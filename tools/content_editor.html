<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Редактор контента игры</title>
<style>
  :root {
    --bg: #f5f3ee;
    --panel: #ffffff;
    --border: #ddd6c8;
    --text: #2b2620;
    --muted: #837c6c;
    --accent: #a15c3d;
    --accent-text: #fff;
    --danger: #b0392f;
    --ok: #4a7c3f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  header .spacer { flex: 1; }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 12px;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.small { padding: 2px 8px; font-size: 12px; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }

  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  nav button {
    border-radius: 6px 6px 0 0;
    border-bottom: none;
    background: transparent;
  }
  nav button.active { background: var(--bg); font-weight: 600; }

  main { padding: 20px; max-width: 980px; margin: 0 auto; }
  .tab { display: none; }
  .tab.active { display: block; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .card-head code {
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  .card-head .spacer { flex: 1; }
  .card-head input[type=text] { font-size: 14px; font-weight: 600; flex: 1; max-width: 320px; }
  .order-controls { display: flex; gap: 3px; }
  .order-controls button { min-width: 26px; }

  /* Сворачивание карточек сущностей (см. makeCardCollapsible) - по умолчанию
     свёрнуты все, кроме .card-head (id/иконка/имя/порядок/удаление остаются
     видны и в свёрнутом виде). Свёрнутая карточка теряет нижний отступ у
     .card-head, чтобы список был компактнее, а не просто пустым местом. */
  .card.collapsed .card-body { display: none; }
  .card.collapsed .card-head { margin-bottom: 0; }
  .card-collapse-toggle {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 13px; padding: 2px 4px; line-height: 1; flex-shrink: 0;
  }
  .card-collapse-toggle:hover { color: var(--text); }

  .field-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
  .field-row label { font-size: 12px; color: var(--muted); min-width: 120px; }
  .settings-summary-row .hint { flex: 1; margin: 0; }
  .modal.settings-modal { max-width: 520px; }

  input, select, textarea {
    font: inherit;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--panel);
    color: var(--text);
  }
  input[type=number] { width: 80px; }
  /* Любое текстовое поле растёт под введённый текст сам - по прямому пожеланию
     "видеть введённое целиком", а не только у описаний. field-sizing - нативная
     CSS-фича (Chrome/Edge 123+), без единой строчки JS; там, где её ещё нет,
     поле просто ведёт себя как раньше (fixed) - деградация без потери функции. */
  input[type=text] { field-sizing: content; min-width: 80px; max-width: 100%; }
  textarea {
    field-sizing: content; resize: none; min-width: 260px; max-width: 100%;
    min-height: 30px; line-height: 1.4; white-space: pre-wrap;
  }

  .dict-editor { margin: 4px 0; }
  .dict-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .dict-row select { min-width: 140px; }

  .stages-box { margin: 6px 0 10px; }
  .stage-card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
  .stage-card .stage-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .stage-card .stage-head strong { font-size: 12px; }
  .stage-card .stage-head .spacer { flex: 1; }
  .gene-pool-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
  .gene-pool-trait { font-size: 12px; color: var(--muted); min-width: 120px; }
  .gene-pool-alleles { display: flex; flex-wrap: wrap; gap: 6px; }
  .gene-pool-allele { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--muted); cursor: pointer; }
  .gene-pool-allele.on { border-color: var(--accent); color: var(--text); }
  .gene-pool-allele input[type=number] { width: 52px; }
  .gene-pool-share { color: var(--muted); min-width: 30px; }
  .gene-pool-warn { font-size: 12px; color: var(--danger); }

  .req-list { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0; }
  .req-list label { display: flex; align-items: center; gap: 4px; font-size: 13px; }

  .tags-chip-list { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .tags-chip {
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px;
    padding: 2px 4px 2px 8px; border-radius: 12px;
    background: var(--panel2, var(--panel)); border: 1px solid var(--border);
  }
  .tags-chip button {
    border: none; background: none; color: var(--muted); cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0 2px;
  }
  .tags-chip button:hover { color: var(--danger); }

  .effect-card {
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 10px;
    margin: 8px 0;
    background: var(--bg);
  }

  table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }

  .add-form {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 12px;
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: 8px;
    flex-wrap: wrap;
  }
  .add-form input, .add-form select { flex: 1; min-width: 140px; }

  #banner {
    position: fixed;
    top: 60px;
    right: 20px;
    max-width: 420px;
    z-index: 100;
  }
  .toast {
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.15);
    font-size: 13px;
  }
  .toast.ok { background: #eaf5e6; border: 1px solid var(--ok); color: #2e5527; }
  .toast.error { background: #fbeae8; border: 1px solid var(--danger); color: #7a2721; }
  .toast ul { margin: 6px 0 0; padding-left: 18px; }

  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 10px; }
  #rawJson { width: 100%; height: 300px; font-family: monospace; font-size: 12px; }

  .filter-bar {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .filter-bar input { flex: 1; }
  .filter-count { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* Закреплённая сверху вкладки панель: форма создания новой сущности + фильтр.
     Так кнопку "Добавить" всегда видно, не нужно листать список до конца. */
  .tab-toolbar {
    position: sticky;
    top: var(--topbar-h, 96px);
    z-index: 5;
    background: var(--bg);
    padding: 8px 0 12px;
    margin-bottom: 12px;
    box-shadow: 0 4px 6px -4px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  @keyframes flash-highlight { 0% { background: #fdeec0; } 100% { background: var(--panel); } }
  .card.flash, tr.flash, .tech-node.flash { animation: flash-highlight 1.6s ease-out; }

  .global-search { position: relative; width: 320px; }
  .global-search input { width: 100%; }
  .search-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.15);
    max-height: 360px;
    overflow-y: auto;
    z-index: 50;
  }
  .search-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .search-row:last-child { border-bottom: none; }
  .search-row:hover { background: var(--bg); }
  .search-cat {
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    border-radius: 4px;
    padding: 2px 6px;
    white-space: nowrap;
  }
  .search-label { flex: 1; }
  .search-row code { color: var(--muted); font-size: 11px; }
  .search-empty { padding: 10px; color: var(--muted); font-size: 13px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto;
  }
  .modal-head {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel);
  }
  .modal-head strong { flex: 1; }

  .icon-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px; font-size: 12px;
  }
  .icon-btn .pixel-icon { image-rendering: pixelated; shape-rendering: crispEdges; background: var(--bg); border-radius: 3px; }
  .icon-btn .custom-tag { color: var(--accent); font-size: 10px; }

  .icon-modal { max-width: 600px; max-height: 92vh; }
  .tech-picker-modal { max-width: 92vw; }
  .tech-pick-btn { text-align: left; min-width: 220px; }

  .building-picker-modal { max-width: 480px; }
  .building-picker-body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .building-picker-search { field-sizing: fixed; width: 100%; }
  .building-picker-list { display: flex; flex-direction: column; gap: 4px; max-height: 50vh; overflow-y: auto; }
  .building-picker-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; background: var(--panel);
  }
  .building-picker-row:hover { border-color: var(--accent); }
  .building-picker-row.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .building-picker-name { font-size: 13px; font-weight: 600; }
  .building-picker-id { font-size: 11px; color: var(--muted); }
  .building-picker-row.multi input[type="checkbox"] { pointer-events: none; }

  .tech-multi-select { display: flex; flex-direction: column; gap: 6px; margin: 4px 0; }
  .tech-multi-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .tech-multi-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px 3px 10px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--panel); font-size: 12px;
  }
  .tech-multi-chip-rm {
    border: none; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0 2px;
  }
  .tech-multi-chip-rm:hover { color: var(--accent); }
  .icon-editor-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .icon-palette-row { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; justify-content: center; }
  .icon-palette-row button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .icon-palette-row .custom-color-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px; border-radius: 6px;
    border: 2px solid transparent;
  }
  .icon-palette-row .custom-color-wrap.active { border-color: var(--accent); }
  .icon-palette-row .custom-color-wrap input.hex-input {
    width: 100%; box-sizing: border-box; font-family: monospace; font-size: 12px; padding: 4px 6px;
    border: 1px solid var(--border); border-radius: 4px; background: var(--panel); color: var(--text);
  }
  .color-picker { display: flex; flex-direction: column; gap: 6px; }
  .color-picker-sv {
    position: relative; width: 180px; height: 120px; border-radius: 4px;
    border: 1px solid var(--border); cursor: crosshair; user-select: none;
  }
  .color-picker-sv-thumb {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6);
    transform: translate(-50%, -50%); pointer-events: none;
  }
  .color-picker-hue {
    position: relative; width: 180px; height: 14px; border-radius: 4px;
    border: 1px solid var(--border); cursor: pointer; user-select: none;
    background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
  }
  .color-picker-hue-thumb {
    position: absolute; top: -2px; width: 4px; height: 18px; background: #fff;
    border: 1px solid #333; transform: translateX(-50%); pointer-events: none;
  }
  .icon-swatch-table { display: grid; grid-template-columns: repeat(5, 32px); gap: 6px; align-content: start; }
  .icon-swatch-table .swatch {
    width: 32px; height: 32px; border-radius: 4px; border: 2px solid var(--border); cursor: pointer;
  }
  .icon-swatch-table .swatch.active { border-color: var(--accent); }
  .icon-swatch-table button.small { grid-column: span 2; padding: 4px 2px; font-size: 11px; }

  .icon-grid { display: grid; gap: 1px; background: var(--border); border: 1px solid var(--border); user-select: none; }
  .icon-cell { width: 14px; height: 14px; background: var(--panel); cursor: crosshair; }
  .icon-cell:hover { outline: 1px solid var(--accent); outline-offset: -1px; }

  .icon-preview { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .icon-preview .pixel-icon { image-rendering: pixelated; shape-rendering: crispEdges; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .icon-preview span { font-size: 11px; color: var(--muted); }

  .icon-editor-footer {
    display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--border);
    justify-content: flex-end; position: sticky; bottom: 0; background: var(--panel);
  }

  .view-toggle { display: flex; gap: 6px; margin-bottom: 12px; }
  .view-toggle button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .era-toggle button.active { background: none; color: var(--era-accent, var(--accent)); border-color: var(--era-accent, var(--accent)); }
  .era-manager { margin-bottom: 12px; }
  .era-manager-row { align-items: center; gap: 8px; }
  .era-manager-row input[type="color"] { width: 36px; height: 28px; padding: 0; border: none; background: none; cursor: pointer; }

  .graph-scroll {
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    max-height: 70vh;
  }
  /* Вкладки "Технологии"/"Квесты" (renderTechGraphView/renderQuestGraphView) -
     не модалка (там graph-scroll и так вписан в max-height модалки 85vh), а
     часть обычной страницы, есть куда расти сильнее дефолтных 70vh. */
  .graph-scroll.graph-scroll-tab { max-height: calc(100vh - 230px); min-height: 420px; }
  .tech-graph { position: relative; transform-origin: 0 0; }
  .tech-graph-svg { position: absolute; top: 0; left: 0; pointer-events: none; }
  .tech-tier-band { position: absolute; top: 0; border-radius: 6px; pointer-events: none; }
  .tech-tier-band-label { position: absolute; top: 4px; text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; pointer-events: none; }
  #arrowhead path { fill: var(--muted); }

  .tech-node {
    position: absolute;
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .tech-node:hover { border-color: var(--accent); }
  .tech-node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .tech-node.dim { opacity: .25; }
  .tech-node { cursor: grab; }
  .tech-node:active { cursor: grabbing; }
  .tech-node-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tech-node-id { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tech-node-handle {
    position: absolute;
    right: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--panel);
    cursor: crosshair;
  }
  /* Квадратные узлы квестов (в отличие от узлов техов) тянутся ЛЮБОЙ из четырёх
     граней - см. renderQuestGraphView. handle-right не переопределяется, это
     и есть дефолт базового правила выше. */
  .tech-node-handle.handle-top { top: -8px; left: 50%; right: auto; transform: translateX(-50%); }
  .tech-node-handle.handle-bottom { top: auto; bottom: -8px; left: 50%; right: auto; transform: translateX(-50%); }
  .tech-node-handle.handle-left { left: -8px; right: auto; top: 50%; transform: translateY(-50%); }

  /* Квадратный узел графа квестов - 1:1 превью того, что увидит игрок в
     web_ui.html (.quest-node/.quest-node-icon/.quest-node-tip) - та же тёмная
     "чертёжная" палитра, независимо от светлой темы остального редактора,
     чтобы значок/оформление/подсказка были видны БЕЗ запуска игры (см.
     renderQuestGraphView). Игрового статуса тут нет (черновик, не состояние
     сохранения) - узел всегда нейтрального цвета, тон "молчащего" узла в
     игре (совпадает с .quest-node.locked - см. web_ui.html), q.bg/q.border
     override переопределяют его ТОЧНО так же, как в игре. */
  .tech-node.quest-node-square {
    width: 64px; height: 64px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: #14191f; border: 1px solid #2b333b; border-radius: 6px;
    box-shadow: none;
  }
  .tech-node.quest-node-square:hover { border-color: #5fd0e8; }
  .tech-node.quest-node-square.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .quest-node-square-icon { display: flex; }
  /* id квеста - единственное, чего НЕТ в игре на самом узле - подпись только
     для автора, вынесена ЗА пределы квадрата (снизу), чтобы не мешать
     превью самого игрового узла. */
  .quest-node-square-caption {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 4px;
    font-size: 10px; color: var(--muted); white-space: nowrap; max-width: 120px;
    overflow: hidden; text-overflow: ellipsis; text-align: center; pointer-events: none;
  }
  /* Буквальная копия .quest-node-tip из web_ui.html (шрифт/размер/цвет) - цвет
     текста ПЕР-КВЕСТОВЫЙ (quests.*.tooltip_color, поле "Свой цвет текста
     подсказки" в карточке квеста на вкладке "Список"), выставляется инлайн-
     стилем на конкретном узле (см. renderQuestGraphView) - тут в CSS только
     дефолт на случай, если квест свой цвет не задал. */
  .quest-node-tip {
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: #10151bf0; border: 1px solid #2b333b; border-radius: 4px; padding: 5px 9px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px; font-weight: 600; line-height: 1.3; letter-spacing: .01em;
    white-space: nowrap; pointer-events: none; z-index: 20;
    display: none;
    color: #dbe7ec;
  }
  .tech-node.quest-node-square:hover .quest-node-tip { display: block; }

  .tech-edge { stroke: var(--muted); stroke-width: 2; fill: none; pointer-events: none; }
  .tech-edge.related { stroke: var(--accent); stroke-width: 3; }
  .tech-edge.dim { opacity: .15; }
  .tech-edge-hit { stroke: transparent; stroke-width: 14; fill: none; pointer-events: stroke; cursor: pointer; }
  .tech-edge-drag { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; pointer-events: none; }

  /* ---------- Редактор узора крафта (openPatternModal) ----------
     Сетка рисуется теми же пиксельными иконками ресурсов, что и игра, чтобы
     нарисованный тут узор выглядел ровно так же, как его увидит игрок. */
  .modal.pattern-modal { max-width: 860px; }
  .pattern-body { display: flex; gap: 14px; padding: 14px 16px; align-items: flex-start; }
  .pattern-side { width: 220px; flex: none; display: flex; flex-direction: column; gap: 8px; }
  .pattern-center { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  /* Палитра - именно СПИСОК, а не плитка иконок: у части ресурсов своей
     пиксельной иконки нет, и без подписи такие плитки неразличимы. */
  .pattern-palette { display: flex; flex-direction: column; gap: 3px; max-height: 340px; overflow-y: auto; }
  .pattern-swatch {
    border: 1px solid var(--border); border-radius: 6px; background: #faf8f4; cursor: pointer;
    padding: 4px 8px; display: flex; align-items: center; gap: 8px; text-align: left; font-size: 12px;
  }
  .pattern-swatch .swatch-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pattern-swatch .pixel-icon { flex: none; }
  .pattern-swatch:hover { border-color: var(--accent); }
  .pattern-swatch.selected { border: 2px solid var(--accent); }
  .pattern-grid { display: grid; gap: 6px; padding: 12px; background: #faf8f4; border: 1px solid var(--border); border-radius: 8px; }
  .pattern-cell {
    width: 64px; height: 64px; border: 1px dashed var(--border); border-radius: 6px; background: var(--panel);
    cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;
  }
  .pattern-cell:hover { border-color: var(--accent); }
  .pattern-cell.filled { border: 1px solid var(--accent); }
  .pattern-cost-row { display: flex; align-items: center; gap: 8px; }
  .pattern-cost-row .amount { margin-left: auto; font-weight: 700; color: var(--accent); }
  .pattern-note { border-radius: 6px; padding: 9px 11px; font-size: 12px; line-height: 1.45; }
  .pattern-note.ok { background: #f2f7f0; border: 1px solid #b7cdb0; color: var(--ok); }
  .pattern-note.err { background: #fdf1ef; border: 1px solid #e0b3ac; color: var(--danger); }
  .pattern-note.warn { background: #fbf4e4; border: 1px solid #e3cf9c; color: #7a5a12; margin: 6px 0 10px; }
</style>

<script>
let DATA = null;
// Шаблоны повторяющихся "лестниц" карточек (тиры склада/инструмента, улучшения
// построек) - см. templateListButtons/openTemplatePickerModal ниже. {kind: [{name, items}]}.
let TEMPLATES = {};

const TABS = [
  ["resources", "Ресурсы"],
  ["storage", "Склад"],
  ["locations", "Локации"],
  ["manual", "Ручные действия"],
  ["buildings", "Постройки"],
  ["breakdown-types", "Виды поломок"],
  ["techs", "Технологии"],
  ["energy-recipes", "Рецепты за энергию"],
  ["species", "Виды"],
  ["genetic-traits", "Генетика"],
  ["breeding", "Мутации"],
  ["mining", "Добыча"],
  ["tools", "Инструменты"],
  ["mobs", "Мобы/Боссы"],
  ["combat-moves", "Приёмы боя"],
  ["skills", "Навыки"],
  ["enchantments", "Зачарования"],
  ["rituals", "Ритуалы"],
  ["smeltery", "Плавильня"],
  ["reactor", "Реактор"],
  ["quests", "Квесты"],
  ["settings", "Настройки"],
  ["raw", "JSON"],
];

// Локация с этим id - обязательный "якорь" механики поиска/добычи жил (см. game/engine.py,
// MINE_LOCATION_ID): её нельзя удалить в редакторе, хотя обычные действия внутри неё
// (например, добычу камня) удалять и редактировать можно как у любой другой локации.
const MINE_LOCATION_ID = "shaft";

// Локация с этим id - обязательный "якорь" механики выбора рецепта крафта за энергию
// (см. game/engine.py, CONVERTER_LOCATION_ID): её нельзя удалить в редакторе, хотя
// обычные действия внутри неё можно удалять и редактировать как у любой другой локации.
// Вложена в обычную (ничем не защищённую) локацию "mechanisms"/"Механизмы".
const CONVERTER_LOCATION_ID = "converter";

// Ресурс с этим id - единственный со спец-поведением в коде (см. game/engine.py,
// ENERGY_RESOURCE_ID): не копится без хранилищ, всегда закреплён на панели, не
// участвует в автокрафте. Его тоже нельзя удалить в редакторе - без него игра
// упадёт в первом же месте, которое к нему обращается.
const ENERGY_RESOURCE_ID = "energy";

// Рецепты, замкнутые в круг («9 слитков -> блок -> 9 слитков», «1 руда -> 2 руды»):
// автокрафт не берёт их источником для других заказов. ДЕРЖАТЬ В ПАРЕ с
// game/engine.py: autocraft_cyclic_recipes (редактор не импортирует game/*). Ключи - как
// grid_recipe_key: id действия, "energy_recipe:<id>", "ritual_recipe:<id>", "replicator:<ресурс>".
function editorCyclicRecipes() {
  const isRange = (v) => v !== null && typeof v === "object";
  const edges = [];
  for (const [aid, a] of Object.entries(DATA.manual_actions || {})) {
    if (!a.cost || !Object.keys(a.cost).length || a.excluded_from_autocraft) continue;
    const chances = [...Object.values(a.cost_chance || {}), ...Object.values(a.gain_chance || {})];
    if (chances.some((c) => c < 1) || Object.values(a.gain || {}).some(isRange)) continue;
    for (const ing of Object.keys(a.cost)) for (const out of Object.keys(a.gain || {})) edges.push([ing, out, aid]);
  }
  const energyFor = {};
  for (const [rid, r] of Object.entries(DATA.energy_recipes || {})) {
    for (const out of Object.keys(r.produces || {})) if (!(out in energyFor)) energyFor[out] = rid;
  }
  for (const [out, rid] of Object.entries(energyFor)) {
    for (const ing of Object.keys(DATA.energy_recipes[rid].consumes || {})) edges.push([ing, out, "energy_recipe:" + rid]);
  }
  const ritualFor = {};
  for (const [rid, r] of Object.entries(DATA.ritual_recipes || {})) {
    const produces = r.produces || {};
    if (!Object.keys(produces).length || Object.values(produces).some(isRange)) continue;
    if (Object.values(r.produces_chance || {}).some((c) => c < 1)) continue;
    for (const out of Object.keys(produces)) if (!(out in ritualFor)) ritualFor[out] = rid;
  }
  for (const [out, rid] of Object.entries(ritualFor)) {
    const r = DATA.ritual_recipes[rid];
    const ings = new Set([...Object.keys(r.ring_cost || {}), ...(r.center_cost ? [r.center_cost] : []), ...Object.keys(r.extra_cost || {})]);
    for (const ing of ings) edges.push([ing, out, "ritual_recipe:" + rid]);
  }
  const replicable = (DATA.resources || []).filter((r) => r.replication_cost).map((r) => r.id);
  const matters = new Set(Object.values(DATA.buildings || {}).map((b) => b.replicator && b.replicator.matter).filter(Boolean));
  for (const matter of matters) for (const out of replicable) if (out !== matter) edges.push([matter, out, "replicator:" + out]);
  const live = edges.filter(([ing]) => ing !== ENERGY_RESOURCE_ID);
  const graph = {};
  for (const [ing, out] of live) (graph[ing] = graph[ing] || new Set()).add(out);
  const reachOf = {};
  const reach = (start) => {
    if (!reachOf[start]) {
      const seen = new Set();
      const stack = [start];
      while (stack.length) {
        for (const next of graph[stack.pop()] || []) {
          if (!seen.has(next)) { seen.add(next); stack.push(next); }
        }
      }
      reachOf[start] = seen;
    }
    return reachOf[start];
  };
  const result = new Set();
  for (const [ing, out, key] of live) if (ing === out || reach(out).has(ing)) result.add(key);
  return result;
}

// Плашка на карточке рецепта из круга (editorCyclicRecipes) - null, если рецепт не в круге.
function cycleNote(key) {
  if (!editorCyclicRecipes().has(key)) return null;
  return el("div", { class: "pattern-note warn", text:
    "⟲ Рецепт замкнут в круг (с другими рецептами или сам с собой) - автокрафт не берёт его "
    + "источником для других заказов: ресурс, который делается только им, для заказа - сырьё. "
    + "Заказать сам рецепт «×N» и поставить его в центр автоматизации можно." });
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined) continue; // напр. disabled: null должен значить "не ставить атрибут"
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) node.appendChild(c);
  return node;
}

// Поле для длинного свободного текста (описания) - <textarea>, а не <input type=text>,
// чтобы длинный текст переносился по словам и поле росло ВНИЗ по мере ввода (field-sizing:
// content в CSS), а не превращалось в бесконечно широкую однострочную полосу. rows=1 -
// стартовая высота в одну строку, дальше field-sizing сам растит её под контент. El()
// не умеет проставлять value текстовой области через atributes (у textarea это не HTML-
// атрибут, а текстовое содержимое) - используем "text" (задаёт и textContent, и тем самым
// стартовое .value), а читаем текущее значение через .value (меняется при вводе).
function descriptionTextarea(value, placeholder, onchange) {
  const ta = el("textarea", { rows: "1", placeholder, text: value || "" });
  ta.addEventListener("change", () => onchange(ta.value));
  return ta;
}

const SVG_NS = "http://www.w3.org/2000/svg";

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined) continue;
    node.setAttribute(k, v);
  }
  return node;
}

function pixelIcon(grid, palette, size = 32) {
  const rows = grid.length, cols = grid[0].length;
  const svg = svgEl("svg", { viewBox: `0 0 ${cols} ${rows}`, width: size, height: size, class: "pixel-icon" });
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const ch = grid[y][x];
      if (ch === ".") continue;
      svg.appendChild(svgEl("rect", { x, y, width: 1, height: 1, fill: palette[ch] }));
    }
  }
  return svg;
}

// Встроенные иконки по умолчанию - те же, что рисует сама игра (tools/web_ui.html),
// нужны тут только чтобы показать "как оно будет выглядеть, если не задавать свою".
const DEFAULT_ICONS = {
  energy: { grid: [
    ".....AA.", "....AA..", "...AA...", "..AAAAAA",
    ".AAAA...", "AAA.....", "AA......", "A.......",
  ], palette: { A: "#f4c430" } },
  wood: { grid: [
    "..AAAAAA..", ".AABBBBAA.", "AABBCCBBAA", "AABCCCCBAA",
    "AABBCCBBAA", ".AABBBBAA.", "..AAAAAA..",
  ], palette: { A: "#6b4423", B: "#c69a6d", C: "#8a5a34" } },
  stone: { grid: [
    "...AAAA...", "..ABBBAA..", ".ABBBBBAA.", "AABBBBBBAA",
    "AABBBBBBAA", ".AABBBBAA.", "..AAAAAA..",
  ], palette: { A: "#5f6266", B: "#8b8f94" } },
  planks: { grid: [
    "AAAAAAAAAA", "BBBBBBBBBB", "AAAAAAAAAA", "BBBBBBBBBB",
    "AAAAAAAAAA", "BBBBBBBBBB", "AAAAAAAAAA",
  ], palette: { A: "#b98a52", B: "#8a5a34" } },
  tools: { grid: [
    "..AAAA..", ".AAAAAA.", ".AAAAAA.", "...BB...",
    "...BB...", "...BB...", "...BB...", "..BBBB..",
  ], palette: { A: "#c7ccd1", B: "#8a5a34" } },
  charcoal: { grid: [
    "..AAAA....", ".AAAAAA...", "AABAAAAA..", "AAAABAAAA.",
    ".AAAAAAAA.", "..AAAAAA..",
  ], palette: { A: "#2b2b2b", B: "#4a4a4a" } },
  ore: { grid: [
    "...AAAA...", "..AABBAA..", ".AAAABAAA.", "AAAABBAAAA",
    "AABAAAABAA", ".AAAAAAAA.", "..AAAAAA..",
  ], palette: { A: "#6f6a63", B: "#c9863a" } },
  metal: { grid: [
    ".AAAAAAAA.", "AABBBBBBAA", "AABCCCCBAA", "AABBBBBBAA", ".AAAAAAAA.",
  ], palette: { A: "#8f959c", B: "#c7ccd1", C: "#e8ecef" } },
  uranium: { grid: [
    "...AAAA...", "..AABBAA..", ".AABBBBAA.", "AABBBBBBAA",
    ".AABBBBAA.", "..AAAAAA..",
  ], palette: { A: "#3d5a2f", B: "#8fd94a" } },
  pickaxe: { grid: [
    "....BBBB", "...BB..B", "..BB....", ".BB.....",
    "BB......", "AB......", ".AB.....", "..AB....", "...AB...", "....AB..",
  ], palette: { A: "#8a5a34", B: "#9aa0a6" } },
  machine: { grid: [
    "..AAAA..", ".AAAAAA.", "AABBBBAA", "AABBBBAA",
    "AABBBBAA", "AABBBBAA", "AAAAAAAA", "A.AAAA.A",
  ], palette: { A: "#c07a2e", B: "#3a2f28" } },

  // ДЕРЖАТЬ В ПАРЕ с ICONS.monster в tools/web_ui.html - фоллбэк для mobs.*.icon
  // без своей кастомной иконки (см. defaultMobIcon ниже).
  monster: { grid: [
    "..A....A..", ".AA....AA.", "AABAAAABAA", "AABBAABBAA",
    "AAAAAAAAAA", "AABAAAABAA", ".AAAAAAAA.", "..AAAAAA..",
  ], palette: { A: "#6b6f7a", B: "#1f2226" } },

  // ДЕРЖАТЬ В ПАРЕ с ICONS.quest в tools/web_ui.html - фоллбэк для quests.*.icon
  // без своей кастомной иконки (свиток с двумя строками "текста", см.
  // defaultQuestIcon ниже).
  quest: { grid: [
    "..AAAAAA..", ".AAAAAAAA.", "AABBBBBBAA", "AABBBBBBAA",
    "AABAAAABAA", "AABBBBBBAA", "AABAAAABAA", ".AAAAAAAA.", "..AAAAAA..",
  ], palette: { A: "#e3c98a", B: "#8a5a34" } },

  // ДЕРЖАТЬ В ПАРЕ с ICONS.enchant в tools/web_ui.html - фоллбэк для
  // enchantments.*.icon без своей кастомной иконки (см. defaultEnchantIcon ниже).
  enchant: { grid: [
    "....A....", "....A....", "...AAA...", "..AAAAA..",
    "AAAAAAAAA", "..AAAAA..", "...AAA...", "....A....", "....A....",
  ], palette: { A: "#f0a030" } },
};
const DEFAULT_PICKAXE_PALETTES = [
  { A: "#6b4423", B: "#8a5a34" }, { A: "#6b4423", B: "#8b8f94" }, { A: "#6b4423", B: "#c7ccd1" },
  { A: "#3a3f52", B: "#5b7fb5" }, { A: "#4a3f1a", B: "#f0a030" },
];

function defaultResourceIcon(rid) { return DEFAULT_ICONS[rid] || null; }
function defaultBuildingIcon() { return { grid: DEFAULT_ICONS.machine.grid, palette: { A: "#3f7a52", B: "#1c2b21" } }; }
// Дефолтная иконка ЛОКАЦИИ без своей кастомной loc.icon - ОБЯЗАНА совпадать с тем,
// что реально рисует игра для такой локации (tools/web_ui.html:renderLocationsPanel -
// is_mine -> ICONS.pickaxe, is_converter -> ICONS.energy, иначе ICONS.machine С ЕГО
// СОБСТВЕННОЙ палитрой). Раньше здесь ошибочно переиспользовался defaultBuildingIcon() -
// тот же грид "machine", но с ЗЕЛЁНОЙ палитрой построек (BUILDING_PALETTE.ok в игре) -
// из-за чего превью в редакторе расходилось с игрой сразу в двух местах: цветом у ВСЕХ
// обычных локаций (зелёный вместо оранжевого DEFAULT_ICONS.machine.palette) и формой у
// Шахты/Преобразователя (везде одна и та же generic-форма вместо кирки/значка энергии).
function defaultLocationIcon(lid) {
  if (lid === MINE_LOCATION_ID) return DEFAULT_ICONS.pickaxe;
  if (lid === CONVERTER_LOCATION_ID) return DEFAULT_ICONS.energy;
  return DEFAULT_ICONS.machine;
}
// Инструмент "pickaxe" сохраняет узнаваемую пиксельную кирку с прогрессией палитр по
// тирам (как раньше); любой ДРУГОЙ инструмент, заведённый через редактор, получает
// generic-иконку "machine" - ровно так же решает toolIcon() в tools/web_ui.html.
function defaultToolTierIcon(toolId, tierIndex) {
  if (toolId === "pickaxe") {
    return { grid: DEFAULT_ICONS.pickaxe.grid, palette: DEFAULT_PICKAXE_PALETTES[tierIndex] || DEFAULT_PICKAXE_PALETTES[0] };
  }
  return { grid: DEFAULT_ICONS.machine.grid, palette: { A: "#3f7a52", B: "#1c2b21" } };
}
// Дефолтная иконка МОБА/БОССА без своей кастомной icon - ОБЯЗАНА совпадать с тем,
// что рисует игра (tools/web_ui.html:mobIcon() -> ICONS.monster), см. комментарий
// у DEFAULT_ICONS.monster выше.
function defaultMobIcon() { return DEFAULT_ICONS.monster; }
// Дефолтная иконка КВЕСТА без своей кастомной icon - ОБЯЗАНА совпадать с тем,
// что рисует игра (tools/web_ui.html:questIcon() -> ICONS.quest).
function defaultQuestIcon() { return DEFAULT_ICONS.quest; }
// Дефолтная иконка ЗАЧАРОВАНИЯ без своей кастомной icon - ОБЯЗАНА совпадать с
// тем, что рисует игра (tools/web_ui.html:enchantIcon() -> ICONS.enchant).
function defaultEnchantIcon() { return DEFAULT_ICONS.enchant; }

// ---------- редактор пиксельных иконок ----------

// 32x32 (раньше 24x24) - разрешение ХОЛСТА пиксель-иконок, общее для ЛЮБОЙ
// сущности с кастомной иконкой (ресурсы/постройки/локации/инструменты/мобы/
// квесты) - держать в паре с тем же числом в комментариях/промпт-инструкции
// ниже. Старые иконки, нарисованные при 24x24, продолжают работать как есть
// (pixelIcon рисует по РЕАЛЬНОМУ grid.length конкретной иконки, не по этой
// константе) - апскейл затрагивает только вновь нарисованные/импортированные
// иконки. Чем выше число, тем чётче картинка при импорте фото (drawImage
// в quantizeImageToIcon использует ИМЕННО его как целевой размер холста).
const ICON_EDITOR_SIZE = 32;
const ICON_EDITOR_CELL_PX = 14;
const ICON_PRESET_COLORS = [
  "#e8e6df", "#8b93a0", "#2b2b2b", "#f0a030", "#f4c430", "#4ac9a0",
  "#e0524a", "#6b4423", "#8a5a34", "#c69a6d", "#8b8f94", "#c7ccd1",
  "#8fd94a", "#3d5a2f", "#5b7fb5",
];

function blankIconGrid() {
  return Array.from({ length: ICON_EDITOR_SIZE }, () => ".".repeat(ICON_EDITOR_SIZE));
}

// ---------- импорт внешней картинки в {grid, palette} ----------

const ICON_IMPORT_MAX_COLORS = 16;

function rgbToHex([r, g, b]) {
  return "#" + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
}

function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || "");
  if (!m) return [0, 0, 0];
  return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
}

function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return [h, max === 0 ? 0 : d / max, max];
}

function hsvToRgb(h, s, v) {
  const c = v * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = v - c;
  let r1, g1, b1;
  if (h < 60) [r1, g1, b1] = [c, x, 0];
  else if (h < 120) [r1, g1, b1] = [x, c, 0];
  else if (h < 180) [r1, g1, b1] = [0, c, x];
  else if (h < 240) [r1, g1, b1] = [0, x, c];
  else if (h < 300) [r1, g1, b1] = [x, 0, c];
  else [r1, g1, b1] = [c, 0, x];
  return [(r1 + m) * 255, (g1 + m) * 255, (b1 + m) * 255];
}

// Свой цвет в редакторе иконок собран на голых div'ах (drag через mousedown/mousemove/
// mouseup) вместо нативного <input type=color> - в pywebview/WebView2 системный попап
// цветовой палитры закрывается прямо во время перетаскивания слайдера (mouseup внутри
// попапа не долетает туда, куда должен), так что выбрать цвет иначе, чем кликом по
// самой палитре без протяжки, было физически невозможно.
function buildColorPicker(initialHex, onChange) {
  const wrap = el("div", { class: "color-picker" });
  const sv = el("div", { class: "color-picker-sv" });
  const svThumb = el("div", { class: "color-picker-sv-thumb" });
  sv.appendChild(svThumb);
  const hue = el("div", { class: "color-picker-hue" });
  const hueThumb = el("div", { class: "color-picker-hue-thumb" });
  hue.appendChild(hueThumb);
  wrap.appendChild(sv);
  wrap.appendChild(hue);

  let [h, s, v] = rgbToHsv(...hexToRgb(initialHex));

  function updateVisuals() {
    sv.style.background = `linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, hsl(${h},100%,50%))`;
    svThumb.style.left = (s * 100) + "%";
    svThumb.style.top = ((1 - v) * 100) + "%";
    hueThumb.style.left = (h / 360 * 100) + "%";
  }
  updateVisuals();

  function dragSv(clientX, clientY) {
    const rect = sv.getBoundingClientRect();
    s = Math.min(Math.max(clientX - rect.left, 0), rect.width) / rect.width;
    v = 1 - Math.min(Math.max(clientY - rect.top, 0), rect.height) / rect.height;
    updateVisuals();
    onChange(rgbToHex(hsvToRgb(h, s, v)));
  }
  function dragHue(clientX) {
    const rect = hue.getBoundingClientRect();
    h = Math.min(Math.max(clientX - rect.left, 0), rect.width) / rect.width * 360;
    updateVisuals();
    onChange(rgbToHex(hsvToRgb(h, s, v)));
  }
  let draggingSv = false, draggingHue = false;
  sv.addEventListener("mousedown", (e) => { e.preventDefault(); draggingSv = true; dragSv(e.clientX, e.clientY); });
  hue.addEventListener("mousedown", (e) => { e.preventDefault(); draggingHue = true; dragHue(e.clientX); });
  const onMove = (e) => {
    if (draggingSv) dragSv(e.clientX, e.clientY);
    if (draggingHue) dragHue(e.clientX);
  };
  const onUp = () => { draggingSv = false; draggingHue = false; };
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);

  return {
    el: wrap,
    setColor(hex) {
      [h, s, v] = rgbToHsv(...hexToRgb(hex));
      updateVisuals();
    },
    destroy() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    },
  };
}

// Простой k-means по RGB - сводит произвольное число цветов картинки к k "центрам",
// чтобы получить палитру пиксель-иконки (буква -> hex), а не тысячи оттенков из фото.
function kmeansColors(pixels, k, iterations = 8) {
  if (pixels.length <= k) {
    const uniq = [];
    const seen = new Set();
    for (const p of pixels) {
      const key = p.join(",");
      if (!seen.has(key)) { seen.add(key); uniq.push(p); }
    }
    return uniq.length ? uniq : [[0, 0, 0]];
  }
  let centers = Array.from({ length: k }, (_, i) => pixels[Math.floor(i * pixels.length / k)].slice());
  for (let iter = 0; iter < iterations; iter++) {
    const sums = centers.map(() => [0, 0, 0, 0]);
    for (const p of pixels) {
      let best = 0, bestDist = Infinity;
      centers.forEach((c, idx) => {
        const d = (c[0] - p[0]) ** 2 + (c[1] - p[1]) ** 2 + (c[2] - p[2]) ** 2;
        if (d < bestDist) { bestDist = d; best = idx; }
      });
      sums[best][0] += p[0]; sums[best][1] += p[1]; sums[best][2] += p[2]; sums[best][3]++;
    }
    centers = centers.map((c, idx) => sums[idx][3]
      ? [sums[idx][0] / sums[idx][3], sums[idx][1] / sums[idx][3], sums[idx][2] / sums[idx][3]]
      : c);
  }
  return centers;
}

// Уменьшает img до size x size (браузер сам усредняет цвета при downscale через drawImage)
// и квантует результат в {grid, palette} того же формата, что рисует редактор руками.
// Прозрачные пиксели (alpha < 128) становятся "." - как в ручных иконках.
function quantizeImageToIcon(img, size, maxColors) {
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, size, size);
  ctx.drawImage(img, 0, 0, size, size);
  const { data } = ctx.getImageData(0, 0, size, size);

  const opaque = new Array(size * size).fill(false);
  const pixels = [];
  for (let i = 0; i < size * size; i++) {
    if (data[i * 4 + 3] >= 128) {
      opaque[i] = true;
      pixels.push([data[i * 4], data[i * 4 + 1], data[i * 4 + 2]]);
    }
  }
  if (!pixels.length) return { grid: blankIconGrid(), palette: {} };

  const centers = kmeansColors(pixels, maxColors);
  const palette = {};
  centers.forEach((c, idx) => { palette[String.fromCharCode(65 + idx)] = rgbToHex(c); });

  const grid = [];
  let pi = 0;
  for (let y = 0; y < size; y++) {
    let row = "";
    for (let x = 0; x < size; x++) {
      if (!opaque[y * size + x]) { row += "."; continue; }
      const [r, g, b] = pixels[pi++];
      let best = 0, bestDist = Infinity;
      centers.forEach((c, idx) => {
        const d = (c[0] - r) ** 2 + (c[1] - g) ** 2 + (c[2] - b) ** 2;
        if (d < bestDist) { bestDist = d; best = idx; }
      });
      row += String.fromCharCode(65 + best);
    }
    grid.push(row);
  }
  return { grid, palette };
}

// Валидирует текст как {grid, palette} той же формы, что рисует редактор и что просит
// сгенерировать LLM (см. инструкцию для дешёвой модели) - используется при вставке
// готового JSON от другой модели. Возвращает { ok: true, icon, warnings } или
// { ok: false, errors }. warnings - некритичные проблемы (аппликуется всё равно),
// errors - блокирующие (не критичные для рендера ошибки формата).
function validateIconJson(text) {
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    return { ok: false, errors: [`Невалидный JSON: ${e.message}`] };
  }
  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
    return { ok: false, errors: ['Ожидается JSON-объект вида {"grid": [...], "palette": {...}}.'] };
  }
  const { grid, palette } = parsed;
  const errors = [];
  if (!Array.isArray(grid)) errors.push('Поле "grid" должно быть массивом строк.');
  if (!palette || typeof palette !== "object" || Array.isArray(palette)) {
    errors.push('Поле "palette" должно быть объектом вида {"A": "#rrggbb"}.');
  }
  if (errors.length) return { ok: false, errors };

  if (grid.length !== ICON_EDITOR_SIZE) {
    errors.push(`"grid" должен содержать ровно ${ICON_EDITOR_SIZE} строк, получено ${grid.length}.`);
  }
  const rowCharsRe = /^[.A-Z]+$/;
  grid.forEach((row, i) => {
    if (typeof row !== "string") { errors.push(`Строка ${i + 1}: не строка.`); return; }
    if (row.length !== ICON_EDITOR_SIZE) errors.push(`Строка ${i + 1}: длина ${row.length} символов, ожидалось ${ICON_EDITOR_SIZE}.`);
    if (!rowCharsRe.test(row)) errors.push(`Строка ${i + 1}: разрешены только "." и заглавные A-Z, найдены другие символы.`);
  });
  if (errors.length) return { ok: false, errors };

  const usedLetters = new Set(grid.join("").split("").filter(c => c !== "."));
  const paletteKeys = new Set(Object.keys(palette));
  const missing = [...usedLetters].filter(c => !paletteKeys.has(c));
  if (missing.length) errors.push(`В palette не хватает цвета для букв из grid: ${missing.join(", ")}.`);
  const hexRe = /^#[0-9a-fA-F]{6}$/;
  Object.entries(palette).forEach(([k, v]) => {
    if (usedLetters.has(k) && (typeof v !== "string" || !hexRe.test(v))) {
      errors.push(`Цвет для "${k}" должен быть в формате "#rrggbb", получено: ${JSON.stringify(v)}.`);
    }
  });
  if (errors.length) return { ok: false, errors };

  const extra = [...paletteKeys].filter(c => !usedLetters.has(c));
  const trimmedPalette = {};
  usedLetters.forEach(c => { trimmedPalette[c] = palette[c]; });
  const warnings = extra.length ? [`Лишние цвета в palette без пикселей в grid проигнорированы: ${extra.join(", ")}.`] : [];
  if (!usedLetters.size) return { ok: false, errors: ["Иконка пустая - ни одного закрашенного пикселя (весь grid из точек)."] };

  return { ok: true, icon: { grid: grid.slice(), palette: trimmedPalette }, warnings };
}

// title - заголовок модалки. currentIcon - {grid, palette} или null. fallbackIcon - что
// показать/с чего начать, если своей иконки ещё нет (встроенная по умолчанию).
// onApply(icon) вызывается с новым {grid, palette} или null (если убрали кастомную иконку).
function openIconEditor(title, currentIcon, fallbackIcon, onApply) {
  const seed = currentIcon || fallbackIcon;
  let grid = seed ? seed.grid.slice() : blankIconGrid();
  // нормализуем к фиксированному размеру редактора, если встроенная иконка меньше
  if (grid.length < ICON_EDITOR_SIZE || grid[0].length < ICON_EDITOR_SIZE) {
    const padded = blankIconGrid();
    grid.forEach((row, y) => { if (y < ICON_EDITOR_SIZE) padded[y] = (row + ".".repeat(ICON_EDITOR_SIZE)).slice(0, ICON_EDITOR_SIZE); });
    grid = padded;
  }
  let palette = seed ? { ...seed.palette } : {};
  const charOf = new Map(Object.entries(palette).map(([c, col]) => [col, c]));
  let nextCharCode = 65 + Object.keys(palette).length;
  let currentColor = ICON_PRESET_COLORS[3];
  let tool = "paint"; // "paint" | "erase" | "pipette"
  // colorPicker создаётся один раз и переиспользуется между перерисовками палитры -
  // иначе drag посреди перетаскивания слайдера обрывался бы пересозданием DOM-узла.
  let colorPicker = null;
  let hexInputEl = null;
  let customWrapEl = null;

  function colorChar(color) {
    if (charOf.has(color)) return charOf.get(color);
    const ch = String.fromCharCode(nextCharCode++);
    charOf.set(color, ch);
    palette[ch] = color;
    return ch;
  }
  function setCell(x, y, ch) {
    const row = grid[y].split("");
    row[x] = ch;
    grid[y] = row.join("");
  }

  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  const modal = el("div", { class: "modal icon-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: `Иконка: ${title}` }));
  head.appendChild(el("button", { text: "Закрыть", onclick: () => close() }));
  modal.appendChild(head);

  const body = el("div", { class: "icon-editor-body" });

  // Слева - увеличенное окно свободного выбора цвета (SV-градиент + оттенок + hex),
  // справа - готовые цвета и инструменты (ластик/пипетка) таблицей-сеткой.
  const paletteRow = el("div", { class: "icon-palette-row" });
  function renderPaletteRow() {
    paletteRow.innerHTML = "";

    // Левая колонка: собственный drag-виджет (палитра SV + слайдер оттенка) + hex-поле
    // для точного значения - оба держат один и тот же currentColor синхронно. См.
    // buildColorPicker: НЕ нативный <input type=color> - его системный попап рвётся
    // посреди перетаскивания в pywebview/WebView2.
    const isCustom = tool === "paint" && !ICON_PRESET_COLORS.includes(currentColor);
    const customWrap = el("div", { class: "custom-color-wrap" + (isCustom ? " active" : "") });
    customWrapEl = customWrap;
    if (!colorPicker) {
      colorPicker = buildColorPicker(currentColor, (hex) => {
        currentColor = hex;
        tool = "paint";
        if (hexInputEl) hexInputEl.value = currentColor;
        if (customWrapEl) customWrapEl.classList.add("active");
      });
    } else {
      colorPicker.setColor(currentColor);
    }
    customWrap.appendChild(colorPicker.el);
    const hexInput = el("input", { type: "text", class: "hex-input", value: currentColor, placeholder: "#rrggbb" });
    hexInputEl = hexInput;
    hexInput.addEventListener("change", () => {
      const v = hexInput.value.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(v)) { currentColor = v; tool = "paint"; colorPicker.setColor(v); renderPaletteRow(); }
      else { hexInput.value = currentColor; }
    });
    customWrap.appendChild(hexInput);
    paletteRow.appendChild(customWrap);

    // Правая колонка: готовые цвета + ластик/пипетка одной сеткой-таблицей.
    const table = el("div", { class: "icon-swatch-table" });
    ICON_PRESET_COLORS.forEach(c => {
      const sw = el("div", { class: "swatch" + (tool === "paint" && currentColor === c ? " active" : ""), style: `background:${c}` });
      sw.addEventListener("click", () => { currentColor = c; tool = "paint"; renderPaletteRow(); });
      table.appendChild(sw);
    });
    const eraseBtn = el("button", { class: "small" + (tool === "erase" ? " active" : ""), text: "Ластик", onclick: () => { tool = "erase"; renderPaletteRow(); } });
    table.appendChild(eraseBtn);
    const pipetteBtn = el("button", { class: "small" + (tool === "pipette" ? " active" : ""), text: "Пипетка", onclick: () => { tool = "pipette"; renderPaletteRow(); } });
    table.appendChild(pipetteBtn);
    paletteRow.appendChild(table);
  }
  renderPaletteRow();
  body.appendChild(paletteRow);

  const gridBox = el("div", { class: "icon-grid" });
  gridBox.style.gridTemplateColumns = `repeat(${ICON_EDITOR_SIZE}, ${ICON_EDITOR_CELL_PX}px)`;
  let painting = false;
  const stopPainting = () => { painting = false; };
  document.addEventListener("mouseup", stopPainting);

  const cellEls = [];
  for (let y = 0; y < ICON_EDITOR_SIZE; y++) {
    const rowEls = [];
    for (let x = 0; x < ICON_EDITOR_SIZE; x++) {
      const cell = el("div", { class: "icon-cell" });
      const paint = () => {
        if (tool === "pipette") {
          const ch = grid[y][x];
          if (ch !== ".") currentColor = palette[ch] || currentColor;
          tool = "paint";
          renderPaletteRow();
          return;
        }
        setCell(x, y, tool === "erase" ? "." : colorChar(currentColor));
        updateCell(x, y);
        updatePreview();
      };
      cell.addEventListener("mousedown", (e) => { e.preventDefault(); painting = true; paint(); });
      cell.addEventListener("mouseenter", () => { if (painting) paint(); });
      gridBox.appendChild(cell);
      rowEls.push(cell);
    }
    cellEls.push(rowEls);
  }
  function updateCell(x, y) {
    const ch = grid[y][x];
    cellEls[y][x].style.background = ch === "." ? "" : (palette[ch] || "");
  }
  for (let y = 0; y < ICON_EDITOR_SIZE; y++) for (let x = 0; x < ICON_EDITOR_SIZE; x++) updateCell(x, y);
  body.appendChild(gridBox);

  // Общая точка входа и для импорта картинки, и для вставки готового JSON от LLM -
  // подменяет содержимое редактируемой иконки целиком и перерисовывает сетку/превью.
  function applyIconToEditor(icon) {
    grid = icon.grid;
    palette = icon.palette;
    charOf.clear();
    Object.entries(palette).forEach(([c, col]) => charOf.set(col, c));
    nextCharCode = 65 + Object.keys(palette).length;
    for (let y = 0; y < ICON_EDITOR_SIZE; y++) for (let x = 0; x < ICON_EDITOR_SIZE; x++) updateCell(x, y);
    updatePreview();
  }

  const previewBox = el("div", { class: "icon-preview" });
  function updatePreview() {
    previewBox.innerHTML = "";
    previewBox.appendChild(pixelIcon(grid, palette, 96));
    previewBox.appendChild(el("span", { text: "Превью в игре" }));
  }
  updatePreview();
  body.appendChild(previewBox);
  modal.appendChild(body);

  const footer = el("div", { class: "icon-editor-footer" });
  const importInput = el("input", { type: "file", accept: "image/*", style: "display:none" });
  importInput.addEventListener("change", () => {
    const file = importInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        applyIconToEditor(quantizeImageToIcon(img, ICON_EDITOR_SIZE, ICON_IMPORT_MAX_COLORS));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    importInput.value = "";
  });
  footer.appendChild(importInput);
  footer.appendChild(el("button", { text: "Импортировать картинку…", onclick: () => importInput.click() }));
  footer.appendChild(el("button", { text: "Вставить JSON…", onclick: () => openJsonPasteModal(applyIconToEditor) }));
  footer.appendChild(el("button", { text: "Очистить", onclick: () => {
    grid = blankIconGrid();
    for (let y = 0; y < ICON_EDITOR_SIZE; y++) for (let x = 0; x < ICON_EDITOR_SIZE; x++) updateCell(x, y);
    updatePreview();
  }}));
  footer.appendChild(el("button", { text: "Убрать свою иконку (вернуть по умолчанию)", onclick: () => {
    onApply(null);
    close();
  }}));
  footer.appendChild(el("button", { class: "primary", text: "Применить", onclick: () => {
    const usedChars = new Set(grid.join("").split("").filter(c => c !== "."));
    if (!usedChars.size) { onApply(null); close(); return; }
    const trimmedPalette = {};
    usedChars.forEach(c => { trimmedPalette[c] = palette[c]; });
    onApply({ grid: grid.slice(), palette: trimmedPalette });
    close();
  }}));
  modal.appendChild(footer);

  function close() {
    document.removeEventListener("mouseup", stopPainting);
    if (colorPicker) colorPicker.destroy();
    overlay.remove();
  }

  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

// Модалка вставки готового {grid, palette} JSON (например, от отдельной LLM-сессии по
// текстовой инструкции формата иконки). onApply(icon) вызывается только для валидного
// JSON, прошедшего validateIconJson - невалидный просто показывает список ошибок и не
// закрывает модалку, дав пользователю поправить текст и попробовать снова.
function openJsonPasteModal(onApply) {
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  const modal = el("div", { class: "modal icon-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Вставить JSON иконки" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: () => close() }));
  modal.appendChild(head);

  const body = el("div", { class: "icon-editor-body" });
  body.appendChild(el("div", {
    style: "font-size:12px;color:var(--muted);align-self:stretch;",
    text: `Вставь JSON вида {"grid": [...${ICON_EDITOR_SIZE} строк...], "palette": {...}}, полученный от другой модели по промпт-инструкции формата иконки.`,
  }));
  const textarea = el("textarea", {
    rows: "14",
    style: "width:100%;font-family:monospace;font-size:12px;box-sizing:border-box;",
    placeholder: '{"grid": [...], "palette": {...}}',
  });
  body.appendChild(textarea);
  const feedback = el("div", { style: "width:100%;white-space:pre-wrap;font-size:12px;" });
  body.appendChild(feedback);
  modal.appendChild(body);

  const footer = el("div", { class: "icon-editor-footer" });
  footer.appendChild(el("button", { class: "primary", text: "Проверить и применить", onclick: () => {
    const result = validateIconJson(textarea.value);
    if (!result.ok) {
      feedback.style.color = "#e0524a";
      feedback.textContent = result.errors.join("\n");
      return;
    }
    feedback.style.color = "";
    feedback.textContent = "";
    onApply(result.icon);
    if (result.warnings.length) alert(result.warnings.join("\n"));
    close();
  }}));
  modal.appendChild(footer);

  function close() { overlay.remove(); }

  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  textarea.focus();
}

// Кнопка-превью с текущей иконкой (кастомной или дефолтной), открывающая редактор по клику.
// iconEditButton работает с ЛЮБЫМ объектом, у которого поле называется РОВНО
// .icon - для сущностей вроде mine_field, где значков несколько под другими
// именами (rock_icon/rock_broken_icon), нужен прокси, переадресующий .icon на
// нужный ключ объекта obj.
function iconFieldProxy(obj, key) {
  return new Proxy({}, {
    get(_, prop) { return prop === "icon" ? obj[key] : undefined; },
    set(_, prop, value) { if (prop === "icon") obj[key] = value; return true; },
    deleteProperty(_, prop) { if (prop === "icon") delete obj[key]; return true; },
  });
}

// Тот же приём, что iconFieldProxy, но для ОДНОГО элемента списка иконок
// (mine_field.rock_icon_variants) вместо именованного поля объекта.
function iconListItemProxy(list, index) {
  return new Proxy({}, {
    get(_, prop) { return prop === "icon" ? list[index] : undefined; },
    set(_, prop, value) { if (prop === "icon") list[index] = value; return true; },
    deleteProperty(_, prop) { if (prop === "icon") list[index] = null; return true; },
  });
}

function iconEditButton(title, entity, fallbackIcon, onChanged) {
  const btn = el("button", { class: "icon-btn" });
  function render() {
    btn.innerHTML = "";
    const shown = entity.icon || fallbackIcon;
    if (shown) btn.appendChild(pixelIcon(shown.grid, shown.palette, 26));
    btn.appendChild(document.createTextNode(entity.icon ? "" : "Иконка"));
    if (entity.icon) btn.appendChild(el("span", { class: "custom-tag", text: "своя" }));
  }
  render();
  btn.addEventListener("click", () => {
    openIconEditor(title, entity.icon || null, fallbackIcon, (icon) => {
      entity.icon = icon || undefined;
      if (!icon) delete entity.icon;
      render();
      if (onChanged) onChanged();
    });
  });
  return btn;
}

const filters = { resources: "", storage: "", locations: "", manual: "", buildings: "", "breakdown-types": "", techs: "", "energy-recipes": "", species: "", breeding: "", mining: "", tools: "", mobs: "", "combat-moves": "", skills: "", enchantments: "", quests: "", "smelt-melt": "", "smelt-alloy": "", "smelt-cast": "" };

// Оборачивает контейнер карточек строкой поиска. Каждая карточка/строка должна иметь
// data-search (текст для сравнения) - см. вызовы ниже. Вызови вернувшуюся apply() один
// раз сразу после того, как контейнер наполнен карточками.
function makeFilterBar(tabKey, container) {
  const bar = el("div", { class: "filter-bar" });
  const input = el("input", { type: "text", placeholder: "Фильтр по названию или id…" });
  input.value = filters[tabKey];
  const count = el("span", { class: "filter-count" });
  const apply = () => {
    const q = input.value.trim().toLowerCase();
    filters[tabKey] = input.value;
    const nodes = container.querySelectorAll("[data-search]");
    let shown = 0;
    nodes.forEach(node => {
      const match = !q || node.dataset.search.includes(q);
      node.style.display = match ? "" : "none";
      if (match) shown++;
    });
    count.textContent = q ? `Показано ${shown} из ${nodes.length}` : `Всего: ${nodes.length}`;
  };
  input.addEventListener("input", apply);
  bar.append(input, count);
  bar._apply = apply;
  return bar;
}

// Закреплённая сверху вкладки панель: форма создания новой сущности (может
// отсутствовать, напр. если добавлять уже нечего) + строка фильтра под ней.
function makeToolbar(addForm, filterBar) {
  const bar = el("div", { class: "tab-toolbar" });
  if (addForm) bar.appendChild(addForm);
  bar.appendChild(filterBar);
  return bar;
}

    idx.push({ tab: "storage", anchor: `card-storage-${r.id}`, cat: "Склад", label: r.name, sub: r.id }));
  Object.entries(DATA.locations).forEach(([lid, loc]) =>
    idx.push({ tab: "locations", anchor: `card-locations-${lid}`, cat: "Локация", label: loc.name, sub: lid }));
  Object.entries(DATA.manual_actions).forEach(([aid, a]) =>
    idx.push({ tab: "manual", anchor: `card-manual-${aid}`, cat: "Действие", label: a.name, sub: aid }));
  Object.entries(DATA.buildings).forEach(([bid, b]) =>
    idx.push({ tab: "buildings", anchor: `card-buildings-${bid}`, cat: "Постройка", label: b.name, sub: bid }));
  Object.entries(DATA.breakdown_types || {}).forEach(([btId, bt]) =>
    idx.push({ tab: "breakdown-types", anchor: `card-breakdown-types-${btId}`, cat: "Вид поломки", label: bt.name, sub: btId }));
  Object.entries(DATA.techs).forEach(([tid, t]) =>
    idx.push({ tab: "techs", anchor: `card-techs-${tid}`, cat: "Технология", label: t.name, sub: tid }));
  Object.entries(DATA.energy_recipes || {}).forEach(([rid, r]) =>
    idx.push({ tab: "energy-recipes", anchor: `card-energy-recipes-${rid}`, cat: "Рецепт за энергию", label: r.name, sub: rid }));
  Object.entries(DATA.mining_info).forEach(([rid]) => {
    const name = DATA.resources.find(r => r.id === rid)?.name || rid;
    idx.push({ tab: "mining", anchor: `card-mining-${rid}`, cat: "Добыча", label: name, sub: rid });
  });
  Object.entries(DATA.tools).forEach(([toolId, tool]) => {
    tool.tiers.forEach((tier, i) =>
      idx.push({ tab: "tools", anchor: `card-tools-${toolId}-${i}`, cat: `Инструмент: ${tool.name}`, label: tier.name, sub: `Тир ${i + 1}` }));
  });
  Object.entries(DATA.mobs || {}).forEach(([mid, m]) =>
    idx.push({ tab: "mobs", anchor: `card-mobs-${mid}`, cat: m.is_boss ? "Босс" : "Моб", label: m.name, sub: mid }));
  Object.entries(DATA.combat_moves || {}).forEach(([moveId, move]) =>

  Object.entries(DATA.skills || {}).forEach(([skid, sk]) =>

function jumpTo(anchor, tab, { focusName = false } = {}) {
  // Сбрасываем фильтр вкладки-назначения - иначе карточка может быть спрятана
  // старым фильтром, и переход визуально ничего не сделает.
  filters[tab] = "";
  // focusName=true используется ТОЛЬКО сразу после создания новой сущности
  // (см. все вызовы jumpTo/jumpToNew/jumpToTechCard с этим флагом) - в этом
  // случае разворачиваем её карточку заранее (см. makeCardCollapsible), чтобы
  // не заставлять игрока сразу разворачивать вручную то, что он только что
  // создал и, очевидно, собирается заполнять.
  if (focusName) expandedCardIds.add(anchor);
  if (RENDER_BY_TAB[tab]) RENDER_BY_TAB[tab]();
  selectTab(tab);
  requestAnimationFrame(() => {
    const node = document.getElementById(anchor);
    if (!node) return;
    node.scrollIntoView({ behavior: "smooth", block: "center" });
    node.classList.remove("flash");
    void node.offsetWidth; // перезапустить анимацию, если карточка уже мигала
    node.classList.add("flash");
    setTimeout(() => node.classList.remove("flash"), 1600);
    // При создании новой сущности сразу ставим курсор в поле названия - чтобы
    // не пришлось ещё и кликать по карточке, найденной в общем списке.
    if (focusName) {
      // .card-head - обычные вкладки-карточки; иначе (например, строка таблицы
      // ресурсов) берём первое текстовое поле в самом узле.
      const nameInput = node.querySelector(".card-head input[type=text]") || node.querySelector("input[type=text]");
      if (nameInput) { nameInput.focus(); nameInput.select(); }
    }
  });
}

function setupGlobalSearch() {
  const input = document.getElementById("globalSearch");
  const results = document.getElementById("globalResults");

  const render = () => {
    const q = input.value.trim().toLowerCase();
    results.innerHTML = "";
    if (!q) { results.hidden = true; return; }
    const matches = buildSearchIndex()
      .filter(item => item.label.toLowerCase().includes(q) || item.sub.toLowerCase().includes(q))
      .slice(0, 25);
    if (!matches.length) {
      results.appendChild(el("div", { class: "search-empty", text: "Ничего не найдено" }));
    } else {
      matches.forEach(m => {
        const row = el("div", { class: "search-row" });
        row.appendChild(el("span", { class: "search-cat", text: m.cat }));
        row.appendChild(el("span", { class: "search-label", text: m.label }));
        row.appendChild(el("code", { text: m.sub }));
        row.addEventListener("mousedown", (e) => {
          e.preventDefault(); // раньше blur - иначе dropdown закроется до клика
          jumpTo(m.anchor, m.tab);
          input.value = "";
          results.hidden = true;
        });
        results.appendChild(row);
      });
    }
    results.hidden = false;
  };

  input.addEventListener("input", render);
  input.addEventListener("focus", () => { if (input.value.trim()) render(); });
  input.addEventListener("blur", () => setTimeout(() => { results.hidden = true; }, 150));

  document.addEventListener("keydown", (e) => {
    const activeTag = document.activeElement.tagName;
    if (e.key === "/" && activeTag !== "INPUT" && activeTag !== "SELECT" && activeTag !== "TEXTAREA") {
      e.preventDefault();
      input.focus();
    } else if (e.key === "Escape" && document.activeElement === input) {
      input.value = "";
      results.hidden = true;
      input.blur();
    }
  });
}

function toast(kind, title, details) {

    box.appendChild(ul);
  }
  const banner = document.getElementById("banner");
  banner.appendChild(box);
  setTimeout(() => box.remove(), kind === "ok" ? 3000 : 12000);
}

// если сохранили один тир/апгрейд - тогда шаблон просто применяют повторно,
// донабирая лестницу вручную). Применение ДОБАВЛЯЕТ глубокую копию сохранённых

// namespace в TEMPLATES ("storage_tier"/"tool_tier"/"building_upgrade") - не
// связан с content.json, только с TEMPLATES/content_editor_templates.json.
function templateListButtons(kind, label, getList, onApplied) {
  const saveBtn = el("button", { class: "small", text: "Сохранить как шаблон", onclick: () => {
    const list = getList();
    if (!list.length) { alert("Список пуст - нечего сохранять."); return; }
    const name = prompt(`Имя шаблона (${label}):`);
    if (!name) return;
    if (!TEMPLATES[kind]) TEMPLATES[kind] = [];
    if (TEMPLATES[kind].some(t => t.name === name)) {
      TEMPLATES[kind] = TEMPLATES[kind].filter(t => t.name !== name);
    }
    TEMPLATES[kind].push({ name, items: JSON.parse(JSON.stringify(list)) });
    saveTemplates();
  }});

  const applyBtn = el("button", { class: "small", text: "+ добавить из шаблона", onclick: () => {
    openTemplatePickerModal(kind, label, (items) => onApplied(JSON.parse(JSON.stringify(items))));

// Общий "выпадающий список с поиском" для ЛЮБОГО контентного списка, который
// со временем может разрастись (ресурсы/постройки/техи/инструменты/локации/
// лутбоксы/...) - кнопка, открывающая модалку со строкой фильтра по названию
// или id, тот же приём, что уже был у buildingRequirementSelect/speciesSelect/
// techMultiSelect ниже, но параметризованный списком вариантов - чтобы не
// плодить ещё одну копию той же модалки под каждый новый список. Голый
// <select> без поиска остаётся только у ЗАКРЫТЫХ фиксированных перечислений
// (тип апгрейда, режим приёма боя и т.п. - десяток-другой значений, заданных в
// коде, а не растущих вместе с контентом) - там поиск не нужен и не решает
// никакой реальной проблемы.
// entries - [{value, label, id?}] (id - если отличается от label, показывается
// отдельным моноширинным подзаголовком, как id постройки/техи рядом с именем).
// opts.noneLabel - непустая строка разрешает "не выбрано" (value -> null),
// показывается кнопкой в шапке модалки, как у techSelect/buildingRequirementSelect.
function genericPickerSelect(entries, selected, onchange, opts = {}) {
  const { title = "Выбрать", noneLabel = null, placeholder = "— выбрать —", emptyText = "Список пуст." } = opts;
  const btn = el("button", { class: "tech-pick-btn", type: "button" });
  const render = () => {
    const found = entries.find(e => e.value === selected);
    btn.textContent = found ? found.label : (selected == null ? (noneLabel || placeholder) : String(selected));
  };
  render();
  btn.addEventListener("click", () => {
    openGenericPicker(title, entries, selected, noneLabel, emptyText, (newValue) => {
      selected = newValue;
      render();
      onchange(newValue);
    });
  });
  return btn;
}

function openGenericPicker(title, entries, currentValue, noneLabel, emptyText, onPick) {
  closeGenericPicker();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeGenericPicker(); });

  const modal = el("div", { class: "modal building-picker-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: title }));
  if (noneLabel) {
    head.appendChild(el("button", { class: "small", text: noneLabel, onclick: () => { onPick(null); closeGenericPicker(); } }));
  }
  head.appendChild(el("button", { text: "Закрыть", onclick: closeGenericPicker }));
  modal.appendChild(head);

  const body = el("div", { class: "building-picker-body" });
  const search = el("input", { type: "text", placeholder: "Фильтр по названию или id…", class: "building-picker-search" });
  body.appendChild(search);

  const list = el("div", { class: "building-picker-list" });
  if (!entries.length) {
    list.appendChild(el("p", { class: "hint", text: emptyText }));
  }
  entries.forEach(({ value, label, id }) => {
    const shownId = id != null ? id : value;
    const row = el("div", {
      class: "building-picker-row" + (value === currentValue ? " selected" : ""),
      "data-search": `${label} ${shownId}`.toLowerCase(),
    });
    row.appendChild(el("div", { class: "building-picker-name", text: label }));
    if (shownId !== label) row.appendChild(el("code", { class: "building-picker-id", text: shownId }));
    row.addEventListener("click", () => { onPick(value); closeGenericPicker(); });
    list.appendChild(row);
  });
  body.appendChild(list);
  modal.appendChild(body);

  search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    list.querySelectorAll("[data-search]").forEach(row => {
      row.style.display = !q || row.dataset.search.includes(q) ? "" : "none";
    });
  });

  overlay.appendChild(modal);
  overlay.id = "genericPickerOverlay";
  document.body.appendChild(overlay);
  search.focus();
}

function closeGenericPicker() {
  const overlay = document.getElementById("genericPickerOverlay");
  if (overlay) overlay.remove();
}

  closeTechPicker();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeTechPicker(); });

  const modal = el("div", { class: "modal tech-picker-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Выбрать технологию" }));
  head.appendChild(el("button", { class: "small", text: "— не требуется —", onclick: () => { onPick(null); closeTechPicker(); } }));
  head.appendChild(el("button", { text: "Закрыть", onclick: closeTechPicker }));
  modal.appendChild(head);

  const scroll = el("div", { class: "graph-scroll" });
  modal.appendChild(scroll);

  if (!Object.keys(DATA.techs).length) {
    scroll.appendChild(el("p", { class: "hint", text: "Технологий пока нет - добавь их на вкладке «Технологии»." }));
  } else {
    const { positions, width, height } = computeTechPositions();
    const graph = el("div", { class: "tech-graph" });
    graph.style.width = width + "px";
    graph.style.height = height + "px";

    const svg = svgEl("svg", { class: "tech-graph-svg", width, height });
    Object.entries(DATA.techs).forEach(([tid, t]) => {
      (t.requires || []).forEach(reqId => {
        const p1 = positions[reqId], p2 = positions[tid];
        if (!p1 || !p2) return;
        const x1 = p1.x + p1.w, y1 = p1.y + p1.h / 2;
        const x2 = p2.x, y2 = p2.y + p2.h / 2;
        svg.appendChild(svgEl("path", { d: edgePathD(x1, y1, x2, y2), class: "tech-edge" }));
      });
    });
    graph.appendChild(svg);

    Object.entries(DATA.techs).forEach(([tid, t]) => {
      const pos = positions[tid];
      const node = el("div", { class: "tech-node" + (tid === currentValue ? " selected" : "") });
      node.style.left = pos.x + "px";
      node.style.top = pos.y + "px";
      node.style.width = pos.w + "px";
      node.style.height = pos.h + "px";
      node.style.cursor = "pointer";
      node.appendChild(el("div", { class: "tech-node-name", text: t.name }));
      node.appendChild(el("div", { class: "tech-node-id", text: tid }));
      node.addEventListener("click", () => { onPick(tid); closeTechPicker(); });
      graph.appendChild(node);
    });

    scroll.appendChild(graph);
  }

  overlay.appendChild(modal);
  overlay.id = "techPickerOverlay";
  document.body.appendChild(overlay);
}

function closeTechPicker() {
  const overlay = document.getElementById("techPickerOverlay");
  if (overlay) overlay.remove();
}

// Мульти-выбор технологий (requires у ДРУГОЙ технологии) - раньше был сплошной
// список чекбоксов (.req-list), один на каждую технологию в игре: нормально,
// пока их десяток, но перестаёт масштабироваться, когда дерево разрастается
// (та же причина, по которой buildingRequirementSelect выше не голый <select>).
// selectedIds - ссылка на t.requires, мутируется НА МЕСТЕ (push/splice), чтобы
// не плодить новых массивов, которые могли бы разойтись со ссылками в других
// местах (граф, cycle-checker). excludeId - сама редактируемая технология (не
// предлагать зависимость от самой себя - полный цикл через цепочку всё равно
// ловит content_validation.py при сохранении).
function techMultiSelect(selectedIds, onChange, { excludeId = null } = {}) {
  const wrap = el("div", { class: "tech-multi-select" });
  const chipsBox = el("div", { class: "tech-multi-chips" });
  const addBtn = el("button", { class: "small", type: "button", text: "+ Добавить технологию…" });

  const renderChips = () => {
    chipsBox.innerHTML = "";
    if (!selectedIds.length) {
      chipsBox.appendChild(el("span", { class: "hint", text: "— требований нет —" }));
    }
    selectedIds.forEach(id => {
      const chip = el("span", { class: "tech-multi-chip" });
      chip.appendChild(document.createTextNode(DATA.techs[id] ? DATA.techs[id].name : id));
      const rm = el("button", { class: "tech-multi-chip-rm", type: "button", text: "×" });
      rm.addEventListener("click", () => {
        const idx = selectedIds.indexOf(id);
        if (idx !== -1) selectedIds.splice(idx, 1);
        onChange();
        renderChips();
      });
      chip.appendChild(rm);
      chipsBox.appendChild(chip);
    });
  };
  renderChips();

  addBtn.addEventListener("click", () => {
    openTechMultiPicker(selectedIds, excludeId, () => { onChange(); renderChips(); });
  });

  wrap.appendChild(chipsBox);
  wrap.appendChild(addBtn);
  return wrap;
}

function openTechMultiPicker(selectedIds, excludeId, onToggle) {
  closeTechMultiPicker();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeTechMultiPicker(); });

  const modal = el("div", { class: "modal building-picker-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Выбрать технологии" }));
  head.appendChild(el("button", { text: "Готово", onclick: closeTechMultiPicker }));
  modal.appendChild(head);

  const body = el("div", { class: "building-picker-body" });
  const search = el("input", { type: "text", placeholder: "Фильтр по названию или id…", class: "building-picker-search" });
  body.appendChild(search);

  const list = el("div", { class: "building-picker-list" });
  const entries = Object.entries(DATA.techs).filter(([tid]) => tid !== excludeId);
  if (!entries.length) {
    list.appendChild(el("p", { class: "hint", text: "Технологий пока нет - добавь их на вкладке «Технологии»." }));
  }
  entries.forEach(([tid, t]) => {
    const isSelected = () => selectedIds.includes(tid);
    const row = el("div", {
      class: "building-picker-row multi" + (isSelected() ? " selected" : ""),
      "data-search": `${t.name} ${tid}`.toLowerCase(),
    });
    const cb = el("input", { type: "checkbox" });
    cb.checked = isSelected();
    const nameBox = el("div", { style: "display:flex; align-items:center; gap:8px;" }, [
      cb, el("div", { class: "building-picker-name", text: t.name }),
    ]);
    row.appendChild(nameBox);
    row.appendChild(el("code", { class: "building-picker-id", text: tid }));
    row.addEventListener("click", () => {
      const idx = selectedIds.indexOf(tid);
      if (idx === -1) { selectedIds.push(tid); } else { selectedIds.splice(idx, 1); }
      cb.checked = isSelected();
      row.classList.toggle("selected", isSelected());
      onToggle();
    });
    list.appendChild(row);
  });
  body.appendChild(list);
  modal.appendChild(body);

  search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    list.querySelectorAll("[data-search]").forEach(row => {
      row.style.display = !q || row.dataset.search.includes(q) ? "" : "none";
    });
  });

  overlay.appendChild(modal);
  overlay.id = "techMultiPickerOverlay";
  document.body.appendChild(overlay);
  search.focus();
}

function closeTechMultiPicker() {
  const overlay = document.getElementById("techMultiPickerOverlay");

}
