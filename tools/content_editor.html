<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Редактор контента игры</title>
<style>
  :root {
    --bg: #f5f3ee;
    --panel: #ffffff;
    --border: #ddd6c8;
    --text: #2b2620;
    --muted: #837c6c;
    --accent: #a15c3d;
    --accent-text: #fff;
    --danger: #b0392f;
    --ok: #4a7c3f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  header .spacer { flex: 1; }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 12px;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.small { padding: 2px 8px; font-size: 12px; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }

  nav {
    display: flex;
    gap: 4px;
    padding: 10px 20px 0;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  nav button {
    border-radius: 6px 6px 0 0;
    border-bottom: none;
    background: transparent;
  }
  nav button.active { background: var(--bg); font-weight: 600; }

  main { padding: 20px; max-width: 980px; margin: 0 auto; }
  .tab { display: none; }
  .tab.active { display: block; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .card-head code {
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  .card-head .spacer { flex: 1; }
  .card-head input[type=text] { font-size: 14px; font-weight: 600; flex: 1; max-width: 320px; }
  .order-controls { display: flex; gap: 3px; }
  .order-controls button { min-width: 26px; }

  /* Сворачивание карточек сущностей (см. makeCardCollapsible) - по умолчанию
     свёрнуты все, кроме .card-head (id/иконка/имя/порядок/удаление остаются
     видны и в свёрнутом виде). Свёрнутая карточка теряет нижний отступ у
     .card-head, чтобы список был компактнее, а не просто пустым местом. */
  .card.collapsed .card-body { display: none; }
  .card.collapsed .card-head { margin-bottom: 0; }
  .card-collapse-toggle {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 13px; padding: 2px 4px; line-height: 1; flex-shrink: 0;
  }
  .card-collapse-toggle:hover { color: var(--text); }

  .field-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
  .field-row label { font-size: 12px; color: var(--muted); min-width: 120px; }
  .settings-summary-row .hint { flex: 1; margin: 0; }
  .modal.settings-modal { max-width: 520px; }

  input, select, textarea {
    font: inherit;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--panel);
    color: var(--text);
  }
  input[type=number] { width: 80px; }
  /* Любое текстовое поле растёт под введённый текст сам - по прямому пожеланию
     "видеть введённое целиком", а не только у описаний. field-sizing - нативная
     CSS-фича (Chrome/Edge 123+), без единой строчки JS; там, где её ещё нет,
     поле просто ведёт себя как раньше (fixed) - деградация без потери функции. */
  input[type=text] { field-sizing: content; min-width: 80px; max-width: 100%; }
  textarea {
    field-sizing: content; resize: none; min-width: 260px; max-width: 100%;
    min-height: 30px; line-height: 1.4; white-space: pre-wrap;
  }

  .dict-editor { margin: 4px 0; }
  .dict-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .dict-row select { min-width: 140px; }

  .stages-box { margin: 6px 0 10px; }
  .stage-card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
  .stage-card .stage-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .stage-card .stage-head strong { font-size: 12px; }
  .stage-card .stage-head .spacer { flex: 1; }

  .req-list { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0; }
  .req-list label { display: flex; align-items: center; gap: 4px; font-size: 13px; }

  .effect-card {
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 10px;
    margin: 8px 0;
    background: var(--bg);
  }

  table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }

  .add-form {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 12px;
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: 8px;
    flex-wrap: wrap;
  }
  .add-form input, .add-form select { flex: 1; min-width: 140px; }

  #banner {
    position: fixed;
    top: 60px;
    right: 20px;
    max-width: 420px;
    z-index: 100;
  }
  .toast {
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.15);
    font-size: 13px;
  }
  .toast.ok { background: #eaf5e6; border: 1px solid var(--ok); color: #2e5527; }
  .toast.error { background: #fbeae8; border: 1px solid var(--danger); color: #7a2721; }
  .toast ul { margin: 6px 0 0; padding-left: 18px; }

  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 10px; }
  #rawJson { width: 100%; height: 300px; font-family: monospace; font-size: 12px; }

  .filter-bar {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .filter-bar input { flex: 1; }
  .filter-count { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* Закреплённая сверху вкладки панель: форма создания новой сущности + фильтр.
     Так кнопку "Добавить" всегда видно, не нужно листать список до конца. */
  .tab-toolbar {
    position: sticky;
    top: var(--topbar-h, 96px);
    z-index: 5;
    background: var(--bg);
    padding: 8px 0 12px;
    margin-bottom: 12px;
    box-shadow: 0 4px 6px -4px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  @keyframes flash-highlight { 0% { background: #fdeec0; } 100% { background: var(--panel); } }
  .card.flash, tr.flash, .tech-node.flash { animation: flash-highlight 1.6s ease-out; }

  .global-search { position: relative; width: 320px; }
  .global-search input { width: 100%; }
  .search-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.15);
    max-height: 360px;
    overflow-y: auto;
    z-index: 50;
  }
  .search-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .search-row:last-child { border-bottom: none; }
  .search-row:hover { background: var(--bg); }
  .search-cat {
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    border-radius: 4px;
    padding: 2px 6px;
    white-space: nowrap;
  }
  .search-label { flex: 1; }
  .search-row code { color: var(--muted); font-size: 11px; }
  .search-empty { padding: 10px; color: var(--muted); font-size: 13px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto;
  }
  .modal-head {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel);
  }
  .modal-head strong { flex: 1; }

  .icon-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px; font-size: 12px;
  }
  .icon-btn .pixel-icon { image-rendering: pixelated; shape-rendering: crispEdges; background: var(--bg); border-radius: 3px; }
  .icon-btn .custom-tag { color: var(--accent); font-size: 10px; }

  .icon-modal { max-width: 480px; }
  .tech-picker-modal { max-width: 92vw; }
  .tech-pick-btn { text-align: left; min-width: 220px; }

  .building-picker-modal { max-width: 480px; }
  .building-picker-body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .building-picker-search { field-sizing: fixed; width: 100%; }
  .building-picker-list { display: flex; flex-direction: column; gap: 4px; max-height: 50vh; overflow-y: auto; }
  .building-picker-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; background: var(--panel);
  }
  .building-picker-row:hover { border-color: var(--accent); }
  .building-picker-row.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .building-picker-name { font-size: 13px; font-weight: 600; }
  .building-picker-id { font-size: 11px; color: var(--muted); }
  .icon-editor-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .icon-palette-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
  .icon-palette-row .swatch {
    width: 22px; height: 22px; border-radius: 4px; border: 2px solid var(--border); cursor: pointer;
  }
  .icon-palette-row .swatch.active { border-color: var(--accent); }
  .icon-palette-row input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--border); border-radius: 4px; }
  .icon-palette-row button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  .icon-grid { display: grid; gap: 1px; background: var(--border); border: 1px solid var(--border); user-select: none; }
  .icon-cell { width: 14px; height: 14px; background: var(--panel); cursor: crosshair; }
  .icon-cell:hover { outline: 1px solid var(--accent); outline-offset: -1px; }

  .icon-preview { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .icon-preview .pixel-icon { image-rendering: pixelated; shape-rendering: crispEdges; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .icon-preview span { font-size: 11px; color: var(--muted); }

  .icon-editor-footer { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--border); justify-content: flex-end; }

  .view-toggle { display: flex; gap: 6px; margin-bottom: 12px; }
  .view-toggle button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  .graph-scroll {
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    max-height: 70vh;
  }
  .tech-graph { position: relative; }
  .tech-graph-svg { position: absolute; top: 0; left: 0; pointer-events: none; }
  .tech-tier-band { position: absolute; top: 0; border-radius: 6px; pointer-events: none; }
  .tech-tier-band-label { position: absolute; top: 4px; text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; pointer-events: none; }
  #arrowhead path { fill: var(--muted); }

  .tech-node {
    position: absolute;
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .tech-node:hover { border-color: var(--accent); }
  .tech-node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .tech-node.dim { opacity: .25; }
  .tech-node { cursor: grab; }
  .tech-node:active { cursor: grabbing; }
  .tech-node-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tech-node-id { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tech-node-handle {
    position: absolute;
    right: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--panel);
    cursor: crosshair;
  }

  .tech-edge { stroke: var(--muted); stroke-width: 2; fill: none; pointer-events: none; }
  .tech-edge.related { stroke: var(--accent); stroke-width: 3; }
  .tech-edge.dim { opacity: .15; }
  .tech-edge-hit { stroke: transparent; stroke-width: 14; fill: none; pointer-events: stroke; cursor: pointer; }
  .tech-edge-drag { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; pointer-events: none; }
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <header>
    <h1>🛠 Редактор контента игры</h1>
    <div class="global-search">
      <input id="globalSearch" type="text" placeholder="Поиск по всему редактору (/ чтобы сфокусировать)…">
      <div id="globalResults" class="search-dropdown" hidden></div>
    </div>
    <div class="spacer"></div>
    <button id="reloadBtn">Перезагрузить с диска</button>
    <button id="saveBtn" class="primary">Сохранить</button>
    <button id="resetSaveBtn" class="danger">Обнулить прогресс игрока</button>
  </header>

  <nav id="tabs"></nav>
</div>

<main>
  <div id="tab-resources" class="tab"></div>
  <div id="tab-storage" class="tab"></div>
  <div id="tab-locations" class="tab"></div>
  <div id="tab-manual" class="tab"></div>
  <div id="tab-buildings" class="tab"></div>
  <div id="tab-techs" class="tab"></div>
  <div id="tab-energy-recipes" class="tab"></div>
  <div id="tab-species" class="tab"></div>
  <div id="tab-genetic-traits" class="tab"></div>
  <div id="tab-breeding" class="tab"></div>
  <div id="tab-mining" class="tab"></div>
  <div id="tab-tools" class="tab"></div>
  <div id="tab-mobs" class="tab"></div>
  <div id="tab-skills" class="tab"></div>
  <div id="tab-quests" class="tab"></div>
  <div id="tab-settings" class="tab"></div>
  <div id="tab-raw" class="tab">
    <p class="hint">Сырой JSON текущего состояния (только для просмотра/копирования - редактируется через вкладки выше).</p>
    <textarea id="rawJson" readonly></textarea>
  </div>
</main>

<div id="banner"></div>

<script>
let DATA = null;

const TABS = [
  ["resources", "Ресурсы"],
  ["storage", "Склад"],
  ["locations", "Локации"],
  ["manual", "Ручные действия"],
  ["buildings", "Постройки"],
  ["techs", "Технологии"],
  ["energy-recipes", "Рецепты за энергию"],
  ["species", "Виды"],
  ["genetic-traits", "Генетика"],
  ["breeding", "Мутации"],
  ["mining", "Добыча"],
  ["tools", "Инструменты"],
  ["mobs", "Мобы/Боссы"],
  ["skills", "Навыки"],
  ["quests", "Квесты"],
  ["settings", "Настройки"],
  ["raw", "JSON"],
];

// Локация с этим id - обязательный "якорь" механики поиска/добычи жил (см. game/engine.py,
// MINE_LOCATION_ID): её нельзя удалить в редакторе, хотя обычные действия внутри неё
// (например, добычу камня) удалять и редактировать можно как у любой другой локации.
const MINE_LOCATION_ID = "shaft";

// Локация с этим id - обязательный "якорь" механики выбора рецепта крафта за энергию
// (см. game/engine.py, CONVERTER_LOCATION_ID): её нельзя удалить в редакторе, хотя
// обычные действия внутри неё можно удалять и редактировать как у любой другой локации.
// Вложена в обычную (ничем не защищённую) локацию "mechanisms"/"Механизмы".
const CONVERTER_LOCATION_ID = "converter";

// Ресурс с этим id - единственный со спец-поведением в коде (см. game/engine.py,
// ENERGY_RESOURCE_ID): не копится без хранилищ, всегда закреплён на панели, не
// участвует в автокрафте. Его тоже нельзя удалить в редакторе - без него игра
// упадёт в первом же месте, которое к нему обращается.
const ENERGY_RESOURCE_ID = "energy";

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined) continue; // напр. disabled: null должен значить "не ставить атрибут"
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) node.appendChild(c);
  return node;
}

// Поле для длинного свободного текста (описания) - <textarea>, а не <input type=text>,
// чтобы длинный текст переносился по словам и поле росло ВНИЗ по мере ввода (field-sizing:
// content в CSS), а не превращалось в бесконечно широкую однострочную полосу. rows=1 -
// стартовая высота в одну строку, дальше field-sizing сам растит её под контент. El()
// не умеет проставлять value текстовой области через atributes (у textarea это не HTML-
// атрибут, а текстовое содержимое) - используем "text" (задаёт и textContent, и тем самым
// стартовое .value), а читаем текущее значение через .value (меняется при вводе).
function descriptionTextarea(value, placeholder, onchange) {
  const ta = el("textarea", { rows: "1", placeholder, text: value || "" });
  ta.addEventListener("change", () => onchange(ta.value));
  return ta;
}

const SVG_NS = "http://www.w3.org/2000/svg";

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined) continue;
    node.setAttribute(k, v);
  }
  return node;
}

function pixelIcon(grid, palette, size = 32) {
  const rows = grid.length, cols = grid[0].length;
  const svg = svgEl("svg", { viewBox: `0 0 ${cols} ${rows}`, width: size, height: size, class: "pixel-icon" });
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const ch = grid[y][x];
      if (ch === ".") continue;
      svg.appendChild(svgEl("rect", { x, y, width: 1, height: 1, fill: palette[ch] }));
    }
  }
  return svg;
}

// Встроенные иконки по умолчанию - те же, что рисует сама игра (tools/web_ui.html),
// нужны тут только чтобы показать "как оно будет выглядеть, если не задавать свою".
const DEFAULT_ICONS = {
  energy: { grid: [
    ".....AA.", "....AA..", "...AA...", "..AAAAAA",
    ".AAAA...", "AAA.....", "AA......", "A.......",
  ], palette: { A: "#f4c430" } },
  wood: { grid: [
    "..AAAAAA..", ".AABBBBAA.", "AABBCCBBAA", "AABCCCCBAA",
    "AABBCCBBAA", ".AABBBBAA.", "..AAAAAA..",
  ], palette: { A: "#6b4423", B: "#c69a6d", C: "#8a5a34" } },
  stone: { grid: [
    "...AAAA...", "..ABBBAA..", ".ABBBBBAA.", "AABBBBBBAA",
    "AABBBBBBAA", ".AABBBBAA.", "..AAAAAA..",
  ], palette: { A: "#5f6266", B: "#8b8f94" } },
  planks: { grid: [
    "AAAAAAAAAA", "BBBBBBBBBB", "AAAAAAAAAA", "BBBBBBBBBB",
    "AAAAAAAAAA", "BBBBBBBBBB", "AAAAAAAAAA",
  ], palette: { A: "#b98a52", B: "#8a5a34" } },
  tools: { grid: [
    "..AAAA..", ".AAAAAA.", ".AAAAAA.", "...BB...",
    "...BB...", "...BB...", "...BB...", "..BBBB..",

// ---------- редактор пиксельных иконок ----------

const ICON_EDITOR_SIZE = 24;
const ICON_EDITOR_CELL_PX = 14;
const ICON_PRESET_COLORS = [
  "#e8e6df", "#8b93a0", "#2b2b2b", "#f0a030", "#f4c430", "#4ac9a0",
  "#e0524a", "#6b4423", "#8a5a34", "#c69a6d", "#8b8f94", "#c7ccd1",
  "#8fd94a", "#3d5a2f", "#5b7fb5",
];

function blankIconGrid() {
  return Array.from({ length: ICON_EDITOR_SIZE }, () => ".".repeat(ICON_EDITOR_SIZE));
}

// ---------- импорт внешней картинки в {grid, palette} ----------

const ICON_IMPORT_MAX_COLORS = 16;

function rgbToHex([r, g, b]) {
  return "#" + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
}

// Простой k-means по RGB - сводит произвольное число цветов картинки к k "центрам",
// чтобы получить палитру пиксель-иконки (буква -> hex), а не тысячи оттенков из фото.
function kmeansColors(pixels, k, iterations = 8) {
  if (pixels.length <= k) {
    const uniq = [];
    const seen = new Set();
    for (const p of pixels) {
      const key = p.join(",");
      if (!seen.has(key)) { seen.add(key); uniq.push(p); }
    }
    return uniq.length ? uniq : [[0, 0, 0]];
  }
  let centers = Array.from({ length: k }, (_, i) => pixels[Math.floor(i * pixels.length / k)].slice());
  for (let iter = 0; iter < iterations; iter++) {
    const sums = centers.map(() => [0, 0, 0, 0]);
    for (const p of pixels) {
      let best = 0, bestDist = Infinity;
      centers.forEach((c, idx) => {
        const d = (c[0] - p[0]) ** 2 + (c[1] - p[1]) ** 2 + (c[2] - p[2]) ** 2;
        if (d < bestDist) { bestDist = d; best = idx; }
      });
      sums[best][0] += p[0]; sums[best][1] += p[1]; sums[best][2] += p[2]; sums[best][3]++;
    }
    centers = centers.map((c, idx) => sums[idx][3]
      ? [sums[idx][0] / sums[idx][3], sums[idx][1] / sums[idx][3], sums[idx][2] / sums[idx][3]]
      : c);
  }
  return centers;
}

// Уменьшает img до size x size (браузер сам усредняет цвета при downscale через drawImage)
// и квантует результат в {grid, palette} того же формата, что рисует редактор руками.
// Прозрачные пиксели (alpha < 128) становятся "." - как в ручных иконках.
function quantizeImageToIcon(img, size, maxColors) {
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, size, size);
  ctx.drawImage(img, 0, 0, size, size);
  const { data } = ctx.getImageData(0, 0, size, size);

  const opaque = new Array(size * size).fill(false);
  const pixels = [];
  for (let i = 0; i < size * size; i++) {
    if (data[i * 4 + 3] >= 128) {
      opaque[i] = true;
      pixels.push([data[i * 4], data[i * 4 + 1], data[i * 4 + 2]]);
    }
  }
  if (!pixels.length) return { grid: blankIconGrid(), palette: {} };

  const centers = kmeansColors(pixels, maxColors);
  const palette = {};
  centers.forEach((c, idx) => { palette[String.fromCharCode(65 + idx)] = rgbToHex(c); });

  const grid = [];
  let pi = 0;
  for (let y = 0; y < size; y++) {
    let row = "";
    for (let x = 0; x < size; x++) {
      if (!opaque[y * size + x]) { row += "."; continue; }
      const [r, g, b] = pixels[pi++];
      let best = 0, bestDist = Infinity;
      centers.forEach((c, idx) => {
        const d = (c[0] - r) ** 2 + (c[1] - g) ** 2 + (c[2] - b) ** 2;
        if (d < bestDist) { bestDist = d; best = idx; }
      });
      row += String.fromCharCode(65 + best);
    }
    grid.push(row);
  }
  return { grid, palette };
}

// Валидирует текст как {grid, palette} той же формы, что рисует редактор и что просит
// сгенерировать LLM (см. инструкцию для дешёвой модели) - используется при вставке
// готового JSON от другой модели. Возвращает { ok: true, icon, warnings } или
// { ok: false, errors }. warnings - некритичные проблемы (аппликуется всё равно),
// errors - блокирующие (не критичные для рендера ошибки формата).
function validateIconJson(text) {
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    return { ok: false, errors: [`Невалидный JSON: ${e.message}`] };
  }
  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
    return { ok: false, errors: ['Ожидается JSON-объект вида {"grid": [...], "palette": {...}}.'] };
  }
  const { grid, palette } = parsed;
  const errors = [];
  if (!Array.isArray(grid)) errors.push('Поле "grid" должно быть массивом строк.');
  if (!palette || typeof palette !== "object" || Array.isArray(palette)) {
    errors.push('Поле "palette" должно быть объектом вида {"A": "#rrggbb"}.');
  }
  if (errors.length) return { ok: false, errors };

  if (grid.length !== ICON_EDITOR_SIZE) {
    errors.push(`"grid" должен содержать ровно ${ICON_EDITOR_SIZE} строк, получено ${grid.length}.`);
  }
  const rowCharsRe = /^[.A-Z]+$/;
  grid.forEach((row, i) => {
    if (typeof row !== "string") { errors.push(`Строка ${i + 1}: не строка.`); return; }
    if (row.length !== ICON_EDITOR_SIZE) errors.push(`Строка ${i + 1}: длина ${row.length} символов, ожидалось ${ICON_EDITOR_SIZE}.`);
    if (!rowCharsRe.test(row)) errors.push(`Строка ${i + 1}: разрешены только "." и заглавные A-Z, найдены другие символы.`);
  });
  if (errors.length) return { ok: false, errors };

  const usedLetters = new Set(grid.join("").split("").filter(c => c !== "."));
  const paletteKeys = new Set(Object.keys(palette));
  const missing = [...usedLetters].filter(c => !paletteKeys.has(c));
  if (missing.length) errors.push(`В palette не хватает цвета для букв из grid: ${missing.join(", ")}.`);
  const hexRe = /^#[0-9a-fA-F]{6}$/;
  Object.entries(palette).forEach(([k, v]) => {
    if (usedLetters.has(k) && (typeof v !== "string" || !hexRe.test(v))) {
      errors.push(`Цвет для "${k}" должен быть в формате "#rrggbb", получено: ${JSON.stringify(v)}.`);
    }
  });
  if (errors.length) return { ok: false, errors };

  const extra = [...paletteKeys].filter(c => !usedLetters.has(c));
  const trimmedPalette = {};
  usedLetters.forEach(c => { trimmedPalette[c] = palette[c]; });
  const warnings = extra.length ? [`Лишние цвета в palette без пикселей в grid проигнорированы: ${extra.join(", ")}.`] : [];
  if (!usedLetters.size) return { ok: false, errors: ["Иконка пустая - ни одного закрашенного пикселя (весь grid из точек)."] };

  return { ok: true, icon: { grid: grid.slice(), palette: trimmedPalette }, warnings };
}

// title - заголовок модалки. currentIcon - {grid, palette} или null. fallbackIcon - что
// показать/с чего начать, если своей иконки ещё нет (встроенная по умолчанию).
// onApply(icon) вызывается с новым {grid, palette} или null (если убрали кастомную иконку).
function openIconEditor(title, currentIcon, fallbackIcon, onApply) {
  const seed = currentIcon || fallbackIcon;
  let grid = seed ? seed.grid.slice() : blankIconGrid();
  // нормализуем к фиксированному размеру редактора, если встроенная иконка меньше
  if (grid.length < ICON_EDITOR_SIZE || grid[0].length < ICON_EDITOR_SIZE) {
    const padded = blankIconGrid();
    grid.forEach((row, y) => { if (y < ICON_EDITOR_SIZE) padded[y] = (row + ".".repeat(ICON_EDITOR_SIZE)).slice(0, ICON_EDITOR_SIZE); });
    grid = padded;
  }
  let palette = seed ? { ...seed.palette } : {};
  const charOf = new Map(Object.entries(palette).map(([c, col]) => [col, c]));
  let nextCharCode = 65 + Object.keys(palette).length;
  let currentColor = ICON_PRESET_COLORS[3];
  let tool = "paint";

  function colorChar(color) {
    if (charOf.has(color)) return charOf.get(color);
    const ch = String.fromCharCode(nextCharCode++);
    charOf.set(color, ch);
    palette[ch] = color;
    return ch;
  }
  function setCell(x, y, ch) {
    const row = grid[y].split("");
    row[x] = ch;
    grid[y] = row.join("");
  }

  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  const modal = el("div", { class: "modal icon-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: `Иконка: ${title}` }));
  head.appendChild(el("button", { text: "Закрыть", onclick: () => close() }));
  modal.appendChild(head);

  const body = el("div", { class: "icon-editor-body" });

  const paletteRow = el("div", { class: "icon-palette-row" });
  function renderPaletteRow() {
    paletteRow.innerHTML = "";
    ICON_PRESET_COLORS.forEach(c => {
      const sw = el("div", { class: "swatch" + (tool === "paint" && currentColor === c ? " active" : ""), style: `background:${c}` });
      sw.addEventListener("click", () => { currentColor = c; tool = "paint"; renderPaletteRow(); });
      paletteRow.appendChild(sw);
    });
    const customInput = el("input", { type: "color", value: currentColor });
    customInput.addEventListener("input", () => { currentColor = customInput.value; tool = "paint"; renderPaletteRow(); });
    paletteRow.appendChild(customInput);
    const eraseBtn = el("button", { class: "small" + (tool === "erase" ? " active" : ""), text: "Ластик", onclick: () => { tool = "erase"; renderPaletteRow(); } });
    paletteRow.appendChild(eraseBtn);
  }
  renderPaletteRow();
  body.appendChild(paletteRow);

  const gridBox = el("div", { class: "icon-grid" });
  gridBox.style.gridTemplateColumns = `repeat(${ICON_EDITOR_SIZE}, ${ICON_EDITOR_CELL_PX}px)`;
  let painting = false;
  const stopPainting = () => { painting = false; };
  document.addEventListener("mouseup", stopPainting);

  const cellEls = [];
  for (let y = 0; y < ICON_EDITOR_SIZE; y++) {
    const rowEls = [];
    for (let x = 0; x < ICON_EDITOR_SIZE; x++) {
      const cell = el("div", { class: "icon-cell" });
      const paint = () => {
        setCell(x, y, tool === "erase" ? "." : colorChar(currentColor));
        updateCell(x, y);
        updatePreview();
      };
      cell.addEventListener("mousedown", (e) => { e.preventDefault(); painting = true; paint(); });
      cell.addEventListener("mouseenter", () => { if (painting) paint(); });
      gridBox.appendChild(cell);
      rowEls.push(cell);
    }
    cellEls.push(rowEls);
  }
  function updateCell(x, y) {
    const ch = grid[y][x];
    cellEls[y][x].style.background = ch === "." ? "" : (palette[ch] || "");
  }
  for (let y = 0; y < ICON_EDITOR_SIZE; y++) for (let x = 0; x < ICON_EDITOR_SIZE; x++) updateCell(x, y);
  body.appendChild(gridBox);

  // Общая точка входа и для импорта картинки, и для вставки готового JSON от LLM -
  // подменяет содержимое редактируемой иконки целиком и перерисовывает сетку/превью.
  function applyIconToEditor(icon) {
    grid = icon.grid;
    palette = icon.palette;
    charOf.clear();
    Object.entries(palette).forEach(([c, col]) => charOf.set(col, c));
    nextCharCode = 65 + Object.keys(palette).length;
    for (let y = 0; y < ICON_EDITOR_SIZE; y++) for (let x = 0; x < ICON_EDITOR_SIZE; x++) updateCell(x, y);
    updatePreview();
  }

  const previewBox = el("div", { class: "icon-preview" });
  function updatePreview() {
    previewBox.innerHTML = "";
    previewBox.appendChild(pixelIcon(grid, palette, 96));
    previewBox.appendChild(el("span", { text: "Превью в игре" }));
  }
  updatePreview();
  body.appendChild(previewBox);
  modal.appendChild(body);

  const footer = el("div", { class: "icon-editor-footer" });
  const importInput = el("input", { type: "file", accept: "image/*", style: "display:none" });
  importInput.addEventListener("change", () => {
    const file = importInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        applyIconToEditor(quantizeImageToIcon(img, ICON_EDITOR_SIZE, ICON_IMPORT_MAX_COLORS));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    importInput.value = "";
  });
  footer.appendChild(importInput);
  footer.appendChild(el("button", { text: "Импортировать картинку…", onclick: () => importInput.click() }));
  footer.appendChild(el("button", { text: "Вставить JSON…", onclick: () => openJsonPasteModal(applyIconToEditor) }));
  footer.appendChild(el("button", { text: "Очистить", onclick: () => {
    grid = blankIconGrid();
    for (let y = 0; y < ICON_EDITOR_SIZE; y++) for (let x = 0; x < ICON_EDITOR_SIZE; x++) updateCell(x, y);
    updatePreview();
  }}));
  footer.appendChild(el("button", { text: "Убрать свою иконку (вернуть по умолчанию)", onclick: () => {
    onApply(null);
    close();
  }}));
  footer.appendChild(el("button", { class: "primary", text: "Применить", onclick: () => {
    const usedChars = new Set(grid.join("").split("").filter(c => c !== "."));
    if (!usedChars.size) { onApply(null); close(); return; }
    const trimmedPalette = {};
    usedChars.forEach(c => { trimmedPalette[c] = palette[c]; });
    onApply({ grid: grid.slice(), palette: trimmedPalette });
    close();
  }}));
  modal.appendChild(footer);

  function close() {
    document.removeEventListener("mouseup", stopPainting);
    overlay.remove();
  }

  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

// Модалка вставки готового {grid, palette} JSON (например, от отдельной LLM-сессии по
// текстовой инструкции формата иконки). onApply(icon) вызывается только для валидного
// JSON, прошедшего validateIconJson - невалидный просто показывает список ошибок и не
// закрывает модалку, дав пользователю поправить текст и попробовать снова.
function openJsonPasteModal(onApply) {
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  const modal = el("div", { class: "modal icon-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Вставить JSON иконки" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: () => close() }));
  modal.appendChild(head);

  const body = el("div", { class: "icon-editor-body" });
  body.appendChild(el("div", {
    style: "font-size:12px;color:var(--muted);align-self:stretch;",
    text: `Вставь JSON вида {"grid": [...${ICON_EDITOR_SIZE} строк...], "palette": {...}}, полученный от другой модели по промпт-инструкции формата иконки.`,
  }));
  const textarea = el("textarea", {
    rows: "14",
    style: "width:100%;font-family:monospace;font-size:12px;box-sizing:border-box;",
    placeholder: '{"grid": [...], "palette": {...}}',
  });
  body.appendChild(textarea);
  const feedback = el("div", { style: "width:100%;white-space:pre-wrap;font-size:12px;" });
  body.appendChild(feedback);
  modal.appendChild(body);

  const footer = el("div", { class: "icon-editor-footer" });
  footer.appendChild(el("button", { class: "primary", text: "Проверить и применить", onclick: () => {
    const result = validateIconJson(textarea.value);
    if (!result.ok) {
      feedback.style.color = "#e0524a";
      feedback.textContent = result.errors.join("\n");
      return;
    }
    feedback.style.color = "";
    feedback.textContent = "";
    onApply(result.icon);
    if (result.warnings.length) alert(result.warnings.join("\n"));
    close();
  }}));
  modal.appendChild(footer);

  function close() { overlay.remove(); }

  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  textarea.focus();
}

// Кнопка-превью с текущей иконкой (кастомной или дефолтной), открывающая редактор по клику.
function iconEditButton(title, entity, fallbackIcon, onChanged) {
  const btn = el("button", { class: "icon-btn" });
  function render() {
    btn.innerHTML = "";
    const shown = entity.icon || fallbackIcon;
    if (shown) btn.appendChild(pixelIcon(shown.grid, shown.palette, 26));
    btn.appendChild(document.createTextNode(entity.icon ? "" : "Иконка"));
    if (entity.icon) btn.appendChild(el("span", { class: "custom-tag", text: "своя" }));
  }
  render();
  btn.addEventListener("click", () => {
    openIconEditor(title, entity.icon || null, fallbackIcon, (icon) => {
      entity.icon = icon || undefined;
      if (!icon) delete entity.icon;
      render();
      if (onChanged) onChanged();
    });
  });
  return btn;
}

// ---------- фильтрация внутри вкладки ----------

const filters = { resources: "", storage: "", locations: "", manual: "", buildings: "", techs: "", "energy-recipes": "", mining: "", tools: "", mobs: "", skills: "", quests: "" };

// Оборачивает контейнер карточек строкой поиска. Каждая карточка/строка должна иметь
// data-search (текст для сравнения) - см. вызовы ниже. Вызови вернувшуюся apply() один
// раз сразу после того, как контейнер наполнен карточками.
function makeFilterBar(tabKey, container) {
  const bar = el("div", { class: "filter-bar" });
  const input = el("input", { type: "text", placeholder: "Фильтр по названию или id…" });
  input.value = filters[tabKey];
  const count = el("span", { class: "filter-count" });
  const apply = () => {
    const q = input.value.trim().toLowerCase();
    filters[tabKey] = input.value;
    const nodes = container.querySelectorAll("[data-search]");
    let shown = 0;
    nodes.forEach(node => {
      const match = !q || node.dataset.search.includes(q);
      node.style.display = match ? "" : "none";
      if (match) shown++;
    });
    count.textContent = q ? `Показано ${shown} из ${nodes.length}` : `Всего: ${nodes.length}`;
  };
  input.addEventListener("input", apply);
  bar.append(input, count);
  bar._apply = apply;
  return bar;
}

function jumpTo(anchor, tab, { focusName = false } = {}) {
  // Сбрасываем фильтр вкладки-назначения - иначе карточка может быть спрятана
  // старым фильтром, и переход визуально ничего не сделает.
  filters[tab] = "";
  // focusName=true используется ТОЛЬКО сразу после создания новой сущности
  // (см. все вызовы jumpTo/jumpToNew/jumpToTechCard с этим флагом) - в этом
  // случае разворачиваем её карточку заранее (см. makeCardCollapsible), чтобы
  // не заставлять игрока сразу разворачивать вручную то, что он только что
  // создал и, очевидно, собирается заполнять.
  if (focusName) expandedCardIds.add(anchor);
  if (RENDER_BY_TAB[tab]) RENDER_BY_TAB[tab]();
  selectTab(tab);
  requestAnimationFrame(() => {
    const node = document.getElementById(anchor);
    if (!node) return;
    node.scrollIntoView({ behavior: "smooth", block: "center" });
    node.classList.remove("flash");
    void node.offsetWidth; // перезапустить анимацию, если карточка уже мигала
    node.classList.add("flash");
    setTimeout(() => node.classList.remove("flash"), 1600);
    // При создании новой сущности сразу ставим курсор в поле названия - чтобы
    // не пришлось ещё и кликать по карточке, найденной в общем списке.
    if (focusName) {
      // .card-head - обычные вкладки-карточки; иначе (например, строка таблицы
      // ресурсов) берём первое текстовое поле в самом узле.
      const nameInput = node.querySelector(".card-head input[type=text]") || node.querySelector("input[type=text]");
      if (nameInput) { nameInput.focus(); nameInput.select(); }
    }
  });
}

function setupGlobalSearch() {
  const input = document.getElementById("globalSearch");
  const results = document.getElementById("globalResults");

  const render = () => {
    const q = input.value.trim().toLowerCase();
    results.innerHTML = "";
    if (!q) { results.hidden = true; return; }
    const matches = buildSearchIndex()
      .filter(item => item.label.toLowerCase().includes(q) || item.sub.toLowerCase().includes(q))
      .slice(0, 25);
    if (!matches.length) {
      results.appendChild(el("div", { class: "search-empty", text: "Ничего не найдено" }));
    } else {
      matches.forEach(m => {
        const row = el("div", { class: "search-row" });
        row.appendChild(el("span", { class: "search-cat", text: m.cat }));
        row.appendChild(el("span", { class: "search-label", text: m.label }));
        row.appendChild(el("code", { text: m.sub }));
        row.addEventListener("mousedown", (e) => {
          e.preventDefault(); // раньше blur - иначе dropdown закроется до клика
          jumpTo(m.anchor, m.tab);
          input.value = "";
          results.hidden = true;
        });
        results.appendChild(row);
      });
    }
    results.hidden = false;
  };

  input.addEventListener("input", render);
  input.addEventListener("focus", () => { if (input.value.trim()) render(); });
  input.addEventListener("blur", () => setTimeout(() => { results.hidden = true; }, 150));

  document.addEventListener("keydown", (e) => {
    const activeTag = document.activeElement.tagName;
    if (e.key === "/" && activeTag !== "INPUT" && activeTag !== "SELECT" && activeTag !== "TEXTAREA") {
      e.preventDefault();
      input.focus();
    } else if (e.key === "Escape" && document.activeElement === input) {
      input.value = "";
      results.hidden = true;
      input.blur();
    }
  });
}

function toast(kind, title, details) {
  const box = el("div", { class: `toast ${kind}` });
  box.appendChild(el("div", { text: title }));
  if (details && details.length) {
    const ul = el("ul");
    details.forEach(d => ul.appendChild(el("li", { text: d })));
    box.appendChild(ul);
  }
  const banner = document.getElementById("banner");
  banner.appendChild(box);
  setTimeout(() => box.remove(), kind === "ok" ? 3000 : 12000);
}

async function load() {
  const res = await fetch("/api/content");

  renderAll();
}

async function save() {
  const res = await fetch("/api/content", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(DATA),
  });
  const payload = await res.json();
  if (res.ok) {
    toast("ok", "Сохранено. Изменения появятся при следующем запуске игры.");
  } else {
    toast("error", `Не сохранено - ${payload.errors.length} ошибок:`, payload.errors);
  }
}

async function resetSave() {
  if (!confirm("Удалить save.json и обнулить весь прогресс игрока? Это касается сохранения игры (не content.json) и не отменяется.")) {
    return;
  }
  const res = await fetch("/api/reset_save", { method: "POST" });
  const payload = await res.json();
  if (res.ok) {
    toast("ok", payload.existed ? "Прогресс обнулён: save.json удалён." : "Прогресс уже был пуст: save.json не существовал.");
  } else {
    toast("error", "Не получилось обнулить прогресс.");
  }
}

function openTechPicker(currentValue, onPick) {
  closeTechPicker();

    const { positions, width, height } = computeTechPositions();
    const graph = el("div", { class: "tech-graph" });
    graph.style.width = width + "px";
    graph.style.height = height + "px";

    const svg = svgEl("svg", { class: "tech-graph-svg", width, height });
    Object.entries(DATA.techs).forEach(([tid, t]) => {
      (t.requires || []).forEach(reqId => {
        const p1 = positions[reqId], p2 = positions[tid];
        if (!p1 || !p2) return;
        const x1 = p1.x + p1.w, y1 = p1.y + p1.h / 2;
        const x2 = p2.x, y2 = p2.y + p2.h / 2;
        svg.appendChild(svgEl("path", { d: edgePathD(x1, y1, x2, y2), class: "tech-edge" }));
      });
    });
    graph.appendChild(svg);

    Object.entries(DATA.techs).forEach(([tid, t]) => {
      const pos = positions[tid];
      const node = el("div", { class: "tech-node" + (tid === currentValue ? " selected" : "") });
      node.style.left = pos.x + "px";
      node.style.top = pos.y + "px";
      node.style.width = pos.w + "px";
      node.style.height = pos.h + "px";
      node.style.cursor = "pointer";
      node.appendChild(el("div", { class: "tech-node-name", text: t.name }));
      node.appendChild(el("div", { class: "tech-node-id", text: tid }));
      node.addEventListener("click", () => { onPick(tid); closeTechPicker(); });
      graph.appendChild(node);
    });

    scroll.appendChild(graph);
  }

  overlay.appendChild(modal);
  overlay.id = "techPickerOverlay";
  document.body.appendChild(overlay);
}

// allowNone - добавляет пункт "— корень —" (value="" -> null): у ручных действий
// это действие без своей локации (лежит в корне дерева локаций), у родительской
// локации - локация верхнего уровня. excludeId - какую локацию НЕ предлагать
// (обычно саму редактируемую локацию - иначе можно было бы назначить её родителем
// самой себе; полный цикл через цепочку предков всё равно ловит content_validation.py
// при сохранении, здесь достаточно исключить самый очевидный случай).
function locationSelect(selected, onchange, { allowNone = false, excludeId = null } = {}) {

// общее значение по умолчанию (ui.default_action_delay_ms, вкладка "Настройки").
function clickDelayRow(entity) {
  const row = el("div", { class: "field-row" });
  row.appendChild(el("label", { text: "Задержка клика (мс)" }));
  const dflt = (DATA.ui && DATA.ui.default_action_delay_ms != null) ? DATA.ui.default_action_delay_ms : 400;
  const input = el("input", { type: "number", min: "0", step: "50", placeholder: `по умолчанию (${dflt})` });
  if (entity.click_delay_ms != null) input.value = entity.click_delay_ms;

    entity.click_delay_ms = input.value === "" ? null : Number(input.value);
  });

  row.appendChild(el("span", { class: "hint", text: "пусто = общее значение по умолчанию" }));
  return row;
}

// Чанками, а не одним String.fromCharCode(...bytes) - на файле в несколько МБ
// spread по всем байтам разом рискует упереться в лимит аргументов движка.
function arrayBufferToBase64(buf) {
  const bytes = new Uint8Array(buf);
  let binary = "";
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

// Кастомный звук (manual_actions.*.sound ИЛИ один из трёх глобальных слотов
// ui.sounds.* - фон/открытие лутбокса/клик по кнопке, см. renderSettings) -
// хранится не в content.json, а отдельным файлом в tools/sounds/<soundId>.<ext>
// (см. tools/content_editor.py:_handle_upload_sound, tools/web_ui.py:SOUNDS_DIR).
// getSound/setSound читают и пишут конкретное место в DATA (entity.sound для
// ручных действий, DATA.ui.sounds.<key> для глобальных слотов - см. вызовы ниже).
// Сама загрузка байтов происходит сразу по выбору файла (мимо обычного цикла
// "поменяли DATA -> нажали Сохранить"), т.к. байты не входят в content.json и
// нечего было бы сохранять кнопкой "Сохранить".
function soundRow(soundId, label, defaultText, hint, getSound, setSound) {
  const row = el("div", { class: "field-row" });
  row.appendChild(el("label", { text: label }));
  const box = el("div", { style: "display:flex; gap:8px; align-items:center; flex-wrap:wrap" });
  const status = el("span", { class: "hint", text: getSound() || defaultText });

  const fileInput = el("input", { type: "file", accept: ".wav,.mp3,.ogg,audio/wav,audio/mpeg,audio/ogg" });
  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    if (!["wav", "mp3", "ogg"].includes(ext)) {
      toast("error", "Поддерживаются только файлы .wav/.mp3/.ogg");
      fileInput.value = "";
      return;
    }
    const buf = await file.arrayBuffer();
    const res = await fetch("/api/upload_sound", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action_id: soundId, ext, data_base64: arrayBufferToBase64(buf) }),
    });
    const payload = await res.json();
    fileInput.value = "";
    if (res.ok) {
      setSound(payload.filename);
      status.textContent = payload.filename;
      toast("ok", "Звук загружен. Не забудь нажать «Сохранить», чтобы ссылка попала в content.json.");
    } else {
      toast("error", `Не получилось загрузить звук: ${payload.error}`);
    }
  });
  box.appendChild(fileInput);

  const playBtn = el("button", { class: "small", type: "button", text: "▶ Прослушать" });
  playBtn.addEventListener("click", () => {
    const current = getSound();
    if (!current) { toast("error", "Звук не назначен"); return; }
    new Audio(`/sounds/${current}`).play().catch(() => toast("error", "Не получилось проиграть звук"));
  });
  box.appendChild(playBtn);

  const clearBtn = el("button", { class: "small", type: "button", text: "Очистить" });
  clearBtn.addEventListener("click", () => {
    setSound(null);
    status.textContent = defaultText;
  });
  box.appendChild(clearBtn);

  box.appendChild(status);
  row.appendChild(box);
  if (hint) row.appendChild(el("span", { class: "hint", text: hint }));
  return row;
}

// allowRandom (по умолчанию false) - разрешает случайное количество РОВНО там,
// где вызывающий явно передал true (produces построек/энергорецептов/синтезаторов
// душ, gain ручных действий через renderManualResourceDictEditor ниже) - НИКОГДА
// в cost/consumes (см. game/engine.py: _is_range_amount, "cost/consumes диапазонов
// не бывает"). Значение ресурса тогда - число (как раньше) ИЛИ объект {min, max}
// (game/content_validation.py: check_amount_range) - равномерный случайный бросок
// при производстве/выполнении, НЕЗАВИСИМО от chance у соседнего chance-словаря
// (шанс решает, случится ли начисление вообще, диапазон - сколько именно, если да).
function renderDictAmountInput(dictObj, rid, allowRandom, onChange, rerender) {
  const wrap = el("span", { class: "dict-amount" });
  const isRange = allowRandom && dictObj[rid] !== null && typeof dictObj[rid] === "object";
  if (isRange) {
    const minInput = el("input", { type: "number", min: "0", value: dictObj[rid].min, style: "width:56px", title: "Минимум" });
    const maxInput = el("input", { type: "number", min: "0", value: dictObj[rid].max, style: "width:56px", title: "Максимум" });
    minInput.addEventListener("change", () => {
      dictObj[rid].min = Number(minInput.value) || 0;
      if (onChange) onChange();
    });
    maxInput.addEventListener("change", () => {
      dictObj[rid].max = Number(maxInput.value) || 0;
      if (onChange) onChange();
    });
    wrap.append(minInput, el("span", { class: "hint", text: "–" }), maxInput);
  } else {
    const amount = el("input", { type: "number", min: "0", value: dictObj[rid] });
    amount.addEventListener("change", () => {
      dictObj[rid] = Number(amount.value) || 0;
      if (onChange) onChange();
    });
    wrap.appendChild(amount);
  }
  if (allowRandom) {
    const toggle = el("label", { class: "hint", title: "Случайное количество (равномерно min..max за один раз), не влияет на шанс" });
    const checkbox = el("input", { type: "checkbox", style: "margin:0 3px 0 8px" });
    checkbox.checked = isRange;
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) {
        const base = typeof dictObj[rid] === "number" ? dictObj[rid] : 1;
        dictObj[rid] = { min: base, max: base };
      } else {
        dictObj[rid] = (dictObj[rid] && typeof dictObj[rid] === "object") ? (dictObj[rid].min || 0) : dictObj[rid];
      }
      rerender();
      if (onChange) onChange();
    });
    toggle.append(checkbox, document.createTextNode("случайно"));
    wrap.appendChild(toggle);
  }
  return wrap;
}

function renderDictEditor(container, dictObj, onChange, allowRandom) {
  container.innerHTML = "";
  Object.keys(dictObj).forEach(rid => {
    const row = el("div", { class: "dict-row" });
    const rerender = () => renderDictEditor(container, dictObj, onChange, allowRandom);
    const sel = resourceSelect(rid, (newId) => {
      const amount = dictObj[rid];
      delete dictObj[rid];
      dictObj[newId] = amount;
      rerender();
      if (onChange) onChange();
    });
    const amountWrap = renderDictAmountInput(dictObj, rid, allowRandom, onChange, rerender);
    const rm = el("button", { class: "small danger", text: "✕", onclick: () => {
      delete dictObj[rid];
      rerender();
      if (onChange) onChange();
    }});
    row.append(sel, amountWrap, rm);
    container.appendChild(row);
  });
  const addBtn = el("button", { class: "small", text: "+ ресурс", onclick: () => {
    const used = new Set(Object.keys(dictObj));
    const free = DATA.resources.find(r => !used.has(r.id));
    if (!free) { alert("Все ресурсы уже добавлены"); return; }
    dictObj[free.id] = 1;
    renderDictEditor(container, dictObj, onChange, allowRandom);
    if (onChange) onChange();
  }});
  container.appendChild(addBtn);
}

// Как renderDictEditor, но для cost/gain РУЧНОГО ДЕЙСТВИЯ - рядом с каждым ресурсом
// дополнительно рисует поле "Шанс, %" (game/engine.py: manual_actions.*.cost_chance/
// gain_chance, см. "Шанс потребления/получения в рецептах" в CLAUDE.md). 100% (по
// умолчанию, как было всегда до этой механики) хранится НЕОТМЕЧЕННЫМ ключом - при
// вводе 100 ключ ресурса в action[chanceKey] удаляется целиком (а сам chanceKey -
// если после этого он опустел), чтобы content.json не засорялся десятками
// "cost_chance": {} у действий, которые эту механику вообще не используют.
// action - сам объект manual_actions[id] (не сам dictObj) - нужен, чтобы читать и
// мутировать компаньон-словарь action[chanceKey] по тому же ключу ресурса.
function renderManualResourceDictEditor(container, action, amountKey, chanceKey, onChange) {
  const dictObj = action[amountKey];
  const chanceLabel = amountKey === "cost" ? "потратится" : "выдастся";
  // Случайное количество (см. renderDictAmountInput/game.engine._is_range_amount)
  // разрешено только на выходе (gain), никогда на цене (cost) - cost/consumes
  // диапазонов не бывает.
  const allowRandom = amountKey === "gain";
  container.innerHTML = "";
  Object.keys(dictObj).forEach(rid => {
    const row = el("div", { class: "dict-row" });
    const rerender = () => renderManualResourceDictEditor(container, action, amountKey, chanceKey, onChange);
    const sel = resourceSelect(rid, (newId) => {
      const amount = dictObj[rid];
      delete dictObj[rid];
      dictObj[newId] = amount;
      if (action[chanceKey] && rid in action[chanceKey]) {
        action[chanceKey][newId] = action[chanceKey][rid];
        delete action[chanceKey][rid];
      }
      rerender();
      if (onChange) onChange();
    });
    const amountWrap = renderDictAmountInput(dictObj, rid, allowRandom, onChange, rerender);
    const currentPercent = action[chanceKey] && rid in action[chanceKey]
      ? Math.round(action[chanceKey][rid] * 100) : 100;
    const chanceInput = el("input", {
      type: "number", min: "1", max: "100", step: "1", value: currentPercent, style: "width:60px",
      title: `Шанс (%), с которым этот ресурс реально ${chanceLabel} за ОДНУ попытку выполнения действия. 100 = всегда (как было раньше)`,
    });
    chanceInput.addEventListener("change", () => {
      const percent = Math.max(1, Math.min(100, Number(chanceInput.value) || 100));
      chanceInput.value = percent;
      if (percent >= 100) {
        if (action[chanceKey]) {
          delete action[chanceKey][rid];
          if (Object.keys(action[chanceKey]).length === 0) delete action[chanceKey];
        }
      } else {
        action[chanceKey] = action[chanceKey] || {};
        action[chanceKey][rid] = percent / 100;
      }
      if (onChange) onChange();
    });
    const rm = el("button", { class: "small danger", text: "✕", onclick: () => {
      delete dictObj[rid];
      if (action[chanceKey]) {
        delete action[chanceKey][rid];
        if (Object.keys(action[chanceKey]).length === 0) delete action[chanceKey];
      }
      rerender();
      if (onChange) onChange();
    }});
    row.append(sel, amountWrap, chanceInput, el("span", { class: "hint", text: "%" }), rm);
    container.appendChild(row);
  });
  const addBtn = el("button", { class: "small", text: "+ ресурс", onclick: () => {
    const used = new Set(Object.keys(dictObj));
    const free = DATA.resources.find(r => !used.has(r.id));
    if (!free) { alert("Все ресурсы уже добавлены"); return; }
    dictObj[free.id] = 1;
    renderManualResourceDictEditor(container, action, amountKey, chanceKey, onChange);
    if (onChange) onChange();
  }});
  container.appendChild(addBtn);
}

// id общие на весь проект - постройка не может взять id, уже занятый ресурсом,
// технологией или ручным действием (и наоборот). Иначе создание молча затирало бы
// существующую сущность (JS-объект не может иметь два ключа с одним именем).
function findIdOwner(id) {
  if (DATA.resources.some(r => r.id === id)) return "ресурсом";
  if (id in DATA.locations) return "локацией";
  if (id in DATA.manual_actions) return "ручным действием";
  if (id in DATA.buildings) return "постройкой";
  if (id in DATA.techs) return "технологией";
  if (DATA.energy_recipes && id in DATA.energy_recipes) return "рецептом за энергию";
  if (id in DATA.tools) return "инструментом";
  if (DATA.mobs && id in DATA.mobs) return "мобом/боссом";
  if (DATA.skills && id in DATA.skills) return "навыком";
  if (DATA.quests && id in DATA.quests) return "квестом";
  if (DATA.loot_cases && id in DATA.loot_cases) return "кейсом с лутом";
  return null;
}

function idPromptAndAdd(kind, onCreate) {
  const idInput = el("input", { type: "text", placeholder: "id, напр. copper_ore" });
  const btn = el("button", { class: "primary", text: "Добавить" });
  btn.addEventListener("click", () => {
    const id = idInput.value.trim();
    if (!/^[a-z][a-z0-9_]*$/.test(id)) {
      alert("id должен быть латиницей в snake_case: буквы, цифры, подчёркивания, начинается с буквы");
      return;
    }
    const owner = findIdOwner(id);
    if (owner) {
      alert(`id "${id}" уже занят другой сущностью (${owner}). Id уникальны во всём проекте, не только внутри вкладки.`);
      return;
    }
    onCreate(id);
    idInput.value = "";
  });
  return el("div", { class: "add-form" }, [
    el("span", { text: `Новая запись (${kind}):` }),
    idInput,
    btn,
  ]);
}

// ---------- порядок сущностей: стрелки вверх/вниз + "создать новую сразу под этой" ----------
// Порядок в content.json (индекс в массиве resources / порядок ключей словаря) -
// это и есть порядок отображения в игре (панель ресурсов и инвентарь, каталог
// строительства, список исследований и т.д.) - см. game/content.py, который грузит
// content.json как есть, ничего не пересортировывая.

function moveArrayItem(array, index, delta) {
  const newIndex = index + delta;
  if (newIndex < 0 || newIndex >= array.length) return false;
  const [item] = array.splice(index, 1);
  array.splice(newIndex, 0, item);
  return true;
}

function insertArrayItemAfter(array, index, value) {
  array.splice(index + 1, 0, value);
}

// Словари в JS сохраняют порядок вставки строковых ключей - чтобы "переместить" или
// "вставить после", перекладываем содержимое в новом порядке ключей БЕЗ замены самой
// ссылки на объект (чистим и заполняем заново), чтобы не разошлись другие места
// редактора, уже держащие ссылку на DATA.buildings/DATA.techs/...
function reorderDictKeys(dict, orderedKeys) {
  const values = {};
  orderedKeys.forEach(k => { values[k] = dict[k]; });
  Object.keys(dict).forEach(k => delete dict[k]);
  orderedKeys.forEach(k => { dict[k] = values[k]; });
}

function moveDictKeyInPlace(dict, key, delta) {
  const keys = Object.keys(dict);
  const index = keys.indexOf(key);
  const newIndex = index + delta;
  if (index === -1 || newIndex < 0 || newIndex >= keys.length) return false;
  [keys[index], keys[newIndex]] = [keys[newIndex], keys[index]];
  reorderDictKeys(dict, keys);
  return true;
}

function insertDictKeyAfterInPlace(dict, afterKey, newKey, value) {
  const keys = Object.keys(dict);
  const newKeys = keys.slice();
  newKeys.splice(keys.indexOf(afterKey) + 1, 0, newKey);
  dict[newKey] = value;
  reorderDictKeys(dict, newKeys);
}

function promptNewId(kind) {
  const raw = prompt(`id новой записи (${kind}), латиницей snake_case (например: copper_ore):`);
  if (raw === null) return null; // отмена
  const id = raw.trim();
  if (!/^[a-z][a-z0-9_]*$/.test(id)) {
    alert("id должен быть латиницей в snake_case: буквы, цифры, подчёркивания, начинается с буквы");
    return null;
  }
  const owner = findIdOwner(id);
  if (owner) {
    alert(`id "${id}" уже занят другой сущностью (${owner}). Id уникальны во всём проекте.`);
    return null;
  }
  return id;
}

// Кнопки для одной карточки/строки: "↑"/"↓" переставляют её, необязательный "+" сразу
// создаёт новую пустую запись прямо под этой - чтобы не тащить новую запись с самого
// низа списка, если место нужно здесь. onMove(delta) переставляет саму запись,
// createDefault(id)/insertAfter(id, value)/jumpToNew(id) - для кнопки "+" (можно не
// передавать, если для вкладки создание "после конкретной записи" не имеет смысла).
function orderControls({ index, count, onMove, kind, createDefault, insertAfter, jumpToNew }) {
  const box = el("div", { class: "order-controls" });
  const up = el("button", { class: "small", title: "Переместить выше", text: "↑" });
  if (index === 0) up.disabled = true;
  up.addEventListener("click", () => onMove(-1));
  const down = el("button", { class: "small", title: "Переместить ниже", text: "↓" });
  if (index === count - 1) down.disabled = true;
  down.addEventListener("click", () => onMove(1));
  box.appendChild(up);
  box.appendChild(down);
  if (createDefault) {
    const insert = el("button", { class: "small", title: `Создать новую запись (${kind}) сразу под этой`, text: "+" });
    insert.addEventListener("click", () => {
      const id = promptNewId(kind);
      if (id === null) return;
      insertAfter(id, createDefault(id));
      jumpToNew(id);
    });
    box.appendChild(insert);
  }
  return box;
}

// ---------- сворачивание карточек сущностей ----------

// Все карточки сущностей (постройки, техи, локации, ручные действия, рецепты
// за энергию, добыча, инструменты, достижения) по умолчанию свёрнуты - по
// прямому пожеланию: у многих (особенно у построек-"механизмов") бывает по
// 15-20 полей, и когда таких карточек в списке много, разворачивать всё сразу
// означает бесконечную прокрутку в поисках нужной. Развёрнутость запоминается
// по id DOM-узла карточки (тот же id, что уже был у card-<вкладка>-<id> для
// jumpTo) - переживает перерисовку вкладки (renderX() перестраивает карточки
// заново при добавлении/удалении/перестановке сущности), но не переживает
// перезагрузку страницы (не save-critical state, как и filters/прокрутка).
const expandedCardIds = new Set();

// Оборачивает всё содержимое card, КРОМЕ ПЕРВОГО ребёнка (.card-head - везде,
// где вызывается эта функция, он добавляется в card первым), в .card-body и
// вешает кнопку-стрелку в начало head для сворачивания/разворачивания.
// Вызывается ПОСЛЕ того, как карточка уже полностью собрана (прямо перед
// добавлением в контейнер списка) - специально НЕ требует переписывать сам
// код сборки полей внутри renderX(), только одну строку в конце.
function makeCardCollapsible(card) {
  const head = card.firstElementChild;
  const bodyChildren = Array.from(card.children).slice(1);
  const body = el("div", { class: "card-body" });
  bodyChildren.forEach(c => body.appendChild(c));
  card.appendChild(body);

  const expanded = expandedCardIds.has(card.id);
  card.classList.toggle("collapsed", !expanded);
  const toggle = el("button", {
    class: "card-collapse-toggle", type: "button", text: expanded ? "▾" : "▸",
    title: expanded ? "Свернуть" : "Развернуть",
  });
  toggle.addEventListener("click", () => {
    const willExpand = card.classList.contains("collapsed");
    card.classList.toggle("collapsed", !willExpand);
    toggle.textContent = willExpand ? "▾" : "▸";
    toggle.title = willExpand ? "Свернуть" : "Развернуть";
    if (willExpand) expandedCardIds.add(card.id); else expandedCardIds.delete(card.id);
  });
  head.insertBefore(toggle, head.firstChild);
  return card;
}

  table.appendChild(el("tr", {}, [

    el("th", { text: "Дробный" }), el("th", { text: "Порядок" }), el("th", { text: "" }),
  ]));
  const filterBar = makeFilterBar("resources", table);

  const idInput = el("input", { type: "text", placeholder: "id, напр. copper_ore" });
  const nameInput = el("input", { type: "text", placeholder: "Название, напр. Медная руда" });

      }}));

      return;
    }

    head.appendChild(el("div", { class: "spacer" }));
    head.appendChild(el("button", { class: "small danger", text: "Убрать вместимость", onclick: () => {

      addInput.addEventListener("change", () => { tier.capacity_add = parseInt(addInput.value, 10) || 1; });

      const techRow = el("div", { class: "field-row" });

      tierCard.appendChild(techRow);

    }}));

    makeCardCollapsible(card);

  });

// Матрица галочек тир x инструмент для requires_tool_tiers (см. game/engine.py -
// is_manual_action_unlocked): ЯВНЫЙ список отмеченных тиров на инструмент, а не порог
// "начиная с" (это специально другая семантика, чем у добычи required_tool/
// required_tier) - позволяет завести несколько вариантов одного и того же по смыслу
// действия, каждый доступный только на своих тирах. Инструмент, у которого не отмечен
// НИ ОДИН тир, вообще не попадает в requires_tool_tiers (ничего не ограничивает) -
// пустой список тиров запрещён валидатором, поэтому просто удаляем ключ целиком.
function requiresToolTiersEditor(container, action) {
  container.innerHTML = "";
  if (!action.requires_tool_tiers) action.requires_tool_tiers = {};
  Object.entries(DATA.tools).forEach(([toolId, tool]) => {
    const row = el("div", { class: "field-row" });
    row.appendChild(el("label", { text: tool.name }));
    const box = el("div", { class: "req-list" });
    tool.tiers.forEach((tier, i) => {
      const tierNum = i + 1;
      const cb = el("input", { type: "checkbox" });
      cb.checked = (action.requires_tool_tiers[toolId] || []).includes(tierNum);
      cb.addEventListener("change", () => {
        const list = action.requires_tool_tiers[toolId] || [];
        if (cb.checked) {
          if (!list.includes(tierNum)) list.push(tierNum);
        } else {
          const at = list.indexOf(tierNum);
          if (at !== -1) list.splice(at, 1);
        }
        if (list.length) action.requires_tool_tiers[toolId] = list.sort((a, b) => a - b);
        else delete action.requires_tool_tiers[toolId];
      });
      box.appendChild(el("label", {}, [cb, document.createTextNode(`${tierNum}. ${tier.name}`)]));
    });
    row.appendChild(box);
    container.appendChild(row);
  });
}

function toolTiersSummaryText(action) {
  const entries = Object.entries(action.requires_tool_tiers || {});
  if (!entries.length) return "не ограничено";
  return entries.map(([toolId, tiers]) => {
    const tool = DATA.tools[toolId];
    return `${tool ? tool.name : toolId}: ${tiers.join(",")}`;
  }).join("; ");
}

// Матрица галочек тир x инструмент живёт в отдельном окне (см. autocraft/energy_converter
// у построек выше) - на карточке действия остаётся только сводка + кнопка, чтобы список
// действий не разрастался матрицей на каждый инструмент в игре, даже когда она пуста.
function openToolTiersModal(action, onChange) {
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  const modal = el("div", { class: "modal settings-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Требуемые тиры инструментов" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: () => { overlay.remove(); onChange(); } }));
  modal.appendChild(head);
  modal.appendChild(el("p", { class: "hint", text:
    "галочки, а не порог \"начиная с\" - отметь ВСЕ тиры, на которых действие должно быть доступно; инструмент без отмеченных тиров ничего не ограничивает" }));
  const box = el("div");
  requiresToolTiersEditor(box, action);
  modal.appendChild(box);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

    });
    const head = [el("code", { text: lid }), nameInput, order, el("div", { class: "spacer" })];
    head.push(iconEditButton("Локация", loc, defaultLocationIcon(lid), () => renderLocations()));
    if (lid === MINE_LOCATION_ID || lid === CONVERTER_LOCATION_ID) {
      head.push(el("span", { class: "hint", text: "🔒 обязательная локация" }));
    } else {
      head.push(el("button", { class: "small danger", text: "Удалить", onclick: () => {
        const usedBy = Object.values(DATA.manual_actions).filter(a => a.location === lid);
        const usedByMobs = Object.values(DATA.mobs || {}).filter(m => m.location === lid);
        const childLocations = Object.values(DATA.locations).filter(l => l.parent_location === lid);
        const warnings = [];
        if (usedBy.length) warnings.push(`${usedBy.length} действий останутся без локации`);
        if (usedByMobs.length) warnings.push(`${usedByMobs.length} мобов/боссов останутся без локации`);
        if (childLocations.length) warnings.push(`${childLocations.length} вложенных локаций останутся без родителя`);
        if (warnings.length && !confirm(`У этой локации ${warnings.join(", ")} - сохранение будет отклонено, пока не поправишь это. Всё равно удалить локацию?`)) return;
        delete DATA.locations[lid];
        renderLocations();
        renderManual();
        renderMobs();
      }}));
    }
    card.appendChild(el("div", { class: "card-head" }, head));

    const techRow = el("div", { class: "field-row" });
    techRow.appendChild(el("label", { text: "Нужна технология" }));
    techRow.appendChild(techSelect(loc.requires_tech, (v) => { loc.requires_tech = v; }));
    card.appendChild(techRow);

    const reqBuildingRow = el("div", { class: "field-row" });
    reqBuildingRow.appendChild(el("label", { text: "Нужна постройка" }));
    reqBuildingRow.appendChild(buildingRequirementSelect(loc.requires_building || null, (v) => { loc.requires_building = v; }));
    reqBuildingRow.appendChild(el("span", { class: "hint", text:
      "необязательно - локация видна, только пока работает хотя бы одна копия этой постройки (в дополнение к технологии, если она тоже указана). Так постройка-\"механизм\" без своих produces/consumes может открывать СВОЮ локацию с ручными действиями внутри - см. requires_building у самих действий и вкладку «Улучшения» постройки" }));
    card.appendChild(reqBuildingRow);

    const parentRow = el("div", { class: "field-row" });
    parentRow.appendChild(el("label", { text: "Родительская локация" }));
    parentRow.appendChild(locationSelect(loc.parent_location, (v) => { loc.parent_location = v; }, { allowNone: true, excludeId: lid }));
    parentRow.appendChild(el("span", { class: "hint", text: "— корень — = локация верхнего уровня. Внутри родительской локации эта появится как вложенная - полноценное дерево, можно вкладывать сколько угодно уровней" }));
    card.appendChild(parentRow);

    makeCardCollapsible(card);
    cardsBox.appendChild(card);
  });
  filterBar._apply();
}

// Автокрафт (compute_power/autocraft_speed/autocraft_slots/unlocks_autocraft) и
// крафт из энергии (energy_converter) настраиваются НЕ инлайн в карточке постройки,
// а в отдельных всплывающих окнах (по образцу techSelect/openTechPicker) - это
// специфичные для одной подсистемы поля, нужные далеко не каждой постройке, и на
// карточке они уступают место карточке короткой сводке + кнопке "Настроить".
function autocraftSummaryText(b) {
  const parts = [];
  if (b.compute_power) parts.push(`мощность ${b.compute_power}`);
  if (b.autocraft_speed) parts.push(`скорость ${b.autocraft_speed}`);
  if (b.autocraft_slots) parts.push(`слоты +${b.autocraft_slots}`);
  if ((b.unlocks_autocraft || []).length) parts.push(`открывает: ${b.unlocks_autocraft.length}`);
  return parts.length ? parts.join(", ") : "не участвует в автокрафте";
}

  head.appendChild(el("strong", { text: "Настройки автокрафта" }));

  const computeRow = el("div", { class: "field-row" });
  computeRow.appendChild(el("label", { text: "Вычислительная мощность" }));
  const computeInput = el("input", { type: "number", min: "0", value: b.compute_power || 0 });
  computeInput.addEventListener("change", () => { b.compute_power = Number(computeInput.value) || 0; });
  computeRow.appendChild(computeInput);
  computeRow.appendChild(el("span", { class: "hint", text: "0 - обычная постройка; иначе это процессор. Суммарная мощность всех рабочих процессоров - потолок того, сколько раз за один автокрафт можно прокрутить один рецепт (см. compute_capacity)" }));
  modal.appendChild(computeRow);

  const speedRow = el("div", { class: "field-row" });
  speedRow.appendChild(el("label", { text: "Скорость автокрафта" }));
  const speedInput = el("input", { type: "number", min: "0", value: b.autocraft_speed || 0 });
  speedInput.addEventListener("change", () => { b.autocraft_speed = Number(speedInput.value) || 0; });
  speedRow.appendChild(speedInput);
  speedRow.appendChild(el("span", { class: "hint", text: "0 - обычная постройка. Сколько операций автокрафта в сумме можно выполнить ЗА ОДИН ХОД (в отличие от мощности - потолка размера запроса безотносительно времени). Не хватает скорости - остаток докрафтится фоновой задачей за несколько ходов, а не мгновенно (см. autocraft_speed_capacity)" }));
  modal.appendChild(speedRow);

  const slotsRow = el("div", { class: "field-row" });
  slotsRow.appendChild(el("label", { text: "Слоты автокрафта" }));
  const slotsInput = el("input", { type: "number", min: "0", value: b.autocraft_slots || 0 });
  slotsInput.addEventListener("change", () => { b.autocraft_slots = Number(slotsInput.value) || 0; });
  slotsRow.appendChild(slotsInput);
  slotsRow.appendChild(el("span", { class: "hint", text: "0 - обычная постройка. Сколько фоновых автокрафт-задач может выполняться одновременно (по одной на каждый ресурс в цепочке докрафта) - база 1 без единой такой постройки" }));
  modal.appendChild(slotsRow);

  modal.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Открывает автокрафт для" })]));
  if (!Array.isArray(b.unlocks_autocraft)) b.unlocks_autocraft = [];
  const autocraftBox = el("div", { class: "req-list" });
  DATA.resources.forEach(r => {
    const cb = el("input", { type: "checkbox" });
    cb.checked = b.unlocks_autocraft.includes(r.id);
    cb.addEventListener("change", () => {
      if (cb.checked) { if (!b.unlocks_autocraft.includes(r.id)) b.unlocks_autocraft.push(r.id); }
      else { b.unlocks_autocraft = b.unlocks_autocraft.filter(x => x !== r.id); }

  });

  overlay.appendChild(modal);
  document.body.appendChild(overlay);

function energyConverterSummaryText(b) {
  const parts = [];
  if (b.energy_converter) {
    const max = b.energy_converter.max_energy_per_turn;
    parts.push(max ? `преобразователь, до ${max} энергии/ход` : "преобразователь, без ограничения энергии/ход");
  }
  if (b.energy_priority) parts.push(`приоритет ${b.energy_priority}`);
  return parts.length ? parts.join("; ") : "не преобразователь";
}

function soulCollectorSummaryText(b) {
  if (!b.soul_collector) return "не синтезатор душ";
  const accepts = b.soul_collector.accepts || [];
  return `${b.soul_collector.slots || 1} слот(ов)/копия, принимает душ: ${accepts.length}`;
}

function openSoulCollectorSettingsModal(b, onChange) {
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  const modal = el("div", { class: "modal settings-modal" });

  modal.appendChild(head);

  modal.appendChild(el("p", { class: "hint", text:
    "Постройка, в слоты которой можно вручную вставить \"душу\" (ресурс, обычно выбитый с моба - см. вкладку "
    + "«Мобы/Боссы» - или скрафтенный) - пока душа стоит в слоте, она вечно (без расхода) производит ресурсы по "
    + "своему рецепту (вкладка «Мобы/Боссы» → «Продукция синтезаторов душ» внизу страницы). accepts - список "
    + "ДОПУСТИМЫХ для ЭТОЙ постройки душ - разным постройкам обычно назначают разные, непересекающиеся души "
    + "(например, «синтезатор» под обычных мобов и отдельный «алтарь» под боссовые)." }));

  const toggleRow = el("div", { class: "field-row" });
  const enabled = el("input", { type: "checkbox" });
  enabled.checked = !!b.soul_collector;
  toggleRow.appendChild(enabled);
  toggleRow.appendChild(el("label", { text: "Синтезатор душ (soul_collector)" }));
  modal.appendChild(toggleRow);

  const body = el("div");
  const renderBody = () => {
    body.innerHTML = "";
    if (!b.soul_collector) return;

    const slotsRow = el("div", { class: "field-row" });
    slotsRow.appendChild(el("label", { text: "Слотов на копию" }));
    const slotsInput = el("input", { type: "number", min: "1", value: b.soul_collector.slots || 1 });
    slotsInput.addEventListener("change", () => { b.soul_collector.slots = Number(slotsInput.value) || 1; });
    slotsRow.appendChild(slotsInput);
    slotsRow.appendChild(el("span", { class: "hint", text: "умножается на число РАБОЧИХ копий этой постройки, плюс бонус от апгрейдов типа «Слоты синтезатора душ»" }));
    body.appendChild(slotsRow);

    body.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Допустимые души (accepts)" })]));
    const acceptsBox = el("div", { class: "dict-editor" });
    const renderAccepts = () => {
      acceptsBox.innerHTML = "";
      if (!Array.isArray(b.soul_collector.accepts)) b.soul_collector.accepts = [];
      b.soul_collector.accepts.forEach((rid, i) => {
        const row = el("div", { class: "dict-row" });
        row.appendChild(resourceSelect(rid, (v) => { b.soul_collector.accepts[i] = v; }));
        row.appendChild(el("button", { class: "small danger", text: "✕", onclick: () => { b.soul_collector.accepts.splice(i, 1); renderAccepts(); } }));
        acceptsBox.appendChild(row);
      });
      acceptsBox.appendChild(el("button", { class: "small", text: "+ душа", onclick: () => {

        b.soul_collector.accepts.push(free.id);
        renderAccepts();
      }}));

    renderAccepts();
    body.appendChild(acceptsBox);
    body.appendChild(el("p", { class: "hint", text: "у души без соответствующей записи в «Продукция синтезаторов душ» (вкладка «Мобы/Боссы») ничего не будет производиться." }));
  };
  renderBody();
  modal.appendChild(body);

  enabled.addEventListener("change", () => {
    if (enabled.checked) b.soul_collector = { slots: 1, accepts: [] };
    else delete b.soul_collector;
    renderBody();
  });

  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

// купленных улучшения одной постройки). Вместо этого - явные "scale" (домножает ВЕСЬ
