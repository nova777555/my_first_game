        weightInput.addEventListener("change", () => {
          if (weightInput.value === "") delete lvl.weight; else lvl.weight = Number(weightInput.value) || 1;
        });
        weightRow.appendChild(weightInput);
        weightRow.appendChild(el("span", { class: "hint", text: "необязательно - чем больше относительно других символов этого инструмента, тем чаще выпадает на круге" }));
        lvlCard.appendChild(weightRow);

        levelsBox.appendChild(lvlCard);
      });
      const addLvlBtn = el("button", { class: "small", text: "+ добавить уровень", onclick: () => {
        const prevValue = ench.levels[ench.levels.length - 1]?.value ?? 1;
        ench.levels.push({ value: prevValue });
        renderLevelsBox();
      }});
      levelsBox.appendChild(addLvlBtn);
    }
    renderLevelsBox();
    card.appendChild(levelsBox);

    makeCardCollapsible(card);
    cardsBox.appendChild(card);
  });
  filterBar._apply();
}

// ---------- условия квестов (общий словарь типов) ----------

const CONDITION_TYPES = {
  resource_at_least: { label: "Иметь ресурса не меньше", fields: ["resource", "amount"] },
  building_count_at_least: { label: "Построить конкретную постройку не меньше раз", fields: ["building", "amount"] },
  total_buildings_at_least: { label: "Иметь построек всего не меньше", fields: ["amount"] },
  tech_researched: { label: "Исследовать конкретную технологию", fields: ["tech"] },
  tech_count_at_least: { label: "Исследовать технологий не меньше", fields: ["amount"] },
  all_techs_researched: { label: "Исследовать все технологии", fields: [] },
  turn_at_least: { label: "Дожить до хода не раньше", fields: ["amount"] },
  tool_tier_at_least: { label: "Прокачать инструмент до тира не ниже", fields: ["tool", "amount"] },
  species_discovered_at_least: { label: "Открыть видов существ не меньше", fields: ["amount"] },
  species_discovered: { label: "Вывести/поймать конкретный вид", fields: ["species"] },
  manual_action_performed_at_least: { label: "Выполнить ручное действие не меньше раз", fields: ["action", "amount"] },
  building_upgrade_purchased: { label: "Купить улучшение постройки", fields: ["building", "upgrade"] },
  storage_tier_at_least: { label: "Прокачать склад ресурса до тира не ниже", fields: ["resource", "amount"] },
  building_upgrade_level_at_least: { label: "Купить улучшение постройки до уровня не ниже", fields: ["building", "upgrade", "amount"] },
  building_upgrade_type_purchased_any: { label: "Купить улучшение типа у ЛЮБОГО механизма", fields: ["upgrade_type"] },
};

// Только ресурсы с настроенной вместимостью склада (r.storage) - для
// storage_tier_at_least: тир, до которого нужно прокачать, имеет смысл только
// у ресурса, у которого вообще ЕСТЬ тиры расширения.
function storageResourceSelect(selected, onchange) {
  const entries = DATA.resources.filter(r => r.storage).map(r => ({ value: r.id, label: r.name }));
  return genericPickerSelect(entries, selected, onchange, { title: "Выбрать ресурс со складом", placeholder: "— выбрать ресурс —" });
}

function upgradeTypeSelect(selected, onchange) {
  const sel = el("select");
  UPGRADE_TYPE_OPTIONS.forEach(([value, label]) => {
    const o = el("option", { value, text: label });
    if (selected === value) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener("change", () => { onchange(sel.value); });
  return sel;
}

function requiredBuildingSelect(selected, onchange) {
  const entries = Object.entries(DATA.buildings).map(([bid, b]) => ({ value: bid, label: b.name }));
  return genericPickerSelect(entries, selected, onchange, { title: "Выбрать постройку", placeholder: "— выбрать постройку —" });
}

function requiredTechSelect(selected, onchange) {
  const entries = Object.entries(DATA.techs).map(([tid, t]) => ({ value: tid, label: t.name }));
  return genericPickerSelect(entries, selected, onchange, { title: "Выбрать технологию", placeholder: "— выбрать технологию —" });
}

function requiredActionSelect(selected, onchange) {
  const entries = Object.entries(DATA.manual_actions).map(([aid, a]) => ({ value: aid, label: a.name }));
  return genericPickerSelect(entries, selected, onchange, { title: "Выбрать действие", placeholder: "— выбрать действие —" });
}

// Зависимый от выбранной постройки список её же upgrades - в отличие от
// requiredBuildingSelect/requiredTechSelect (плоское глобальное пространство id),
// upgrade.id уникален только ВНУТРИ одной постройки (см. building_upgrade_purchased).
function requiredBuildingUpgradeSelect(buildingId, selected, onchange) {
  const upgrades = DATA.buildings[buildingId]?.upgrades || [];
  const entries = upgrades.map(u => ({ value: u.id, label: u.name }));
  return genericPickerSelect(entries, selected, onchange, { title: "Выбрать улучшение", placeholder: "— выбрать улучшение —" });
}

function defaultConditionOfType(type) {
  const fields = CONDITION_TYPES[type].fields;
  const cond = { type };
  if (fields.includes("amount")) cond.amount = 1;
  if (fields.includes("resource")) {
    cond.resource = type === "storage_tier_at_least"
      ? (DATA.resources.find(r => r.storage)?.id ?? DATA.resources[0]?.id)
      : DATA.resources[0]?.id;
  }
  if (fields.includes("building")) cond.building = Object.keys(DATA.buildings)[0];
  if (fields.includes("tech")) cond.tech = Object.keys(DATA.techs)[0];
  if (fields.includes("tool")) cond.tool = Object.keys(DATA.tools)[0];
  if (fields.includes("action")) cond.action = Object.keys(DATA.manual_actions)[0];
  if (fields.includes("species")) cond.species = Object.keys(DATA.species || {})[0];
  if (fields.includes("upgrade")) cond.upgrade = (DATA.buildings[cond.building]?.upgrades || [])[0]?.id;
  if (fields.includes("upgrade_type")) cond.upgrade_type = UPGRADE_TYPE_OPTIONS[0][0];
  return cond;
}

function renderConditions(container, conditions) {
  container.innerHTML = "";
  conditions.forEach((cond, i) => {
    const row = el("div", { class: "effect-card" });
    const head = el("div", { class: "field-row" });
    const typeSelect = el("select");
    Object.entries(CONDITION_TYPES).forEach(([type, info]) => {
      const opt = el("option", { value: type, text: info.label });
      if (type === cond.type) opt.selected = true;
      typeSelect.appendChild(opt);
    });
    typeSelect.addEventListener("change", () => {
      conditions[i] = defaultConditionOfType(typeSelect.value);
      renderConditions(container, conditions);
    });
    head.appendChild(typeSelect);
    const rm = el("button", { class: "small danger", text: "✕", onclick: () => {
      conditions.splice(i, 1);
      renderConditions(container, conditions);
    }});
    head.appendChild(rm);
    row.appendChild(head);

    const info = CONDITION_TYPES[cond.type] || { fields: [] };
    const fieldsRow = el("div", { class: "field-row" });
    if (info.fields.includes("resource")) {
      fieldsRow.appendChild(el("label", { text: "Ресурс" }));
      fieldsRow.appendChild(cond.type === "storage_tier_at_least"
        ? storageResourceSelect(cond.resource, v => { cond.resource = v; })
        : resourceSelect(cond.resource, v => { cond.resource = v; }));
    }
    if (info.fields.includes("building")) {
      fieldsRow.appendChild(el("label", { text: "Постройка" }));
      fieldsRow.appendChild(requiredBuildingSelect(cond.building, v => {
        cond.building = v;
        if (info.fields.includes("upgrade")) {
          // Смена постройки меняет доступный набор upgrade.id - старый выбор
          // из другой постройки больше не валиден, перерисовываем строку целиком.
          cond.upgrade = (DATA.buildings[v]?.upgrades || [])[0]?.id;
          renderConditions(container, conditions);
        }
      }));
    }
    if (info.fields.includes("tech")) {
      fieldsRow.appendChild(el("label", { text: "Технология" }));
      fieldsRow.appendChild(requiredTechSelect(cond.tech, v => { cond.tech = v; }));
    }
    if (info.fields.includes("tool")) {
      fieldsRow.appendChild(el("label", { text: "Инструмент" }));
      fieldsRow.appendChild(toolSelect(cond.tool, v => { cond.tool = v; }));
    }
    if (info.fields.includes("action")) {
      fieldsRow.appendChild(el("label", { text: "Действие" }));
      fieldsRow.appendChild(requiredActionSelect(cond.action, v => { cond.action = v; }));
    }
    if (info.fields.includes("species")) {
      fieldsRow.appendChild(el("label", { text: "Вид" }));
      fieldsRow.appendChild(speciesSelect(cond.species, v => { cond.species = v; }));
    }
    if (info.fields.includes("upgrade")) {
      fieldsRow.appendChild(el("label", { text: "Улучшение" }));
      fieldsRow.appendChild(requiredBuildingUpgradeSelect(cond.building, cond.upgrade, v => { cond.upgrade = v; }));
    }
    if (info.fields.includes("upgrade_type")) {
      fieldsRow.appendChild(el("label", { text: "Тип улучшения" }));
      fieldsRow.appendChild(upgradeTypeSelect(cond.upgrade_type, v => { cond.upgrade_type = v; }));
    }
    if (info.fields.includes("amount")) {
      fieldsRow.appendChild(el("label", { text: "Не меньше" }));
      const input = el("input", { type: "number", min: "1", value: cond.amount ?? 1 });
      input.addEventListener("change", () => { cond.amount = Number(input.value) || 1; });
      fieldsRow.appendChild(input);
    }
    if (fieldsRow.children.length) row.appendChild(fieldsRow);

    container.appendChild(row);
  });

  const addBtn = el("button", { class: "small", text: "+ добавить условие", onclick: () => {
    conditions.push(defaultConditionOfType("total_buildings_at_least"));
    renderConditions(container, conditions);
  }});
  container.appendChild(addBtn);
}

  root.appendChild(el("p", { class: "hint", text:
    "ring_cost - сколько чего нужно разложить по внешнему кольцу алтаря (requires_building, должна быть "
    + "постройка с полем ritual_circle - настраивается на вкладке «Постройки»), суммарно не больше её текущей "
    + "ёмкости кольца (см. апгрейды типа «Пьедесталы ритуального круга»). center_cost - ровно один предмет в "
    + "отдельный центральный пьедestal (не считается в ёмкость кольца). extra_cost - дополнительная разовая "
    + "цена (списывается вместе с ring/center в момент запуска, для нефизических затрат вроде маны). "
    + "duration_turns > 1 делает ритуал многоходовым - тогда extra_consumes_per_turn (+ шанс extra_consumes_chance "
    + "на каждый ресурс отдельно, как cost_chance) списывается КАЖДЫЙ ход отдельно, пока ритуал идёт; нехватка "
    + "не отменяет и не тормозит ритуал, просто в этот ход ничего не спишется." }));

  const cardsBox = el("div");
  const filterBar = makeFilterBar("rituals", cardsBox);
  const addForm = idPromptAndAdd("рецепт ритуала", (id) => {
    DATA.ritual_recipes[id] = ritualDefaultRecipe();
    jumpTo(`card-rituals-${id}`, "rituals", { focusName: true });
  });
  root.appendChild(makeToolbar(addForm, filterBar));
  root.appendChild(cardsBox);

  const recipeIds = Object.keys(DATA.ritual_recipes);
  recipeIds.forEach((rid, i) => {
    const r = DATA.ritual_recipes[rid];
    const card = el("div", { class: "card", id: `card-rituals-${rid}` });
    card.dataset.search = (rid + " " + r.name).toLowerCase();
    const nameInput = el("input", { type: "text", value: r.name });
    nameInput.addEventListener("change", () => { r.name = nameInput.value; card.dataset.search = (rid + " " + r.name).toLowerCase(); });
    const order = orderControls({
      index: i, count: recipeIds.length,
      onMove: (delta) => { moveDictKeyInPlace(DATA.ritual_recipes, rid, delta); renderRituals(); },
      kind: "рецепт ритуала",
      createDefault: () => ritualDefaultRecipe(),
      insertAfter: (id, value) => insertDictKeyAfterInPlace(DATA.ritual_recipes, rid, id, value),
      jumpToNew: (id) => { renderRituals(); jumpTo(`card-rituals-${id}`, "rituals", { focusName: true }); },
    });
    const rm = el("button", { class: "small danger", text: "Удалить", onclick: () => {
      delete DATA.ritual_recipes[rid];
      renderRituals();
    }});
    card.appendChild(el("div", { class: "card-head" }, [el("code", { text: rid }), nameInput, order, el("div", { class: "spacer" }), rm]));

    const descRow = el("div", { class: "field-row" });
    descRow.appendChild(el("label", { text: "Описание" }));
    descRow.appendChild(descriptionTextarea(r.description, "Что это за ритуал, зачем он игроку", (v) => { r.description = v; }));
    card.appendChild(descRow);

    const techRow = el("div", { class: "field-row" });
    techRow.appendChild(el("label", { text: "Нужна технология" }));
    techRow.appendChild(techSelect(r.requires_tech, (v) => { r.requires_tech = v; }));
    card.appendChild(techRow);

    const buildingRow = el("div", { class: "field-row" });
    buildingRow.appendChild(el("label", { text: "Алтарь (requires_building)" }));
    buildingRow.appendChild(buildingRequirementSelect(r.requires_building || null, (v) => { r.requires_building = v; }, {}));
    buildingRow.appendChild(el("span", { class: "hint", text: "обязательно - постройка должна иметь включённый ritual_circle (вкладка «Постройки»), иначе рецепт не пройдёт валидацию" }));
    card.appendChild(buildingRow);

    const ringRowWrap = el("div");
    ringRowWrap.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Кольцо (ring_cost)" })]));
    const ringBox = el("div", { class: "dict-editor" });
    if (!r.ring_cost) r.ring_cost = {};
    renderDictEditor(ringBox, r.ring_cost);
    ringRowWrap.appendChild(ringBox);
    card.appendChild(ringRowWrap);

    const centerRow = el("div", { class: "field-row" });
    centerRow.appendChild(el("label", { text: "Центр (center_cost)" }));
    if (!r.center_cost && DATA.resources.length) r.center_cost = DATA.resources[0].id;
    centerRow.appendChild(resourceSelect(r.center_cost || null, (v) => { r.center_cost = v; }));
    centerRow.appendChild(el("span", { class: "hint", text: "ровно 1 шт., отдельный пьедestal, не считается в ёмкость кольца" }));
    card.appendChild(centerRow);

    const extraCostWrap = el("div");
    extraCostWrap.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Доп. разовая цена (extra_cost)" })]));
    const extraCostBox = el("div", { class: "dict-editor" });
    if (!r.extra_cost) r.extra_cost = {};
    renderDictEditor(extraCostBox, r.extra_cost);
    extraCostWrap.appendChild(extraCostBox);
    card.appendChild(extraCostWrap);

    const durationRow = el("div", { class: "field-row" });
    durationRow.appendChild(el("label", { text: "Длительность, ходов" }));
    const durationInput = el("input", { type: "number", min: "1", step: "1", value: r.duration_turns || 1 });
    durationInput.addEventListener("change", () => { r.duration_turns = Math.max(1, Math.round(Number(durationInput.value) || 1)); });
    durationRow.appendChild(durationInput);
    durationRow.appendChild(el("span", { class: "hint", text: "1 (или пусто) - ритуал мгновенный" }));
    card.appendChild(durationRow);

    const extraTurnWrap = el("div");
    extraTurnWrap.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Доп. расход за ход (extra_consumes_per_turn)" })]));
    const extraTurnBox = el("div", { class: "dict-editor" });
    if (!r.extra_consumes_per_turn) r.extra_consumes_per_turn = {};
    const extraTurnChanceBox = el("div", { class: "dict-editor" });
    const renderExtraTurnChance = () => renderChanceOnlyEditor(extraTurnChanceBox, r, "extra_consumes_per_turn", "extra_consumes_chance");
    renderDictEditor(extraTurnBox, r.extra_consumes_per_turn, renderExtraTurnChance);
    extraTurnWrap.appendChild(extraTurnBox);
    extraTurnWrap.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Шанс на ресурс, %" })]));
    extraTurnWrap.appendChild(extraTurnChanceBox);
    extraTurnWrap.appendChild(el("p", { class: "hint", text: "имеет смысл только при длительности > 1; 100% - гарантированно каждый ход, меньше - независимый шанс на КАЖДЫЙ ресурс (как cost_chance у ручных действий)" }));
    renderExtraTurnChance();
    card.appendChild(extraTurnWrap);

    const producesWrap = el("div");
    producesWrap.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Результат (produces)" })]));
    const producesBox = el("div", { class: "dict-editor" });
    if (!r.produces) r.produces = {};
    const producesChanceBox = el("div", { class: "dict-editor" });
    const renderProducesChance = () => renderChanceOnlyEditor(producesChanceBox, r, "produces", "produces_chance");
    renderDictEditor(producesBox, r.produces, renderProducesChance, true);
    producesWrap.appendChild(producesBox);
    producesWrap.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Шанс на ресурс, %" })]));
    producesWrap.appendChild(producesChanceBox);
    renderProducesChance();
    card.appendChild(producesWrap);

    card.appendChild(soundRow(
      rid, "Звук ритуала", "стандартный (по умолчанию)",
      "необязательно - без файла играет общий стандартный звук действия",
      () => r.sound, (v) => { if (v) r.sound = v; else delete r.sound; },
    ));
    const ritualCycle = cycleNote("ritual_recipe:" + rid);
    if (ritualCycle) card.appendChild(ritualCycle);

    makeCardCollapsible(card);
    cardsBox.appendChild(card);
  });
}

// ---------- Реактор ----------
// resources.*.reactor_component - тег роли компонента решётки реактора (fuel/
// moderator/coolant/absorber), тот же генерик-принцип, что soul_kind: живёт НА
// ресурсе, но редактируется на СВОЕЙ вкладке (а не на общей "Ресурсы"), потому
// что у него, в отличие от soul_kind, несколько числовых полей сразу (как
// resources.*.storage - см. renderStorage). Сама постройка-реактор
// (buildings.*.reactor) настраивается в "Настроить" на карточке постройки
// (openReactorSettingsModal выше) - тут только компоненты + барабан аварий.
// ---------- Плавильня: жидкие металлы + рецепты плавки/сплавов/литья ----------
// Постройка-плавильня (buildings.*.smeltery) настраивается на вкладке «Постройки»; здесь -
// то, что она плавит/сплавляет/льёт. См. game/engine.py: load_melt/alloy_smeltery/pour_cast
// и tools/content_validation.py (там же правила: металлы только в тигле, пара форма+металл
// уникальна).
const SMELTERY_EDITOR_KINDS = {
  melt: {
    key: "melt_recipes", title: "Плавка (melt_recipes)", noun: "рецепт плавки", filter: "smelt-melt",
    hint: "input - что списывается со склада при загрузке в слот. ПЕРВЫМ пишите главное сырьё (руду): его иконка в слоте, "
      + "и по нему клик на складе выбирает рецепт; топливо - следом. output - что через turns ходов стечёт в тигель: жидкие "
      + "металлы и/или шлак (всё не-металлическое всплывает и снимается на склад). heat - нужный жар плавильни. Если одну "
      + "руду плавят несколько рецептов, клик по плитке склада берёт самый «горячий» из доступных этой плавильне.",
    make: () => ({ name: "Новая плавка", requires_tech: null, heat: 1, input: {}, output: {}, turns: 1 }),
  },
  alloy: {
    key: "alloy_recipes", title: "Сплавы (alloy_recipes)", noun: "рецепт сплава", filter: "smelt-alloy",
    hint: "input и output - только жидкие металлы: сплав идёт прямо в тигле по кнопке «Сплавить» (тратит ход), результат "
      + "должен влезть в тигель. heat - нужный жар. hidden - пропорция скрыта («???»), пока игрок сам не попробует "
      + "сплавить эти металлы (открытие хранится в сохранении).",
    make: () => ({ name: "Новый сплав", requires_tech: null, heat: 1, input: {}, output: {}, hidden: false }),
  },
  cast: {
    key: "cast_recipes", title: "Литьё (cast_recipes)", noun: "рецепт литья", filter: "smelt-cast",
    hint: "Литейный стол: amount единиц жидкого металла metal из тигля в форму form -> output на склад через turns ходов "
      + "остывания (1 - сразу). Форма - обычный предмет склада: нужна одна, при литье НЕ тратится (крафтится один раз). "
      + "Пара «форма + металл» должна быть уникальной - по ней стол понимает, что лить.",
    make: () => ({ name: "Новое литьё", requires_tech: null, form: null, metal: null, amount: 1, output: {}, turns: 1 }),
  },
};

function smelteryIntRow(label, value, min, onchange, hint) {
  const row = el("div", { class: "field-row" });
  row.appendChild(el("label", { text: label }));
  const input = el("input", { type: "number", min: String(min), step: "1", value: value ?? min });
  input.addEventListener("change", () => onchange(Math.max(min, Math.round(Number(input.value) || min))));
  row.appendChild(input);
  if (hint) row.appendChild(el("span", { class: "hint", text: hint }));
  return row;
}

function smelteryDictRow(label, obj) {
  const wrap = el("div");
  wrap.appendChild(el("div", { class: "field-row" }, [el("label", { text: label })]));
  const box = el("div", { class: "dict-editor" });
  renderDictEditor(box, obj);
  wrap.appendChild(box);
  return wrap;
}

function smelteryRecipeSection(kind) {
  const cfg = SMELTERY_EDITOR_KINDS[kind];
  const dict = DATA[cfg.key];
  const box = el("div", { class: "sub-section" });
  box.appendChild(el("h3", { text: cfg.title }));
  box.appendChild(el("p", { class: "hint", text: cfg.hint }));
  const cardsBox = el("div");
  const filterBar = makeFilterBar(cfg.filter, cardsBox);
  const addForm = idPromptAndAdd(cfg.noun, (id) => {
    dict[id] = cfg.make();
    jumpTo(`card-smelt-${kind}-${id}`, "smeltery", { focusName: true });
  });
  box.appendChild(makeToolbar(addForm, filterBar));
  box.appendChild(cardsBox);
  const moltenEntries = DATA.resources.filter(r => r.molten).map(r => ({ value: r.id, label: r.name }));
  const ids = Object.keys(dict);
  ids.forEach((rid, i) => {
    const r = dict[rid];
    const card = el("div", { class: "card", id: `card-smelt-${kind}-${rid}` });
    card.dataset.search = (rid + " " + r.name).toLowerCase();
    const nameInput = el("input", { type: "text", value: r.name });
    nameInput.addEventListener("change", () => { r.name = nameInput.value; card.dataset.search = (rid + " " + r.name).toLowerCase(); });
    const order = orderControls({
      index: i, count: ids.length,
      onMove: (delta) => { moveDictKeyInPlace(dict, rid, delta); renderSmeltery(); },
      kind: cfg.noun,
      createDefault: () => cfg.make(),
      insertAfter: (id, value) => insertDictKeyAfterInPlace(dict, rid, id, value),
      jumpToNew: (id) => { renderSmeltery(); jumpTo(`card-smelt-${kind}-${id}`, "smeltery", { focusName: true }); },
    });
    const rm = el("button", { class: "small danger", text: "Удалить", onclick: () => { delete dict[rid]; renderSmeltery(); } });
    card.appendChild(el("div", { class: "card-head" }, [el("code", { text: rid }), nameInput, order, el("div", { class: "spacer" }), rm]));

    const techRow = el("div", { class: "field-row" });
    techRow.appendChild(el("label", { text: "Нужна технология" }));
    techRow.appendChild(techSelect(r.requires_tech, (v) => { r.requires_tech = v; }));
    card.appendChild(techRow);

    if (kind !== "cast") {
      card.appendChild(smelteryIntRow("Жар (heat)", r.heat ?? 1, 1, (v) => { r.heat = v; }, "плавильне нужен жар не ниже этого"));
    }
    if (kind === "alloy") {
      const hiddenRow = el("div", { class: "field-row" });
      const cb = el("input", { type: "checkbox" });
      cb.checked = !!r.hidden;
      cb.addEventListener("change", () => { r.hidden = cb.checked; });
      hiddenRow.appendChild(cb);
      hiddenRow.appendChild(el("label", { text: "Скрытый (hidden) - открывается пробой" }));
      card.appendChild(hiddenRow);
    }
    if (kind === "cast") {
      const formRow = el("div", { class: "field-row" });
      formRow.appendChild(el("label", { text: "Форма (form)" }));
      formRow.appendChild(resourceSelect(r.form || null, (v) => { r.form = v; }));
      formRow.appendChild(el("span", { class: "hint", text: "предмет склада, при литье не тратится" }));
      card.appendChild(formRow);
      const metalRow = el("div", { class: "field-row" });
      metalRow.appendChild(el("label", { text: "Металл (metal)" }));
      metalRow.appendChild(genericPickerSelect(moltenEntries, r.metal || null, (v) => { r.metal = v; }, {
        title: "Выбрать жидкий металл", placeholder: "— жидкий металл —", emptyText: "Сначала отметьте ресурс жидким металлом выше.",
      }));
      card.appendChild(metalRow);
      card.appendChild(smelteryIntRow("Сколько металла (amount)", r.amount ?? 1, 1, (v) => { r.amount = v; }, "единиц из тигля на одну отливку"));
    } else {
      if (!r.input) r.input = {};
      card.appendChild(smelteryDictRow(kind === "melt" ? "Сырьё со склада (input)" : "Металлы из тигля (input)", r.input));
    }
    if (!r.output) r.output = {};
    card.appendChild(smelteryDictRow(kind === "melt" ? "Стекает в тигель (output)" : kind === "alloy" ? "Сплав в тигель (output)" : "На склад (output)", r.output));
    if (kind !== "alloy") {
      card.appendChild(smelteryIntRow(kind === "melt" ? "Ходов плавки (turns)" : "Ходов остывания (turns)", r.turns ?? 1, 1, (v) => { r.turns = v; },
        kind === "cast" ? "1 - отливка готова сразу" : ""));
    }
    makeCardCollapsible(card);
    cardsBox.appendChild(card);
  });
  filterBar._apply();
  return box;
}

function renderSmeltery() {
  const root = document.getElementById("tab-smeltery");
  root.innerHTML = "";
  ["melt_recipes", "alloy_recipes", "cast_recipes"].forEach(k => { if (!DATA[k]) DATA[k] = {}; });
  root.appendChild(el("p", { class: "hint", text:
    "Плавильня - постройка с полем smeltery (вкладка «Постройки», строка «Плавильня» → «Настроить»: жар, слоты плавки, "
    + "объём тигля). Рецепты ниже не привязаны к конкретной постройке - их ведёт любая плавильня, чьего жара хватает. "
    + "В игре: руда -> слот плавки (ход, затем turns ходов) -> тигель (жидкий металл, шлак сверху) -> «Сплавить» -> литьё "
    + "в форму. Все три вида рецептов видны в справочнике источников и закрепляются звездой. Автокрафт и автоматизатор "
    + "плавильню не видят." }));

  const moltenBox = el("div", { class: "sub-section" });
  moltenBox.appendChild(el("h3", { text: "Жидкие металлы (resources.*.molten)" }));
  moltenBox.appendChild(el("p", { class: "hint", text:
    "Такой ресурс живёт только в тигле плавильни, не на складе. color - цвет слоя, density - порядок слоёв (тяжёлый "
    + "тонет, лёгкий сверху). Без своей иконки в игре рисуется каплей этого цвета." }));
  const free = DATA.resources.filter(r => !r.molten && r.id !== ENERGY_RESOURCE_ID);
  if (free.length) {
    let addId = free[0].id;
    const sel = genericPickerSelect(free.map(r => ({ value: r.id, label: r.name })), addId, (v) => { addId = v; }, { title: "Выбрать ресурс", placeholder: "— выбрать ресурс —" });
    const addBtn = el("button", { class: "primary", text: "Сделать жидким металлом", onclick: () => {
      const res = DATA.resources.find(x => x.id === addId);
      if (res) res.molten = { color: "#e07a3f", density: 8 };
      renderSmeltery();
    }});
    moltenBox.appendChild(el("div", { class: "add-form" }, [el("span", { text: "Ресурс:" }), sel, addBtn]));
  }
  DATA.resources.filter(r => r.molten).forEach(r => {
    const card = el("div", { class: "card", id: `card-smelt-molten-${r.id}` });
    const swatch = el("span", { style: `display:inline-block;width:14px;height:14px;background:${r.molten.color};box-shadow:0 0 6px ${r.molten.color};` });
    const rm = el("button", { class: "small danger", text: "Убрать тег", onclick: () => { delete r.molten; renderSmeltery(); } });
    card.appendChild(el("div", { class: "card-head" }, [swatch, el("code", { text: r.id }), el("strong", { text: r.name }), el("div", { class: "spacer" }), rm]));
    const colorRow = el("div", { class: "field-row" });
    colorRow.appendChild(el("label", { text: "Цвет слоя (color)" }));
    const colorInput = el("input", { type: "color", value: r.molten.color || "#e07a3f" });
    colorInput.addEventListener("input", () => {
      r.molten.color = colorInput.value;
      swatch.style.background = colorInput.value;
      swatch.style.boxShadow = `0 0 6px ${colorInput.value}`;
    });
    colorRow.appendChild(colorInput);
    card.appendChild(colorRow);
    const densityRow = el("div", { class: "field-row" });
    densityRow.appendChild(el("label", { text: "Плотность (density)" }));
    const densityInput = el("input", { type: "number", step: "any", value: r.molten.density ?? 0 });
    densityInput.addEventListener("change", () => { r.molten.density = Number(densityInput.value) || 0; });
    densityRow.appendChild(densityInput);
    densityRow.appendChild(el("span", { class: "hint", text: "больше - ниже в тигле" }));
    card.appendChild(densityRow);
    makeCardCollapsible(card);
    moltenBox.appendChild(card);
  });
  root.appendChild(moltenBox);

  root.appendChild(smelteryRecipeSection("melt"));
  root.appendChild(smelteryRecipeSection("alloy"));
  root.appendChild(smelteryRecipeSection("cast"));
}

function renderReactor() {
  const root = document.getElementById("tab-reactor");
  root.innerHTML = "";
  root.appendChild(el("p", { class: "hint", text:
    "Компоненты решётки реактора (resources.*.reactor_component) - любой ресурс можно пометить ролью "
    + "fuel/moderator/coolant/absorber/reflector/shield (свободный тег, как soul_kind); постройка-реактор (вкладка "
    + "«Постройки», кнопка «Настроить» у поля «Реактор») принимает роли из accepts_roles. У fuel "
    + "обязателен spent_result - ресурс-отход, остающийся в ячейке после выгорания (burnup_per_turn/turn "
    + "до charge_max)." }));

  const cardsBox = el("div");
  const freeResources = DATA.resources.filter(r => !r.reactor_component);
  if (freeResources.length) {
    let addRid = freeResources[0].id;
    const entries = freeResources.map(r => ({ value: r.id, label: r.name }));
    const select = genericPickerSelect(entries, addRid, (v) => { addRid = v; }, { title: "Выбрать ресурс", placeholder: "— выбрать ресурс —" });
    const addBtn = el("button", { class: "primary", text: "Добавить", onclick: () => {
      const resource = DATA.resources.find(r => r.id === addRid);
      if (resource) resource.reactor_component = { role: "fuel", heat: 4, output: 6, burnup_per_turn: 1, charge_max: 20, spent_result: "" };
      renderReactor();
    }});
    root.appendChild(el("div", { class: "add-form" }, [el("span", { text: "Компонент реактора для ресурса:" }), select, addBtn]));

  // resources.*.reactor_catalyst - отдельный слот ПОВЕРХ уже занятой ячейки

  // reactor_accidents - барабан аварий (тот же алгоритм взвешенного розыгрыша,

  // _roll_reactor_accident), но result - закрытый хардкод-enum, не ресурс.
  const REACTOR_ACCIDENT_RESULTS = [

    card.appendChild(el("button", { class: "small", text: "+ добавить исход", onclick: () => {

    makeCardCollapsible(card);
    accidentsBox.appendChild(card);
  });
  root.appendChild(accidentsBox);
}

// Квестбук - буквально дерево технологий (renderTechs/renderTechGraphView ниже),
// только "requires" ссылается на ДРУГОЙ КВЕСТ (а не технологию), а "era" - чисто
// визуальная колонка графа (аналог "tier" у технологий), без завязки на технологии
// вообще (см. game/engine.py:is_quest_available/check_quests: граф квестов
// открывается волнами "один за другим" сам по себе, требуя выполнения requires).
let questsViewMode = "graph"; // "graph" | "list"

function renderQuests() {
  const root = document.getElementById("tab-quests");
  root.innerHTML = "";
  if (!DATA.quests) DATA.quests = {};
  if (!DATA.loot_cases) DATA.loot_cases = {};

  const toggle = el("div", { class: "view-toggle" });
  const graphBtn = el("button", { text: "Граф", class: questsViewMode === "graph" ? "active" : "", onclick: () => { questsViewMode = "graph"; renderQuests(); } });
  const listBtn = el("button", { text: "Список", class: questsViewMode === "list" ? "active" : "", onclick: () => { questsViewMode = "list"; renderQuests(); } });
  toggle.append(graphBtn, listBtn);
  root.appendChild(toggle);

  if (questsViewMode === "graph") {
    renderQuestGraphView(root);
  } else {
    renderQuestListView(root);
  }
}

function jumpToQuestCard(qid, options) {
  questsViewMode = "list";
  jumpTo(`card-quests-${qid}`, "quests", options);
}

// Как renderTechsKeepScroll - перерисовка графа сбрасывает .graph-scroll в (0,0),
// эта обёртка сохраняет прокрутку там, где перестройка не должна двигать вид
// (перетаскивание узла, добавление/удаление связи).
function renderQuestsKeepScroll() {
  const scrollEl = document.querySelector(".graph-scroll");
  const left = scrollEl ? scrollEl.scrollLeft : null;
  const top = scrollEl ? scrollEl.scrollTop : null;
  renderQuests();
  if (left !== null) {
    const newScrollEl = document.querySelector(".graph-scroll");
    if (newScrollEl) { newScrollEl.scrollLeft = left; newScrollEl.scrollTop = top; }
  }
}

// Необязательное per-объектное поле-цвет с чекбоксом "включено" (obj[key]
// отсутствует = используется дефолт, задавать который тут не нужно - см.
// eraThemeEditor/CSS по статусу в web_ui.html). Общий виджет для quests.*.bg/border.
function optionalColorField(label, obj, key, onChange) {
  const row = el("div", { class: "field-row" });
  row.appendChild(el("label", { text: label }));
  const enabled = obj[key] !== undefined && obj[key] !== null;
  const cb = el("input", { type: "checkbox" });
  cb.checked = enabled;
  const colorInput = el("input", { type: "color", value: obj[key] || "#f0a030" });
  colorInput.style.display = enabled ? "" : "none";
  cb.addEventListener("change", () => {
    if (cb.checked) { obj[key] = colorInput.value; colorInput.style.display = ""; }
    else { delete obj[key]; colorInput.style.display = "none"; }
    onChange();
  });
  colorInput.addEventListener("input", () => { obj[key] = colorInput.value; onChange(); });
  row.append(cb, colorInput);
  return row;
}

function renderQuestListView(root) {
  ensureErasForQuests();
  root.appendChild(el("p", { class: "hint", text:
    "Условия внутри одного квеста нужно выполнить ВСЕ сразу (через И). Квест выполняется один раз и не теряется; "
    + "награда - ВСЕГДА лутбокс (кейс с лутом ниже), который игрок открывает сам отдельным кликом в игре (анимация "
    + "прокрутки барабана). requires - какие другие квесты должны быть выполнены раньше (граф открывается волнами, "
    + "как дерево технологий) - удобнее тянуть мышью на вкладке «Граф». era - чисто визуальная группировка в "
    + "колонки графа, с технологиями никак не связана." }));

  const cardsBox = el("div");
  const filterBar = makeFilterBar("quests", cardsBox);
  const addForm = idPromptAndAdd("квест", (id) => {
    const firstCase = Object.keys(DATA.loot_cases)[0] || null;
    DATA.quests[id] = { name: "Новый квест", description: "", era: 1, requires: [], conditions: [], reward_case: firstCase };
    jumpToQuestCard(id, { focusName: true });
  });
  root.appendChild(makeToolbar(addForm, filterBar));
  root.appendChild(cardsBox);

  const questIds = Object.keys(DATA.quests);
  questIds.forEach((qid, i) => {
    const q = DATA.quests[qid];
    if (q.conditions === undefined) q.conditions = [];
    if (q.requires === undefined) q.requires = [];
    const card = el("div", { class: "card", id: `card-quests-${qid}` });
    card.dataset.search = (qid + " " + q.name).toLowerCase();
    const nameInput = el("input", { type: "text", value: q.name });
    nameInput.addEventListener("change", () => { q.name = nameInput.value; card.dataset.search = (qid + " " + q.name).toLowerCase(); });
    const order = orderControls({
      index: i, count: questIds.length,
      onMove: (delta) => { moveDictKeyInPlace(DATA.quests, qid, delta); renderQuests(); },
      kind: "квест",
      createDefault: () => ({ name: "Новый квест", description: "", era: q.era, requires: [], conditions: [], reward_case: q.reward_case }),
      insertAfter: (id, value) => insertDictKeyAfterInPlace(DATA.quests, qid, id, value),
      jumpToNew: (id) => jumpToQuestCard(id, { focusName: true }),
    });
    const rm = el("button", { class: "small danger", text: "Удалить", onclick: () => {
      // Убираем ссылки на удаляемый квест из requires у ВСЕХ остальных - иначе
      // осталась бы битая ссылка на несуществующий id в чужом requires.
      Object.values(DATA.quests).forEach(other => { other.requires = (other.requires || []).filter(r => r !== qid); });
      delete DATA.quests[qid];
      renderQuests();
    }});
    card.appendChild(el("div", { class: "card-head" }, [el("code", { text: qid }), nameInput, order, el("div", { class: "spacer" }), rm]));

    card.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Описание" }), descriptionTextarea(q.description, "Описание квеста", (v) => { q.description = v; })]));

    const eraRow = el("div", { class: "field-row" });
    eraRow.appendChild(el("label", { text: "Эра (колонка графа)" }));
    const eraSelect = el("select");
    sortedEraIds().forEach(eraId => {
      const opt = el("option", { value: String(eraId), text: `#${eraId} ${DATA.eras[String(eraId)].name}` });
      if (eraId === (q.era || 1)) opt.selected = true;
      eraSelect.appendChild(opt);
    });
    eraSelect.addEventListener("change", () => { q.era = Number(eraSelect.value); });
    eraRow.appendChild(eraSelect);
    eraRow.appendChild(el("span", { class: "hint", text: "новую эру заведи в блоке «Эры» на вкладке «Граф»" }));

    card.appendChild(el("div", { class: "field-row" }, [
      iconEditButton(q.name || qid, q, defaultQuestIcon(), () => renderQuestsKeepScroll()),
    ]));

    card.appendChild(optionalColorField("Свой фон узла на графе", q, "bg", () => renderQuestsKeepScroll()));
    card.appendChild(optionalColorField("Своя рамка узла на графе", q, "border", () => renderQuestsKeepScroll()));
    card.appendChild(optionalColorField("Свой цвет текста подсказки при наведении", q, "tooltip_color", () => renderQuestsKeepScroll()));

    card.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Требует квестов" })]));
    const reqBox = el("div", { class: "req-list" });
    Object.entries(DATA.quests).filter(([oqid]) => oqid !== qid).forEach(([oqid, other]) => {
      const cb = el("input", { type: "checkbox" });
      cb.checked = q.requires.includes(oqid);
      cb.addEventListener("change", () => {
        if (cb.checked) { if (!q.requires.includes(oqid)) q.requires.push(oqid); }
        else { q.requires = q.requires.filter(x => x !== oqid); }
      });
      reqBox.appendChild(el("label", {}, [cb, document.createTextNode(other.name)]));
    });
    card.appendChild(reqBox);

    const rewardRow = el("div", { class: "field-row" });
    rewardRow.appendChild(el("label", { text: "Награда (кейс с лутом)" }));
    if (Object.keys(DATA.loot_cases).length) {
      rewardRow.appendChild(lootCaseSelect(q.reward_case, (v) => { q.reward_case = v; }));
    } else {
      rewardRow.appendChild(el("span", { class: "hint", text: "сначала добавь хотя бы один кейс с лутом ниже" }));
    }
    card.appendChild(rewardRow);

    card.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Условия (все обязательны)" })]));
    const condBox = el("div");
    renderConditions(condBox, q.conditions);
    card.appendChild(condBox);

    makeCardCollapsible(card);
    cardsBox.appendChild(card);
  });
  filterBar._apply();

  root.appendChild(renderLootCasesSection());
}

// ---------- Квесты: граф ----------
// Буквальная копия "Технологии: граф" (renderTechGraphView и соседний код) ниже -
// свои DOM id/переменные состояния, чтобы перетаскивание в одном графе никогда не
// задевало состояние другого (переключение вкладок посреди drag - редкий, но
// дешёво избегаемый край).

// 64x64 - РОВНО тот же размер, что .quest-node в игре (tools/web_ui.html) -
// узел графа тут больше не текстовая карточка, а 1:1 превью финального вида
// (см. renderQuestGraphView ниже). ROW_GAP чуть больше, чем у остальных
// графов редактора - под подпись-id, которая торчит ПОД квадратом.
const QUEST_NODE_W = 64, QUEST_NODE_H = 64, QUEST_COL_GAP = 60, QUEST_ROW_GAP = 30, QUEST_PAD = 24;
// Дефолтный цвет текста подсказки без q.tooltip_color - держать в паре с
// QUEST_DEFAULT_TOOLTIP_COLOR в tools/web_ui.html.
const QUEST_DEFAULT_TOOLTIP_COLOR = "#dbe7ec";
// Квадратный узел квеста тянется за любую грань (в отличие от узла тех-дерева -
// там только правая) - квесты не обязаны течь строго слева направо, см.
// renderQuestGraphView/questEdgeAnchor.
const QUEST_HANDLE_SIDES = ["top", "right", "bottom", "left"];

let selectedQuestNode = null;
let questConnectDragState = null;
let questNodeDragState = null;
// Активная вкладка-эра графового редактора (см. renderQuestGraphView) - каждая
// эра теперь СВОЙ отдельный граф/канвас, а не колонка общего (см. комментарий
// у renderQuestGraphView) - переживает перерисовки в течение сессии редактора.
let questGraphEra = null;

function questEraOf(id) {
  return DATA.quests[id]?.era || 1;
}

// Оформление эр квестбука (content.json: eras[eraId] -> {name, color}) - хранит
// имя и главный цвет каждой эры отдельно от самого номера era у квеста
// (quests.*.era остаётся числом-ключом графа/сортировки, как раньше - см.
// "Критичные инварианты" в CLAUDE.md про переиспользование позиции как id).
// ensureEra идемпотентно заводит запись с дефолтным именем/цветом для любого
// era, у которого её ещё нет (тот же приём, что _ensure_farm_instances в
// engine.py) - вызывается при каждом обращении к эре в редакторе, поэтому у
// любого номера, реально использованного квестом, всегда есть что редактировать.
function ensureEra(eraId) {
  if (!DATA.eras) DATA.eras = {};
  const key = String(eraId);
  if (!DATA.eras[key]) {
    const palette = tierBandColorEditor(eraId);
    DATA.eras[key] = { name: `Эра ${eraId}`, color: palette.text };
  }
  return DATA.eras[key];
}

function ensureErasForQuests() {
  const usedEras = [...new Set(Object.values(DATA.quests).map(q => q.era || 1))];
  usedEras.forEach(ensureEra);
}

function sortedEraIds() {
  ensureErasForQuests();
  return Object.keys(DATA.eras).map(Number).sort((a, b) => a - b);
}

function hexToRgbaEditor(hex, alpha) {
  const m = /^#([0-9a-fA-F]{2})([0-9a-fA-F]{2})([0-9a-fA-F]{2})$/.exec(hex || "");
  if (!m) return hex;
  const r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// Тема эры для отрисовки (вкладка/фон графа) - буквальная копия eraTheme из
// tools/web_ui.html, держать в паре (два независимых HTML-файла, общего JS-
// модуля между ними нет - см. CLAUDE.md).
function eraThemeEditor(eraId) {
  const info = ensureEra(eraId);
  return { bg: hexToRgbaEditor(info.color, 0.10), border: hexToRgbaEditor(info.color, 0.35), text: info.color, name: info.name };
}

// Следующий свободный номер era - максимум среди уже заведённых (и в eras, и у
// квестов, на случай расхождения) + 1, чтобы "Добавить эру" никогда не
// перезаписала уже занятый номер.
function nextFreeEraId() {
  const used = [
    ...Object.keys(DATA.eras || {}).map(Number),
    ...Object.values(DATA.quests || {}).map(q => q.era || 1),
  ];
  return (used.length ? Math.max(...used) : 0) + 1;
}

// Число квестов, использующих эту эру - определяет, можно ли её удалить
// (удаление эры с квестами оставило бы их era висеть без оформления - не
// запрещено валидатором, но осмысленнее не пускать это из UI молча).
function eraUsageCount(eraId) {
  return Object.values(DATA.quests || {}).filter(q => (q.era || 1) === eraId).length;
}

// Обмен местами двух эр (реордер вкладок) - номер era квеста ХРАНИТ позицию
// (тот же принцип, что тир инструмента/апгрейда, см. CLAUDE.md), поэтому
// "передвинуть эру раньше" означает поменять местами её номер с соседним:
// перевесить оформление eras[a]/eras[b] И перевести era всех квестов обеих эр.
function swapEras(idA, idB) {
  const a = String(idA), b = String(idB);
  const tmp = DATA.eras[a];
  DATA.eras[a] = DATA.eras[b];
  DATA.eras[b] = tmp;
  Object.values(DATA.quests).forEach(q => {
    if (q.era === idA) q.era = idB;
    else if (q.era === idB) q.era = idA;
  });
}

function renderEraManager() {
  ensureErasForQuests();
  const box = el("div", { class: "card era-manager" });
  box.appendChild(el("div", { class: "card-head" }, [el("strong", { text: "Эры" })]));
  box.appendChild(el("p", { class: "hint", text:
    "Название и главный цвет вкладки/фона графа для каждой эры. Удалить можно только эру, которой не пользуется ни один квест - "
    + "перенеси их в другую эру на вкладке «Список» или в графе." }));

  const eraIds = sortedEraIds();
  eraIds.forEach((eraId, i) => {
    const info = DATA.eras[String(eraId)];
    const row = el("div", { class: "field-row era-manager-row" });
    row.appendChild(el("span", { class: "hint", text: `#${eraId}` }));

    const nameInput = el("input", { type: "text", value: info.name, style: "flex:1" });
    nameInput.addEventListener("change", () => { info.name = nameInput.value || `Эра ${eraId}`; renderQuests(); });
    row.appendChild(nameInput);

    const colorInput = el("input", { type: "color", value: info.color });
    colorInput.addEventListener("input", () => { info.color = colorInput.value; renderQuestsKeepScroll(); });
    row.appendChild(colorInput);

    const upBtn = el("button", { class: "small", text: "↑", disabled: i === 0 ? "true" : null });
    upBtn.addEventListener("click", () => { swapEras(eraId, eraIds[i - 1]); renderQuests(); });
    row.appendChild(upBtn);
    const downBtn = el("button", { class: "small", text: "↓", disabled: i === eraIds.length - 1 ? "true" : null });
    downBtn.addEventListener("click", () => { swapEras(eraId, eraIds[i + 1]); renderQuests(); });
    row.appendChild(downBtn);

    const usage = eraUsageCount(eraId);
    const rmBtn = el("button", { class: "small danger", text: "Удалить", disabled: usage > 0 ? "true" : null,
      title: usage > 0 ? `Эрой пользуются ${usage} квест(ов) - сначала перенеси их` : "" });
    rmBtn.addEventListener("click", () => { delete DATA.eras[String(eraId)]; renderQuests(); });
    row.appendChild(rmBtn);

    box.appendChild(row);
  });

  const addBtn = el("button", { text: "+ Добавить эру", onclick: () => {
    const id = nextFreeEraId();
    ensureEra(id);
    renderQuests();
  }});
  box.appendChild(addBtn);

  return box;
}

// Локальная глубина зависимостей СРЕДИ id из `ids` (одна эра) - requires на
// квест ВНЕ этого набора (другая эра) не увеличивает глубину: такой квест тут
// физически не рисуется, см. renderQuestGraphView.
function computeQuestLocalLevels(ids) {
  const idSet = new Set(ids);
  const localLevel = {};
  function levelOf(id, stack) {
    if (localLevel[id] !== undefined) return localLevel[id];
    if (stack.has(id)) return 0; // цикл в данных - не должно происходить, но не зависаем
    stack.add(id);
    const q = DATA.quests[id];
    const sameEraReqs = (q.requires || []).filter(r => idSet.has(r));
    localLevel[id] = sameEraReqs.length ? 1 + Math.max(...sameEraReqs.map(r => levelOf(r, stack))) : 0;
    return localLevel[id];
  }
  ids.forEach(id => levelOf(id, new Set()));
  return localLevel;
}

// Раскладка графа ОДНОЙ эры (era) - в отличие от старой версии (все эры разом,
// колонки идут одна за другой), тут offset колонок всегда начинается с нуля:
// каждая вкладка - самостоятельный канвас.
function computeQuestPositions(era) {
  const ids = Object.keys(DATA.quests).filter(id => questEraOf(id) === era);
  const localLevel = computeQuestLocalLevels(ids);

  const byCol = {};
  ids.forEach(id => { (byCol[localLevel[id]] = byCol[localLevel[id]] || []).push(id); });
  Object.values(byCol).forEach(list => list.sort((a, b) => DATA.quests[a].name.localeCompare(DATA.quests[b].name, "ru")));

  const maxCol = ids.length ? Math.max(...ids.map(id => localLevel[id])) : 0;
  let maxAutoRows = 0;
  const positions = {};
  for (let col = 0; col <= maxCol; col++) {
    const list = byCol[col] || [];
    let row = 0;
    list.forEach(id => {
      const q = DATA.quests[id];
      if (q.pos) {
        positions[id] = { x: q.pos.x, y: q.pos.y, w: QUEST_NODE_W, h: QUEST_NODE_H };
      } else {
        positions[id] = {
          x: QUEST_PAD + col * (QUEST_NODE_W + QUEST_COL_GAP),
          y: QUEST_PAD + row * (QUEST_NODE_H + QUEST_ROW_GAP),
          w: QUEST_NODE_W,
          h: QUEST_NODE_H,
        };
        row++;
      }
    });
    maxAutoRows = Math.max(maxAutoRows, row);
  }
  let width = QUEST_PAD * 2 + (maxCol + 1) * QUEST_NODE_W + maxCol * QUEST_COL_GAP;
  let height = QUEST_PAD * 2 + maxAutoRows * QUEST_NODE_H + Math.max(0, maxAutoRows - 1) * QUEST_ROW_GAP;
  Object.values(positions).forEach(p => {
    width = Math.max(width, p.x + p.w + QUEST_PAD);
    height = Math.max(height, p.y + p.h + QUEST_PAD);
  });
  return { positions, width: Math.max(width, 400), height: Math.max(height, 200), ids };
}

function dependsOnQuest(questId, targetId, visited) {
  if (visited.has(questId)) return false;
  visited.add(questId);
  const reqs = (DATA.quests[questId] || {}).requires || [];
  if (reqs.includes(targetId)) return true;
  return reqs.some(r => dependsOnQuest(r, targetId, visited));
}

// Добавление ребра fromId -> toId (toId.requires получит fromId) создаёт цикл, если
// fromId уже (прямо или косвенно) зависит от toId.
function wouldCreateQuestCycle(fromId, toId) {
  if (fromId === toId) return true;
  return dependsOnQuest(fromId, toId, new Set());
}

// Каждая эра - СВОЙ отдельный граф на своей вкладке (не колонка общего, как
// было раньше) - requires ВНУТРИ одной эры рисуется линией, requires на квест
// ИЗ ДРУГОЙ эры по-прежнему реально гейтит доступность в игре (см.
// game/engine.py:is_quest_available), но линией тут не рисуется - того узла
// физически нет на этой вкладке. Ставится/убирается такая межэровая связь
// чекбоксом в карточке (вкладка «Список» - requires там не ограничен эрой).
function renderQuestGraphView(root) {
  const eras = [...new Set(Object.values(DATA.quests).map(q => q.era || 1))].sort((a, b) => a - b);
  if (questGraphEra === null || !eras.includes(questGraphEra)) {
    questGraphEra = eras[0] ?? 1;
  }

  const addForm = idPromptAndAdd("квест", (id) => {
    const firstCase = Object.keys(DATA.loot_cases)[0] || null;
    DATA.quests[id] = { name: "Новый квест", description: "", era: questGraphEra, requires: [], conditions: [], reward_case: firstCase };
    selectedQuestNode = id;
    // Узлы графа не редактируются inline (только перетаскивание/связи) - настоящие
    // поля (название, описание, условия) живут в карточке списка, поэтому сразу туда.
    jumpToQuestCard(id, { focusName: true });
  });
  const resetBtn = el("button", { text: "Сбросить расположение этой эры", onclick: () => {
    Object.values(DATA.quests).forEach(q => { if ((q.era || 1) === questGraphEra) delete q.pos; });
    renderQuests();
  }});
  addForm.appendChild(resetBtn);
  // В отличие от техов (всегда линейно слева направо), квесты можно расставить
  // как угодно (например "плюсом") - авто-раскладка по столбцам тогда покрывает
  // только часть общей рамки графа, и дефолтный скролл в (0,0) может показать
  // пустой угол. centerQuestGraphView (вызывается ниже при каждом рендере этой
  // вкладки) уже центрирует вид по факту содержимого - кнопка нужна, только
  // чтобы вернуться к центру вручную после того, как игрок сам поскроллил/
  // попанорамил в сторону.
  const centerBtn = el("button", { text: "Центрировать", onclick: () => centerQuestGraphView() });
  addForm.appendChild(centerBtn);
  const toolbar = el("div", { class: "tab-toolbar" }, [addForm]);
  root.appendChild(toolbar);

  root.appendChild(renderEraManager());

  root.appendChild(el("p", { class: "hint", text:
    "Перетаскивай узел за тело карточки, чтобы разместить его где угодно в графе - позиция запоминается. " +
    "Тяни за один из четырёх оранжевых кружков по граням узла к другому узлу ЭТОЙ ЖЕ эры - появится " +
    "зависимость (узел-источник станет требуемым квестом для узла-цели); в отличие от техов, квесты не обязаны " +
    "выстраиваться слева направо, поэтому грань для связи можно выбрать любую - линия сама подбирает, с какой " +
    "стороны каждого узла ей удобнее выходить/входить, в зависимости от их взаимного расположения. Клик по линии " +
    "удаляет связь. Клик по узлу (без перетаскивания) подсвечивает его связи. Двойной клик открывает карточку в " +
    "списке для полного редактирования (название, условия, награда, оформление, а также requires НА ДРУГУЮ ЭРУ - " +
    "там список не ограничен текущей вкладкой)." }));

  if (!Object.keys(DATA.quests).length) {
    root.appendChild(el("p", { class: "hint", text: "Квестов пока нет - добавь их кнопкой выше." }));
    return;
  }

  const tabs = el("div", { class: "view-toggle era-toggle" });
  eras.forEach(era => {
    const theme = eraThemeEditor(era);
    const btn = el("button", { text: theme.name, class: era === questGraphEra ? "active" : "" });
    btn.style.setProperty("--era-accent", theme.text);
    btn.addEventListener("click", () => { questGraphEra = era; renderQuests(); });
    tabs.appendChild(btn);
  });
  root.appendChild(tabs);

  const { positions, width, height, ids } = computeQuestPositions(questGraphEra);

  if (!ids.length) {
    root.appendChild(el("p", { class: "hint", text: "В этой эре пока нет квестов." }));
    return;
  }

  const scroll = el("div", { class: "graph-scroll graph-scroll-tab" });
  const graph = el("div", { class: "tech-graph", id: "questGraph" });
  graph.style.width = width + "px";
  graph.style.height = height + "px";
  const theme = eraThemeEditor(questGraphEra);
  graph.style.background = theme.bg;

  const svg = svgEl("svg", { class: "tech-graph-svg", width, height });
  const defs = svgEl("defs");
  const marker = svgEl("marker", {
    id: "arrowhead-quest", viewBox: "0 0 10 10", refX: "9", refY: "5",
    markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse",
  });
  marker.appendChild(svgEl("path", { d: "M 0 0 L 10 5 L 0 10 z" }));
  defs.appendChild(marker);
  svg.appendChild(defs);

  ids.forEach(qid => {
    const q = DATA.quests[qid];
    (q.requires || []).forEach(reqId => {
      const p1 = positions[reqId], p2 = positions[qid];
      if (!p1 || !p2) return; // reqId из другой эры - на этой вкладке не рисуется
      const { x1, y1, x2, y2 } = questEdgeAnchor(p1, p2);
      const d = questEdgePathD(x1, y1, x2, y2);

      const visible = svgEl("path", { d, class: "tech-edge" });
      visible.setAttribute("marker-end", "url(#arrowhead-quest)");
      visible.dataset.from = reqId;
      visible.dataset.to = qid;

      const hit = svgEl("path", { d, class: "tech-edge-hit" });
      hit.dataset.from = reqId;
      hit.dataset.to = qid;
      hit.addEventListener("click", () => {
        q.requires = q.requires.filter(x => x !== reqId);
        renderQuestsKeepScroll();
      });

      svg.appendChild(visible);
      svg.appendChild(hit);
    });
  });
  graph.appendChild(svg);

  ids.forEach(qid => {
    const q = DATA.quests[qid];
    const pos = positions[qid];
    const node = el("div", { class: "tech-node quest-node-square", id: `questnode-${qid}` });
    node.dataset.questId = qid;
    node.style.left = pos.x + "px";
    node.style.top = pos.y + "px";
    node.style.width = pos.w + "px";
    node.style.height = pos.h + "px";
    // 1:1 превью игрового узла (web_ui.html:buildQuestNode) - большая пиксель-
    // иконка (q.icon, дефолт defaultQuestIcon() - та же {grid,palette} форма,
    // что у ресурсов/построек/мобов, рисуется через pixelIcon) виден при
    // ЛЮБОМ статусе, включая locked, поэтому показываем его тут БЕЗУСЛОВНО
    // (не только если q.icon задан). Подсказка с именем - та же самая, что
    // всплывает в игре при наведении, тем же шрифтом/цветом - включая
    // q.tooltip_color, если задан (та же per-квестовая настройка, что
    // icon/bg/border, не общая на все квесты сразу).
    const iconDef = q.icon || defaultQuestIcon();
    const iconWrap = el("div", { class: "quest-node-square-icon" });
    iconWrap.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 34));
    node.appendChild(iconWrap);
    const tip = el("div", { class: "quest-node-tip", text: q.name });
    tip.style.color = q.tooltip_color || QUEST_DEFAULT_TOOLTIP_COLOR;
    node.appendChild(tip);
    node.appendChild(el("div", { class: "quest-node-square-caption", text: qid }));
    if (q.bg) node.style.background = q.bg;
    if (q.border) node.style.borderColor = q.border;

    // Квадратный узел квеста тянется за любую из четырёх граней (в отличие от
    // узла тех-дерева - там только правая, см. handle выше в renderTechGraphView) -
    // квесты не обязаны течь строго слева направо.
    QUEST_HANDLE_SIDES.forEach(side => {
      const handle = el("div", { class: `tech-node-handle handle-${side}` });
      handle.addEventListener("mousedown", (e) => startQuestConnectDrag(qid, side, e));
      node.appendChild(handle);
    });

    // Обычный клик (без движения мыши) выделяет узел; клик с движением - перетаскивание.
    node.addEventListener("mousedown", (e) => {
      if (e.target.closest(".tech-node-handle") || e.button !== 0) return;
      startQuestNodeDrag(qid, e);
    });
    node.addEventListener("dblclick", (e) => {
      if (e.target.closest(".tech-node-handle")) return;
      jumpToQuestCard(qid);
    });

    graph.appendChild(node);
  });

  scroll.appendChild(graph);
  root.appendChild(scroll);
  enableGraphZoomEditor(scroll, graph, questGraphZoom);
  applyQuestSelectionHighlight();
  // Раскладка по столбцам покрывает не всю рамку графа, если квесты расставлены
  // вручную не по прямой (см. кнопку "Центрировать" выше) - без этого дефолтный
  // скролл (0,0) может показать пустой угол вместо содержимого. Синхронно (не
  // requestAnimationFrame) - иначе перебивало бы восстановление позиции в
  // renderQuestsKeepScroll (та тоже синхронная, выполняется СРАЗУ после
  // renderQuests(), см. её код), из-за которого любой клик по ребру/перетаскивание
  // узла откидывали бы вид обратно к центру вместо сохранения текущего скролла.
  centerQuestGraphView();
}

// Центрирует .graph-scroll на фактической рамке уже отрисованных узлов
// (а не на позициях из DATA - читает live DOM, чтобы работать что для
// авто-раскладки, что для узлов с ручным pos, одинаково). Вызывается и
// автоматически при каждом рендере вкладки "Граф" (renderQuestsKeepScroll
// сразу после неё синхронно восстанавливает прежний скролл, если он был -
// см. комментарий выше), и вручную кнопкой "Центрировать".
function centerQuestGraphView() {
  const scrollEl = document.querySelector(".graph-scroll");
  const graph = document.getElementById("questGraph");
  if (!scrollEl || !graph) return;
  const nodeEls = graph.querySelectorAll(".tech-node.quest-node-square");
  if (!nodeEls.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodeEls.forEach(n => {
    const x = parseFloat(n.style.left) || 0, y = parseFloat(n.style.top) || 0;
    const w = n.offsetWidth || QUEST_NODE_W, h = n.offsetHeight || QUEST_NODE_H;
    minX = Math.min(minX, x); minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h);
  });
  // scrollLeft/scrollTop живут в отмасштабированном (экранном) пространстве -
  // центр рамки, посчитанный в немасштабированных x/y, нужно домножить на zoom.
  const zoom = questGraphZoom.value;
  scrollEl.scrollLeft = Math.max(0, ((minX + maxX) / 2) * zoom - scrollEl.clientWidth / 2);
  scrollEl.scrollTop = Math.max(0, ((minY + maxY) / 2) * zoom - scrollEl.clientHeight / 2);
}

function applyQuestSelectionHighlight() {
  const graph = document.getElementById("questGraph");
  if (!graph) return;
  const nodes = graph.querySelectorAll(".tech-node");
  const edges = graph.querySelectorAll(".tech-edge, .tech-edge-hit");

  // selectedQuestNode может принадлежать эре, для которой сейчас показана НЕ
  // ТА вкладка (выбор пережил переключение вкладки) - в этом случае в ТЕКУЩЕМ
  // графе его просто нет, и без этой проверки все узлы этой эры ошибочно
  // помечались бы "dim" (ни один не совпал бы с selectedQuestNode).
  if (!selectedQuestNode || !DATA.quests[selectedQuestNode] || questEraOf(selectedQuestNode) !== questGraphEra) {
    nodes.forEach(n => n.classList.remove("dim", "selected"));
    edges.forEach(e => e.classList.remove("dim", "related"));
    return;
  }

  const related = new Set([selectedQuestNode]);
  edges.forEach(e => {
    if (e.dataset.from === selectedQuestNode || e.dataset.to === selectedQuestNode) {
      related.add(e.dataset.from);
      related.add(e.dataset.to);
    }
  });

  nodes.forEach(n => {
    const id = n.dataset.questId;
    n.classList.toggle("selected", id === selectedQuestNode);
    n.classList.toggle("dim", !related.has(id));
  });
  edges.forEach(e => {
    const isRelated = e.dataset.from === selectedQuestNode || e.dataset.to === selectedQuestNode;
    e.classList.toggle("related", isRelated);
    e.classList.toggle("dim", !isRelated);
  });
}

// Точка на конкретной грани узла (в координатах viewport, как getBoundingClientRect)
// - какую грань тянуть, решает игрок (см. QUEST_HANDLE_SIDES), в отличие от
// questEdgeAnchor ниже, которая для УЖЕ построенных рёбер выбирает грань сама.
function questHandlePoint(rect, side) {
  if (side === "top") return [rect.left + rect.width / 2, rect.top];
  if (side === "bottom") return [rect.left + rect.width / 2, rect.bottom];
  if (side === "left") return [rect.left, rect.top + rect.height / 2];
  return [rect.right, rect.top + rect.height / 2]; // right (дефолт)
}

function startQuestConnectDrag(fromId, side, evt) {
  evt.preventDefault();
  evt.stopPropagation();
  const graph = document.getElementById("questGraph");
  const svg = graph.querySelector(".tech-graph-svg");
  const line = svgEl("line", { class: "tech-edge-drag" });
  svg.appendChild(line);
  questConnectDragState = { fromId, side, line, graph, zoom: questGraphZoom.value };
  updateQuestDragLine(evt);
  document.addEventListener("mousemove", onQuestConnectDragMove);
  document.addEventListener("mouseup", onQuestConnectDragEnd);
}

function updateQuestDragLine(evt) {
  const { fromId, side, line, graph, zoom } = questConnectDragState;
  const graphRect = graph.getBoundingClientRect();
  const fromNode = document.getElementById(`questnode-${fromId}`);
  const fromRect = fromNode.getBoundingClientRect();
  const [hx, hy] = questHandlePoint(fromRect, side);
  // См. комментарий в updateDragLine (тех-граф) - те же экранные координаты,
  // делим на zoom, чтобы попасть в немасштабированную систему координат svg.
  line.setAttribute("x1", (hx - graphRect.left) / zoom);
  line.setAttribute("y1", (hy - graphRect.top) / zoom);
  line.setAttribute("x2", (evt.clientX - graphRect.left) / zoom);
  line.setAttribute("y2", (evt.clientY - graphRect.top) / zoom);
}

function onQuestConnectDragMove(evt) {
  if (questConnectDragState) updateQuestDragLine(evt);
}

function onQuestConnectDragEnd(evt) {
  document.removeEventListener("mousemove", onQuestConnectDragMove);
  document.removeEventListener("mouseup", onQuestConnectDragEnd);
  if (!questConnectDragState) return;
  const { fromId, line } = questConnectDragState;
  line.remove();
  questConnectDragState = null;

  const targetEl = document.elementFromPoint(evt.clientX, evt.clientY);
  const nodeEl = targetEl && targetEl.closest(".tech-node");
  if (!nodeEl) return;
  const toId = nodeEl.dataset.questId;
  if (!toId || toId === fromId) return;

  const toQuest = DATA.quests[toId];
  if (toQuest.requires.includes(fromId)) return; // уже связаны
  if (wouldCreateQuestCycle(fromId, toId)) {
    alert(`Нельзя связать: "${DATA.quests[toId].name}" уже (прямо или косвенно) требуется для "${DATA.quests[fromId].name}" - получился бы цикл.`);
    return;
  }
  toQuest.requires.push(fromId);
  renderQuestsKeepScroll();
}

function questNodeRect(qid) {
  const nodeEl = document.getElementById(`questnode-${qid}`);
  if (!nodeEl) return null;
  return {
    x: parseFloat(nodeEl.style.left) || 0,
    y: parseFloat(nodeEl.style.top) || 0,
    w: nodeEl.offsetWidth || QUEST_NODE_W,
    h: nodeEl.offsetHeight || QUEST_NODE_H,
  };
}

// Для УЖЕ существующего ребра (fromId.requires содержит toId) сама выбирает,
// с какой из четырёх граней каждого узла ей входить/выходить - по направлению
// между их центрами (доминирует горизонталь -> боковые грани, вертикаль ->
// верх/низ), а не по тому, за какую грань его тянул игрок при создании связи
// (это разово, дальше узлы могут переехать перетаскиванием - см.
// updateQuestEdgesForNode/onQuestNodeDragMove). Тем самым ЛЮБАЯ грань доступна
// без ручного выбора при каждой перерисовке - ровно то, что нужно для
// нелинейных по форме квестовых графов (в отличие от edgePathD/дерева
// технологий, которые всегда текут строго слева направо).
function questEdgeAnchor(p1, p2) {
  const c1x = p1.x + p1.w / 2, c1y = p1.y + p1.h / 2;
  const c2x = p2.x + p2.w / 2, c2y = p2.y + p2.h / 2;
  const dx = c2x - c1x, dy = c2y - c1y;
  if (Math.abs(dx) >= Math.abs(dy)) {
    return dx >= 0
      ? { x1: p1.x + p1.w, y1: c1y, x2: p2.x, y2: c2y }
      : { x1: p1.x, y1: c1y, x2: p2.x + p2.w, y2: c2y };
  }
  return dy >= 0
    ? { x1: c1x, y1: p1.y + p1.h, x2: c2x, y2: p2.y }
    : { x1: c1x, y1: p1.y, x2: c2x, y2: p2.y + p2.h };
}

// Как edgePathD, но кривая бульжится в сторону, реально ведущую от x1,y1 к
// x2,y2 (тот всегда предполагает движение слева направо) - нужно для рёбер,
// которые questEdgeAnchor мог направить вертикально или даже справа налево.
function questEdgePathD(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  if (Math.abs(dx) >= Math.abs(dy)) {
    const off = Math.max(30, Math.abs(dx) / 2) * (dx < 0 ? -1 : 1);
    return `M ${x1} ${y1} C ${x1 + off} ${y1}, ${x2 - off} ${y2}, ${x2} ${y2}`;
  }
  const off = Math.max(30, Math.abs(dy) / 2) * (dy < 0 ? -1 : 1);
  return `M ${x1} ${y1} C ${x1} ${y1 + off}, ${x2} ${y2 - off}, ${x2} ${y2}`;
}

function updateQuestEdgesForNode(qid) {
  const graph = document.getElementById("questGraph");
  const svg = graph.querySelector(".tech-graph-svg");
  svg.querySelectorAll("path[data-from]").forEach(p => {
    if (p.dataset.from !== qid && p.dataset.to !== qid) return;
    const r1 = questNodeRect(p.dataset.from);
    const r2 = questNodeRect(p.dataset.to);
    if (!r1 || !r2) return;
    const { x1, y1, x2, y2 } = questEdgeAnchor(r1, r2);
    p.setAttribute("d", questEdgePathD(x1, y1, x2, y2));
  });
}

function ensureQuestCanvasSize(x, y, w, h) {
  const graph = document.getElementById("questGraph");
  const svg = graph.querySelector(".tech-graph-svg");
  const neededW = x + w + QUEST_PAD;
  const neededH = y + h + QUEST_PAD;
  if (neededW > graph.offsetWidth) { graph.style.width = neededW + "px"; svg.setAttribute("width", neededW); }
  if (neededH > graph.offsetHeight) { graph.style.height = neededH + "px"; svg.setAttribute("height", neededH); }
}

function startQuestNodeDrag(qid, evt) {
  evt.preventDefault();
  const nodeEl = document.getElementById(`questnode-${qid}`);
  questNodeDragState = {
    qid, nodeEl,
    startX: evt.clientX, startY: evt.clientY,
    startLeft: parseFloat(nodeEl.style.left) || 0,
    startTop: parseFloat(nodeEl.style.top) || 0,
    zoom: questGraphZoom.value,
    moved: false,
  };
  document.addEventListener("mousemove", onQuestNodeDragMove);
  document.addEventListener("mouseup", onQuestNodeDragEnd);
}

function onQuestNodeDragMove(evt) {
  if (!questNodeDragState) return;
  const dx = (evt.clientX - questNodeDragState.startX) / questNodeDragState.zoom;
  const dy = (evt.clientY - questNodeDragState.startY) / questNodeDragState.zoom;
  if (!questNodeDragState.moved && Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
  questNodeDragState.moved = true;
  const x = Math.max(0, questNodeDragState.startLeft + dx);
  const y = Math.max(0, questNodeDragState.startTop + dy);
  questNodeDragState.nodeEl.style.left = x + "px";
  questNodeDragState.nodeEl.style.top = y + "px";
  ensureQuestCanvasSize(x, y, questNodeDragState.nodeEl.offsetWidth, questNodeDragState.nodeEl.offsetHeight);
  updateQuestEdgesForNode(questNodeDragState.qid);
}

function onQuestNodeDragEnd() {
  document.removeEventListener("mousemove", onQuestNodeDragMove);
  document.removeEventListener("mouseup", onQuestNodeDragEnd);
  if (!questNodeDragState) return;
  const { qid, nodeEl, moved } = questNodeDragState;
  questNodeDragState = null;
  if (moved) {
    DATA.quests[qid].pos = { x: parseFloat(nodeEl.style.left) || 0, y: parseFloat(nodeEl.style.top) || 0 };
    renderQuestsKeepScroll();
  } else {
    selectedQuestNode = selectedQuestNode === qid ? null : qid;
    applyQuestSelectionHighlight();
  }
}

// Барабан призов лутбокса (content.json loot_cases.*.prizes = [{resource, amount,
// weight}]) - классический "открой кейс, выпадет РОВНО один приз" (см.
// game/engine.py:_roll_loot_case_prize). Вероятность приза = его weight / сумма
// весов ВСЕХ призов этого же кейса - поэтому проценты в списке пересчитываются
// заново при любом изменении веса (полная перерисовка), а не только своей строки.
function renderPrizesEditor(container, prizes) {
  container.innerHTML = "";
  const totalWeight = prizes.reduce((sum, p) => sum + (Number(p.weight) || 1), 0);
  prizes.forEach((prize, i) => {
    const row = el("div", { class: "dict-row" });
    row.appendChild(resourceSelect(prize.resource, v => { prize.resource = v; }));
    const amountInput = el("input", { type: "number", min: "1", value: prize.amount ?? 1, title: "Количество" });
    amountInput.addEventListener("change", () => { prize.amount = Number(amountInput.value) || 1; });
    row.appendChild(amountInput);
    row.appendChild(el("span", { class: "hint", text: "вес" }));
    const weightInput = el("input", { type: "number", min: "1", value: prize.weight ?? 1, style: "width:56px", title: "Вес - шанс приза пропорционален весу среди суммы весов всех призов" });
    weightInput.addEventListener("change", () => {
      prize.weight = Number(weightInput.value) || 1;
      renderPrizesEditor(container, prizes);
    });
    row.appendChild(weightInput);
    const odds = totalWeight ? Math.round((Number(prize.weight) || 1) / totalWeight * 100) : 0;
    row.appendChild(el("span", { class: "hint", text: `≈${odds}%` }));
    const rm = el("button", { class: "small danger", text: "✕", onclick: () => {
      prizes.splice(i, 1);
      renderPrizesEditor(container, prizes);
    }});
    row.appendChild(rm);
    container.appendChild(row);
  });
  const addBtn = el("button", { class: "small", text: "+ приз", onclick: () => {
    prizes.push({ resource: DATA.resources[0]?.id, amount: 1, weight: 1 });
    renderPrizesEditor(container, prizes);
  }});
  container.appendChild(addBtn);
}

function renderLootCasesSection() {
  const box = el("div", { class: "sub-section" });
  box.appendChild(el("h3", { text: "Кейсы с лутом (лутбоксы)" }));
  box.appendChild(el("p", { class: "hint", text:
    "Награда за квесты (см. reward_case выше) - при открытии выпадает РОВНО ОДИН приз из барабана (не всё сразу): "
    + "шанс каждого приза пропорционален его весу среди суммы весов ВСЕХ призов этого кейса. Один кейс может быть "
    + "наградой сразу нескольких квестов." }));

  const cardsBox = el("div");
  const addForm = idPromptAndAdd("кейс с лутом", (id) => {
    DATA.loot_cases[id] = { name: "Новый кейс", description: "", prizes: [] };
    renderQuests();
    jumpTo(`card-loot-cases-${id}`, "quests", { focusName: true });
  });
  box.appendChild(addForm);
  box.appendChild(cardsBox);

  Object.entries(DATA.loot_cases).forEach(([cid, c]) => {
    const card = el("div", { class: "card", id: `card-loot-cases-${cid}` });
    card.dataset.search = (cid + " " + c.name).toLowerCase();
    const nameInput = el("input", { type: "text", value: c.name });
    nameInput.addEventListener("change", () => { c.name = nameInput.value; card.dataset.search = (cid + " " + c.name).toLowerCase(); });
    const rm = el("button", { class: "small danger", text: "Удалить", onclick: () => {
      delete DATA.loot_cases[cid];
      renderQuests();
    }});
    card.appendChild(el("div", { class: "card-head" }, [el("code", { text: cid }), nameInput, el("div", { class: "spacer" }), rm]));

    card.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Описание" }), descriptionTextarea(c.description, "Описание кейса", (v) => { c.description = v; })]));

    if (!c.prizes) c.prizes = [];
    card.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Барабан призов" })]));
    const prizesBox = el("div", { class: "dict-editor" });
    renderPrizesEditor(prizesBox, c.prizes);
    card.appendChild(prizesBox);

    makeCardCollapsible(card);
    cardsBox.appendChild(card);
  });
  return box;
}

    "Три глобальных звука игры, не привязанных к конкретному действию. Громкость музыки и звуков игрок "
    + "регулирует у себя в игре отдельными ползунками (кнопка-колонка в правом верхнем углу) - здесь только "
    + "сами файлы. Звук ЛЮБОГО ручного действия задаётся отдельно, в его собственной карточке на вкладке "
    + "«Ручные действия»." }));

  soundsCard.appendChild(soundRow(
    "background_music", "Фоновая музыка", "нет (тишина)",
    "зацикленный трек, играет негромко на фоне всей игры; без файла музыки просто не будет - "
    + "синтезированной замены по умолчанию для неё нет, в отличие от двух звуков ниже",
    () => DATA.ui.sounds.background_music, (v) => { if (v) DATA.ui.sounds.background_music = v; else delete DATA.ui.sounds.background_music; },
  ));
  soundsCard.appendChild(soundRow(
    "lootbox_open", "Звук открытия кейса", "стандартный (по умолчанию)",
    "играет в момент, когда игрок открывает лутбокс (запускается прокрутка барабана награды)",
    () => DATA.ui.sounds.lootbox_open, (v) => { if (v) DATA.ui.sounds.lootbox_open = v; else delete DATA.ui.sounds.lootbox_open; },
  ));
  soundsCard.appendChild(soundRow(
    "button_click", "Звук клика по кнопке", "стандартный (по умолчанию)",
    "короткий тактильный щелчок при клике по ЛЮБОЙ кнопке интерфейса - отдельно от звука результата "
    + "самого действия (успех/провал/поломка и т.п.)",
    () => DATA.ui.sounds.button_click, (v) => { if (v) DATA.ui.sounds.button_click = v; else delete DATA.ui.sounds.button_click; },
  ));
  soundsCard.appendChild(soundRow(
    "mine_hit", "Звук удара киркой в шахте", "стандартный (по умолчанию)",
    "играет при каждом удачном ударе по клетке поля шахты (Шахта -> клик по клетке) - независимо от того, "
    + "выпала ли руда",
    () => DATA.ui.sounds.mine_hit, (v) => { if (v) DATA.ui.sounds.mine_hit = v; else delete DATA.ui.sounds.mine_hit; },
  ));

  root.appendChild(soundsCard);

  if (!DATA.genetics) DATA.genetics = {};
  if (!DATA.genetics.synthesis_cost) DATA.genetics.synthesis_cost = {};

  const geneticsCard = el("div", { class: "card" });
  geneticsCard.appendChild(el("div", { class: "card-head" }, [el("strong", { text: "Разведение" })]));
  geneticsCard.appendChild(el("p", { class: "hint", text:
    "Скрещивание ВСЕГДА бесплатно, кроме самих двух родителей (списываются целиком) - доп. цены сверху "
    + "больше нет, это не настраивается. synthesis_cost - цена генетического шаблона (модалка «Фермы», "
    + "доступно с генетической лабораторией) - фиксированная на весь синтез, не зависит от того, какие "
    + "конкретно аллели выбраны." }));

  geneticsCard.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Цена синтеза (synthesis_cost)" })]));
  const synthesisCostBox = el("div", { class: "dict-editor" });
  renderDictEditor(synthesisCostBox, DATA.genetics.synthesis_cost);
  geneticsCard.appendChild(synthesisCostBox);

  root.appendChild(geneticsCard);

  if (!DATA.combat) DATA.combat = {};

  const combatCard = el("div", { class: "card" });
  combatCard.appendChild(el("div", { class: "card-head" }, [el("strong", { text: "Бой" })]));
  combatCard.appendChild(el("p", { class: "hint", text:
    "Глобальные настройки HP игрока в схватках (охота, см. game/engine.py:player_max_hp/current_player_hp/"
    + "is_wounded) - урон по игроку задаётся отдельно на каждом мобе/боссе (вкладка «Мобы»), урон, "
    + "который наносит сам игрок брони/оружия - вкладка «Инструменты»." }));

  const combatField = (key, label, hint, opts) => {
    const row = el("div", { class: "field-row" });
    row.appendChild(el("label", { text: label }));
    const input = el("input", { type: "number", min: opts.min ?? "0", step: opts.step ?? "1", value: DATA.combat[key] ?? opts.def });
    input.addEventListener("change", () => { DATA.combat[key] = Number(input.value) || 0; });
    row.appendChild(input);
    if (hint) row.appendChild(el("span", { class: "hint", text: hint }));
    combatCard.appendChild(row);
  };
  combatField("player_base_hp", "Базовый максимум HP игрока", "без учёта бонусов боевого навыка и брони", { def: 20 });
  combatField("hp_regen_per_turn", "Реген HP за ход", "тикает КАЖДЫЙ ход, но ТОЛЬКО вне активной схватки", { def: 3 });
  combatField("wounded_turns", "Длительность «Ранен» после поражения (ходов)", "выставляется при отступлении на 0 HP - см. attack_encounter", { def: 5 });
  combatField("wounded_damage_multiplier", "Множитель урона игрока, пока «Ранен»", "число от 0 до 1 - домножает ЛЮБОЙ урон игрока по мобу (обычная атака и приёмы)", { def: 0.5, step: "0.05" });

  root.appendChild(combatCard);
}

const RENDER_BY_TAB = {
  resources: renderResources,
  storage: renderStorage,
  locations: renderLocations,
  manual: renderManual,
  buildings: renderBuildings,
  "breakdown-types": renderBreakdownTypes,
  techs: renderTechs,
  "energy-recipes": renderEnergyRecipes,
  species: renderSpecies,
  "genetic-traits": renderGeneticTraits,
  breeding: renderMutations,
  mining: renderMining,
  tools: renderTools,
  smeltery: renderSmeltery,
  quests: renderQuests,
  settings: renderSettings,
};

function setupTabs() {
  const nav = document.getElementById("tabs");
  TABS.forEach(([id, label], i) => {
    const btn = el("button", { text: label, onclick: () => selectTab(id) });
    btn.dataset.tab = id;
    if (i === 0) btn.classList.add("active");
    nav.appendChild(btn);
  });
}

function selectTab(id) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === id));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.id === `tab-${id}`));
  if (id === "raw") document.getElementById("rawJson").value = JSON.stringify(DATA, null, 2);
}

function updateTopbarHeight() {
  const topbar = document.getElementById("topbar");
  if (topbar) document.documentElement.style.setProperty("--topbar-h", topbar.offsetHeight + "px");
}

setupTabs();
setupGlobalSearch();
updateTopbarHeight();
window.addEventListener("resize", updateTopbarHeight);
selectTab("resources");
document.getElementById("saveBtn").addEventListener("click", save);
document.getElementById("resetSaveBtn").addEventListener("click", resetSave);
document.getElementById("reloadBtn").addEventListener("click", () => { load(); });
load();
</script>
