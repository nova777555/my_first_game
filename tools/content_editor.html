// Свободный текстовый тег "семейства" вида (species.*.family) и той же
// строкой - что фермы принимают (buildings.*.breeding_accepts_family, см.
// game/engine.py:species_family/breeding_accepts_family) - НЕ фиксированный
// enum (тот же принцип, что id сред у environment_emulation), поэтому обычный
// текстовый input, а не кнопка+модалка, как у speciesSelect. datalist из уже
// встречающихся в DATA.species значений - только подсказка (защита от
// опечатки вроде "bee"/"bees"), сохранить можно любую непустую строку. id
// datalist генерируется на каждый вызов (счётчик ниже) - на странице может
// быть сразу несколько таких полей (по одному на карточку постройки/вида),
// одинаковый id у нескольких <datalist> в DOM был бы невалиден.
let _speciesFamilyDatalistCounter = 0;
function speciesFamilyInput(value, onChange) {
  const listId = `speciesFamilyList_${_speciesFamilyDatalistCounter++}`;
  const input = el("input", { type: "text", list: listId, placeholder: "пусто - без ограничений", value: value || "" });

  const families = new Set();
  Object.values(DATA.species || {}).forEach(sp => { if (sp.family) families.add(sp.family); });
  const datalist = el("datalist", { id: listId });
  [...families].sort().forEach(f => datalist.appendChild(el("option", { value: f })));
  return el("span", {}, [input, datalist]);
}

// Список произвольных тегов постройки (buildings.*.tags) - НЕ фиксированный
// enum (тот же принцип, что breeding_accepts_family/soul_kind), только МНОЖЕСТВО
// значений вместо одного: панель "Производственные мощности" в web_ui.html
// собирает фильтр по типу постройки из тегов, реально назначенных хоть одной
// уже построенной постройке - движок эти теги не читает вообще, чисто
// UI-метаданные. Мутирует b.tags на месте (splice/push), пустой список
// удаляется целиком (b.tags), чтобы не засорять content.json пустыми "tags": []
// у построек без единого тега - тот же приём, что breakdown_types.
let _buildingTagsDatalistCounter = 0;
function buildingTagsInput(b) {
  if (!Array.isArray(b.tags)) b.tags = [];
  const list = b.tags;
  const sync = () => { if (!list.length) delete b.tags; };
  const listId = `buildingTagsList_${_buildingTagsDatalistCounter++}`;
  const wrap = el("span", { class: "tags-chip-list" });
  const input = el("input", { type: "text", list: listId, placeholder: "добавить тег…" });
  const addTag = () => {
    const v = input.value.trim();
    input.value = "";
    if (v && !list.includes(v)) { list.push(v); }
    sync();
    renderChips();
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addTag(); }
  });
  input.addEventListener("change", addTag);
  function renderChips() {
    wrap.querySelectorAll(".tags-chip").forEach(c => c.remove());
    list.forEach((tag, i) => {
      const chip = el("span", { class: "tags-chip" }, [document.createTextNode(tag)]);
      const rm = el("button", { type: "button", text: "×", title: "Убрать тег" });
      rm.addEventListener("click", () => { list.splice(i, 1); sync(); renderChips(); });
      chip.appendChild(rm);
      wrap.insertBefore(chip, input);
    });
  }
  wrap.appendChild(input);
  const existingTags = new Set();
  Object.values(DATA.buildings || {}).forEach(other => (other.tags || []).forEach(t => existingTags.add(t)));
  const datalist = el("datalist", { id: listId });
  [...existingTags].sort().forEach(t => datalist.appendChild(el("option", { value: t })));
  wrap.appendChild(datalist);
  renderChips();
  return wrap;
}

// allowNone - добавляет пункт "— корень —" (value="" -> null): у ручных действий
// это действие без своей локации (лежит в корне дерева локаций), у родительской
// локации - локация верхнего уровня. excludeId - какую локацию НЕ предлагать
// (обычно саму редактируемую локацию - иначе можно было бы назначить её родителем
// самой себе; полный цикл через цепочку предков всё равно ловит content_validation.py
// при сохранении, здесь достаточно исключить самый очевидный случай).
function locationSelect(selected, onchange, { allowNone = false, excludeId = null } = {}) {
  const entries = Object.entries(DATA.locations)
    .filter(([lid]) => lid !== excludeId)
    .map(([lid, l]) => ({ value: lid, label: l.name }));
  return genericPickerSelect(entries, selected, onchange, {
    title: "Выбрать локацию",
    placeholder: "— выбрать локацию —",
    noneLabel: allowNone ? "— корень (без локации) —" : null,
  });
}

// Общее поле "Задержка клика (мс)" для построек/ручных действий/добычи - защита от
// автокликера в web-версии (см. tools/web_ui.html: tryRunAction). Пусто = использовать
// общее значение по умолчанию (ui.default_action_delay_ms, вкладка "Настройки").
function clickDelayRow(entity) {
  const row = el("div", { class: "field-row" });
  row.appendChild(el("label", { text: "Задержка клика (мс)" }));
  const dflt = (DATA.ui && DATA.ui.default_action_delay_ms != null) ? DATA.ui.default_action_delay_ms : 400;
  const input = el("input", { type: "number", min: "0", step: "50", placeholder: `по умолчанию (${dflt})` });
  if (entity.click_delay_ms != null) input.value = entity.click_delay_ms;
  input.addEventListener("change", () => {
    entity.click_delay_ms = input.value === "" ? null : Number(input.value);
  });
  row.appendChild(input);
  row.appendChild(el("span", { class: "hint", text: "пусто = общее значение по умолчанию" }));
  return row;
}

// Чанками, а не одним String.fromCharCode(...bytes) - на файле в несколько МБ
// spread по всем байтам разом рискует упереться в лимит аргументов движка.
function arrayBufferToBase64(buf) {
  const bytes = new Uint8Array(buf);
  let binary = "";
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

// Кастомный звук (manual_actions.*.sound ИЛИ один из трёх глобальных слотов
// ui.sounds.* - фон/открытие лутбокса/клик по кнопке, см. renderSettings) -
// хранится не в content.json, а отдельным файлом в tools/sounds/<soundId>.<ext>
// (см. tools/content_editor.py:_handle_upload_sound, tools/web_ui.py:SOUNDS_DIR).
// getSound/setSound читают и пишут конкретное место в DATA (entity.sound для
// ручных действий, DATA.ui.sounds.<key> для глобальных слотов - см. вызовы ниже).
// Сама загрузка байтов происходит сразу по выбору файла (мимо обычного цикла
// "поменяли DATA -> нажали Сохранить"), т.к. байты не входят в content.json и
// нечего было бы сохранять кнопкой "Сохранить".
function soundRow(soundId, label, defaultText, hint, getSound, setSound) {
  const row = el("div", { class: "field-row" });
  row.appendChild(el("label", { text: label }));
  const box = el("div", { style: "display:flex; gap:8px; align-items:center; flex-wrap:wrap" });
  const status = el("span", { class: "hint", text: getSound() || defaultText });

  const fileInput = el("input", { type: "file", accept: ".wav,.mp3,.ogg,audio/wav,audio/mpeg,audio/ogg" });
  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    if (!["wav", "mp3", "ogg"].includes(ext)) {
      toast("error", "Поддерживаются только файлы .wav/.mp3/.ogg");
      fileInput.value = "";
      return;
    }
    const buf = await file.arrayBuffer();
    const res = await fetch("/api/upload_sound", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action_id: soundId, ext, data_base64: arrayBufferToBase64(buf) }),
    });
    const payload = await res.json();
    fileInput.value = "";
    if (res.ok) {
      setSound(payload.filename);
      status.textContent = payload.filename;
      toast("ok", "Звук загружен. Не забудь нажать «Сохранить», чтобы ссылка попала в content.json.");
    } else {
      toast("error", `Не получилось загрузить звук: ${payload.error}`);
    }
  });
  box.appendChild(fileInput);

  const playBtn = el("button", { class: "small", type: "button", text: "▶ Прослушать" });
  playBtn.addEventListener("click", () => {
    const current = getSound();
    if (!current) { toast("error", "Звук не назначен"); return; }
    new Audio(`/sounds/${current}`).play().catch(() => toast("error", "Не получилось проиграть звук"));
  });
  box.appendChild(playBtn);

  const clearBtn = el("button", { class: "small", type: "button", text: "Очистить" });
  clearBtn.addEventListener("click", () => {
    setSound(null);
    status.textContent = defaultText;
  });
  box.appendChild(clearBtn);

  box.appendChild(status);
  row.appendChild(box);
  if (hint) row.appendChild(el("span", { class: "hint", text: hint }));
  return row;
}

// allowRandom (по умолчанию false) - разрешает случайное количество РОВНО там,
// где вызывающий явно передал true (produces построек/энергорецептов/синтезаторов
// душ, gain ручных действий через renderManualResourceDictEditor ниже) - НИКОГДА
// в cost/consumes (см. game/engine.py: _is_range_amount, "cost/consumes диапазонов
// не бывает"). Значение ресурса тогда - число (как раньше) ИЛИ объект {min, max}
// (game/content_validation.py: check_amount_range) - равномерный случайный бросок
// при производстве/выполнении, НЕЗАВИСИМО от chance у соседнего chance-словаря
// (шанс решает, случится ли начисление вообще, диапазон - сколько именно, если да).
function renderDictAmountInput(dictObj, rid, allowRandom, onChange, rerender) {
  const wrap = el("span", { class: "dict-amount" });
  const isRange = allowRandom && dictObj[rid] !== null && typeof dictObj[rid] === "object";
  if (isRange) {
    const minInput = el("input", { type: "number", min: "0", value: dictObj[rid].min, style: "width:56px", title: "Минимум" });
    const maxInput = el("input", { type: "number", min: "0", value: dictObj[rid].max, style: "width:56px", title: "Максимум" });
    minInput.addEventListener("change", () => {
      dictObj[rid].min = Number(minInput.value) || 0;
      if (onChange) onChange();
    });
    maxInput.addEventListener("change", () => {
      dictObj[rid].max = Number(maxInput.value) || 0;
      if (onChange) onChange();
    });
    wrap.append(minInput, el("span", { class: "hint", text: "–" }), maxInput);
  } else {
    const amount = el("input", { type: "number", min: "0", value: dictObj[rid] });
    amount.addEventListener("change", () => {
      dictObj[rid] = Number(amount.value) || 0;
      if (onChange) onChange();
    });
    wrap.appendChild(amount);
  }
  if (allowRandom) {
    const toggle = el("label", { class: "hint", title: "Случайное количество (равномерно min..max за один раз), не влияет на шанс" });
    const checkbox = el("input", { type: "checkbox", style: "margin:0 3px 0 8px" });
    checkbox.checked = isRange;
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) {
        const base = typeof dictObj[rid] === "number" ? dictObj[rid] : 1;
        dictObj[rid] = { min: base, max: base };
      } else {
        dictObj[rid] = (dictObj[rid] && typeof dictObj[rid] === "object") ? (dictObj[rid].min || 0) : dictObj[rid];
      }
      rerender();
      if (onChange) onChange();
    });
    toggle.append(checkbox, document.createTextNode("случайно"));
    wrap.appendChild(toggle);
  }
  return wrap;
}

function renderDictEditor(container, dictObj, onChange, allowRandom) {
  container.innerHTML = "";
  Object.keys(dictObj).forEach(rid => {
    const row = el("div", { class: "dict-row" });
    const rerender = () => renderDictEditor(container, dictObj, onChange, allowRandom);
    const sel = resourceSelect(rid, (newId) => {
      const amount = dictObj[rid];
      delete dictObj[rid];
      dictObj[newId] = amount;
      rerender();
      if (onChange) onChange();
    });
    const amountWrap = renderDictAmountInput(dictObj, rid, allowRandom, onChange, rerender);
    const rm = el("button", { class: "small danger", text: "✕", onclick: () => {
      delete dictObj[rid];
      rerender();
      if (onChange) onChange();
    }});
    row.append(sel, amountWrap, rm);
    container.appendChild(row);
  });
  const addBtn = el("button", { class: "small", text: "+ ресурс", onclick: () => {
    const used = new Set(Object.keys(dictObj));
    const free = DATA.resources.find(r => !used.has(r.id));
    if (!free) { alert("Все ресурсы уже добавлены"); return; }
    dictObj[free.id] = 1;
    renderDictEditor(container, dictObj, onChange, allowRandom);
    if (onChange) onChange();
  }});
  container.appendChild(addBtn);
}

// Как renderDictEditor, но для cost/gain РУЧНОГО ДЕЙСТВИЯ - рядом с каждым ресурсом
// дополнительно рисует поле "Шанс, %" (game/engine.py: manual_actions.*.cost_chance/
// gain_chance, см. "Шанс потребления/получения в рецептах" в CLAUDE.md). 100% (по
// умолчанию, как было всегда до этой механики) хранится НЕОТМЕЧЕННЫМ ключом - при
// вводе 100 ключ ресурса в action[chanceKey] удаляется целиком (а сам chanceKey -
// если после этого он опустел), чтобы content.json не засорялся десятками
// "cost_chance": {} у действий, которые эту механику вообще не используют.
// action - сам объект manual_actions[id] (не сам dictObj) - нужен, чтобы читать и
// мутировать компаньон-словарь action[chanceKey] по тому же ключу ресурса.
function renderManualResourceDictEditor(container, action, amountKey, chanceKey, onChange) {
  const dictObj = action[amountKey];
  const chanceLabel = amountKey === "cost" ? "потратится" : "выдастся";
  // Случайное количество (см. renderDictAmountInput/game.engine._is_range_amount)
  // разрешено только на выходе (gain), никогда на цене (cost) - cost/consumes
  // диапазонов не бывает.
  const allowRandom = amountKey === "gain";
  container.innerHTML = "";
  Object.keys(dictObj).forEach(rid => {
    const row = el("div", { class: "dict-row" });
    const rerender = () => renderManualResourceDictEditor(container, action, amountKey, chanceKey, onChange);
    const sel = resourceSelect(rid, (newId) => {
      const amount = dictObj[rid];
      delete dictObj[rid];
      dictObj[newId] = amount;
      if (action[chanceKey] && rid in action[chanceKey]) {
        action[chanceKey][newId] = action[chanceKey][rid];
        delete action[chanceKey][rid];
      }
      rerender();
      if (onChange) onChange();
    });
    const amountWrap = renderDictAmountInput(dictObj, rid, allowRandom, onChange, rerender);
    const currentPercent = action[chanceKey] && rid in action[chanceKey]
      ? Math.round(action[chanceKey][rid] * 100) : 100;
    const chanceInput = el("input", {
      type: "number", min: "1", max: "100", step: "1", value: currentPercent, style: "width:60px",
      title: `Шанс (%), с которым этот ресурс реально ${chanceLabel} за ОДНУ попытку выполнения действия. 100 = всегда (как было раньше)`,
    });
    chanceInput.addEventListener("change", () => {
      const percent = Math.max(1, Math.min(100, Number(chanceInput.value) || 100));
      chanceInput.value = percent;
      if (percent >= 100) {
        if (action[chanceKey]) {
          delete action[chanceKey][rid];
          if (Object.keys(action[chanceKey]).length === 0) delete action[chanceKey];
        }
      } else {
        action[chanceKey] = action[chanceKey] || {};
        action[chanceKey][rid] = percent / 100;
      }
      if (onChange) onChange();
    });
    const rm = el("button", { class: "small danger", text: "✕", onclick: () => {
      delete dictObj[rid];
      if (action[chanceKey]) {
        delete action[chanceKey][rid];
        if (Object.keys(action[chanceKey]).length === 0) delete action[chanceKey];
      }
      rerender();
      if (onChange) onChange();
    }});
    row.append(sel, amountWrap, chanceInput, el("span", { class: "hint", text: "%" }), rm);
    container.appendChild(row);
  });
  const addBtn = el("button", { class: "small", text: "+ ресурс", onclick: () => {
    const used = new Set(Object.keys(dictObj));
    const free = DATA.resources.find(r => !used.has(r.id));
    if (!free) { alert("Все ресурсы уже добавлены"); return; }
    dictObj[free.id] = 1;
    renderManualResourceDictEditor(container, action, amountKey, chanceKey, onChange);
    if (onChange) onChange();
  }});
  container.appendChild(addBtn);
}

// id общие на весь проект - постройка не может взять id, уже занятый ресурсом,
// технологией или ручным действием (и наоборот). Иначе создание молча затирало бы
// существующую сущность (JS-объект не может иметь два ключа с одним именем).
function findIdOwner(id) {
  if (DATA.resources.some(r => r.id === id)) return "ресурсом";
  if (id in DATA.locations) return "локацией";
  if (id in DATA.manual_actions) return "ручным действием";
  if (id in DATA.buildings) return "постройкой";
  if (DATA.breakdown_types && id in DATA.breakdown_types) return "видом поломки";
  if (id in DATA.techs) return "технологией";
  if (DATA.energy_recipes && id in DATA.energy_recipes) return "рецептом за энергию";
  if (id in DATA.tools) return "инструментом";
  if (DATA.mobs && id in DATA.mobs) return "мобом/боссом";
  if (DATA.combat_moves && id in DATA.combat_moves) return "приёмом боя";
  if (DATA.skills && id in DATA.skills) return "навыком";
  if (DATA.enchantments && id in DATA.enchantments) return "зачарованием";
  if (DATA.quests && id in DATA.quests) return "квестом";
  if (DATA.loot_cases && id in DATA.loot_cases) return "кейсом с лутом";
  if (DATA.melt_recipes && id in DATA.melt_recipes) return "рецептом плавки";
  if (DATA.alloy_recipes && id in DATA.alloy_recipes) return "рецептом сплава";
  if (DATA.cast_recipes && id in DATA.cast_recipes) return "рецептом литья";
  return null;
}

function idPromptAndAdd(kind, onCreate) {
  const idInput = el("input", { type: "text", placeholder: "id, напр. copper_ore" });
  const btn = el("button", { class: "primary", text: "Добавить" });
  btn.addEventListener("click", () => {
    const id = idInput.value.trim();
    if (!/^[a-z][a-z0-9_]*$/.test(id)) {
      alert("id должен быть латиницей в snake_case: буквы, цифры, подчёркивания, начинается с буквы");
      return;
    }
    const owner = findIdOwner(id);
    if (owner) {
      alert(`id "${id}" уже занят другой сущностью (${owner}). Id уникальны во всём проекте, не только внутри вкладки.`);
      return;
    }
    onCreate(id);
    idInput.value = "";
  });
  return el("div", { class: "add-form" }, [
    el("span", { text: `Новая запись (${kind}):` }),
    idInput,
    btn,
  ]);
}

// ---------- порядок сущностей: стрелки вверх/вниз + "создать новую сразу под этой" ----------
// Порядок в content.json (индекс в массиве resources / порядок ключей словаря) -
// это и есть порядок отображения в игре (панель ресурсов и инвентарь, каталог
// строительства, список исследований и т.д.) - см. game/content.py, который грузит
// content.json как есть, ничего не пересортировывая.

function moveArrayItem(array, index, delta) {
  const newIndex = index + delta;
  if (newIndex < 0 || newIndex >= array.length) return false;
  const [item] = array.splice(index, 1);
  array.splice(newIndex, 0, item);
  return true;
}

function insertArrayItemAfter(array, index, value) {
  array.splice(index + 1, 0, value);
}

// Словари в JS сохраняют порядок вставки строковых ключей - чтобы "переместить" или
// "вставить после", перекладываем содержимое в новом порядке ключей БЕЗ замены самой
// ссылки на объект (чистим и заполняем заново), чтобы не разошлись другие места
// редактора, уже держащие ссылку на DATA.buildings/DATA.techs/...
function reorderDictKeys(dict, orderedKeys) {
  const values = {};
  orderedKeys.forEach(k => { values[k] = dict[k]; });
  Object.keys(dict).forEach(k => delete dict[k]);
  orderedKeys.forEach(k => { dict[k] = values[k]; });
}

function moveDictKeyInPlace(dict, key, delta) {
  const keys = Object.keys(dict);
  const index = keys.indexOf(key);
  const newIndex = index + delta;
  if (index === -1 || newIndex < 0 || newIndex >= keys.length) return false;
  [keys[index], keys[newIndex]] = [keys[newIndex], keys[index]];
  reorderDictKeys(dict, keys);
  return true;
}

function insertDictKeyAfterInPlace(dict, afterKey, newKey, value) {
  const keys = Object.keys(dict);
  const newKeys = keys.slice();
  newKeys.splice(keys.indexOf(afterKey) + 1, 0, newKey);
  dict[newKey] = value;
  reorderDictKeys(dict, newKeys);
}

function promptNewId(kind) {
  const raw = prompt(`id новой записи (${kind}), латиницей snake_case (например: copper_ore):`);
  if (raw === null) return null; // отмена
  const id = raw.trim();
  if (!/^[a-z][a-z0-9_]*$/.test(id)) {
    alert("id должен быть латиницей в snake_case: буквы, цифры, подчёркивания, начинается с буквы");
    return null;
  }
  const owner = findIdOwner(id);
  if (owner) {
    alert(`id "${id}" уже занят другой сущностью (${owner}). Id уникальны во всём проекте.`);
    return null;
  }
  return id;
}

// Кнопки для одной карточки/строки: "↑"/"↓" переставляют её, необязательный "+" сразу
// создаёт новую пустую запись прямо под этой - чтобы не тащить новую запись с самого
// низа списка, если место нужно здесь. onMove(delta) переставляет саму запись,
// createDefault(id)/insertAfter(id, value)/jumpToNew(id) - для кнопки "+" (можно не
// передавать, если для вкладки создание "после конкретной записи" не имеет смысла).
function orderControls({ index, count, onMove, kind, createDefault, insertAfter, jumpToNew }) {
  const box = el("div", { class: "order-controls" });
  const up = el("button", { class: "small", title: "Переместить выше", text: "↑" });
  if (index === 0) up.disabled = true;
  up.addEventListener("click", () => onMove(-1));
  const down = el("button", { class: "small", title: "Переместить ниже", text: "↓" });
  if (index === count - 1) down.disabled = true;
  down.addEventListener("click", () => onMove(1));
  box.appendChild(up);
  box.appendChild(down);
  if (createDefault) {
    const insert = el("button", { class: "small", title: `Создать новую запись (${kind}) сразу под этой`, text: "+" });
    insert.addEventListener("click", () => {
      const id = promptNewId(kind);
      if (id === null) return;
      insertAfter(id, createDefault(id));
      jumpToNew(id);
    });
    box.appendChild(insert);
  }
  return box;
}

// ---------- сворачивание карточек сущностей ----------

// Все карточки сущностей (постройки, техи, локации, ручные действия, рецепты
// за энергию, добыча, инструменты, достижения) по умолчанию свёрнуты - по
// прямому пожеланию: у многих (особенно у построек-"механизмов") бывает по
// 15-20 полей, и когда таких карточек в списке много, разворачивать всё сразу
// означает бесконечную прокрутку в поисках нужной. Развёрнутость запоминается
// по id DOM-узла карточки (тот же id, что уже был у card-<вкладка>-<id> для
// jumpTo) - переживает перерисовку вкладки (renderX() перестраивает карточки
// заново при добавлении/удалении/перестановке сущности), но не переживает
// перезагрузку страницы (не save-critical state, как и filters/прокрутка).
const expandedCardIds = new Set();

// Оборачивает всё содержимое card, КРОМЕ ПЕРВОГО ребёнка (.card-head - везде,
// где вызывается эта функция, он добавляется в card первым), в .card-body и
// вешает кнопку-стрелку в начало head для сворачивания/разворачивания.
// Вызывается ПОСЛЕ того, как карточка уже полностью собрана (прямо перед
// добавлением в контейнер списка) - специально НЕ требует переписывать сам
// код сборки полей внутри renderX(), только одну строку в конце.
function makeCardCollapsible(card) {
  const head = card.firstElementChild;
  const bodyChildren = Array.from(card.children).slice(1);
  const body = el("div", { class: "card-body" });
  bodyChildren.forEach(c => body.appendChild(c));
  card.appendChild(body);

  const expanded = expandedCardIds.has(card.id);
  card.classList.toggle("collapsed", !expanded);
  const toggle = el("button", {
    class: "card-collapse-toggle", type: "button", text: expanded ? "▾" : "▸",
    title: expanded ? "Свернуть" : "Развернуть",
  });
  toggle.addEventListener("click", () => {
    const willExpand = card.classList.contains("collapsed");
    card.classList.toggle("collapsed", !willExpand);
    toggle.textContent = willExpand ? "▾" : "▸";
    toggle.title = willExpand ? "Свернуть" : "Развернуть";
    if (willExpand) expandedCardIds.add(card.id); else expandedCardIds.delete(card.id);
  });
  head.insertBefore(toggle, head.firstChild);
  return card;
}

// Матрица галочек тир x инструмент для requires_tool_tiers (см. game/engine.py -
// is_manual_action_unlocked): ЯВНЫЙ список отмеченных тиров на инструмент, а не порог
// "начиная с" (это специально другая семантика, чем у добычи required_tool/
// required_tier) - позволяет завести несколько вариантов одного и того же по смыслу
// действия, каждый доступный только на своих тирах. Инструмент, у которого не отмечен
// НИ ОДИН тир, вообще не попадает в requires_tool_tiers (ничего не ограничивает) -
// пустой список тиров запрещён валидатором, поэтому просто удаляем ключ целиком.
function requiresToolTiersEditor(container, action) {
  container.innerHTML = "";
  if (!action.requires_tool_tiers) action.requires_tool_tiers = {};
  Object.entries(DATA.tools).forEach(([toolId, tool]) => {
    const row = el("div", { class: "field-row" });
    row.appendChild(el("label", { text: tool.name }));
    const box = el("div", { class: "req-list" });
    tool.tiers.forEach((tier, i) => {
      const tierNum = i + 1;
      const cb = el("input", { type: "checkbox" });
      cb.checked = (action.requires_tool_tiers[toolId] || []).includes(tierNum);
      cb.addEventListener("change", () => {
        const list = action.requires_tool_tiers[toolId] || [];
        if (cb.checked) {
          if (!list.includes(tierNum)) list.push(tierNum);
        } else {
          const at = list.indexOf(tierNum);
          if (at !== -1) list.splice(at, 1);
        }
        if (list.length) action.requires_tool_tiers[toolId] = list.sort((a, b) => a - b);
        else delete action.requires_tool_tiers[toolId];
      });
      box.appendChild(el("label", {}, [cb, document.createTextNode(`${tierNum}. ${tier.name}`)]));
    });
    row.appendChild(box);
    container.appendChild(row);
  });
}

function toolTiersSummaryText(action) {
  const entries = Object.entries(action.requires_tool_tiers || {});
  if (!entries.length) return "не ограничено";
  return entries.map(([toolId, tiers]) => {
    const tool = DATA.tools[toolId];
    return `${tool ? tool.name : toolId}: ${tiers.join(",")}`;
  }).join("; ");
}

// Матрица галочек тир x инструмент живёт в отдельном окне (см. autocraft/energy_converter
// у построек выше) - на карточке действия остаётся только сводка + кнопка, чтобы список
// действий не разрастался матрицей на каждый инструмент в игре, даже когда она пуста.
// ---------- Крафт на сетке механизма (locations.*.crafting + manual_actions.*.pattern) ----------
//
// Граница "нужна модалка / не нужна" проходит по ДВУМ явным переключателям, а не
// выводится из сложности рецепта:
//   1) у ЛОКАЦИИ - галочка "Крафт-сетка": без неё локация работает как сейчас
//      (лес, шахта, охотничьи угодья - просто список карточек);
//   2) у ДЕЙСТВИЯ внутри такой локации - галочка "Крафтится на сетке": без неё
//      действие остаётся обычной карточкой рядом с сеточными рецептами (например,
//      плавка, которая тратит прочность молота).
// В данных обе галочки - это наличие самого поля (crafting / pattern), отдельного
// флага нет, поэтому рассинхронизироваться им негде.
//
// Узор хранится как "сетка символов + легенда" - тот же приём, что у пиксельных
// иконок: {"rows": ["AA.", "B..", "..."], "key": {"A": "ore", "B": "charcoal"}}.

function patternResourceIcon(rid) {
  const res = DATA.resources.find(r => r.id === rid);
  return (res && res.icon) || defaultResourceIcon(rid) || null;
}

function patternResourceName(rid) {
  return DATA.resources.find(r => r.id === rid)?.name || rid;
}

// withName=true подписывает НАЗВАНИЕМ ресурсы, у которых нет своей пиксельной
// иконки (и нет встроенной по умолчанию) - нужно в ячейке сетки, где другого
// текста рядом нет. Там, где имя уже написано рядом (палитра, строка цены),
// withName=false: иначе выходит "Мана Мана".
function patternIconEl(rid, size, withName = true) {
  const def = patternResourceIcon(rid);
  if (def) return pixelIcon(def.grid, def.palette, size);
  if (!withName) {
    return el("span", { style: `display:inline-block; flex:none; width:${size}px; height:${size}px; border:1px dashed var(--border); border-radius:3px;` });
  }
  return el("span", { class: "hint", style: `max-width:${size + 20}px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;`,
    text: patternResourceName(rid) });
}

function craftingGridRow(loc, lid) {

    renderManual(); // у действий этой локации меняется доступность узора

    + "игра открывает для неё модалку-верстак с сеткой такого размера (3×3 - верстак, 9×9 - ужасающий верстак, 2×1 - печь/мастерская). "
    + "Внутри такой локации каждое действие само решает, крафтится оно на сетке или остаётся обычной карточкой - см. «Крафт на сетке» у действия. "
    + "«Сборщик» - форма не важна: игрок кладёт в ячейки стопки, рецепт узнаётся по составу и количеству (ровно cost без энергии), "
    + "узоры не нужны, а все действия локации собираются в модалке. Постройки выбирают механизм полем «Где собирается»"
    + (lid === CONVERTER_LOCATION_ID

      : "") }));
  return row;
}

function patternToGrid(pattern, width, height) {
  const grid = [];
  for (let y = 0; y < height; y++) grid.push(new Array(width).fill(null));
  if (!pattern || !Array.isArray(pattern.rows)) return grid;
  const key = pattern.key || {};
  pattern.rows.forEach((rowStr, y) => {
    if (y >= height || typeof rowStr !== "string") return;
    for (let x = 0; x < Math.min(rowStr.length, width); x++) {
      const ch = rowStr[x];
      if (ch !== "." && key[ch]) grid[y][x] = key[ch];
    }
  });
  return grid;
}

const PATTERN_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

function gridToPattern(grid) {
  const ids = [];
  grid.forEach(row => row.forEach(cell => { if (cell && !ids.includes(cell)) ids.push(cell); }));
  if (!ids.length) return null;
  const charOf = {};
  const key = {};
  ids.forEach((id, i) => {
    const ch = PATTERN_ALPHABET[i] || PATTERN_ALPHABET[PATTERN_ALPHABET.length - 1];
    charOf[id] = ch;
    key[ch] = id;
  });
  return { rows: grid.map(row => row.map(cell => (cell ? charOf[cell] : ".")).join("")), key };
}

function patternCostOf(grid) {
  const cost = {};
  grid.forEach(row => row.forEach(cell => { if (cell) cost[cell] = (cost[cell] || 0) + 1; }));
  return cost;
}

function sameCost(a, b) {
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every(k => b[k] === a[k]);
}

// Цена БЕЗ энергии - именно её обязан повторять узор: энергию в ячейку не положить,
// она идёт в cost сверх узора и списывается при крафте (держать в паре с
// tools/content_validation.py: check_grid_pattern).
function itemCostOf(cost) {
  const out = {};
  Object.entries(cost || {}).forEach(([rid, n]) => { if (rid !== ENERGY_RESOURCE_ID) out[rid] = n; });
  return out;
}

// Узор рисуется и у ручного действия (сетка его локации, сверяется с cost), и у
// рецепта крафта за энергию (сетка преобразователя, сверяется с consumes) -
// opts говорит, чей он: {locationId, costField, isEnergy}.
function actionPatternOpts(action) {
  return { locationId: action.location || null, costField: "cost", isEnergy: false };
}

function energyRecipePatternOpts() {
  return { locationId: CONVERTER_LOCATION_ID, costField: "consumes", isEnergy: true };
}

// Постройка собирается в механизме своего buildings.*.location (вкладки «Построить»
// в игре нет): на сетке - узор над cost, в сборщике узор не нужен.
function buildingPatternOpts(building) {
  return { locationId: building.location || null, costField: "cost", isEnergy: false, isBuilding: true };
}

function patternSummaryText(action, opts) {
  opts = opts || actionPatternOpts(action);
  const loc = opts.locationId ? DATA.locations[opts.locationId] : null;
  if (!loc || !loc.crafting) {
    if (opts.isBuilding) return opts.locationId ? "у этой локации нет крафт-сетки" : "механизм не выбран";
    return opts.isEnergy ? "у преобразователя нет крафт-сетки" : "у локации нет крафт-сетки";
  }
  if (loc.crafting.stacks) {
    return action.pattern
      ? "сборщик: узор здесь лишний - сними галочку (ошибка валидации)"
      : "сборщик: узор не нужен - рецептом служит цена, игрок кладёт её стопками";
  }
  if (!action.pattern) {
    if (opts.isBuilding) return "узора нет - собрать постройку будет нельзя";
    return opts.isEnergy ? "узора нет - запустить руками нельзя" : "обычная карточка (модалка не нужна)";
  }
  const grid = patternToGrid(action.pattern, loc.crafting.width, loc.crafting.height);
  const cost = patternCostOf(grid);
  const cells = Object.values(cost).reduce((s, n) => s + n, 0);
  const mirror = action.pattern_mirror ? ", зеркальный" : "";
  const mismatch = sameCost(cost, itemCostOf(action[opts.costField])) ? "" : `, РАСХОДИТСЯ С ${opts.costField.toUpperCase()}`;
  const energy = (action[opts.costField] || {})[ENERGY_RESOURCE_ID];
  const energyText = energy ? `, +${energy} энергии` : "";
  return `${loc.crafting.width}×${loc.crafting.height}, занято ${cells}${energyText}${mirror}${mismatch}`;
}

function actionPatternRow(action, aid, opts, onChange) {
  opts = opts || actionPatternOpts(action);
  const row = el("div", { class: "field-row settings-summary-row" });
  row.appendChild(el("label", { text: "Крафт на сетке" }));
  const checkbox = el("input", { type: "checkbox" });
  const summary = el("span", { class: "hint", text: patternSummaryText(action, opts) });
  const editBtn = el("button", { class: "small", text: "Нарисовать узор" });

  // Локацию ручного действия (или механизм постройки) могли сменить в карточке -
  // opts пересобираем.
  const currentOpts = () => (opts.isEnergy ? opts : opts.isBuilding ? buildingPatternOpts(action) : actionPatternOpts(action));
  const refresh = () => {
    const current = currentOpts();
    const loc = current.locationId ? DATA.locations[current.locationId] : null;
    const crafting = loc && loc.crafting;
    // В сборщике узор не нужен - галочку можно только снять (если узор остался
    // от прежней локации), поставить нельзя.
    const stacks = !!(crafting && crafting.stacks);
    checkbox.disabled = !crafting || (stacks && !action.pattern);
    checkbox.checked = !!action.pattern;
    editBtn.disabled = !crafting || stacks || !action.pattern;
    summary.textContent = patternSummaryText(action, current);
    if (onChange) onChange();
  };

  checkbox.addEventListener("change", () => {
    if (checkbox.checked) {
      openPatternModal(action, aid, refresh, currentOpts());
    } else {
      delete action.pattern;
      delete action.pattern_mirror;
      refresh();
    }
  });
  editBtn.addEventListener("click", () => openPatternModal(action, aid, refresh, currentOpts()));

  row.append(checkbox, summary, editBtn);
  row.appendChild(el("span", { class: "hint", text: opts.isBuilding
    ? "узор = что игрок раскладывает на сетке механизма, чтобы поставить постройку; одна ячейка - одна единица cost "
      + "(обязаны совпадать), энергия - сверх узора. На сетке без узора постройку не собрать (ошибка валидации). "
      + "В сборщике узор не нужен - там рецептом служит цена. Многоэтапную постройку собирают только в сборщике"
    : opts.isEnergy
    ? "узор = что игрок раскладывает в слотах преобразователя, чтобы запустить этот рецепт; одна ячейка - одна единица "
      + "consumes (обязаны совпадать). Энергия в узор не входит - она копится по ходам до порога. Пока у преобразователя "
      + "есть крафт-сетка, рецепт без узора - ошибка валидации: запустить его руками было бы нельзя"
    : "галочка = действие выполняется ТОЛЬКО раскладыванием узора в модалке этого механизма. Без галочки действие остаётся "
      + "обычной карточкой, как сейчас (например, плавка, которая тратит прочность молота, или рубка дров). Галочка недоступна, "
      + "пока у локации действия не включена крафт-сетка" }));
  refresh();
  // Смена локации у действия меняет доступность узора (и его размер), поэтому
  // карточка дёргает этот refresh вручную - перерисовывать всю вкладку ради
  // одной строки было бы потерей прокрутки и фокуса.
  row._refresh = refresh;
  return row;
}

function openPatternModal(action, aid, onChange, opts) {
  opts = opts || actionPatternOpts(action);
  const costField = opts.costField;
  const loc = opts.locationId ? DATA.locations[opts.locationId] : null;
  const crafting = loc && loc.crafting;
  if (!crafting) {
    alert(opts.isEnergy
      ? "У локации «Преобразователь» не включена крафт-сетка - сначала включи её на вкладке «Локации»."
      : opts.isBuilding
      ? "Сначала выбери, где собирается постройка («Где собирается»), - механизм с крафт-сеткой."
      : "У локации этого действия не включена крафт-сетка - сначала включи её на вкладке «Локации».");
    onChange();
    return;
  }
  const width = crafting.width, height = crafting.height;
  const grid = patternToGrid(action.pattern, width, height);
  let selected = null; // id ресурса или null = ластик
  let query = "";

  const overlay = el("div", { class: "modal-overlay" });
  const close = () => {
    const pattern = gridToPattern(grid);
    if (pattern) {
      action.pattern = pattern;
    } else {
      // Пустую сетку не сохраняем: действие просто возвращается в обычные карточки,
      // иначе в content.json остался бы узор без единой занятой ячейки.
      delete action.pattern;
      delete action.pattern_mirror;
    }
    overlay.remove();
    onChange();
  };
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });

  const modal = el("div", { class: "modal settings-modal pattern-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: `Узор: ${action.name || aid}` }));
  head.appendChild(el("span", { class: "hint", text: `${loc.name} · сетка ${width}×${height}` }));
  head.appendChild(el("button", { text: "Готово", onclick: close }));
  modal.appendChild(head);

  const body = el("div", { class: "pattern-body" });
  const paletteSide = el("div", { class: "pattern-side" });
  const center = el("div", { class: "pattern-center" });
  const costSide = el("div", { class: "pattern-side" });
  body.append(paletteSide, center, costSide);
  modal.appendChild(body);

  const paletteBox = el("div", { class: "pattern-palette" });
  const gridBox = el("div", { class: "pattern-grid", style: `grid-template-columns: repeat(${width}, max-content);` });
  const costBox = el("div");

  function renderPalette() {
    paletteBox.innerHTML = "";
    DATA.resources
      .filter(r => r.id !== ENERGY_RESOURCE_ID) // в ячейку не кладётся - см. поле «Энергия за крафт»
      .filter(r => !query || r.name.toLowerCase().includes(query) || r.id.includes(query))
      .forEach(r => {
        const swatch = el("button", { class: "pattern-swatch" + (selected === r.id ? " selected" : ""), title: r.id });
        swatch.appendChild(patternIconEl(r.id, 22, false));
        swatch.appendChild(el("span", { class: "swatch-name", text: r.name }));
        swatch.addEventListener("click", () => { selected = r.id; renderAllPattern(); });
        paletteBox.appendChild(swatch);
      });
  }

  function renderGrid() {
    gridBox.innerHTML = "";
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const cell = grid[y][x];
        const btn = el("button", { class: "pattern-cell" + (cell ? " filled" : ""), title: cell ? patternResourceName(cell) : "пусто" });
        if (cell) btn.appendChild(patternIconEl(cell, Math.min(40, Math.floor(320 / Math.max(width, height)))));
        btn.addEventListener("click", () => {
          // Клик тем же ресурсом (или ластиком) стирает - иначе выбранную ячейку
          // нельзя было бы очистить, не переключаясь на ластик каждый раз.
          grid[y][x] = (!selected || cell === selected) ? null : selected;
          renderAllPattern();
        });
        gridBox.appendChild(btn);
      }
    }
  }

  function renderCost() {
    costBox.innerHTML = "";
    const cost = patternCostOf(grid);
    const ids = Object.keys(cost);
    costBox.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Цена по узору" })]));
    if (!ids.length) {
      costBox.appendChild(el("p", { class: "hint", text: opts.isEnergy
        ? "сетка пуста - при закрытии узор у рецепта будет убран"
        : opts.isBuilding
        ? "сетка пуста - при закрытии узор будет убран (собрать постройку на этой сетке станет нельзя)"
        : "сетка пуста - при закрытии действие вернётся в обычные карточки" }));
    } else {
      ids.forEach(rid => {
        const line = el("div", { class: "pattern-cost-row" });
        line.appendChild(patternIconEl(rid, 20, false));
        line.appendChild(el("span", { text: patternResourceName(rid) }));
        line.appendChild(el("span", { class: "amount", text: `×${cost[rid]}` }));
        costBox.appendChild(line);
      });
    }
    const current = itemCostOf(action[costField]);
    const matches = sameCost(cost, current);
    const note = el("div", { class: "pattern-note " + (matches ? "ok" : "err") });
    if (matches) {
      note.appendChild(el("div", { text: `${costField} ${opts.isEnergy ? "рецепта" : opts.isBuilding ? "постройки" : "действия"} совпадает с узором` }));
    } else {
      const currentText = Object.keys(current).length
        ? Object.entries(current).map(([rid, amt]) => `${patternResourceName(rid)} ×${amt}`).join(", ")
        : "пусто";
      note.appendChild(el("div", { text: `Сейчас в ${costField}: ${currentText}` }));
      note.appendChild(el("div", { class: "hint", text:
        "одна ячейка = одна единица ресурса, поэтому расхождение - ОШИБКА валидации, сохранить контент с ней не выйдет. "
        + `Либо перенеси узор в ${costField} кнопкой ниже, либо поправь сам узор` }));
      const syncBtn = el("button", { class: "small", text: `Записать узор в ${costField}` });
      syncBtn.addEventListener("click", () => {
        // На месте, а не новым объектом: редактор словаря в карточке держит
        // ссылку на этот же объект. Энергия - не из узора, её не трогаем.
        const target = action[costField] || (action[costField] = {});
        Object.keys(target).forEach(k => { if (k !== ENERGY_RESOURCE_ID) delete target[k]; });
        Object.assign(target, cost);
        renderAllPattern();
      });
      note.appendChild(syncBtn);
    }
    costBox.appendChild(note);

    if (!opts.isEnergy) {
      // Энергия в цене рецепта - СВЕРХ узора (в ячейку её не положить). Списывается
      // при крафте; апгрейд механизма energy_efficiency её уменьшает; при нехватке
      // крафт ждёт притока энергии, а не отказывает.
      const energyRow = el("div", { class: "field-row" });
      energyRow.appendChild(el("label", { text: "Энергия за крафт" }));
      const target = action[costField] || (action[costField] = {});
      const energyInput = el("input", { type: "number", min: "0", step: "any", style: "width:80px",
        value: target[ENERGY_RESOURCE_ID] || "", placeholder: "0" });
      energyInput.addEventListener("change", () => {
        const v = Number(energyInput.value);
        if (v > 0) target[ENERGY_RESOURCE_ID] = v; else delete target[ENERGY_RESOURCE_ID];
      });
      energyRow.appendChild(energyInput);
      costBox.appendChild(energyRow);
      costBox.appendChild(el("p", { class: "hint", text:
        "не кладётся в ячейку - списывается при каждом крафте сверх узора. Улучшение механизма «энергоэффективность» "
        + "её уменьшает. Если энергии не хватает, крафт встаёт в очередь и выполнится сам, когда она накопится" }));
    }

    const mirrorRow = el("div", { class: "field-row" });
    const mirrorCheckbox = el("input", { type: "checkbox" });
    mirrorCheckbox.checked = !!action.pattern_mirror;
    mirrorCheckbox.addEventListener("change", () => {
      if (mirrorCheckbox.checked) action.pattern_mirror = true; else delete action.pattern_mirror;
    });
    mirrorRow.append(mirrorCheckbox, el("label", { text: "Ловить зеркальный узор" }));
    costBox.appendChild(mirrorRow);
    costBox.appendChild(el("p", { class: "hint", text:
      "пустые края узора обрезаются перед сравнением, поэтому рисунок ловится в любом углу сетки, а рецепт верстака 3×3 "
      + "срабатывает и на большей сетке. Два рецепта одного механизма не могут иметь одинаковую форму - это ошибка валидации" }));
  }

  function renderAllPattern() {
    renderPalette();
    renderGrid();
    renderCost();
  }

  const searchInput = el("input", { type: "text", placeholder: "поиск ресурса…" });
  searchInput.addEventListener("input", () => { query = searchInput.value.trim().toLowerCase(); renderPalette(); });
  const eraserBtn = el("button", { class: "small", text: "Ластик" });
  eraserBtn.addEventListener("click", () => { selected = null; renderAllPattern(); });
  paletteSide.append(
    el("div", { class: "field-row" }, [el("label", { text: "Ресурсы" })]),
    searchInput,
    paletteBox,
    eraserBtn,
  );
  center.append(gridBox, el("p", { class: "hint", style: "text-align:center; max-width:320px;", text:
    "клик ставит выбранный ресурс, повторный клик по той же ячейке стирает" }));
  costSide.appendChild(costBox);

  renderAllPattern();
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

    "cost тратится, gain выдаётся при выполнении действия за 1 ход. Пустой cost = доступно бесплатно (например, обычный сбор)." }));

function renderLocations() {
  const root = document.getElementById("tab-locations");
  root.innerHTML = "";
  root.appendChild(el("p", { class: "hint", text:
    `Локации - места, куда игрок отправляется выбором (это не тратит ход - ход тратит выбор конкретного `
    + `действия внутри локации). Локация "${MINE_LOCATION_ID}" (Шахта) обязательна - к ней всегда привязаны `
    + `поиск и добыча жил (улучшение инструментов - отдельная, не привязанная ни к одной локации вкладка `
    + `игрового меню). Локация "${CONVERTER_LOCATION_ID}" (Преобразователь, обычно вложена в "Механизмы") `
    + `обязательна - в ней выбирается рецепт крафта за энергию для свободного преобразователя. Обе нельзя `
    + `удалить, но обычные действия внутри них (например, добычу камня) можно свободно редактировать и удалять. `
    + `Разведение видов (фермы) теперь отдельная модалка в игре ("Фермы" в шапке), не привязано ни к одной локации.` }));

  const cardsBox = el("div");
  const filterBar = makeFilterBar("locations", cardsBox);
  const addForm = idPromptAndAdd("локация", (id) => {
    DATA.locations[id] = { name: "Новая локация", requires_tech: null };

    renderMobs(); // и в locationSelect на вкладке «Мобы/Боссы» тоже
    jumpTo(`card-locations-${id}`, "locations", { focusName: true });
  });

  const locationIds = Object.keys(DATA.locations);
  locationIds.forEach((lid, i) => {
    const loc = DATA.locations[lid];
    const card = el("div", { class: "card", id: `card-locations-${lid}` });
    card.dataset.search = (lid + " " + loc.name).toLowerCase();
    const nameInput = el("input", { type: "text", value: loc.name });
    nameInput.addEventListener("change", () => { loc.name = nameInput.value; card.dataset.search = (lid + " " + loc.name).toLowerCase(); });
    const order = orderControls({
      index: i, count: locationIds.length,
      onMove: (delta) => { moveDictKeyInPlace(DATA.locations, lid, delta); renderLocations(); },
      kind: "локация",
      createDefault: () => ({ name: "Новая локация", requires_tech: null }),
      insertAfter: (id, value) => insertDictKeyAfterInPlace(DATA.locations, lid, id, value),
      jumpToNew: (id) => { renderLocations(); renderManual(); renderMobs(); jumpTo(`card-locations-${id}`, "locations", { focusName: true }); },
    });
    const head = [el("code", { text: lid }), nameInput, order, el("div", { class: "spacer" })];
    head.push(iconEditButton("Локация", loc, defaultLocationIcon(lid), () => renderLocations()));
    if (lid === MINE_LOCATION_ID || lid === CONVERTER_LOCATION_ID) {
      head.push(el("span", { class: "hint", text: "🔒 обязательная локация" }));
    } else {
      head.push(el("button", { class: "small danger", text: "Удалить", onclick: () => {
        delete DATA.locations[lid];
        renderLocations();
        renderManual();
        renderMobs();
      }}));
    }
    card.appendChild(el("div", { class: "card-head" }, head));

    const techRow = el("div", { class: "field-row" });
    techRow.appendChild(el("label", { text: "Нужна технология" }));
    techRow.appendChild(techSelect(loc.requires_tech, (v) => { loc.requires_tech = v; }));
    card.appendChild(techRow);

    const reqBuildingRow = el("div", { class: "field-row" });
    reqBuildingRow.appendChild(el("label", { text: "Нужна постройка" }));
    reqBuildingRow.appendChild(buildingRequirementSelect(loc.requires_building || null, (v) => { loc.requires_building = v; }));
    reqBuildingRow.appendChild(el("span", { class: "hint", text:
      "необязательно - локация видна, только пока работает хотя бы одна копия этой постройки (в дополнение к технологии, если она тоже указана). Так постройка-\"механизм\" без своих produces/consumes может открывать СВОЮ локацию с ручными действиями внутри. Все действия этой локации без собственной «Нужна постройка» наследуют эту: и проверку «постройка работает», и её улучшения (масштаб, энергоэффективность, ускорение многоходовых) - см. вкладку «Улучшения» постройки" }));
    card.appendChild(reqBuildingRow);

    const parentRow = el("div", { class: "field-row" });
    parentRow.appendChild(el("label", { text: "Родительская локация" }));
    parentRow.appendChild(locationSelect(loc.parent_location, (v) => { loc.parent_location = v; }, { allowNone: true, excludeId: lid }));
    parentRow.appendChild(el("span", { class: "hint", text: "— корень — = локация верхнего уровня. Внутри родительской локации эта появится как вложенная - полноценное дерево, можно вкладывать сколько угодно уровней" }));
    card.appendChild(parentRow);

    card.appendChild(craftingGridRow(loc, lid));

    const hubRow = el("div", { class: "field-row" });
    hubRow.appendChild(el("label", { text: "Кнопки построек-механизмов" }));
    const hubInput = el("input", { type: "checkbox" });
    hubInput.checked = !!loc.shows_building_mechanisms;
    hubInput.addEventListener("change", () => {
      if (hubInput.checked) loc.shows_building_mechanisms = true;
      else delete loc.shows_building_mechanisms;
    });
    hubRow.appendChild(hubInput);
    hubRow.appendChild(el("span", { class: "hint", text:
      "в этой локации появятся кнопки «Открыть: ...» для построенных автоматизаторов, синтезаторов душ, ритуальных кругов и реакторов (в дополнение к кнопкам на карточке постройки). Обычно - у «Механизмов». Локация с крафт-сеткой, в которой нет ничего, кроме сетки, и так показывается кнопкой в родительской локации, а не отдельной локацией" }));
    card.appendChild(hubRow);

    makeCardCollapsible(card);
    cardsBox.appendChild(card);
  });
  filterBar._apply();
}

// ---------- Постройки ----------

// Автокрафт (процессор: compute_power/autocraft_slots; сборщик: autocraft_assembler) и
// крафт из энергии (energy_converter) настраиваются НЕ инлайн в карточке постройки,
// а в отдельных всплывающих окнах (по образцу techSelect/openTechPicker) - это
// специфичные для одной подсистемы поля, нужные далеко не каждой постройке, и на
// карточке они уступают место карточке короткой сводке + кнопке "Настроить".
function autocraftSummaryText(b) {
  const parts = [];
  if (b.compute_power) parts.push(`мощность ${b.compute_power}`);
  if (b.autocraft_slots) parts.push(`слоты заказов +${b.autocraft_slots}`);
  if (b.autocraft_assembler) {
    const perTurn = b.autocraft_assembler.per_turn;
    parts.push(`сборщик «${assemblerTargetName(b.autocraft_assembler)}», ${perTurn == null ? "без лимита" : `${perTurn}/ход`}`);
  }
  return parts.length ? parts.join(", ") : "не участвует в автокрафте";
}

// Цель сборщика - ОДНО из полей: location (локация-механизм: верстак, печь,
// преобразователь...) или building (ритуальный алтарь - постройка с ritual_circle,
// своей локации у ритуалов нет). Держать в паре с content_validation.py.
function assemblerTargetValue(asm) {
  return "building" in asm ? `building:${asm.building}` : `location:${asm.location}`;
}
function assemblerTargetName(asm) {
  if ("building" in asm) {
    const b = DATA.buildings[asm.building];
    return b ? b.name : asm.building;
  }
  const loc = DATA.locations[asm.location];
  return loc ? loc.name : asm.location;
}
function assemblerTargetSelect(asm) {
  const entries = Object.entries(DATA.locations).map(([lid, l]) => ({ value: `location:${lid}`, label: l.name, id: lid }));
  Object.entries(DATA.buildings).forEach(([bid, bb]) => {
    if (bb.ritual_circle) entries.push({ value: `building:${bid}`, label: `Ритуалы: ${bb.name}`, id: bid });
  });
  return genericPickerSelect(entries, assemblerTargetValue(asm), (v) => {
    const sep = v.indexOf(":");
    const key = v.slice(0, sep), id = v.slice(sep + 1);
    const perTurn = asm.per_turn;  // пересобираем, чтобы в content.json цель шла первой
    delete asm.location;
    delete asm.building;
    delete asm.per_turn;
    asm[key] = id;
    asm.per_turn = perTurn;
  }, { title: "Выбрать механизм", placeholder: "— выбрать механизм —" });
}

function openAutocraftSettingsModal(b, onChange) {
  // Поля старого автокрафта (открытие по ресурсам и общая скорость) убраны из игры -
  // валидатор считает их ошибкой, здесь они просто стираются при открытии окна.
  delete b.unlocks_autocraft;
  delete b.autocraft_speed;
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  const modal = el("div", { class: "modal settings-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Настройки автокрафта" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: () => { overlay.remove(); onChange(); } }));
  modal.appendChild(head);

  modal.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Процессор - «мозг заказов»" })]));
  const computeRow = el("div", { class: "field-row" });
  computeRow.appendChild(el("label", { text: "Вычислительная мощность" }));
  const computeInput = el("input", { type: "number", min: "0", value: b.compute_power || 0 });
  computeInput.addEventListener("change", () => { b.compute_power = Number(computeInput.value) || 0; });
  computeRow.appendChild(computeInput);
  computeRow.appendChild(el("span", { class: "hint", text: "0 - обычная постройка; иначе это процессор. Суммарная мощность всех рабочих процессоров - максимальный размер ОДНОГО заказа автокрафта: сколько предметов съедят все его крафты (энергия не считается). Без процессоров заказов нет вовсе" }));
  modal.appendChild(computeRow);

  const slotsRow = el("div", { class: "field-row" });
  slotsRow.appendChild(el("label", { text: "Слоты заказов" }));
  const slotsInput = el("input", { type: "number", min: "0", value: b.autocraft_slots || 0 });
  slotsInput.addEventListener("change", () => { b.autocraft_slots = Number(slotsInput.value) || 0; });
  slotsRow.appendChild(slotsInput);
  slotsRow.appendChild(el("span", { class: "hint", text: "0 - обычная постройка. Сколько заказов автокрафта идёт одновременно - база 1 без единой такой постройки. Заказ, который только ждёт энергию, слот не занимает" }));
  modal.appendChild(slotsRow);

  modal.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Сборщик" })]));
  const asmRow = el("div", { class: "field-row" });
  const asmCheckbox = el("input", { type: "checkbox" });
  asmCheckbox.checked = !!b.autocraft_assembler;
  asmRow.appendChild(asmCheckbox);
  asmRow.appendChild(el("label", { text: "Эта постройка - сборщик" }));
  modal.appendChild(asmRow);
  const asmBox = el("div");
  modal.appendChild(asmBox);
  const renderAssembler = () => {
    asmBox.innerHTML = "";
    if (!b.autocraft_assembler) return;
    const locRow = el("div", { class: "field-row" });
    locRow.appendChild(el("label", { text: "Для какого механизма" }));
    locRow.appendChild(assemblerTargetSelect(b.autocraft_assembler));
    asmBox.appendChild(locRow);
    const perRow = el("div", { class: "field-row" });
    perRow.appendChild(el("label", { text: "Крафтов (ритуалов) за ход на копию" }));
    const unlimited = el("input", { type: "checkbox" });
    unlimited.checked = b.autocraft_assembler.per_turn == null;
    const perInput = el("input", { type: "number", min: "1", step: "1", style: "width:70px",
      value: b.autocraft_assembler.per_turn == null ? 1 : b.autocraft_assembler.per_turn });
    perInput.disabled = unlimited.checked;
    perInput.addEventListener("change", () => {
      b.autocraft_assembler.per_turn = Math.max(1, Math.floor(Number(perInput.value) || 1));
      perInput.value = b.autocraft_assembler.per_turn;
    });
    unlimited.addEventListener("change", () => {
      b.autocraft_assembler.per_turn = unlimited.checked ? null : Math.max(1, Math.floor(Number(perInput.value) || 1));
      perInput.disabled = unlimited.checked;
    });
    perRow.append(perInput, unlimited, el("span", { text: "без лимита" }));
    asmBox.appendChild(perRow);
  };
  asmCheckbox.addEventListener("change", () => {
    if (asmCheckbox.checked) {
      const firstMechanism = Object.keys(DATA.locations).find(lid => DATA.locations[lid].crafting) || Object.keys(DATA.locations)[0];
      b.autocraft_assembler = { location: firstMechanism, per_turn: 1 };
    } else {
      delete b.autocraft_assembler;
    }
    renderAssembler();
  });
  renderAssembler();
  modal.appendChild(el("p", { class: "hint", text:
    "Сборщик делает для заказов автокрафта рецепты выбранного механизма (любой локации: верстак, печь, преобразователь...) МГНОВЕННО, "
    + "какой бы долгий ни был рецепт. Лимит - сколько крафтов за ход даёт каждая копия (32 сборщика по 1 = 32 крафта за ход); "
    + "«без лимита» - любое число за ход. Второй способ автоматизировать механизм - улучшение «Автоматизация» (type autocraft) "
    + "у постройки механизма: как игрок у механизма, 1 крафт за ход с длительностью рецепта. "

    slotsRow.appendChild(el("span", { class: "hint", text: "умножается на число РАБОЧИХ копий этой постройки, плюс бонус от апгрейдов типа «Слоты автоматизатора»" }));
    body.appendChild(slotsRow);
  };
  renderBody();
  modal.appendChild(body);

  enabled.addEventListener("change", () => {
    if (enabled.checked) b.automation_hub = { slots: 1 };

  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

// Свободные теги ролей реактора (resources.*.reactor_component.role), уже
// встречающиеся хоть у одного ресурса - тот же приём, что soulKindInput, только
// собирает МНОЖЕСТВО отмеченных ролей (accepts_roles - список), а не одну строку.
function knownReactorRoles() {
  const roles = new Set();
  (DATA.resources || []).forEach(r => { if (r.reactor_component && r.reactor_component.role) roles.add(r.reactor_component.role); });
  return [...roles].sort();
}

function reactorSummaryText(b) {
  if (!b.reactor) return "не реактор";
  const r = b.reactor;
  return `${r.grid_width || 3}×${r.grid_height || 3}, зон по умолчанию: ${r.zones_default || 1}, роли: ${(r.accepts_roles || []).join(", ") || "—"}`;
}

      ["reflector_adjacency_output_mult_step", "Множитель выхода за соседний reflector (перемножается с другими reflector)"],
      ["reflector_adjacency_heat_mult_step", "Множитель ТЕПЛА за соседний reflector (0 = отражатель бесплатный, и тогда его всегда выгодно ставить максимум)"],

      ["control_rod_heat_damp_exponent", "Во сколько раз сильнее рычаг душит ТЕПЛО, чем выход (степень): 1 = одинаково (глубина бесполезна), больше 1 = погружение улучшает отношение тепла к выходу и становится предметом выбора"],
      ["catalyst_malus_radius", "Радиус (Чебышёва) окна, в котором катализатор штрафует чужие ячейки: 0 = только 4 ортогональные, 1 = весь квадрат 3x3 вместе с диагоналями"],
      ["thermal_shock_flow_delta_pct", "Термоудар: порог скачка потока охлаждения (пп, 0-100)"],
      ["thermal_shock_heat_bonus_pct", "Термоудар: добавка тепла (доля ёмкости зоны, 0..1)"],
    ].forEach(([field, label]) => {

function enchantingTableSummaryText(b) {
  if (!b.enchanting_table) return "не стол зачарований";
  const cost = Object.entries(b.enchanting_table.cost || {});
  const costText = cost.length
    ? "цена попытки: " + cost.map(([rid, amt]) => `${amt}× ${DATA.resources.find(r => r.id === rid)?.name || rid}`).join(", ")
    : "цена попытки не задана";
  const strip = b.enchanting_table.strip_on_fail !== false;
  return `${costText}, провал ${strip ? "снимает все чары" : "щадящий"}`;
}

function upgradesSummaryText(b) {
  const n = (b.upgrades || []).length;
  return n ? `Улучшений: ${n}` : "нет улучшений";
}

function promptNewUpgradeId(b) {
  const id = prompt("id улучшения (латиница, snake_case, например sawmill_scale_2):");
  if (!id) return null;
  if (!/^[a-z][a-z0-9_]*$/.test(id)) {
    alert("id должен быть в snake_case: строчные латинские буквы, цифры, подчёркивания, начинается с буквы.");
    return null;
  }
  if ((b.upgrades || []).some(u => u.id === id)) {
    alert(`У этой постройки уже есть улучшение с id "${id}".`);
    return null;
  }
  return id;
}

// Для массового добавления улучшений из шаблона (в отличие от promptNewUpgradeId,
// который используется при ручном добавлении ОДНОГО улучшения) - id из шаблона мог
// уже встретиться у ЭТОЙ постройки (тот же шаблон применили дважды, или у неё уже
// было одноимённое улучшение), тогда просто подбираем следующий свободный "_2"/"_3".
function uniqueUpgradeId(b, baseId) {
  if (!(b.upgrades || []).some(u => u.id === baseId)) return baseId;
  let n = 2;
  while ((b.upgrades || []).some(u => u.id === `${baseId}_${n}`)) n++;
  return `${baseId}_${n}`;
}

function openBuildingUpgradesEditorModal(b, onChange) {
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) { overlay.remove(); onChange(); } });
  const modal = el("div", { class: "modal settings-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Улучшения постройки" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: () => { overlay.remove(); onChange(); } }));
  modal.appendChild(head);

  modal.appendChild(el("p", { class: "hint", text:
    "Действует сразу на ВСЕ копии этой постройки (как эффект технологии), но покупается напрямую в "
    + "каталоге строительства, а не через дерево технологий. Среди купленных улучшений ОДНОГО типа "
    + "у одной постройки действует только САМОЕ СИЛЬНОЕ (не перемножаются и не складываются) - см. "
    + "подсказку у поля \"Значение\" ниже про прогрессии вида \"1:1 -> 2:2 -> 3:3\". ПОРЯДОК В ЭТОМ "
    + "СПИСКЕ ВАЖЕН: следующее улучшение ТОГО ЖЕ ТИПА нельзя купить в игре, пока не куплено "
    + "предыдущее (по позиции здесь, а не по value) - при добавлении новых уровней прогрессии "
    + "используйте \"+ добавить улучшение\" (кладёт в конец списка), а не переставляйте уже "
    + "существующие задним числом, это незаметно поменяет, какое улучшение от какого зависит." }));

  if (!Array.isArray(b.upgrades)) b.upgrades = [];
  const listBox = el("div", { class: "stages-box" });
  function renderList() {
    listBox.innerHTML = "";
    b.upgrades.forEach((u, i) => {
      const card = el("div", { class: "stage-card" });
      const nameInput = el("input", { type: "text", value: u.name || "" });
      nameInput.addEventListener("change", () => { u.name = nameInput.value; });
      const rm = el("button", { class: "small danger", text: "Удалить", onclick: () => {
        b.upgrades.splice(i, 1);
        renderList();
      }});
      card.appendChild(el("div", { class: "stage-head" }, [el("code", { text: u.id }), nameInput, el("div", { class: "spacer" }), rm]));

      const descRow = el("div", { class: "field-row" });
      descRow.appendChild(el("label", { text: "Описание" }));
      descRow.appendChild(descriptionTextarea(u.description, "Что даёт игроку это улучшение", (v) => { u.description = v; }));
      card.appendChild(descRow);

      const typeRow = el("div", { class: "field-row" });
      typeRow.appendChild(el("label", { text: "Тип" }));
      const typeSelect = el("select", {});
      UPGRADE_TYPE_OPTIONS.forEach(([value, label]) => {
        const o = el("option", { value, text: label });
        if (u.type === value) o.selected = true;
        typeSelect.appendChild(o);
      });
      typeSelect.addEventListener("change", () => { u.type = typeSelect.value; renderList(); });
      typeRow.appendChild(typeSelect);
      card.appendChild(typeRow);

      const valueRow = el("div", { class: "field-row" });
      valueRow.appendChild(el("label", { text: "Значение" }));
      if (u.type === "environment_emulation") {
        // value - id аллели среды (строка), не число - см. UPGRADE_TYPE_HINTS.
        const valueSelect = el("select", {});
        ENVIRONMENT_ALLELE_IDS.forEach(aid => {
          const o = el("option", { value: aid, text: ENVIRONMENT_ALLELE_NAMES[aid] || aid });
          if (u.value === aid) o.selected = true;
          valueSelect.appendChild(o);
        });
        if (!ENVIRONMENT_ALLELE_IDS.includes(u.value)) u.value = ENVIRONMENT_ALLELE_IDS[0];
        valueSelect.addEventListener("change", () => { u.value = valueSelect.value; });
        valueRow.appendChild(valueSelect);
      } else if (u.type === "reactor_grid_size") {
        // value - объект {width, height}, не число - см. UPGRADE_TYPE_HINTS.
        if (!u.value || typeof u.value !== "object") u.value = { width: 4, height: 4 };
        const widthInput = el("input", { type: "number", min: "1", value: u.value.width || 4, style: "width:70px" });
        widthInput.addEventListener("change", () => { u.value.width = parseInt(widthInput.value, 10) || 1; });
        const heightInput = el("input", { type: "number", min: "1", value: u.value.height || 4, style: "width:70px" });
        heightInput.addEventListener("change", () => { u.value.height = parseInt(heightInput.value, 10) || 1; });
        valueRow.appendChild(el("span", { text: "ширина:" }));
        valueRow.appendChild(widthInput);
        valueRow.appendChild(el("span", { text: "высота:" }));
        valueRow.appendChild(heightInput);
      } else if (u.type === "reactor_telemetry") {
        // Как breakdown_immunity/breeding_immortality - куплено/не куплено, но тут
        // это буквально true, а не произвольное положительное число.
        u.value = true;
        valueRow.appendChild(el("span", { class: "hint", text: "(включено/выключено покупкой - значение не используется)" }));
      } else {
        const valueInput = el("input", { type: "number", step: "any", value: u.value != null ? u.value : "" });
        valueInput.addEventListener("change", () => { u.value = Number(valueInput.value) || 0; });
        valueRow.appendChild(valueInput);
      }
      valueRow.appendChild(el("span", { class: "hint", text: UPGRADE_TYPE_HINTS[u.type] || "" }));
      card.appendChild(valueRow);

      const techRow = el("div", { class: "field-row" });
      techRow.appendChild(el("label", { text: "Нужна технология" }));
      techRow.appendChild(techSelect(u.requires_tech, (v) => { u.requires_tech = v; }));
      card.appendChild(techRow);

      card.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Цена улучшения" })]));
      if (!u.cost) u.cost = {};
      const costBox = el("div", { class: "dict-editor" });
      renderDictEditor(costBox, u.cost);
      card.appendChild(costBox);

      // repeatable - улучшение можно купить НЕСКОЛЬКО РАЗ подряд, каждая покупка
      // добавляет ЕЩЁ ОДНО value (см. game/engine.py:_purchased_upgrade_value), а
      // цена растёт геометрически (cost_growth в степени "сколько раз уже куплено",
      // см. repeatable_upgrade_cost) - одна запись тем самым заменяет N вручную
      // прописанных дискретных тиров. Годится для ЛЮБОГО типа, не только *_slots -
      // но не для environment_emulation (взаимоисключающий выбор, не накопление).
      const repeatRow = el("div", { class: "field-row" });
      const repeatCheck = el("input", { type: "checkbox" });
      repeatCheck.checked = !!u.repeatable;
      repeatRow.appendChild(repeatCheck);
      repeatRow.appendChild(el("label", { text: "Повторяемое (repeatable)" }));
      repeatRow.appendChild(el("span", { class: "hint", text: "можно покупать многократно подряд - каждая покупка добавляет ещё +value, цена растёт (cost_growth ниже)" }));
      card.appendChild(repeatRow);

      const repeatBody = el("div");
      const renderRepeatBody = () => {
        repeatBody.innerHTML = "";
        if (!u.repeatable) return;
        const growthRow = el("div", { class: "field-row" });
        growthRow.appendChild(el("label", { text: "Рост цены за покупку (×)" }));
        const growthInput = el("input", { type: "number", min: "1.01", step: "0.05", value: u.cost_growth ?? 1.3 });
        growthInput.addEventListener("change", () => { u.cost_growth = Number(growthInput.value) || 1.3; });
        growthRow.appendChild(growthInput);
        growthRow.appendChild(el("span", { class: "hint", text: "должно быть больше 1 - иначе цена не растёт со следующими покупками. Пример: 1.5 = +50% к цене за каждую следующую покупку" }));
        repeatBody.appendChild(growthRow);

        const maxRow = el("div", { class: "field-row" });
        maxRow.appendChild(el("label", { text: "Максимум покупок" }));
        const maxInput = el("input", { type: "number", min: "1", value: u.max_purchases ?? "", placeholder: "без ограничения" });
        maxInput.addEventListener("change", () => {
          const v = Number(maxInput.value);
          if (v > 0) u.max_purchases = v; else delete u.max_purchases;
        });
        maxRow.appendChild(maxInput);
        maxRow.appendChild(el("span", { class: "hint", text: "пусто - можно покупать бесконечно" }));
        repeatBody.appendChild(maxRow);
      };
      renderRepeatBody();
      card.appendChild(repeatBody);

      repeatCheck.addEventListener("change", () => {
        if (repeatCheck.checked) {
          u.repeatable = true;
          if (u.cost_growth == null) u.cost_growth = 1.3;
        } else {
          delete u.repeatable;
          delete u.cost_growth;
          delete u.max_purchases;
        }
        renderRepeatBody();
      });

      listBox.appendChild(card);
    });
  }
  renderList();
  modal.appendChild(listBox);

  const addBtn = el("button", { class: "small", text: "+ добавить улучшение", onclick: () => {
    const id = promptNewUpgradeId(b);
    if (!id) return;
    b.upgrades.push({ id, name: "Новое улучшение", description: "", type: "scale", value: 2, requires_tech: null, cost: {} });
    renderList();
  }});
  const templateBtns = templateListButtons("building_upgrade", "улучшения построек", () => b.upgrades, (items) => {
    items.forEach(item => { item.id = uniqueUpgradeId(b, item.id); b.upgrades.push(item); });
    renderList();
  });
  modal.appendChild(el("div", { class: "tab-toolbar" }, [addBtn, ...templateBtns]));

  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

// Куда по умолчанию ставить новую постройку - первый сборщик (там узор не нужен, её
// сразу можно собрать); сборщика нет - нигде (карточка покажет предупреждение).
function defaultBuildingLocation() {
  const found = Object.entries(DATA.locations).find(([, l]) => l.crafting && l.crafting.stacks);
  return found ? found[0] : undefined;
}

function renderBuildings() {
  const root = document.getElementById("tab-buildings");
  root.innerHTML = "";
  root.appendChild(el("p", { class: "hint", text:
    "produces/consumes применяются автоматически каждый ход за каждую рабочую копию. breakdown_chance - шанс поломки одной копии за ход (0..1)." }));

  const cardsBox = el("div");
  const filterBar = makeFilterBar("buildings", cardsBox);
  const addForm = idPromptAndAdd("постройка", (id) => {
    DATA.buildings[id] = { name: "Новая постройка", description: "", requires_tech: null, location: defaultBuildingLocation(), cost: {}, produces: {}, consumes: {}, breakdown_chance: 0.02, repair_cost: {}, icon_label: id.slice(0, 2).toUpperCase() };
    jumpTo(`card-buildings-${id}`, "buildings", { focusName: true });
  });
  root.appendChild(makeToolbar(addForm, filterBar));
  root.appendChild(cardsBox);

  const buildingIds = Object.keys(DATA.buildings);
  buildingIds.forEach((bid, i) => {
    const b = DATA.buildings[bid];
    const card = el("div", { class: "card", id: `card-buildings-${bid}` });
    card.dataset.search = (bid + " " + b.name).toLowerCase();
    const nameInput = el("input", { type: "text", value: b.name });
    nameInput.addEventListener("change", () => { b.name = nameInput.value; card.dataset.search = (bid + " " + b.name).toLowerCase(); });
    const order = orderControls({
      index: i, count: buildingIds.length,
      onMove: (delta) => { moveDictKeyInPlace(DATA.buildings, bid, delta); renderBuildings(); },
      kind: "постройка",
      createDefault: (id) => ({ name: "Новая постройка", description: "", requires_tech: null, location: defaultBuildingLocation(), cost: {}, produces: {}, consumes: {}, breakdown_chance: 0.02, repair_cost: {}, icon_label: id.slice(0, 2).toUpperCase() }),
      insertAfter: (id, value) => insertDictKeyAfterInPlace(DATA.buildings, bid, id, value),
      jumpToNew: (id) => { renderBuildings(); jumpTo(`card-buildings-${id}`, "buildings", { focusName: true }); },
    });
    const rm = el("button", { class: "small danger", text: "Удалить", onclick: () => {
      delete DATA.buildings[bid];
      renderBuildings();
    }});
    const iconBtn = iconEditButton(b.name, b, defaultBuildingIcon(), () => {});
    card.appendChild(el("div", { class: "card-head" }, [el("code", { text: bid }), iconBtn, nameInput, order, el("div", { class: "spacer" }), rm]));

    const descRow = el("div", { class: "field-row" });
    descRow.appendChild(el("label", { text: "Описание" }));
    descRow.appendChild(descriptionTextarea(b.description, "Зачем нужна эта постройка - что она даёт игроку", (v) => { b.description = v; }));
    descRow.appendChild(el("span", { class: "hint", text: "показывается игроку на карточке построенной копии - обязательное поле" }));
    card.appendChild(descRow);

    const techRow = el("div", { class: "field-row" });
    techRow.appendChild(el("label", { text: "Нужна технология" }));
    techRow.appendChild(techSelect(b.requires_tech, (v) => { b.requires_tech = v; }));
    card.appendChild(techRow);

    const reqBuildingRow = el("div", { class: "field-row" });
