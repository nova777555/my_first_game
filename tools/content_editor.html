// Зум колесом мыши для графов технологий/квестов - вокруг точки под курсором,
// а не вокруг фиксированного (0,0), как в игровых модалках web_ui.html:
// enableGraphZoom. Устройство графа здесь другое: #techGraph/#questGraph - ОДИН
// div на узлы И svg рёбер разом (общая система координат абсолютных left/top,
// см. nodeRect/questNodeRect), поэтому масштабируется CSS-transform'ом он
// целиком - в отличие от web_ui.html, где рёбра рисует отдельный НЕскейлящийся
// svg, перерисовываемый после каждого шага зума через getBoundingClientRect.
// Здесь рёбра сами остаются на месте относительно узлов без отдельного redraw.
// Оборотная сторона: getBoundingClientRect/clientX-clientY внутри
// перетаскивания узлов и связей возвращают уже отмасштабированные экранные
// пиксели - их нужно делить на текущий zoom, чтобы получить те же единицы, что
// style.left/top и координаты svg (см. updateDragLine/onNodeDragMove/
// centerQuestGraphView и их quest-аналоги - все они делают эту поправку).
const GRAPH_ZOOM_MIN = 0.4;
const GRAPH_ZOOM_MAX = 2.5;
const GRAPH_ZOOM_STEP = 1.12;
let techGraphZoom = { value: 1 };
let questGraphZoom = { value: 1 };

function applyGraphZoomEditor(graphEl, zoom) {
  graphEl.style.transform = `scale(${zoom})`;
}

// zoomState - объект-обёртка {value}, а не голое число: renderTechs()/
// renderQuests() пересобирают DOM графа с нуля при каждом действии, пока
// вкладка открыта - обёртка живёт СНАРУЖИ рендер-функции (как selectedTechNode)
// и переживает эту пересборку, поэтому зум не сбрасывается на 1 при любом
// клике/перетаскивании узла.
function enableGraphZoomEditor(scrollEl, graphEl, zoomState) {
  applyGraphZoomEditor(graphEl, zoomState.value);
  scrollEl.addEventListener("wheel", (e) => {
    e.preventDefault(); // колесо теперь целиком отдано зуму, не скроллу графа
    const rect = scrollEl.getBoundingClientRect();
    const offsetX = e.clientX - rect.left;
    const offsetY = e.clientY - rect.top;
    const oldZoom = zoomState.value;
    const contentX = (scrollEl.scrollLeft + offsetX) / oldZoom;
    const contentY = (scrollEl.scrollTop + offsetY) / oldZoom;
    const factor = e.deltaY < 0 ? GRAPH_ZOOM_STEP : 1 / GRAPH_ZOOM_STEP;
    const newZoom = Math.min(GRAPH_ZOOM_MAX, Math.max(GRAPH_ZOOM_MIN, oldZoom * factor));
    if (newZoom === oldZoom) return;
    zoomState.value = newZoom;
    applyGraphZoomEditor(graphEl, newZoom);
    scrollEl.scrollLeft = contentX * newZoom - offsetX;
    scrollEl.scrollTop = contentY * newZoom - offsetY;
  }, { passive: false });
}

function techTierOf(id) {
  return DATA.techs[id]?.tier || 1;
}

// Столбец графа - это НЕ тир целиком (было так, но зависимости ВНУТРИ тира,
// толпящиеся в одном столбце, тяжело отследить визуально): тир теперь может
// занимать НЕСКОЛЬКО столбцов подряд - по одному на каждый уровень глубины СРЕДИ
// ЗАВИСИМОСТЕЙ ВНУТРИ ЭТОГО ЖЕ ТИРА (requires на технологию из ДРУГОГО тира не
// увеличивает эту локальную глубину - такая зависимость рисуется обычной, пусть
// и более длинной, кривой к более ранней колонке). Инвариант всё равно держится:
// столбец принадлежит РОВНО одному тиру - тиры просто получают по несколько
// столбцов подряд вместо одного, и между ними по-прежнему можно провести
// вертикальную разделительную линию (граница между .tech-tier-band).
function computeTechLocalLevels() {
  const localLevel = {};
  function levelOf(id, stack) {
    if (localLevel[id] !== undefined) return localLevel[id];
    if (stack.has(id)) return 0; // цикл в данных - не должно происходить, но не зависаем
    stack.add(id);
    const t = DATA.techs[id];
    const tier = techTierOf(id);
    const sameTierReqs = (t.requires || []).filter(r => DATA.techs[r] && techTierOf(r) === tier);
    localLevel[id] = sameTierReqs.length ? 1 + Math.max(...sameTierReqs.map(r => levelOf(r, stack))) : 0;
    return localLevel[id];
  }
  Object.keys(DATA.techs).forEach(id => levelOf(id, new Set()));
  return localLevel;
}

// Технологии без своей сохранённой позиции (pos) раскладываются по столбцам
// автоматически (столбец = смещение блока тира + локальный уровень внутри тира,
// см. computeTechLocalLevels). Как только узел перетащили мышью, его позиция
// фиксируется в t.pos и дальше он больше не переезжает сам (в т.ч. может
// визуально оказаться вне "своего" фона зоны тира - это осознанный компромисс
// ручного оверрайда, а не баг).
function computeTechPositions() {
  const localLevel = computeTechLocalLevels();
  const tiers = [...new Set(Object.keys(DATA.techs).map(techTierOf))].sort((a, b) => a - b);

  const byCol = {};
  const tierColRange = {};
  let offset = 0;
  tiers.forEach(tier => {
    const idsInTier = Object.keys(DATA.techs).filter(id => techTierOf(id) === tier);
    const width = 1 + Math.max(0, ...idsInTier.map(id => localLevel[id]));
    idsInTier.forEach(id => {
      const col = offset + localLevel[id];
      (byCol[col] = byCol[col] || []).push(id);
    });
    tierColRange[tier] = { startCol: offset, endCol: offset + width - 1 };
    offset += width;
  });
  Object.values(byCol).forEach(list => list.sort((a, b) => DATA.techs[a].name.localeCompare(DATA.techs[b].name, "ru")));

  const maxCol = Math.max(0, offset - 1);
  let maxAutoRows = 0;
  const positions = {};
  for (let col = 0; col <= maxCol; col++) {
    const list = byCol[col] || [];
    let row = 0;
    list.forEach(id => {
      const t = DATA.techs[id];
      if (t.pos) {
        positions[id] = { x: t.pos.x, y: t.pos.y, w: TECH_NODE_W, h: TECH_NODE_H };
      } else {
        positions[id] = {
          x: TECH_PAD + col * (TECH_NODE_W + TECH_COL_GAP),
          y: TECH_PAD + row * (TECH_NODE_H + TECH_ROW_GAP),
          w: TECH_NODE_W,
          h: TECH_NODE_H,
        };
        row++;
      }
    });
    maxAutoRows = Math.max(maxAutoRows, row);
  }
  let width = TECH_PAD * 2 + (maxCol + 1) * TECH_NODE_W + maxCol * TECH_COL_GAP;
  let height = TECH_PAD * 2 + maxAutoRows * TECH_NODE_H + Math.max(0, maxAutoRows - 1) * TECH_ROW_GAP;
  Object.values(positions).forEach(p => {
    width = Math.max(width, p.x + p.w + TECH_PAD);
    height = Math.max(height, p.y + p.h + TECH_PAD);
  });
  return { positions, width: Math.max(width, 400), height: Math.max(height, 200), tierColRange, tiers };
}

function edgePathD(x1, y1, x2, y2) {
  const dx = Math.max(30, Math.abs(x2 - x1) / 2);
  return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
}

function dependsOn(techId, targetId, visited) {
  if (visited.has(techId)) return false;
  visited.add(techId);
  const reqs = (DATA.techs[techId] || {}).requires || [];
  if (reqs.includes(targetId)) return true;
  return reqs.some(r => dependsOn(r, targetId, visited));
}

// Добавление ребра fromId -> toId (toId.requires получит fromId) создаёт цикл, если
// fromId уже (прямо или косвенно) зависит от toId.
function wouldCreateCycle(fromId, toId) {
  if (fromId === toId) return true;
  return dependsOn(fromId, toId, new Set());
}

function renderTechGraphView(root) {

    selectedTechNode = id;
    // Узлы графа не редактируются inline (только перетаскивание/связи) - настоящие
    // поля (название, описание, цена) живут в карточке списка, поэтому сразу туда.
    jumpToTechCard(id, { focusName: true });
  });
  const resetBtn = el("button", { text: "Сбросить расположение", onclick: () => {
    Object.values(DATA.techs).forEach(t => { delete t.pos; });
    renderTechs();
  }});
  addForm.appendChild(resetBtn);
  const toolbar = el("div", { class: "tab-toolbar" }, [addForm]);
  root.appendChild(toolbar);

  root.appendChild(el("p", { class: "hint", text:
    "Перетаскивай узел за тело карточки, чтобы разместить его где угодно в графе - позиция запоминается. " +
    "Тяни за оранжевый кружок справа от узла к другому узлу - появится зависимость (узел-источник станет условием для узла-цели). " +
    "Клик по линии удаляет связь. Клик по узлу (без перетаскивания) подсвечивает его связи. Двойной клик открывает карточку в списке для полного редактирования." }));

  if (!Object.keys(DATA.techs).length) {
    root.appendChild(el("p", { class: "hint", text: "Технологий пока нет - добавь их кнопкой выше." }));
    return;
  }

  const { positions, width, height, tierColRange, tiers } = computeTechPositions();

  const scroll = el("div", { class: "graph-scroll graph-scroll-tab" });
  const graph = el("div", { class: "tech-graph", id: "techGraph" });
  graph.style.width = width + "px";
  graph.style.height = height + "px";

  // Фоновые зоны тиров - чисто ориентир для авторасстановки (см. computeTechPositions):
  // узел, перетащенный вручную (t.pos), может визуально оказаться в чужой зоне -
  // это не баг, просто зоны не пытаются подстроиться под ручной оверрайд. Тир
  // теперь может занимать НЕСКОЛЬКО столбцов подряд (tierColRange[tier].startCol..
  // endCol) - зона просто растягивается на всю их ширину.
  tiers.forEach((tier, idx) => {
    const { startCol, endCol } = tierColRange[tier];
    const colStartX = TECH_PAD + startCol * (TECH_NODE_W + TECH_COL_GAP);
    const colEndX = TECH_PAD + endCol * (TECH_NODE_W + TECH_COL_GAP) + TECH_NODE_W;
    const left = idx === 0 ? 0 : colStartX - TECH_COL_GAP / 2;
    const right = idx === tiers.length - 1 ? width : colEndX + TECH_COL_GAP / 2;
    const palette = tierBandColorEditor(tier);
    const band = el("div", { class: "tech-tier-band" });
    band.style.left = left + "px";
    band.style.width = (right - left) + "px";
    band.style.height = height + "px";
    band.style.background = palette.bg;
    band.style.border = `1px solid ${palette.border}`;
    graph.appendChild(band);
    const label = el("div", { class: "tech-tier-band-label", text: `Тир ${tier}` });
    label.style.left = left + "px";
    label.style.width = (right - left) + "px";
    label.style.color = palette.text;
    graph.appendChild(label);
  });

  const svg = svgEl("svg", { class: "tech-graph-svg", width, height });
  const defs = svgEl("defs");
  const marker = svgEl("marker", {
    id: "arrowhead", viewBox: "0 0 10 10", refX: "9", refY: "5",
    markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse",
  });
  marker.appendChild(svgEl("path", { d: "M 0 0 L 10 5 L 0 10 z" }));
  defs.appendChild(marker);
  svg.appendChild(defs);

  Object.entries(DATA.techs).forEach(([tid, t]) => {
    (t.requires || []).forEach(reqId => {
      const p1 = positions[reqId], p2 = positions[tid];
      if (!p1 || !p2) return;
      const x1 = p1.x + p1.w, y1 = p1.y + p1.h / 2;
      const x2 = p2.x, y2 = p2.y + p2.h / 2;
      const d = edgePathD(x1, y1, x2, y2);

      const visible = svgEl("path", { d, class: "tech-edge" });
      visible.setAttribute("marker-end", "url(#arrowhead)");
      visible.dataset.from = reqId;
      visible.dataset.to = tid;

      const hit = svgEl("path", { d, class: "tech-edge-hit" });
      hit.dataset.from = reqId;
      hit.dataset.to = tid;
      hit.addEventListener("click", () => {
        t.requires = t.requires.filter(x => x !== reqId);
        renderTechsKeepScroll();
      });

      svg.appendChild(visible);
      svg.appendChild(hit);
    });
  });
  graph.appendChild(svg);

  Object.entries(DATA.techs).forEach(([tid, t]) => {
    const pos = positions[tid];
    const node = el("div", { class: "tech-node", id: `graphnode-${tid}` });
    node.dataset.techId = tid;
    node.style.left = pos.x + "px";
    node.style.top = pos.y + "px";
    node.style.width = pos.w + "px";
    node.style.height = pos.h + "px";
    node.appendChild(el("div", { class: "tech-node-name", text: t.name }));
    node.appendChild(el("div", { class: "tech-node-id", text: tid }));

    const handle = el("div", { class: "tech-node-handle" });
    handle.addEventListener("mousedown", (e) => startConnectDrag(tid, e));
    node.appendChild(handle);

    // Обычный клик (без движения мыши) выделяет узел; клик с движением - перетаскивание.
    // Оба разруливаются в startNodeDrag/onNodeDragEnd, отдельный click-листенер тут не нужен.
    node.addEventListener("mousedown", (e) => {
      if (e.target === handle || e.button !== 0) return;
      startNodeDrag(tid, e);
    });
    node.addEventListener("dblclick", (e) => {
      if (e.target === handle) return;
      jumpToTechCard(tid);
    });

    graph.appendChild(node);
  });

  scroll.appendChild(graph);
  root.appendChild(scroll);
  enableGraphZoomEditor(scroll, graph, techGraphZoom);
  applyTechSelectionHighlight();
}

function applyTechSelectionHighlight() {
  const graph = document.getElementById("techGraph");
  if (!graph) return;
  const nodes = graph.querySelectorAll(".tech-node");
  const edges = graph.querySelectorAll(".tech-edge, .tech-edge-hit");

  if (!selectedTechNode || !DATA.techs[selectedTechNode]) {
    nodes.forEach(n => n.classList.remove("dim", "selected"));
    edges.forEach(e => e.classList.remove("dim", "related"));
    return;
  }

  const related = new Set([selectedTechNode]);
  edges.forEach(e => {
    if (e.dataset.from === selectedTechNode || e.dataset.to === selectedTechNode) {
      related.add(e.dataset.from);
      related.add(e.dataset.to);
    }
  });

  nodes.forEach(n => {
    const id = n.dataset.techId;
    n.classList.toggle("selected", id === selectedTechNode);
    n.classList.toggle("dim", !related.has(id));
  });
  edges.forEach(e => {
    const isRelated = e.dataset.from === selectedTechNode || e.dataset.to === selectedTechNode;
    e.classList.toggle("related", isRelated);
    e.classList.toggle("dim", !isRelated);
  });
}

function startConnectDrag(fromId, evt) {
  evt.preventDefault();
  evt.stopPropagation();
  const graph = document.getElementById("techGraph");
  const svg = graph.querySelector(".tech-graph-svg");
  const line = svgEl("line", { class: "tech-edge-drag" });
  svg.appendChild(line);
  dragConnectState = { fromId, line, graph, zoom: techGraphZoom.value };
  updateDragLine(evt);
  document.addEventListener("mousemove", onConnectDragMove);
  document.addEventListener("mouseup", onConnectDragEnd);
}

function updateDragLine(evt) {
  const { fromId, line, graph, zoom } = dragConnectState;
  const graphRect = graph.getBoundingClientRect();
  const fromNode = document.getElementById(`graphnode-${fromId}`);
  const fromRect = fromNode.getBoundingClientRect();
  // graphRect/fromRect - уже отмасштабированные экранные пиксели (getBoundingClientRect
  // не знает про transform:scale на #techGraph), делим на zoom, чтобы получить те же
  // единицы, что и координаты svg/style.left-top (см. комментарий у GRAPH_ZOOM_MIN выше).
  line.setAttribute("x1", (fromRect.right - graphRect.left) / zoom);
  line.setAttribute("y1", (fromRect.top + fromRect.height / 2 - graphRect.top) / zoom);
  line.setAttribute("x2", (evt.clientX - graphRect.left) / zoom);
  line.setAttribute("y2", (evt.clientY - graphRect.top) / zoom);
}

function onConnectDragMove(evt) {
  if (dragConnectState) updateDragLine(evt);
}

function onConnectDragEnd(evt) {
  document.removeEventListener("mousemove", onConnectDragMove);
  document.removeEventListener("mouseup", onConnectDragEnd);
  if (!dragConnectState) return;
  const { fromId, line } = dragConnectState;
  line.remove();
  dragConnectState = null;

  const targetEl = document.elementFromPoint(evt.clientX, evt.clientY);
  const nodeEl = targetEl && targetEl.closest(".tech-node");
  if (!nodeEl) return;
  const toId = nodeEl.dataset.techId;
  if (!toId || toId === fromId) return;

  const toTech = DATA.techs[toId];
  if (toTech.requires.includes(fromId)) return; // уже связаны
  if (wouldCreateCycle(fromId, toId)) {
    alert(`Нельзя связать: "${DATA.techs[toId].name}" уже (прямо или косвенно) требуется для "${DATA.techs[fromId].name}" - получился бы цикл.`);
    return;
  }
  toTech.requires.push(fromId);
  renderTechsKeepScroll();
}

// ---------- Технологии: граф - перетаскивание узлов ----------

let nodeDragState = null;

function nodeRect(tid) {
  const nodeEl = document.getElementById(`graphnode-${tid}`);
  if (!nodeEl) return null;
  return {
    x: parseFloat(nodeEl.style.left) || 0,
    y: parseFloat(nodeEl.style.top) || 0,
    w: nodeEl.offsetWidth || TECH_NODE_W,
    h: nodeEl.offsetHeight || TECH_NODE_H,
  };
}

// Во время перетаскивания пересчитываем "d" только у рёбер, касающихся сдвинутого
// узла - полный renderTechs() на каждый mousemove был бы слишком медленным/дёрганым.
function updateEdgesForNode(tid) {
  const graph = document.getElementById("techGraph");
  const svg = graph.querySelector(".tech-graph-svg");
  svg.querySelectorAll("path[data-from]").forEach(p => {
    if (p.dataset.from !== tid && p.dataset.to !== tid) return;
    const r1 = nodeRect(p.dataset.from);
    const r2 = nodeRect(p.dataset.to);
    if (!r1 || !r2) return;
    const x1 = r1.x + r1.w, y1 = r1.y + r1.h / 2;
    const x2 = r2.x, y2 = r2.y + r2.h / 2;
    p.setAttribute("d", edgePathD(x1, y1, x2, y2));
  });
}

// Расширяет холст графа, если узел утащили за текущую границу - иначе перетащенная
// карточка обрезалась бы контейнером с overflow.
function ensureCanvasSize(x, y, w, h) {
  const graph = document.getElementById("techGraph");
  const svg = graph.querySelector(".tech-graph-svg");
  const neededW = x + w + TECH_PAD;
  const neededH = y + h + TECH_PAD;
  if (neededW > graph.offsetWidth) { graph.style.width = neededW + "px"; svg.setAttribute("width", neededW); }
  if (neededH > graph.offsetHeight) { graph.style.height = neededH + "px"; svg.setAttribute("height", neededH); }
}

function startNodeDrag(tid, evt) {
  evt.preventDefault();
  const nodeEl = document.getElementById(`graphnode-${tid}`);
  nodeDragState = {
    tid, nodeEl,
    startX: evt.clientX, startY: evt.clientY,
    startLeft: parseFloat(nodeEl.style.left) || 0,
    startTop: parseFloat(nodeEl.style.top) || 0,
    zoom: techGraphZoom.value,
    moved: false,
  };
  document.addEventListener("mousemove", onNodeDragMove);
  document.addEventListener("mouseup", onNodeDragEnd);
}

function onNodeDragMove(evt) {
  if (!nodeDragState) return;
  // Экранный сдвиг мыши делим на zoom - при масштабе узел должен сдвинуться
  // на dx/zoom в собственных (немасштабированных) координатах style.left/top.
  const dx = (evt.clientX - nodeDragState.startX) / nodeDragState.zoom;
  const dy = (evt.clientY - nodeDragState.startY) / nodeDragState.zoom;
  if (!nodeDragState.moved && Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
  nodeDragState.moved = true;
  const x = Math.max(0, nodeDragState.startLeft + dx);
  const y = Math.max(0, nodeDragState.startTop + dy);
  nodeDragState.nodeEl.style.left = x + "px";
  nodeDragState.nodeEl.style.top = y + "px";
  ensureCanvasSize(x, y, nodeDragState.nodeEl.offsetWidth, nodeDragState.nodeEl.offsetHeight);
  updateEdgesForNode(nodeDragState.tid);
}

function onNodeDragEnd() {
  document.removeEventListener("mousemove", onNodeDragMove);
  document.removeEventListener("mouseup", onNodeDragEnd);
  if (!nodeDragState) return;
  const { tid, nodeEl, moved } = nodeDragState;
  nodeDragState = null;
  if (moved) {
    DATA.techs[tid].pos = { x: parseFloat(nodeEl.style.left) || 0, y: parseFloat(nodeEl.style.top) || 0 };
    renderTechsKeepScroll();
  } else {
    selectedTechNode = selectedTechNode === tid ? null : tid;
    applyTechSelectionHighlight();
  }
}

function renderEffects(container, effects) {
  container.innerHTML = "";
  effects.forEach((eff, i) => {
    if (eff.produces === undefined) eff.produces = {};
    if (eff.consumes === undefined) eff.consumes = {};
    if (eff.breakdown_delta === undefined) eff.breakdown_delta = 0;

    const card = el("div", { class: "effect-card" });
    const head = el("div", { class: "field-row" });
    head.appendChild(el("label", { text: "Постройка" }));
    head.appendChild(buildingSelect(eff.building, (v) => { eff.building = v; }));
    const rm = el("button", { class: "small danger", text: "✕ убрать эффект", onclick: () => {
      effects.splice(i, 1);
      renderEffects(container, effects);
    }});
    head.appendChild(rm);
    card.appendChild(head);

    card.appendChild(el("div", { class: "field-row" }, [el("label", { text: "+ к produces" })]));
    const pBox = el("div", { class: "dict-editor" });
    renderDictEditor(pBox, eff.produces);
    card.appendChild(pBox);

    card.appendChild(el("div", { class: "field-row" }, [el("label", { text: "+ к consumes" })]));
    const cBox = el("div", { class: "dict-editor" });
    renderDictEditor(cBox, eff.consumes);
    card.appendChild(cBox);

    const bdRow = el("div", { class: "field-row" });
    bdRow.appendChild(el("label", { text: "Δ шанса поломки" }));
    const bdInput = el("input", { type: "number", step: "0.01", value: eff.breakdown_delta });
    bdInput.addEventListener("change", () => { eff.breakdown_delta = Number(bdInput.value) || 0; });
    bdRow.appendChild(bdInput);
    card.appendChild(bdRow);

    container.appendChild(card);
  });

  const addBtn = el("button", { class: "small", text: "+ добавить эффект", onclick: () => {
    effects.push({ building: "*", produces: {}, consumes: {}, breakdown_delta: 0 });
    renderEffects(container, effects);
  }});
  container.appendChild(addBtn);
}

    bonusResRow.appendChild(bonusResSelect);
    bonusResRow.appendChild(el("span", { class: "hint", text: "какой ресурс с шансом добавляет промышленная пасека, если генотип особи ('Среда обитания') совпадает со средой, которую эмулирует её экземпляр фермы (апгрейд типа environment_emulation) - разные виды в ОДНОЙ и той же благоприятной среде дают разные бонусы" }));
    card.appendChild(bonusResRow);

    if (sp.bonus_resource) {
      const bonusAmountRow = el("div", { class: "field-row" });
      bonusAmountRow.appendChild(el("label", { text: "Количество бонуса" }));

      bonusChanceInput.addEventListener("change", () => { sp.bonus_chance = Number(bonusChanceInput.value) || 0.2; });
      bonusChanceRow.appendChild(bonusChanceInput);
      bonusChanceRow.appendChild(el("span", { class: "hint", text: "вероятность (0..1) бонуса за ход, независимо от обычной produces - свой отдельный бросок" }));
      card.appendChild(bonusChanceRow);
    }

    makeCardCollapsible(card);
    cardsBox.appendChild(card);
  });
  filterBar._apply();
}

// ---------- Генетика ----------

const GENETIC_TRAIT_IDS = ["lifespan", "output_multiplier", "active_period", "environment"];
const GENETIC_TRAIT_DEFAULT_NAMES = { lifespan: "Срок жизни", output_multiplier: "Продуктивность", active_period: "Активность", environment: "Среда обитания" };
const ACTIVE_PERIOD_ALLELE_IDS = ["day", "night", "always"];
const ACTIVE_PERIOD_ALLELE_NAMES = { day: "Днём", night: "Ночью", always: "Всегда" };
// Закрытый список - держать в паре с _ENVIRONMENT_ALLELE_IDS в
// tools/content_validation.py и с 6 апгрейдами типа environment_emulation
// (buildings.*.upgrades, см. UPGRADE_TYPE_OPTIONS выше).
const ENVIRONMENT_ALLELE_IDS = ["forest", "fields", "caves", "desert", "water", "space"];
const ENVIRONMENT_ALLELE_NAMES = { forest: "Лес", fields: "Поля", caves: "Пещеры", desert: "Пустыня", water: "Вода", space: "Космос" };

// Пул генов вида (species.*.gene_pool, game/engine.py: species_gene_pool) -
// {признак: {аллель: вес}}. Новому виду - «обычная особь»: доминантные аллели.
function defaultGenePool() {
  const pool = {};
  GENETIC_TRAIT_IDS.forEach(traitId => {
    const alleles = DATA.genetic_traits?.[traitId]?.alleles || [];
    const dominant = alleles.filter(a => a.dominant);
    pool[traitId] = {};
    (dominant.length ? dominant : alleles.slice(0, 1)).forEach(a => { pool[traitId][a.id] = 1; });
  });
  return pool;
}

// Строка на признак: все аллели каталога («Генетика») чипами, галочка - вид
// носит ген, число - вес, рядом доля в процентах. Правка веса пересчитывает
// доли на месте (без пересборки - не сбивать фокус при Tab между полями).
function renderGenePoolEditor(box, sp) {
  box.innerHTML = "";
  if (!sp.gene_pool) sp.gene_pool = {};
  GENETIC_TRAIT_IDS.forEach(traitId => {
    const trait = DATA.genetic_traits?.[traitId];
    const alleles = trait?.alleles || [];
    if (!sp.gene_pool[traitId]) sp.gene_pool[traitId] = {};
    const pool = sp.gene_pool[traitId];
    const row = el("div", { class: "gene-pool-row" });
    row.appendChild(el("span", { class: "gene-pool-trait", text: trait?.name || GENETIC_TRAIT_DEFAULT_NAMES[traitId] }));
    const chips = el("div", { class: "gene-pool-alleles" });
    const shares = [];
    const updateShares = () => {
      const total = Object.values(pool).reduce((sum, w) => sum + (Number(w) || 0), 0);
      shares.forEach(({ id, span }) => { span.textContent = total ? `${Math.round(pool[id] / total * 100)}%` : ""; });
    };
    alleles.forEach(a => {
      const on = a.id in pool;
      const chip = el("label", { class: "gene-pool-allele" + (on ? " on" : "") });
      const checkbox = el("input", { type: "checkbox" });
      checkbox.checked = on;
      checkbox.addEventListener("change", () => {
        if (checkbox.checked) pool[a.id] = 1; else delete pool[a.id];
        renderGenePoolEditor(box, sp);
      });
      chip.appendChild(checkbox);
      chip.appendChild(el("span", { text: a.name || a.id }));
      if (on) {
        const weightInput = el("input", { type: "number", min: "0.01", step: "0.1", value: pool[a.id], title: "Вес: чем больше, тем чаще ген у дикой особи" });
        weightInput.addEventListener("change", () => {
          const v = Number(weightInput.value);
          pool[a.id] = v > 0 ? v : 1;
          weightInput.value = pool[a.id];
          updateShares();
        });
        chip.appendChild(weightInput);
        const share = el("span", { class: "gene-pool-share" });
        shares.push({ id: a.id, span: share });
        chip.appendChild(share);
      }
      chips.appendChild(chip);
    });
    row.appendChild(chips);
    if (!Object.keys(pool).length) row.appendChild(el("span", { class: "gene-pool-warn", text: "нужна хотя бы одна аллель" }));
    box.appendChild(row);
    updateShares();
  });
}

// Переименование/удаление аллели в каталоге - то же самое во всех пулах видов,
// иначе пулы молча ссылались бы на несуществующий ген (валидатор отказал бы).
function renameAlleleInGenePools(traitId, oldId, newId) {
  Object.values(DATA.species || {}).forEach(sp => {
    const pool = sp.gene_pool?.[traitId];
    if (!pool || !(oldId in pool)) return;
    if (newId !== null && !(newId in pool)) pool[newId] = pool[oldId];
    delete pool[oldId];
  });
}

function renderGeneticTraits() {
  const root = document.getElementById("tab-genetic-traits");
  root.innerHTML = "";
  root.appendChild(el("p", { class: "hint", text:
    "4 жёстко зашитых признака генотипа особи - id признаков и, для «Активности»/«Среды обитания», "
    + "id аллелей фиксированы в движке (добавить/удалить сам признак или сменить состав аллелей нельзя). "
    + "Пятый признак генотипа - «Вид» - это вкладка «Виды» (dominant ЛЮБОГО вида играет ТУ ЖЕ роль, что "
    + "здесь у аллелей). dominant решает, какая из двух аллелей пары выражается в фенотипе при скрещивании "
    + "(нужна хотя бы одна dominant=true аллель на признак - иначе гетерозигота ничего не определит). Это общий "
    + "КАТАЛОГ генов: какие из них и как часто носит особь конкретного вида, настраивается «Пулом генов» на "
    + "вкладке «Виды». «Среда обитания» решает только, КАКАЯ "
    + "среда благоприятна для генотипа особи - бонусный ресурс за эту благоприятность настраивается на вкладке "
    + "«Виды» (у каждого вида свой, не у самой среды - см. подсказку там)." }));

  if (!DATA.genetic_traits) DATA.genetic_traits = {};

  GENETIC_TRAIT_IDS.forEach(traitId => {
    if (!DATA.genetic_traits[traitId]) {
      DATA.genetic_traits[traitId] = { name: GENETIC_TRAIT_DEFAULT_NAMES[traitId], alleles: [] };
    }
    const trait = DATA.genetic_traits[traitId];
    if (!trait.alleles) trait.alleles = [];
    const isActivePeriod = traitId === "active_period";
    const isEnvironment = traitId === "environment";
    const isLocked = isActivePeriod || isEnvironment;
    if (isActivePeriod) {
      ACTIVE_PERIOD_ALLELE_IDS.forEach(aid => {
        if (!trait.alleles.some(a => a.id === aid)) {
          trait.alleles.push({ id: aid, name: ACTIVE_PERIOD_ALLELE_NAMES[aid], dominant: aid === "day" });
        }
      });
    }
    if (isEnvironment) {
      ENVIRONMENT_ALLELE_IDS.forEach(aid => {
        if (!trait.alleles.some(a => a.id === aid)) {
          trait.alleles.push({ id: aid, name: ENVIRONMENT_ALLELE_NAMES[aid], dominant: aid === "forest" });
        }
      });
    }

    const card = el("div", { class: "card", id: `card-genetic-traits-${traitId}` });
    const nameInput = el("input", { type: "text", value: trait.name || "" });
    nameInput.addEventListener("change", () => { trait.name = nameInput.value; });
    card.appendChild(el("div", { class: "card-head" }, [el("code", { text: traitId }), nameInput]));

    const allelesBox = el("div", { class: "stages-box" });
    function renderAllelesBox() {
      allelesBox.innerHTML = "";
      trait.alleles.forEach((a, i) => {
        const aCard = el("div", { class: "stage-card" });
        const head = el("div", { class: "stage-head" });
        head.appendChild(el("strong", { text: isLocked ? a.id : `Аллель ${i + 1}` }));
        head.appendChild(el("div", { class: "spacer" }));
        if (!isLocked) {
          const rm = el("button", { class: "small danger", text: "Удалить", disabled: trait.alleles.length <= 1 ? "true" : null });
          rm.addEventListener("click", () => { trait.alleles.splice(i, 1); renameAlleleInGenePools(traitId, a.id, null); renderAllelesBox(); });
          head.appendChild(rm);
        }
        aCard.appendChild(head);

        if (!isLocked) {
          const idRow = el("div", { class: "field-row" });
          idRow.appendChild(el("label", { text: "id" }));
          const idInput = el("input", { type: "text", value: a.id || "" });
          idInput.addEventListener("change", () => {
            const v = idInput.value.trim();
            if (!/^[a-z][a-z0-9_]*$/.test(v)) { alert("id должен быть латиницей в snake_case"); idInput.value = a.id || ""; return; }
            renameAlleleInGenePools(traitId, a.id, v);
            a.id = v;
          });
          idRow.appendChild(idInput);
          aCard.appendChild(idRow);
        }

        const nameRow = el("div", { class: "field-row" });
        nameRow.appendChild(el("label", { text: "Название" }));
        const aNameInput = el("input", { type: "text", value: a.name || "" });
        aNameInput.addEventListener("change", () => { a.name = aNameInput.value; });
        nameRow.appendChild(aNameInput);
        aCard.appendChild(nameRow);

        if (!isLocked) {
          const valueRow = el("div", { class: "field-row" });
          valueRow.appendChild(el("label", { text: "Значение (value)" }));
          const valueInput = el("input", { type: "number", min: "0.01", step: "0.1", value: a.value ?? 1 });
          valueInput.addEventListener("change", () => { a.value = Number(valueInput.value) || 1; });
          valueRow.appendChild(valueInput);
          valueRow.appendChild(el("span", { class: "hint", text: traitId === "lifespan" ? "сколько ходов особь живёт в ферме, пока не умрёт от старости" : "множитель продукции особи (домножает produces её вида)" }));
          aCard.appendChild(valueRow);
        }

        const domRow = el("div", { class: "field-row" });
        const domCheckbox = el("input", { type: "checkbox" });
        domCheckbox.checked = !!a.dominant;
        domCheckbox.addEventListener("change", () => { a.dominant = domCheckbox.checked; });
        domRow.appendChild(domCheckbox);
        domRow.appendChild(el("label", { text: "Доминантная" }));
        aCard.appendChild(domRow);

        allelesBox.appendChild(aCard);
      });
      if (!isLocked) {
        const addBtn = el("button", { class: "small", text: "+ добавить аллель", onclick: () => {
          trait.alleles.push({ id: "new_allele", name: "Новая аллель", dominant: false, value: 1 });
          renderAllelesBox();
        }});
        allelesBox.appendChild(addBtn);
      }
    }
    renderAllelesBox();
    card.appendChild(allelesBox);
    makeCardCollapsible(card);
    root.appendChild(card);
  });
}

// ---------- Мутации ----------

function renderMutations() {
  const root = document.getElementById("tab-breeding");
  root.innerHTML = "";
  root.appendChild(el("p", { class: "hint", text:
    "Мутации - шанс, что скрещивание пары видов даст потомка ТРЕТЬЕГО вида вместо чистокровного "
    + "потомка одного из родителей (см. game/engine.py:_cross_genotype). chance - вероятность, что мутация "
    + "СРАБОТАЕТ (домножается на апгрейд станции скрещивания breeding_mutation_chance, если куплен). Если для "
    + "пары видов заведено НЕСКОЛЬКО открытых одновременно мутаций, их шансы складываются; весь остаток, "
    + "(1 - сумма шансов) / 2, делится ПОРОВНУ между чистокровным видом родителя А и чистокровным видом "
    + "родителя Б - потомок ВСЕГДА получается чистокровным (либо новый вид, либо вид одного из родителей), "
    + "никогда не смесь. Суммарный chance всех мутаций одной пары не должен превышать 1 (иначе шанс получить "
    + "чистого родителя уйдёт в минус - редактор это проверит при сохранении). outcomes - взвешенный выбор "
    + "МЕЖДУ несколькими возможными мутировавшими видами (один элемент - если исход всегда один и тот же)." }));

  if (!DATA.mutations) DATA.mutations = [];

  const cardsBox = el("div");
  const filterBar = makeFilterBar("breeding", cardsBox);
  const addForm = el("div", { class: "add-form" }, [
    el("button", { class: "primary", text: "+ добавить мутацию", onclick: () => {
      const anySpecies = Object.keys(DATA.species || {})[0] || null;
      DATA.mutations.push({
        parent_a: anySpecies, parent_b: anySpecies, requires_tech: null, requires_building: null,
        chance: 0.1, outcomes: anySpecies ? [{ species_id: anySpecies, weight: 1 }] : [],

      const newIndex = DATA.mutations.length - 1;
      renderMutations();
      jumpTo(`card-mutation-${newIndex}`, "breeding");

  DATA.mutations.forEach((m, i) => {

    const headLabel = el("strong", { text: "? × ?" });
    const updateHeadLabel = () => {
      const nameA = DATA.resources.find(r => r.id === m.parent_a)?.name || m.parent_a || "?";
      const nameB = DATA.resources.find(r => r.id === m.parent_b)?.name || m.parent_b || "?";
      headLabel.textContent = `${nameA} × ${nameB}`;
      card.dataset.search = `${nameA} ${nameB} ${m.parent_a || ""} ${m.parent_b || ""}`.toLowerCase();
    };
    updateHeadLabel();
    const order = el("div", { class: "order-controls" });
    const up = el("button", { class: "small", title: "Переместить выше", text: "↑" });
    if (i === 0) up.disabled = true;
    up.addEventListener("click", () => { moveArrayItem(DATA.mutations, i, -1); renderMutations(); });
    const down = el("button", { class: "small", title: "Переместить ниже", text: "↓" });
    if (i === DATA.mutations.length - 1) down.disabled = true;
    down.addEventListener("click", () => { moveArrayItem(DATA.mutations, i, 1); renderMutations(); });
    order.append(up, down);
    const rm = el("button", { class: "small danger", text: "Удалить", onclick: () => {
      DATA.mutations.splice(i, 1);
      renderMutations();
    }});

    card.appendChild(techRow);

    reqBuildingRow.appendChild(el("label", { text: "Нужна постройка" }));
    reqBuildingRow.appendChild(buildingRequirementSelect(m.requires_building || null, (v) => { m.requires_building = v; }));
    card.appendChild(reqBuildingRow);

    const parentARow = el("div", { class: "field-row" });
    parentARow.appendChild(el("label", { text: "Родитель А" }));
    parentARow.appendChild(speciesSelect(m.parent_a, (v) => { m.parent_a = v; updateHeadLabel(); }));
    card.appendChild(parentARow);

    card.appendChild(parentBRow);

    const chanceRow = el("div", { class: "field-row" });
    chanceRow.appendChild(el("label", { text: "Шанс срабатывания" }));

    chanceInput.addEventListener("change", () => { m.chance = Number(chanceInput.value) || 0.1; });
    chanceRow.appendChild(chanceInput);
    chanceRow.appendChild(el("span", { class: "hint", text: "0..1 (например 0.1 = 10%); домножается на апгрейд станции скрещивания breeding_mutation_chance, если куплен" }));
    card.appendChild(chanceRow);

    card.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Возможные исходы (outcomes)" })]));
    const outcomesBox = el("div", { class: "stages-box" });

        oCard.appendChild(oHead);

        const speciesRow = el("div", { class: "field-row" });
        speciesRow.appendChild(el("label", { text: "Вид" }));
        speciesRow.appendChild(speciesSelect(o.species_id, (v) => { o.species_id = v; }));
        oCard.appendChild(speciesRow);

        const weightRow = el("div", { class: "field-row" });
        weightRow.appendChild(el("label", { text: "Вес" }));
        const weightInput = el("input", { type: "number", min: "0.01", step: "0.1", value: o.weight });
        weightInput.addEventListener("change", () => { o.weight = Number(weightInput.value) || 1; });
        weightRow.appendChild(weightInput);
        weightRow.appendChild(el("span", { class: "hint", text: "относительный вес - сравнивается только с весами других исходов ЭТОЙ ЖЕ мутации" }));
        oCard.appendChild(weightRow);

        outcomesBox.appendChild(oCard);
      });
    }
    renderOutcomesBox();
    card.appendChild(outcomesBox);
    const addOutcomeBtn = el("button", { class: "small", text: "+ добавить исход", onclick: () => {
      const anySpecies = Object.keys(DATA.species || {})[0] || null;
      if (!m.outcomes) m.outcomes = [];
      m.outcomes.push({ species_id: anySpecies, weight: 1 });
      renderOutcomesBox();
    }});
    card.appendChild(addOutcomeBtn);

    makeCardCollapsible(card);
    cardsBox.appendChild(card);
  });
  filterBar._apply();
}

function renderMining() {
  const root = document.getElementById("tab-mining");
  root.innerHTML = "";
  root.appendChild(el("p", { class: "hint", text:
    "Шахта - закрытое туманом поле (см. \"Настройки поля\" ниже): руда каждого исследованного (по requires_tech) "
    + "вида ложится на поле кластерами, но ломается только киркой нужного тира (required_tier) - недоступная руда "
    + "видна, но не поддаётся удару. rarity - вес частоты кластеров (чем МЕНЬШЕ число, тем ЧАЩЕ), "
    + "field_cluster_size - размер одного кластера в клетках, toughness - сколько урона нужно снять с клетки, "
    + "base_yield x множитель тира инструмента = выход руды с ОДНОЙ сломанной клетки." }));

  if (!DATA.mine_field) {
    DATA.mine_field = {
      size: 20, dig_tool: Object.keys(DATA.tools)[0] || null, cluster_budget: 8,
      scanner_tool: Object.keys(DATA.tools)[0] || null,
      scanner_types_tier: 1, scanner_counts_tier: 1, scanner_radius_tiers: [], scanner_reveal_all_tier: 1,
      rock_resource: DATA.resources[0]?.id || null, rock_yield: 2, rock_toughness: 1,
      rock_icon: null, rock_broken_icon: null, rock_icon_variants: [],
    };
  }
  root.appendChild(renderMineFieldSettingsCard());

  const cardsBox = el("div");
  const filterBar = makeFilterBar("mining", cardsBox);

  const freeResources = DATA.resources.filter(r => !(r.id in DATA.mining_info));
  let addForm = null;
  if (freeResources.length) {
    let addRid = freeResources[0].id;
    const entries = freeResources.map(r => ({ value: r.id, label: r.name }));
    const select = genericPickerSelect(entries, addRid, (v) => { addRid = v; }, { title: "Выбрать ресурс", placeholder: "— выбрать ресурс —" });
    const addBtn = el("button", { class: "primary", text: "Добавить", onclick: () => {
      const rid = addRid;
      const firstTool = Object.keys(DATA.tools)[0] || null;
      DATA.mining_info[rid] = {
        requires_tech: null, required_tool: firstTool, required_tier: 1, rarity: 1,
        toughness: 2, field_cluster_size: [2, 5], base_yield: 2,
      };
      jumpTo(`card-mining-${rid}`, "mining");
    }});
    addForm = el("div", { class: "add-form" }, [el("span", { text: "Включить добычу для:" }), select, addBtn]);
  }
  root.appendChild(makeToolbar(addForm, filterBar));
  root.appendChild(cardsBox);

  Object.entries(DATA.mining_info).forEach(([rid, info]) => {
    const resName = DATA.resources.find(r => r.id === rid)?.name || rid;
    const card = el("div", { class: "card", id: `card-mining-${rid}` });
    card.dataset.search = (rid + " " + resName).toLowerCase();
    const rm = el("button", { class: "small danger", text: "Удалить", onclick: () => {
      delete DATA.mining_info[rid];
      renderMining();
    }});
    card.appendChild(el("div", { class: "card-head" }, [el("code", { text: rid }), el("strong", { text: resName }), el("div", { class: "spacer" }), rm]));

    const techRow = el("div", { class: "field-row" });
    techRow.appendChild(el("label", { text: "Нужна технология" }));
    techRow.appendChild(techSelect(info.requires_tech, (v) => { info.requires_tech = v; }));
    card.appendChild(techRow);

    const toolRow = el("div", { class: "field-row" });
    toolRow.appendChild(el("label", { text: "Инструмент" }));
    toolRow.appendChild(toolSelect(info.required_tool, (v) => {
      info.required_tool = v;
      const maxTier = DATA.tools[v].tiers.length;
      if (info.required_tier > maxTier) info.required_tier = maxTier;
      renderMining(); // сменился инструмент - у соседнего инпута может смениться max тиров
    }));
    card.appendChild(toolRow);

    const tierRow = el("div", { class: "field-row" });
    tierRow.appendChild(el("label", { text: "Мин. тир инструмента" }));
    const tierCount = DATA.tools[info.required_tool] ? DATA.tools[info.required_tool].tiers.length : 1;
    const tierInput = el("input", { type: "number", min: "1", max: String(tierCount), value: info.required_tier });
    tierInput.addEventListener("change", () => { info.required_tier = Number(tierInput.value) || 1; });
    tierRow.appendChild(tierInput);
    tierRow.appendChild(el("span", { class: "hint", text: "порог \"начиная с тира N\" - не путать с requires_tool_tiers у ручных действий (там явные галочки, не порог)" }));
    card.appendChild(tierRow);

    const rarityRow = el("div", { class: "field-row" });
    rarityRow.appendChild(el("label", { text: "Редкость (rarity)" }));
    const rarityInput = el("input", { type: "number", min: "0.01", step: "0.1", value: info.rarity });
    rarityInput.addEventListener("change", () => { info.rarity = Number(rarityInput.value) || 1; });
    rarityRow.appendChild(rarityInput);
    rarityRow.appendChild(el("span", { class: "hint", text: "относительный вес - сравнивается только с rarity других разведанных руд" }));
    card.appendChild(rarityRow);

    const clusterRow = el("div", { class: "field-row" });
    clusterRow.appendChild(el("label", { text: "Размер кластера на поле (min-max клеток)" }));
    const minInput = el("input", { type: "number", min: "1", value: info.field_cluster_size[0] });
    const maxInput = el("input", { type: "number", min: "1", value: info.field_cluster_size[1] });
    minInput.addEventListener("change", () => { info.field_cluster_size[0] = Number(minInput.value) || 1; });
    maxInput.addEventListener("change", () => { info.field_cluster_size[1] = Number(maxInput.value) || 1; });
    clusterRow.append(minInput, document.createTextNode(" – "), maxInput);
    card.appendChild(clusterRow);

    const toughnessRow = el("div", { class: "field-row" });
    toughnessRow.appendChild(el("label", { text: "Прочность клетки" }));
    const toughnessInput = el("input", { type: "number", min: "1", value: info.toughness });
    toughnessInput.addEventListener("change", () => { info.toughness = Number(toughnessInput.value) || 1; });
    toughnessRow.appendChild(toughnessInput);
    toughnessRow.appendChild(el("span", { class: "hint", text: "сколько урона (mining_power кирки) нужно снять, чтобы клетка сломалась" }));
    card.appendChild(toughnessRow);

    const yieldRow = el("div", { class: "field-row" });
    yieldRow.appendChild(el("label", { text: "Выход с клетки (на мин. тире)" }));
    const yieldInput = el("input", { type: "number", min: "1", value: info.base_yield });
    yieldInput.addEventListener("change", () => { info.base_yield = Number(yieldInput.value) || 1; });
    yieldRow.appendChild(yieldInput);
    card.appendChild(yieldRow);

    // Иконка ЖИЛЫ на поле шахты - НЕЗАВИСИМА от иконки самого ресурса (вкладка
    // "Ресурсы") по прямому пожеланию, 2026-09-16: жила в забое и добытый
    // ресурс - разные картинки. Без своей иконки клетка на поле откатывается
    // на иконку ресурса (тот же resource, что и id этой записи) - fallbackIcon
    // ниже показывает именно её, чтобы было видно, что покажется по умолчанию.
    const iconRow = el("div", { class: "field-row" });
    iconRow.appendChild(el("label", { text: "Иконка жилы на поле" }));
    const resourceIconFallback = DATA.resources.find(r => r.id === rid)?.icon || null;
    iconRow.appendChild(iconEditButton(`Жила «${resName}»`, info, resourceIconFallback, () => {}));
    iconRow.appendChild(el("span", { class: "hint", text: "без своей иконки клетка на поле выглядит как ресурс (вкладка \"Ресурсы\")" }));
    card.appendChild(iconRow);

    makeCardCollapsible(card);
    cardsBox.appendChild(card);
  });
  filterBar._apply();
}

// ---------- Инструменты ----------
// Раньше была ровно одна жёстко зашитая "Кирка" (pickaxe_tiers, плоский список тиров).
// Теперь произвольное число инструментов (DATA.tools: id -> {name, tiers}), каждый со
// своей независимой линейкой тиров той же формы, что была у кирки. Тир инструмента =
// позиция в ЕГО списке tiers - на номер тира ссылаются вкладка «Добыча» (required_tool/
// required_tier, порог "начиная с") и «Ручные действия» (requires_tool_tiers, явные
// галочки), поэтому добавлять/удалять тиры можно только с конца конкретного инструмента.

function renderTools() {
  const root = document.getElementById("tab-tools");
  root.innerHTML = "";
  root.appendChild(el("p", { class: "hint", text:
    "Каждый инструмент - независимая линейка тиров (1-й тир - стартовый, бесплатный, есть у игрока с начала "
    + "игры). Тир = позиция в списке тиров ЭТОГО инструмента; добавлять/удалять тиры можно только с конца, иначе "
    + "сместятся номера, на которые ссылаются вкладки «Добыча» и «Ручные действия»." }));

  const cardsBox = el("div");

      if (tool.armor) {

      if (toolId === DATA.mine_field?.dig_tool) {

        areaInput.addEventListener("change", () => {

        });

        const powerRow = el("div", { class: "field-row" });

        const powerInput = el("input", { type: "number", min: "1", step: "1", value: tier.mining_power ?? "", placeholder: "1 (не задано)" });
        powerInput.addEventListener("change", () => {

        powerRow.appendChild(el("span", { class: "hint", text: "показывается тут, т.к. этот инструмент назначен mine_field.dig_tool (см. вкладку «Добыча»)" }));

      tiersBox.appendChild(tierCard);

    card.appendChild(el("button", { class: "small", text: "+ добавить следующий тир", onclick: () => {

    // slice(1) - тир №1 (стартовый, бесплатный) нарочно исключён из шаблонов: он не

// ---------- Мобы/Боссы ----------

// Как renderManualResourceDictEditor, но только % (без строки "количество") -
// entity[chanceKey] - шанс (0..1) на КАЖДЫЙ ресурс, который уже есть в
// entity[amountKey] (см. tools/content_validation.py:check_chance_dict - ключ
// шанса обязан уже быть в самом словаре количества). Количества редактируются
// отдельным renderDictEditor(entity[amountKey]) - эта функция только шанс.
function renderChanceOnlyEditor(container, entity, amountKey, chanceKey) {
  container.innerHTML = "";
  const dictObj = entity[amountKey] || {};
  const keys = Object.keys(dictObj);
  if (!keys.length) {
    container.appendChild(el("span", { class: "hint", text: "сначала добавь ресурс(ы) выше" }));
    return;
  }
  keys.forEach(rid => {
    const row = el("div", { class: "dict-row" });
    const name = DATA.resources.find(r => r.id === rid)?.name || rid;
    row.appendChild(el("span", { text: name, style: "min-width:120px;display:inline-block" }));
    const currentPercent = entity[chanceKey] && rid in entity[chanceKey] ? Math.round(entity[chanceKey][rid] * 100) : 100;
    const chanceInput = el("input", { type: "number", min: "1", max: "100", step: "1", value: currentPercent, style: "width:60px" });
    chanceInput.addEventListener("change", () => {
      const percent = Math.max(1, Math.min(100, Number(chanceInput.value) || 100));
      chanceInput.value = percent;
      if (percent >= 100) {
        if (entity[chanceKey]) {
          delete entity[chanceKey][rid];
          if (Object.keys(entity[chanceKey]).length === 0) delete entity[chanceKey];
        }
      } else {
        entity[chanceKey] = entity[chanceKey] || {};
        entity[chanceKey][rid] = percent / 100;
      }
    });
    row.append(chanceInput, el("span", { class: "hint", text: "%" }));
    container.appendChild(row);
  });
}

function renderSoulRecipesSection() {
  const box = el("div", { class: "sub-section" });
  box.appendChild(el("h3", { text: "Продукция синтезаторов душ" }));
  box.appendChild(el("p", { class: "hint", text:
    "Что производит КАЖДАЯ вставленная в синтезатор душ (постройка с полем soul_collector, см. вкладку "
    + "«Постройки», кнопка «Настроить синтезатор душ») душа за ход, пока стоит в слоте - вечно, без расхода. "
    + "produces - гарантированная часть, шанс % у ресурса ниже - вероятностная (та же механика, что cost_chance/"
    + "gain_chance у ручных действий)." }));

  const cardsBox = el("div");
  const freeResources = DATA.resources.filter(r => !(r.id in DATA.soul_recipes));
  if (freeResources.length) {
    let addRid = freeResources[0].id;
    const entries = freeResources.map(r => ({ value: r.id, label: r.name }));
    const select = genericPickerSelect(entries, addRid, (v) => { addRid = v; }, { title: "Выбрать ресурс", placeholder: "— выбрать ресурс —" });
    const addBtn = el("button", { class: "primary", text: "Добавить", onclick: () => {
      DATA.soul_recipes[addRid] = { produces: {} };
      renderMobs();
    }});
    box.appendChild(el("div", { class: "add-form" }, [el("span", { text: "Продукция для души:" }), select, addBtn]));
  }
  box.appendChild(cardsBox);

  Object.entries(DATA.soul_recipes).forEach(([rid, recipe]) => {
    const resName = DATA.resources.find(r => r.id === rid)?.name || rid;
    const card = el("div", { class: "card" });
    const rm = el("button", { class: "small danger", text: "Удалить", onclick: () => {
      delete DATA.soul_recipes[rid];
      renderMobs();
    }});
    card.appendChild(el("div", { class: "card-head" }, [el("code", { text: rid }), el("strong", { text: resName }), el("div", { class: "spacer" }), rm]));

    const kindRow = el("div", { class: "field-row" });
    kindRow.appendChild(el("label", { text: "Тег вида души (soul_kind)" }));
    const resource = DATA.resources.find(r => r.id === rid);
    kindRow.appendChild(soulKindInput(resource?.soul_kind, (v) => {
      if (!resource) return;
      if (v) resource.soul_kind = v; else delete resource.soul_kind;
    }));
    kindRow.appendChild(el("span", { class: "hint", text: "например 'моб'/'босс' - синтезатор с тем же accepts_kind (вкладка «Постройки») примет эту душу" }));
    card.appendChild(kindRow);

    if (!recipe.produces) recipe.produces = {};
    card.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Производит за ход (гарантированно)" })]));
    const producesBox = el("div", { class: "dict-editor" });
    const chanceBox = el("div", { class: "dict-editor" });
    renderDictEditor(producesBox, recipe.produces, () => renderChanceOnlyEditor(chanceBox, recipe, "produces", "produces_chance"), true);
    card.appendChild(producesBox);

    card.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Шанс на каждый ресурс (%, необязательно)" })]));
    renderChanceOnlyEditor(chanceBox, recipe, "produces", "produces_chance");
    card.appendChild(chanceBox);

    makeCardCollapsible(card);
    cardsBox.appendChild(card);
  });
  return box;
}

// content.json["combat_moves"] - альтернативные варианты атаки (game/engine.py:
// attack_encounter(move_id=...)). КОМУ и С КАКОГО ТИРА оружия открывается конкретный
// приём настраивается НЕ здесь, а на вкладке «Инструменты» у тира оружия
// (tier.unlocks_moves) - этот список только сами определения приёмов.
function renderCombatMoves() {
  const root = document.getElementById("tab-combat-moves");
  root.innerHTML = "";
  if (!DATA.combat_moves) DATA.combat_moves = {};
  root.appendChild(el("p", { class: "hint", text:
    "Альтернативные варианты атаки в схватке - у каждого свой независимый способ посчитать урон (см. режим ниже). "
    + "cooldown_turns - сколько ходов приём недоступен после применения (тикает КАЖДЫЙ ход игры, не только пока "
    + "идёт бой). Какой тир оружия открывает какой приём - настраивается на вкладке «Инструменты» у конкретного "
    + "тира (галочки «Открывает приёмы боя», видны только у weapon=true)." }));

  const cardsBox = el("div");
  const filterBar = makeFilterBar("combat-moves", cardsBox);
  const addForm = idPromptAndAdd("приём боя", (id) => {
    DATA.combat_moves[id] = { name: "Новый приём", description: "", damage_multiplier: 1.5, cooldown_turns: 2 };
    renderCombatMoves();
    renderTools(); // список приёмов у чекбоксов unlocks_moves должен увидеть новую запись
    jumpTo(`card-combat-moves-${id}`, "combat-moves", { focusName: true });
  });
  root.appendChild(makeToolbar(addForm, filterBar));
  root.appendChild(cardsBox);

  Object.entries(DATA.combat_moves).forEach(([moveId, move]) => {
    const card = el("div", { class: "card", id: `card-combat-moves-${moveId}` });
    card.dataset.search = (moveId + " " + move.name).toLowerCase();
    const nameInput = el("input", { type: "text", value: move.name });
    nameInput.addEventListener("change", () => { move.name = nameInput.value; card.dataset.search = (moveId + " " + move.name).toLowerCase(); });
    const rm = el("button", { class: "small danger", text: "Удалить", onclick: () => {
      delete DATA.combat_moves[moveId];
      renderCombatMoves();
      renderTools(); // сняли из чекбоксов unlocks_moves - сама ссылка в tier.unlocks_moves[] тут не чистится
    }});
    card.appendChild(el("div", { class: "card-head" }, [el("code", { text: moveId }), nameInput, el("div", { class: "spacer" }), rm]));

    const descRow = el("div", { class: "field-row" });
    descRow.appendChild(el("label", { text: "Описание" }));
    descRow.appendChild(descriptionTextarea(move.description, "Что это за приём, чем ощущается иначе, чем обычная атака", (v) => { move.description = v; }));
    card.appendChild(descRow);

    const modeRow = el("div", { class: "field-row" });
    modeRow.appendChild(el("label", { text: "Режим расчёта урона" }));
    const modeSelect = el("select");
    const MOVE_MODE_OPTIONS = [
      ["multiplier", "Множитель обычного урона"],
      ["percent_max_hp", "% от максимального HP цели"],
      ["percent_remaining_hp", "% от текущего (оставшегося) HP цели"],
      ["execute", "Добивающий удар (казнь ниже порога HP)"],
    ];
    MOVE_MODE_OPTIONS.forEach(([value, text]) => modeSelect.appendChild(el("option", { value, text })));
    modeSelect.value = move.mode || "multiplier";
    modeSelect.addEventListener("change", () => {
      // Поля СТАРОГО режима валидатору чужие у нового mode (tools/content_validation.py) -
      // чистим и подставляем разумные дефолты нового режима.
      delete move.damage_multiplier; delete move.percent; delete move.execute_threshold_percent;
      move.mode = modeSelect.value;
      if (move.mode === "multiplier") move.damage_multiplier = 1.5;
      else if (move.mode === "percent_max_hp" || move.mode === "percent_remaining_hp") move.percent = 0.15;
      else if (move.mode === "execute") move.execute_threshold_percent = 0.2;
      renderCombatMoves();
    });
    modeRow.appendChild(modeSelect);
    card.appendChild(modeRow);

    const mode = move.mode || "multiplier";
    if (mode === "multiplier") {
      const dmgRow = el("div", { class: "field-row" });
      dmgRow.appendChild(el("label", { text: "Множитель урона" }));
      const dmgInput = el("input", { type: "number", min: "0.1", step: "0.1", value: move.damage_multiplier ?? 1 });
      dmgInput.addEventListener("change", () => { move.damage_multiplier = Number(dmgInput.value) || 1; });
      dmgRow.appendChild(dmgInput);
      dmgRow.appendChild(el("span", { class: "hint", text: "домножает уже посчитанный обычный урон (навык × лучший множитель владеемого оружия)" }));
      card.appendChild(dmgRow);
    } else if (mode === "percent_max_hp" || mode === "percent_remaining_hp") {
      const pctRow = el("div", { class: "field-row" });
      pctRow.appendChild(el("label", { text: mode === "percent_max_hp" ? "Урон, % от максимального HP цели" : "Урон, % от текущего HP цели" }));
      const pctInput = el("input", { type: "number", min: "1", max: "100", step: "1", value: Math.round((move.percent ?? 0.15) * 100) });
      pctInput.addEventListener("change", () => { move.percent = Math.max(1, Math.min(100, Number(pctInput.value) || 1)) / 100; });
      pctRow.appendChild(pctInput);
      pctRow.appendChild(el("span", { class: "hint", text:
        mode === "percent_max_hp"
          ? "не зависит от навыка/оружия - постоянная доля от МАКСИМАЛЬНОГО HP цели"
          : "не зависит от навыка/оружия - доля от ОСТАВШЕГОСЯ прямо сейчас HP (убывает с каждым применением)" }));
      card.appendChild(pctRow);
    } else if (mode === "execute") {
      const threshRow = el("div", { class: "field-row" });
      threshRow.appendChild(el("label", { text: "Добивает при HP цели ≤, %" }));
      const threshInput = el("input", { type: "number", min: "1", max: "100", step: "1", value: Math.round((move.execute_threshold_percent ?? 0.2) * 100) });
      threshInput.addEventListener("change", () => { move.execute_threshold_percent = Math.max(1, Math.min(100, Number(threshInput.value) || 1)) / 100; });
      threshRow.appendChild(threshInput);
      threshRow.appendChild(el("span", { class: "hint", text: "порог считается от МАКСИМАЛЬНОГО HP цели" }));
      card.appendChild(threshRow);

      const fallbackRow = el("div", { class: "field-row" });
      fallbackRow.appendChild(el("label", { text: "Запасной множитель урона (необязательно)" }));
      const fallbackInput = el("input", { type: "number", min: "0.1", step: "0.1", value: move.damage_multiplier ?? "", placeholder: "1 (как обычная атака)" });
      fallbackInput.addEventListener("change", () => {
        if (fallbackInput.value === "") delete move.damage_multiplier;
        else move.damage_multiplier = Number(fallbackInput.value) || 1;
      });
      fallbackRow.appendChild(fallbackInput);
      fallbackRow.appendChild(el("span", { class: "hint", text: "чем бьёт приём, ПОКА HP цели ещё выше порога - пусто значит как обычная атака" }));
      card.appendChild(fallbackRow);
    }

    const cdRow = el("div", { class: "field-row" });
    cdRow.appendChild(el("label", { text: "Кулдаун, ходов" }));
    const cdInput = el("input", { type: "number", min: "0", step: "1", value: move.cooldown_turns ?? 0 });
    cdInput.addEventListener("change", () => { move.cooldown_turns = Math.max(0, Math.round(Number(cdInput.value) || 0)); });
    cdRow.appendChild(cdInput);
    cdRow.appendChild(el("span", { class: "hint", text: "0 - без ограничения, можно применять хоть каждый ход" }));
    card.appendChild(cdRow);

    makeCardCollapsible(card);
    cardsBox.appendChild(card);
  });
  filterBar._apply();
}

function renderMobs() {

  if (!DATA.soul_recipes) DATA.soul_recipes = {};
  root.appendChild(el("p", { class: "hint", text:
    "Охота: рандомная встреча (\"Искать\") среди НЕ-боссов той же локации (rarity - как у руды в Добыче, чем "
    + "МЕНЬШЕ число, тем чаще), либо ручной призыв босса (summon_cost - предмет призыва, тратится сразу, при "
    + "провале НЕ возвращается). Атака снимает HP цели - лут/опыт/душа выдаются одним пакетом только при "
    + "финальном убийстве. Душа обычного моба выбивается ШАНСОМ при убийстве; душа босса намеренно недоступна "

    const rm = el("button", { class: "small danger", text: "Удалить", onclick: () => {
      delete DATA.mobs[mid];
      renderMobs();
    }});
    const iconBtn = iconEditButton(mob.name, mob, defaultMobIcon(), () => {});
    card.appendChild(el("div", { class: "card-head" }, [el("code", { text: mid }), iconBtn, nameInput, el("div", { class: "spacer" }), rm]));

    const descRow = el("div", { class: "field-row" });
    descRow.appendChild(el("label", { text: "Описание" }));
    const descInput = el("textarea", {});
    descInput.value = mob.description || "";
    descInput.addEventListener("change", () => { mob.description = descInput.value; });
    descRow.appendChild(descInput);
    card.appendChild(descRow);

    const locRow = el("div", { class: "field-row" });
    locRow.appendChild(el("label", { text: "Локация («Охота»)" }));
    locRow.appendChild(locationSelect(mob.location, (v) => { mob.location = v; }));
    locRow.appendChild(el("span", { class: "hint", text: "любая локация может быть «Охотой» - достаточно, чтобы хотя бы один моб/босс на неё ссылался" }));
    card.appendChild(locRow);

    const techRow = el("div", { class: "field-row" });
    techRow.appendChild(el("label", { text: "Нужна технология" }));
    techRow.appendChild(techSelect(mob.requires_tech, (v) => { mob.requires_tech = v; }));
    card.appendChild(techRow);

    const reqBuildingRow = el("div", { class: "field-row" });
    reqBuildingRow.appendChild(el("label", { text: "Нужна постройка" }));
    reqBuildingRow.appendChild(buildingRequirementSelect(mob.requires_building || null, (v) => { mob.requires_building = v; }));
    card.appendChild(reqBuildingRow);

    const bossRow = el("div", { class: "field-row" });
    const bossCheck = el("input", { type: "checkbox" });
    bossCheck.checked = !!mob.is_boss;
    bossCheck.addEventListener("change", () => {
      mob.is_boss = bossCheck.checked;
      if (mob.is_boss) {
        delete mob.soul_id; delete mob.soul_chance; delete mob.rarity;
        if (!mob.summon_cost) mob.summon_cost = {};
      } else {
        delete mob.summon_cost;
        delete mob.turn_limit;
        if (mob.rarity == null) mob.rarity = 1;
      }
      renderMobs();
    });
    bossRow.appendChild(bossCheck);
    bossRow.appendChild(el("label", { text: "Босс (is_boss)" }));
    bossRow.appendChild(el("span", { class: "hint", text: "боссов не встречают случайно - их призывают вручную кнопкой, за цену summon_cost" }));
    card.appendChild(bossRow);

    const hpRow = el("div", { class: "field-row" });
    hpRow.appendChild(el("label", { text: "HP" }));
    const hpInput = el("input", { type: "number", min: "1", value: mob.hp ?? 1 });
    hpInput.addEventListener("change", () => { mob.hp = Number(hpInput.value) || 1; });
    hpRow.appendChild(hpInput);
    card.appendChild(hpRow);

    const damageRow = el("div", { class: "field-row" });
    damageRow.appendChild(el("label", { text: "Урон по игроку (damage)" }));
    const damageInput = el("input", { type: "number", min: "0", value: mob.damage ?? 0 });
    damageInput.addEventListener("change", () => { mob.damage = Number(damageInput.value) || 0; });
    damageRow.appendChild(damageInput);
    damageRow.appendChild(el("span", { class: "hint", text: "ответный удар, только если атака игрока НЕ убила моба за этот раз - см. game/engine.py:attack_encounter" }));
    card.appendChild(damageRow);

    const xpRow = el("div", { class: "field-row" });
    xpRow.appendChild(el("label", { text: "Опыт за убийство (xp_reward)" }));
    const xpInput = el("input", { type: "number", min: "0", value: mob.xp_reward ?? 0 });
    xpInput.addEventListener("change", () => { mob.xp_reward = Number(xpInput.value) || 0; });
    xpRow.appendChild(xpInput);
    card.appendChild(xpRow);

    if (!mob.is_boss) {
      const rarityRow = el("div", { class: "field-row" });
      rarityRow.appendChild(el("label", { text: "Редкость встречи (rarity)" }));
      const rarityInput = el("input", { type: "number", min: "0.01", step: "0.1", value: mob.rarity ?? 1 });
      rarityInput.addEventListener("change", () => { mob.rarity = Number(rarityInput.value) || 1; });
      rarityRow.appendChild(rarityInput);
      rarityRow.appendChild(el("span", { class: "hint", text: "как у руды в Добыче - чем МЕНЬШЕ число, тем чаще встречается относительно других мобов той же локации" }));
      card.appendChild(rarityRow);
    }

    if (!mob.loot) mob.loot = {};
    card.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Лут при убийстве (гарантированный)" })]));
    const lootBox = el("div", { class: "dict-editor" });
    const lootChanceBox = el("div", { class: "dict-editor" });
    renderDictEditor(lootBox, mob.loot, () => renderChanceOnlyEditor(lootChanceBox, mob, "loot", "loot_chance"));
    card.appendChild(lootBox);

    card.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Шанс на каждый ресурс лута (%, необязательно)" })]));
    renderChanceOnlyEditor(lootChanceBox, mob, "loot", "loot_chance");
    card.appendChild(lootChanceBox);

    if (mob.is_boss) {
      if (!mob.summon_cost) mob.summon_cost = {};
      card.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Цена призыва (summon_cost)" })]));
      const summonBox = el("div", { class: "dict-editor" });
      renderDictEditor(summonBox, mob.summon_cost);
      card.appendChild(summonBox);

      const turnLimitRow = el("div", { class: "field-row" });
      turnLimitRow.appendChild(el("label", { text: "Лимит ходов на убийство (необязательно)" }));
      const turnLimitInput = el("input", { type: "number", min: "1", step: "1", value: mob.turn_limit ?? "", placeholder: "нет лимита" });
      turnLimitInput.addEventListener("change", () => {
        if (turnLimitInput.value === "") delete mob.turn_limit;
        else mob.turn_limit = Math.max(1, Math.round(Number(turnLimitInput.value) || 1));
      });
      turnLimitRow.appendChild(turnLimitInput);
      turnLimitRow.appendChild(el("span", { class: "hint", text:
        "если не убить босса за столько ходов ПОСЛЕ призыва - он сбегает сам (схватка обрывается, прогресс/цена "
        + "призыва теряются, как при обычном abandon_encounter). Пусто - лимита нет, как раньше." }));
      card.appendChild(turnLimitRow);
    } else {
      const soulRow = el("div", { class: "field-row" });
      soulRow.appendChild(el("label", { text: "Душа (soul_id)" }));
      const soulEntries = DATA.resources.map(r => ({ value: r.id, label: r.name }));
      const soulSelect = genericPickerSelect(soulEntries, mob.soul_id || null, (v) => {
        if (v == null) { delete mob.soul_id; delete mob.soul_chance; }
        else { mob.soul_id = v; if (mob.soul_chance == null) mob.soul_chance = 0.05; }
        renderMobs();
      }, { title: "Выбрать ресурс", placeholder: "— не выпадает —", noneLabel: "— не выпадает —" });
      soulRow.appendChild(soulSelect);
      card.appendChild(soulRow);

      if (mob.soul_id) {
        const soulChanceRow = el("div", { class: "field-row" });
        soulChanceRow.appendChild(el("label", { text: "Шанс души, %" }));
        const soulChanceInput = el("input", { type: "number", min: "1", max: "100", value: Math.round((mob.soul_chance ?? 0.05) * 100) });
        soulChanceInput.addEventListener("change", () => {
          mob.soul_chance = Math.max(1, Math.min(100, Number(soulChanceInput.value) || 1)) / 100;
        });
        soulChanceRow.appendChild(soulChanceInput);
        soulChanceRow.appendChild(el("span", { class: "hint", text: "выбивается мечом при убийстве - домножается на soul_chance_multiplier лучшего владеемого оружия (см. вкладку «Инструменты»)" }));
        card.appendChild(soulChanceRow);
      }
    }

    makeCardCollapsible(card);
    cardsBox.appendChild(card);
  });
  filterBar._apply();

  root.appendChild(renderSoulRecipesSection());
}

// Виды поломки построек (content.json["breakdown_types"], необязательный
// раздел) - buildings.*.breakdown_types (см. renderBuildings) ссылается на эти
// id. Удаление вида/инструмента отсюда НЕ чистит дальние ссылки само по себе
// (тот же принцип, что удаление приёма боя/инструмента - см. combat_moves) -
// осиротевшую ссылку поймает validate() при сохранении.
function renderBreakdownTypes() {
  const root = document.getElementById("tab-breakdown-types");
  root.innerHTML = "";
  if (!DATA.breakdown_types) DATA.breakdown_types = {};
  root.appendChild(el("p", { class: "hint", text:
    "Необязательная подсистема поломок построек (см. CLAUDE.md). Постройка без единого отмеченного здесь "
    + "вида поломки (вкладка «Постройки») ломается \"без типа\" - починка не требует инструмента, как раньше. "
    + "required_tools - инструменты (вкладка «Инструменты»), которыми должен ВЛАДЕТЬ игрок (тир 2+, т.е. не "
    + "стартовый \"без инструмента\"), чтобы починить поломку этого вида - если инструментов несколько, нужны "
    + "ВСЕ сразу." }));

  const cardsBox = el("div");
  const filterBar = makeFilterBar("breakdown-types", cardsBox);
  const addForm = idPromptAndAdd("вид поломки", (id) => {
    DATA.breakdown_types[id] = { name: "Новый вид поломки", description: "", required_tools: [] };
    renderBreakdownTypes();
    jumpTo(`card-breakdown-types-${id}`, "breakdown-types", { focusName: true });
  });
  root.appendChild(makeToolbar(addForm, filterBar));
  root.appendChild(cardsBox);

  Object.entries(DATA.breakdown_types).forEach(([btId, bt]) => {
    const card = el("div", { class: "card", id: `card-breakdown-types-${btId}` });
    card.dataset.search = (btId + " " + bt.name).toLowerCase();
    const nameInput = el("input", { type: "text", value: bt.name });
    nameInput.addEventListener("change", () => { bt.name = nameInput.value; card.dataset.search = (btId + " " + bt.name).toLowerCase(); });
    const rm = el("button", { class: "small danger", text: "Удалить", onclick: () => {
      delete DATA.breakdown_types[btId];
      renderBreakdownTypes();
    }});
    card.appendChild(el("div", { class: "card-head" }, [el("code", { text: btId }), nameInput, el("div", { class: "spacer" }), rm]));

    const descRow = el("div", { class: "field-row" });
    descRow.appendChild(el("label", { text: "Описание" }));
    descRow.appendChild(descriptionTextarea(bt.description, "Что случилось с постройкой и как это выглядит для игрока", (v) => { bt.description = v; }));
    card.appendChild(descRow);

    const toolEntries = Object.entries(DATA.tools || {});
    card.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Нужные инструменты (required_tools)" })]));
    if (!toolEntries.length) {
      card.appendChild(el("p", { class: "hint", text: "Инструментов пока нет - заведи их на вкладке «Инструменты»." }));
    } else {
      if (!Array.isArray(bt.required_tools)) bt.required_tools = [];
      const toolsBox = el("div", { class: "req-list" });
      toolEntries.forEach(([toolId, tool]) => {
        const cb = el("input", { type: "checkbox" });
        cb.checked = bt.required_tools.includes(toolId);
        cb.addEventListener("change", () => {
          if (cb.checked) {
            if (!bt.required_tools.includes(toolId)) bt.required_tools.push(toolId);
          } else {
            bt.required_tools = bt.required_tools.filter(x => x !== toolId);
          }
        });
        toolsBox.appendChild(el("label", {}, [cb, document.createTextNode(tool.name)]));
      });
      card.appendChild(toolsBox);
    }

    cardsBox.appendChild(card);
  });
}

  Object.entries(DATA.skills).forEach(([skid, skill]) => {
    const card = el("div", { class: "card", id: `card-skills-${skid}` });
    card.dataset.search = (skid + " " + skill.name).toLowerCase();
    const nameInput = el("input", { type: "text", value: skill.name });
    nameInput.addEventListener("change", () => { skill.name = nameInput.value; card.dataset.search = (skid + " " + skill.name).toLowerCase(); });
    const rm = el("button", { class: "small danger", text: "Удалить", onclick: () => {
      delete DATA.skills[skid];
      renderSkills();
    }});
    card.appendChild(el("div", { class: "card-head" }, [el("code", { text: skid }), nameInput, el("div", { class: "spacer" }), rm]));

    const descRow = el("div", { class: "field-row" });
    descRow.appendChild(el("label", { text: "Описание" }));
    const descInput = el("input", { type: "text", value: skill.description || "" });
    descInput.addEventListener("change", () => { skill.description = descInput.value; });
    descRow.appendChild(descInput);
    card.appendChild(descRow);

    if (!Array.isArray(skill.levels) || !skill.levels.length) skill.levels = [{ xp_required: 0, effects: {} }];
    const levelsBox = el("div", { class: "stages-box" });
    function renderLevelsBox() {
      levelsBox.innerHTML = "";
      skill.levels.forEach((lvl, i) => {
        const lvlCard = el("div", { class: "stage-card" });
        const isFirst = i === 0;
        const isLast = i === skill.levels.length - 1;
        const lvlRm = el("button", {
          class: "small danger", text: "Удалить уровень",
          disabled: (!isLast || skill.levels.length === 1) ? "true" : null,
          onclick: () => { skill.levels.pop(); renderLevelsBox(); },
        });
        lvlCard.appendChild(el("div", { class: "stage-head" }, [el("strong", { text: `Уровень ${i + 1}` }), el("div", { class: "spacer" }), lvlRm]));

        if (isFirst) {
          lvlCard.appendChild(el("p", { class: "hint", text: "Стартовый уровень - xp_required не проверяется (уровень 1 доступен всегда, с 0 опыта)." }));
        } else {
          const xpRow = el("div", { class: "field-row" });
          xpRow.appendChild(el("label", { text: "Нужно опыта (накопленного)" }));
          const xpInput = el("input", { type: "number", min: "0", value: lvl.xp_required ?? 0 });
          xpInput.addEventListener("change", () => { lvl.xp_required = Number(xpInput.value) || 0; });
          xpRow.appendChild(xpInput);
          xpRow.appendChild(el("span", { class: "hint", text: "должно быть больше, чем у предыдущего уровня" }));
          lvlCard.appendChild(xpRow);
        }

        if (!lvl.effects) lvl.effects = {};
        lvlCard.appendChild(el("div", { class: "field-row" }, [el("label", { text: "Эффекты уровня (ключ → число)" })]));
        const effectsBox = el("div", { class: "dict-editor" });
        function renderEffectsBox() {
          effectsBox.innerHTML = "";
          Object.keys(lvl.effects).forEach(key => {
            const row = el("div", { class: "dict-row" });
            const keyInput = el("input", { type: "text", value: key, placeholder: "например, damage" });
            keyInput.addEventListener("change", () => {
              const newKey = keyInput.value.trim();
              if (!newKey || newKey === key) { keyInput.value = key; return; }
              const value = lvl.effects[key];
              delete lvl.effects[key];
              lvl.effects[newKey] = value;
              renderEffectsBox();
            });
            const valueInput = el("input", { type: "number", step: "any", value: lvl.effects[key] });
            valueInput.addEventListener("change", () => { lvl.effects[key] = Number(valueInput.value) || 0; });
            const effRm = el("button", { class: "small danger", text: "✕", onclick: () => { delete lvl.effects[key]; renderEffectsBox(); } });
            row.append(keyInput, valueInput, effRm);
            effectsBox.appendChild(row);
          });
          const addEffBtn = el("button", { class: "small", text: "+ эффект", onclick: () => {
            let key = "effect", n = 1;
            while (key in lvl.effects) { key = `effect_${++n}`; }
            lvl.effects[key] = 1;
            renderEffectsBox();
          }});
          effectsBox.appendChild(addEffBtn);
        }
        renderEffectsBox();
        lvlCard.appendChild(effectsBox);

        levelsBox.appendChild(lvlCard);
      });
      const addLvlBtn = el("button", { class: "small", text: "+ добавить следующий уровень", onclick: () => {
        const prevXp = skill.levels[skill.levels.length - 1]?.xp_required ?? 0;
        skill.levels.push({ xp_required: prevXp + 10, effects: {} });
        renderLevelsBox();
      }});
      levelsBox.appendChild(addLvlBtn);
    }
    renderLevelsBox();
    card.appendChild(levelsBox);

    makeCardCollapsible(card);
    cardsBox.appendChild(card);
  });
  filterBar._apply();
}

  ["drop_chance_multiplier", "Множитель шанса И дропа, И души разом (только оружие)"],
  ["soul_chance_multiplier", "Множитель ТОЛЬКО шанса души - стакается перемножением с добычей (только оружие)"],

      renderEnchantments();
    }});
    card.appendChild(el("div", { class: "card-head" }, [el("code", { text: eid }), iconBtn, nameInput, el("div", { class: "spacer" }), rm]));

    const descRow = el("div", { class: "field-row" });

    descRow.appendChild(descriptionTextarea(ench.description, "Что оно даёт игроку", (v) => { ench.description = v; }));
    card.appendChild(descRow);

    const kindRow = el("div", { class: "field-row" });
    kindRow.appendChild(el("label", { text: "Применимо к тегу (applies_to_kind)" }));
    kindRow.appendChild(enchantKindInput(ench.applies_to_kind, (v) => { ench.applies_to_kind = v || null; }));
    kindRow.appendChild(el("span", { class: "hint", text: "пусто = универсальное, доступно ЛЮБОМУ зачаровываемому инструменту" }));

    const effectRow = el("div", { class: "field-row" });
    effectRow.appendChild(el("label", { text: "Тип эффекта (effect.type)" }));
    const effectSelect = el("select", {});
    ENCHANT_EFFECT_TYPE_OPTIONS.forEach(([value, label]) => {
      const opt = el("option", { value, text: label });
      if (ench.effect.type === value) opt.selected = true;
      effectSelect.appendChild(opt);
    });
    effectSelect.addEventListener("change", () => { ench.effect.type = effectSelect.value; });
    effectRow.appendChild(effectSelect);
    card.appendChild(effectRow);

    if (!Array.isArray(ench.levels) || !ench.levels.length) ench.levels = [{ value: 1.5 }];
    const levelsBox = el("div", { class: "stages-box" });
    function renderLevelsBox() {
      levelsBox.innerHTML = "";
      ench.levels.forEach((lvl, i) => {

        lvlCard.appendChild(valueRow);
