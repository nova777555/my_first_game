    // такой кнопки не получает.
    if (item && item.next_capacity_add !== null) {
      const costText = item.next_cost.map(c => `${c.amount} ${c.name}`).join(", ") || "бесплатно";
      const btn = el("button", { class: "storage-upgrade-btn", text: `+${item.next_capacity_add}` });
      if (item.can_upgrade) {
        btn.title = `Расширить склад: +${item.next_capacity_add} (${costText})`;
        const key = `storage_upgrade:${rid}`;
        const delay = VIEW.default_action_delay_ms;
        const remaining = cooldownRemainingMs(key);
        if (remaining > 0) applyCooldownVisual(btn, remaining, delay);
        btn.addEventListener("click", () => tryRunAction(key, delay, btn, () => doAction("storage_upgrade", rid)));
      } else {
        btn.disabled = true;
        btn.title = `Нужна технология «${item.next_tech_name}» (${costText})`;
      }
      tile.appendChild(btn);
    }
    grid.appendChild(tile);
  });
  if (!grid.children.length) {
    grid.appendChild(el("div", { class: "empty-note", text: "Пока нечего показать - ни одного ресурса на руках." }));
  }
  const controls = el("div", { class: "storage-controls-row" });
  controls.appendChild(makeResourceSearchBar(grid, {
    get: () => storageSearchQuery,
    set: (v) => { storageSearchQuery = v; },
  }));
  controls.appendChild(makeStorageSortBar());
  modal.appendChild(controls);
  modal.appendChild(grid);

  overlay.appendChild(modal);
  overlay.id = "storageOverlay";
  document.body.appendChild(overlay);
  if (savedScroll !== null) modal.scrollTop = savedScroll;
}

function closeStorage() {
  const overlay = document.getElementById("storageOverlay");
  if (overlay) overlay.remove();
}

// ---------- статистика за диапазон ходов ----------

function openStats() {
  closeStats();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeStats(); });

  const modal = el("div", { class: "modal stats-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Статистика" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: closeStats }));
  modal.appendChild(head);

  const currentTurn = Math.max(VIEW.turn - 1, 1);
  const fromInput = el("input", { type: "number", min: "1", value: String(Math.max(1, currentTurn - 19)) });
  const toInput = el("input", { type: "number", min: "1", value: String(currentTurn) });

  const range = el("div", { class: "stats-range-row" }, [
    el("label", { text: "С хода" }), fromInput, el("label", { text: "по ход" }), toInput,
  ]);
  const showBtn = el("button", { class: "primary", text: "Показать" });
  range.appendChild(showBtn);
  modal.appendChild(range);

  const presets = el("div", { class: "stats-presets" });
  [["10", 10], ["50", 50], ["100", 100]].forEach(([label, n]) => {
    presets.appendChild(el("button", { text: `Последние ${label}`, onclick: () => {
      fromInput.value = String(Math.max(1, currentTurn - n + 1));
      toInput.value = String(currentTurn);
      loadStats();
    }}));
  });
  presets.appendChild(el("button", { text: "Вся игра", onclick: () => {
    fromInput.value = "1";
    toInput.value = String(currentTurn);
    loadStats();
  }}));
  modal.appendChild(presets);

  const body = el("div", { class: "stats-body" });
  modal.appendChild(body);

  async function loadStats() {
    const start_turn = parseInt(fromInput.value, 10);
    const end_turn = parseInt(toInput.value, 10);
    body.innerHTML = "";
    if (!Number.isFinite(start_turn) || !Number.isFinite(end_turn) || start_turn > end_turn) {
      body.appendChild(el("div", { class: "stats-empty", text: "Некорректный диапазон." }));
      return;
    }
    const res = await fetch("/api/stats", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ start_turn, end_turn }),
    });
    const payload = await res.json();
    renderStatsBody(body, payload.stats, start_turn, end_turn);
  }

  showBtn.addEventListener("click", loadStats);
  overlay.appendChild(modal);
  overlay.id = "statsOverlay";
  document.body.appendChild(overlay);
  loadStats();
}

function closeStats() {
  const overlay = document.getElementById("statsOverlay");
  if (overlay) overlay.remove();
}

// ---------- именованные сохранения ----------

async function fetchSaves() {
  const res = await fetch("/api/saves");
  const payload = await res.json();
  return payload.saves || [];
}

function formatSaveDate(unixSeconds) {
  return new Date(unixSeconds * 1000).toLocaleString();
}

async function openSaves() {
  closeSaves();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeSaves(); });

  const modal = el("div", { class: "modal saves-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Сохранения" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: closeSaves }));
  modal.appendChild(head);

  const newRow = el("div", { class: "saves-new-row" });
  const nameInput = el("input", { type: "text", placeholder: "Имя нового сохранения" });
  const saveBtn = el("button", { class: "primary", text: "Сохранить как" });
  newRow.appendChild(nameInput);
  newRow.appendChild(saveBtn);
  modal.appendChild(newRow);

  const list = el("div", { class: "saves-list" });
  modal.appendChild(list);

  async function renderList() {
    list.innerHTML = "";
    const saves = await fetchSaves();
    if (!saves.length) {
      list.appendChild(el("div", { class: "stats-empty", text: "Пока нет ни одного именованного сохранения." }));
      return;
    }
    saves.forEach(save => {
      const item = el("div", { class: "save-item" });
      const info = el("div", { class: "info" });
      info.appendChild(el("div", { class: "name", text: save.name }));
      info.appendChild(el("div", { class: "meta", text: `Ход ${save.turn} · ${formatSaveDate(save.modified)}` }));
      item.appendChild(info);

      const openBtn = el("button", { class: "primary", text: "Открыть" });
      openBtn.addEventListener("click", async () => {
        if (!confirm(`Открыть сохранение «${save.name}»? Текущая игра будет заменена им.`)) return;
        const res = await fetch("/api/saves/load", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: save.name }),
        });
        if (!res.ok) {
          const err = await res.json();
          alert(err.error || "Не удалось открыть сохранение.");
          return;
        }
        const payload = await res.json();
        VIEW = payload.state;
        activeActionTab = "locations";
        activeLocationTab = null;
        selectedTechId = null;
        lastRenderedActionView = null;
        renderAll();
        pushLog({ message: `Загружено сохранение «${save.name}».`, ok: true, action_deltas: [], production_deltas: [], idle: [], broken: [] });
        closeSaves();
      });
      item.appendChild(openBtn);
      list.appendChild(item);
    });
  }

  saveBtn.addEventListener("click", async () => {
    const name = nameInput.value.trim();
    if (!name) { alert("Введи имя сохранения."); return; }
    const res = await fetch("/api/saves/save", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }),
    });
    if (!res.ok) {
      const err = await res.json();
      alert(err.error || "Не удалось сохранить.");
      return;
    }
    const payload = await res.json();
    VIEW = payload.state;
    renderAll();
    pushLog({ message: `Сохранено как «${name}».`, ok: true, action_deltas: [], production_deltas: [], idle: [], broken: [] });
    nameInput.value = "";
    renderList();
  });
  nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") saveBtn.click(); });

  const resetRow = el("div", { class: "saves-reset-row" });
  resetRow.appendChild(el("button", { class: "danger", text: "Начать заново (обнулить весь прогресс)", onclick: doReset }));
  modal.appendChild(resetRow);

  overlay.appendChild(modal);
  overlay.id = "savesOverlay";
  document.body.appendChild(overlay);
  renderList();
}

function closeSaves() {
  const overlay = document.getElementById("savesOverlay");
  if (overlay) overlay.remove();
}

function statRow(iconDef, label, amount, signed) {
  const row = el("div", { class: "stats-row" });
  if (iconDef) row.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 18));
  row.appendChild(el("span", { text: label }));
  const cls = signed ? (amount >= 0 ? "amount pos" : "amount neg") : "amount";
  const text = signed ? `${amount >= 0 ? "+" : ""}${amount}` : String(amount);
  row.appendChild(el("span", { class: cls, text }));
  return row;
}

function renderStatsBody(body, stats, start_turn, end_turn) {
  body.innerHTML = "";
  if (!stats) {
    body.appendChild(el("div", { class: "stats-empty", text: `За ходы ${start_turn}-${end_turn} нет данных - возможно, они ещё не наступили, либо эта часть истории уже вытеснена более новыми ходами.` }));
    return;
  }

  const overview = el("div", { class: "stats-section" });
  overview.appendChild(el("h4", { text: "Обзор" }));
  overview.appendChild(el("div", { class: "stats-row" }, [
    el("span", { text: `Ходов записано: ${stats.turns_recorded}, пропущено: ${stats.turns_skipped}` }),
  ]));
  overview.appendChild(el("div", { class: "stats-row" }, [
    el("span", { text: `Поломок: ${stats.total_breakdowns}, ремонтов: ${stats.total_repairs}` }),
  ]));
  body.appendChild(overview);

  if (stats.resource_gained.length || stats.resource_spent.length) {
    const sec = el("div", { class: "stats-section" });
    sec.appendChild(el("h4", { text: "Ресурсы" }));
    const spentById = Object.fromEntries(stats.resource_spent.map(r => [r.id, r.amount]));
    const netById = Object.fromEntries(stats.resource_net.map(r => [r.id, r.amount]));
    const ids = new Set([...stats.resource_gained.map(r => r.id), ...stats.resource_spent.map(r => r.id)]);
    stats.resource_gained.forEach(r => {
      const iconDef = resourceIcon(r.id);
      const spent = spentById[r.id] || 0;
      const net = netById[r.id] || 0;
      sec.appendChild(statRow(iconDef, `${r.name}: получено ${r.amount}, потрачено ${spent}`, net, true));
      ids.delete(r.id);
    });
    stats.resource_spent.forEach(r => {
      if (!ids.has(r.id)) return; // уже показан выше вместе с "получено"
      const iconDef = resourceIcon(r.id);
      sec.appendChild(statRow(iconDef, `${r.name}: получено 0, потрачено ${r.amount}`, -r.amount, true));
    });
    body.appendChild(sec);
  }

  if (stats.techs_researched.length) {
    const sec = el("div", { class: "stats-section" });
    sec.appendChild(el("h4", { text: `Исследовано технологий: ${stats.techs_researched.length}` }));
    sec.appendChild(el("div", { class: "stats-row" }, [el("span", { text: stats.techs_researched.map(t => t.name).join(", ") })]));
    body.appendChild(sec);
  }

  if (stats.buildings_built.length) {
    const sec = el("div", { class: "stats-section" });
    sec.appendChild(el("h4", { text: "Построено" }));
    stats.buildings_built.forEach(b => {
      sec.appendChild(statRow({ grid: ICONS.machine.grid, palette: BUILDING_PALETTE.ok }, b.name, b.amount, false));
    });
    body.appendChild(sec);
  }

  if (stats.quests_completed.length) {
    const sec = el("div", { class: "stats-section" });
    sec.appendChild(el("h4", { text: "Выполнено квестов" }));
    stats.quests_completed.forEach(q => {
      const row = el("div", { class: "stats-row" });
      row.appendChild(el("span", { text: q.name }));
      sec.appendChild(row);
    });
    body.appendChild(sec);
  }

  if (!stats.resource_gained.length && !stats.resource_spent.length && !stats.techs_researched.length
    && !stats.buildings_built.length && !stats.quests_completed.length) {
    body.appendChild(el("div", { class: "stats-empty", text: "За этот диапазон ничего не произошло." }));
  }
}

{
  const soundControl = document.getElementById("soundControl");
  const soundBtn = document.getElementById("soundToggleBtn");
  const soundPanel = document.getElementById("soundPanel");
  soundBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    soundPanel.hidden = !soundPanel.hidden;
    // Панель по умолчанию прижата правым краем к кнопке (см. .sound-panel) - на
    // достаточно узком окне (особенно если сама кнопка съехала в начало строки
    // из-за переноса .hud-nav) это уводит её за левый край видимой области.
    // Переключаемся на левое прижатие, только если правое реально не влезло.
    if (!soundPanel.hidden) {
      soundPanel.style.left = "";
      soundPanel.style.right = "0";
      if (soundPanel.getBoundingClientRect().left < 0) {
        soundPanel.style.right = "auto";
        soundPanel.style.left = "0";
      }
    }
  });
  document.addEventListener("click", (e) => {
    if (!soundPanel.hidden && !soundControl.contains(e.target)) soundPanel.hidden = true;
  });
  const musicSlider = document.getElementById("musicVolumeSlider");
  musicSlider.value = String(Math.round(_musicVolume * 100));
  musicSlider.addEventListener("input", () => setMusicVolume(Number(musicSlider.value) / 100));
  const sfxSlider = document.getElementById("sfxVolumeSlider");
  sfxSlider.value = String(Math.round(_sfxVolume * 100));
  sfxSlider.addEventListener("input", () => setSfxVolume(Number(sfxSlider.value) / 100));
  _applyVolumes();
}
// Звук нажатия по ЛЮБОЙ кнопке интерфейса - тактильный отклик "живой" игры,
// отдельный от звука РЕЗУЛЬТАТА действия (playSound("success")/... в doAction,
// который играет чуть позже, уже после ответа сервера). Capture-фаза - чтобы
// сработать, даже если обработчик клика на самой кнопке остановит всплытие.
document.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (btn && !btn.disabled) playGlobalSound("button_click");
}, true);
{

document.getElementById("autocraftToggle").addEventListener("change", async () => {
  if (busy) return;
  busy = true;
  try {
    const res = await fetch("/api/autocraft_toggle", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    const payload = await res.json();
    VIEW = payload.state;
    renderAll();
  } finally {
    busy = false;
  }
});

// Глобальные слушатели для панорамирования дерева технологий/квестов (см.
// enableGraphPanning) - ровно одна пара на весь документ, а не по одной на
// каждый .tech-graph, иначе они копились бы на window с каждой перерисовкой.
// graphPanRafPending коалесцирует redraw() рёбер до одного раза за кадр - сам
// transform (applyGraphTransform) применяется немедленно на каждый mousemove
// (дёшево), а вот пересборка SVG-путей в redraw() дороже и не обязана поспевать
// за каждым отдельным событием мыши, которых может быть намного больше, чем
// кадров в секунду.
let graphPanRafPending = false;
window.addEventListener("mousemove", (e) => {
  if (!graphPanState) return;
  const { cols, zoomState, startX, startY, panX0, panY0 } = graphPanState;
  zoomState.panX = panX0 + (e.clientX - startX);
  zoomState.panY = panY0 + (e.clientY - startY);
  applyGraphTransform(cols, zoomState);
  if (!graphPanRafPending) {
    graphPanRafPending = true;
    requestAnimationFrame(() => {
      graphPanRafPending = false;
      if (graphPanState) graphPanState.redraw();
    });
  }
});
window.addEventListener("mouseup", () => {
  if (!graphPanState) return;
  graphPanState.graph.classList.remove("panning");
  graphPanState = null;
});

loadState();

(function setupAutoShutdown() {
  const ping = () => fetch("/api/heartbeat", { method: "POST" }).catch(() => {});
  ping();
  setInterval(ping, 15000);
  window.addEventListener("pagehide", () => {
    navigator.sendBeacon("/api/shutdown");
  });
})();
</script>
