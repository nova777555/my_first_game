  const chip = el("span", { class: `cost-chip${isProduce ? " gain" : ""}` });
  const iconDef = resourceIcon(resId);
  if (iconDef) chip.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 14));
  chip.appendChild(document.createTextNode(`${isProduce ? "+" : "-"}${formatAmount(amount)}/ход`));
  return chip;
}

// Иконка + НАЗВАНИЕ ресурса, БЕЗ числа - для слота особи в модалке "Особи":
// показывает, ЧТО производит эта пчела, но не сколько (см. CLAUDE.md).
function produceLabelChip(resId, name) {
  const chip = el("span", { class: "cost-chip gain" });
  const iconDef = resourceIcon(resId);
  if (iconDef) chip.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 14));
  chip.appendChild(document.createTextNode(name));
  return chip;
}

// Иконка + процент шанса бонусной продукции промышленной пасеки, БЕЗ числа
// объёма (см. entry.bonus_produce - engine.creature_view/_process_habitat).
function produceChanceChip(resId, name, chance) {
  const chip = el("span", { class: "cost-chip gain bonus-chip" });
  const iconDef = resourceIcon(resId);
  if (iconDef) chip.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 14));
  chip.appendChild(document.createTextNode(`${Math.round(chance * 100)}%`));
  chip.title = `Бонус: ${name}, только если среда пасеки совпадает со средой этой пчелы`;
  return chip;
}

function upkeepRow(item) {
  // Что постройка будет производить/тратить каждый ход ПОСЛЕ постройки - отдельно
  // от одноразовой цены постройки выше, чтобы не перепутать одно с другим.
  if (!item.produces.length && !item.consumes.length) return null;
  const row = el("div", { class: "costs" });
  row.appendChild(el("span", { class: "note-chip", text: "содержание/ход:" }));
  item.produces.forEach(c => row.appendChild(perTurnChip(c.id, c.amount, true)));
  item.consumes.forEach(c => row.appendChild(perTurnChip(c.id, c.amount, false)));
  return row;
}

function specialAbilitiesRow(item) {
  // Процессорная мощность / разблокировка автокрафта / крафт из энергии - то,
  // что не сводится к обычным produces/consumes за ход, но важно знать ДО постройки.
  const notes = [];
  if (item.compute_power > 0) notes.push(`+${item.compute_power} вычислит. мощности`);
  if (item.autocraft_speed > 0) notes.push(`+${item.autocraft_speed} скорости автокрафта`);
  if (item.autocraft_slots > 0) notes.push(`+${item.autocraft_slots} слот(ов) автокрафта`);
  if (item.unlocks_autocraft.length) notes.push(`открывает автокрафт: ${item.unlocks_autocraft.join(", ")}`);
  if (item.energy_converter) {
    const cap = item.energy_converter.max_energy_per_turn;
    notes.push(`энергетический преобразователь (${cap == null ? "без ограничения" : `до ${cap}`} энергии/ход) - рецепт выбирается в «Преобразователе»`);
  }
  if (!notes.length) return null;
  const row = el("div", { class: "costs" });
  notes.forEach(text => row.appendChild(el("span", { class: "note-chip", text })));
  return row;
}

function actionLabel(kind, item) {
  if (kind === "hunting") {
    if (item.kind === "search") return "Искать";
    if (item.kind === "attack") return `Атаковать: ${item.name}`;
    if (item.kind === "summon") return `Призвать: ${item.name}`;
  }
  if (kind === "converter") return `Запустить: ${item.name}`;
  if (kind === "build" && item.stage_total > 1) {
    return `${item.name}: ${item.stage_description} (Стадия ${item.stage_number} из ${item.stage_total})`;
  }
  // Ровно 1 этап в construction_stages - счётчик "1 из 1" ничего не говорит игроку,
  // но описание этапа всё равно показываем (см. game/engine.py:current_construction_stage).
  if (kind === "build" && item.stage_total === 1) {
    return `${item.name}: ${item.stage_description}`;
  }
  if (kind === "build" && item.max_count != null) return `${item.name} (построено: ${item.owned}/${item.max_count})`;
  if (kind === "build" && item.owned) return `${item.name} (уже построено: ${item.owned})`;
  return item.name;
}

function actionCard(kind, item) {
  // "Ползунок масштаба ручного действия" (см. CLAUDE.md) - только у ручных
  // действий, зависящих от механизма с купленным scale-апгрейдом
  // (item.scale_cap > 1, см. tools/web_ui.py:build_view). item.cost/item.gain
  // для таких действий приходят UNIT-ом (за x1 партию, см. build_view) - карточка
  // сама домножает их на текущее положение ползунка, без похода на сервер.
  const hasScale = kind === "manual" && item.scale_cap > 1;
  const manualJobRunning = kind === "manual" && item.already_running;
  const manualLocationBlocked = kind === "manual" && !manualJobRunning && !!item.blocked_by;
  const scaleStateKey = `manual:${item.id}`;
  if (hasScale && !(scaleStateKey in manualActionScale)) {
    manualActionScale[scaleStateKey] = item.scale_cap; // по умолчанию - максимум, как было раньше без ползунка
  }
  let currentScale = hasScale ? manualActionScale[scaleStateKey] : 1;

  const btn = el("button", { class: "action-card" });
  // data-action-id идёт либо на саму кнопку (простой случай, без обёртки), либо
  // на group ниже - никогда на оба сразу (см. group.dataset.actionId).
  if (kind === "manual" && !hasScale && !manualJobRunning) btn.dataset.actionId = item.id;

  let iconDef = null;
  if (kind === "build") {
    iconDef = buildingIcon(item.id) || { grid: ICONS.machine.grid, palette: BUILDING_PALETTE.ok };
  } else if (kind === "manual" && item.gain && item.gain[0]) {
    iconDef = resourceIcon(item.gain[0].id);
  } else if (kind === "converter") {
    iconDef = (item.produces[0] && resourceIcon(item.produces[0].id)) || ICONS.energy;
  } else if (kind === "hunting") {
    iconDef = ICONS.machine;
  }
  if (iconDef) btn.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 30));

  const main = el("div", { class: "main" });
  main.appendChild(el("div", { class: "name", text: actionLabel(kind, item) }));
  if ((kind === "build" || kind === "converter" || (kind === "hunting" && item.kind === "summon")) && item.description) {
    main.appendChild(el("div", { class: "desc", text: item.description }));
  }

  const costs = el("div", { class: "costs" });
  const renderCosts = (scale) => {
    costs.innerHTML = "";
    (item.cost || []).forEach(c => costs.appendChild(costChip(c.id, scaleAmount(c.amount, scale), false, c.jump_to, c.chance)));
    (item.gain || []).forEach(c => costs.appendChild(costChip(c.id, scaleAmount(c.amount, scale), true, undefined, c.chance)));
    if (kind === "converter") {
      item.produces.forEach(c => costs.appendChild(costChip(c.id, c.amount, true)));
      costs.appendChild(el("span", { class: "note-chip", text: `${item.threshold} энергии` }));
      if (item.already_running) costs.appendChild(el("span", { class: "note-chip", text: "уже выполняется" }));
      else if (!item.available) costs.appendChild(el("span", { class: "note-chip", text: "все преобразователи заняты" }));
    }
    if (kind === "manual" && item.duration_turns) {
      const chipText = item.already_running
        ? `${item.turns_done}/${item.turns_total} ход(ов)`
        : `займёт ${item.duration_turns} ход(ов)`;
      costs.appendChild(el("span", { class: "note-chip", text: chipText }));
      if (manualLocationBlocked) costs.appendChild(el("span", { class: "note-chip", text: `занято: «${item.blocked_by}»` }));
    }
    if (kind === "hunting" && item.kind === "search") {
      costs.appendChild(el("span", { class: "note-chip", text: "рандомная встреча" }));
    }
    if (kind === "hunting" && item.kind === "summon") {
      (item.summon_cost || []).forEach(c => costs.appendChild(costChip(c.id, c.amount, false, c.jump_to)));
      costs.appendChild(el("span", { class: "note-chip", text: `HP: ${item.hp}` }));
    }
    if (!costs.children.length) costs.appendChild(el("span", { class: "note-chip", text: "бесплатно" }));
  };
  renderCosts(currentScale);
  main.appendChild(costs);
  if (kind === "build") {
    const upkeep = upkeepRow(item);
    if (upkeep) main.appendChild(upkeep);
    const special = specialAbilitiesRow(item);
    if (special) main.appendChild(special);
  }
  btn.appendChild(main);

  // Кнопка "⚙ Улучшения" сюда больше не заходит - постройка, упёршаяся в
  // max_count, теперь просто пропадает из этого каталога (см. tools/web_ui.py:
  // build_view), а сама кнопка живёт в панели "Производственные мощности"
  // (см. renderBuildings) - каталог "Построить" всегда показывает только то,
  // что ещё можно построить.
  const noFreeConverter = kind === "converter" && !item.available;
  if (noFreeConverter) {
    btn.disabled = true;
    btn.title = "Все энергетические преобразователи заняты - дождись завершения текущего крафта";
  } else if (manualJobRunning) {
    btn.disabled = true;
    btn.title = "Это действие уже выполняется - прогресс и отмена ниже";
  } else if (manualLocationBlocked) {
    btn.disabled = true;
    btn.title = `В этой локации уже выполняется другое действие: «${item.blocked_by}»`;
  } else {
    const { key, delay } = actionCooldownInfo(kind, item);
    const remaining = cooldownRemainingMs(key);
    if (remaining > 0) applyCooldownVisual(btn, remaining, delay);
    // currentScale читается В МОМЕНТ КЛИКА (замыкание над let-переменной), а не
    // на момент создания кнопки - слайдер ниже переприсваивает её при движении,
    // так что клик всегда уходит с ТЕКУЩИМ положением ползунка.
    btn.addEventListener("click", () => tryRunAction(key, delay, btn, () => runAction(kind, item, hasScale ? currentScale : undefined)));
  }

  if (!hasScale && !manualJobRunning) return btn;

  // Прогресс-бар/ползунок живут СНАРУЖИ <button> (не внутри неё) - вложенные
  // интерактивные элементы внутри нативной кнопки ненадёжны в браузерах
  // (перетаскивание слайдера или клик по "✕" конфликтуют с кликом по самой
  // кнопке) - тот же принцип, что уже применялся к costChip.jumpable
  // (см. CLAUDE.md), только в этот раз обойти нельзя одним stopPropagation,
  // поэтому целая группа-обёртка. data-action-id/data-search
  // (см. addCard) обязаны быть на ЭТОЙ обёртке - именно она попадает в DOM
  // .action-list, и именно её ищет jumpToAction/фильтр по локации.
  const group = el("div", { class: "action-card-group" });
  group.dataset.actionId = item.id;
  group.appendChild(btn);

  if (manualJobRunning) group.appendChild(manualJobProgressRow(item.id, item.turns_done, item.turns_total));

  if (!hasScale) return group;

  const sliderRow = el("div", { class: "scale-slider-row" });
  sliderRow.appendChild(el("span", { class: "scale-slider-label", text: "Партий за раз:" }));
  const slider = el("input", {
    type: "range", min: "1", max: String(item.scale_cap), step: "1", value: String(currentScale),
  });
  const valueLabel = el("span", { class: "scale-slider-value mono", text: `×${currentScale}` });
  slider.addEventListener("input", () => {
    currentScale = Number(slider.value);
    manualActionScale[scaleStateKey] = currentScale;
    valueLabel.textContent = `×${currentScale}`;
    renderCosts(currentScale);
  });
  sliderRow.append(slider, valueLabel);
  group.appendChild(sliderRow);
  return group;
}

function runAction(kind, item, scale) {
  if (kind === "manual") return doAction("manual", item.id, scale);
  if (kind === "build") return doAction("build", item.id);
  if (kind === "converter") return doAction("start_energy_recipe", item.id);
  if (kind === "hunting") {
    // После успешного поиска/призыва (VIEW.hunting.active_encounter появился)
    // сразу открываем модалку "Охота" - см. openHuntingModal. doAction() уже
    // обновил VIEW и один раз перерисовал страницу к моменту, когда resolve'ится
    // этот .then(), так что openHuntingModal() тут видит свежие данные.
    if (item.kind === "search") {
      return doAction("hunt_search", item.location).then(() => {
        if (VIEW.hunting.active_encounter) openHuntingModal();
      });
    }
    if (item.kind === "summon") {
      return doAction("summon_boss", item.id).then(() => {
        if (VIEW.hunting.active_encounter) openHuntingModal();
      });
    }
  }
}

// Заполняется renderTechTree() и живёт, пока дерево не перестроено целиком -
// клик по узлу (selectTechNode) переключает класс и подменяет только панель
// деталей НАПРЯМУЮ, не трогая .tech-graph, чтобы её прокрутка не сбрасывалась
// (тот же приём, что applyTechSelectionHighlight в редакторе контента).
let techTreeState = null;

function selectTechNode(id) {
  selectedTechId = id;
  if (!techTreeState) { renderActions(); return; }
  Object.entries(techTreeState.nodeEls).forEach(([tid, node]) => {
    node.classList.toggle("selected", tid === id);
  });
  const tech = VIEW.tech_tree.find(t => t.id === id);
  techTreeState.detailBox.innerHTML = "";
  techTreeState.detailBox.appendChild(renderTechDetail(tech));
}

function renderTechTab() {
  // Само дерево (граф + детали) теперь живёт в отдельной почти полноэкранной
  // модалке (openTechTreeModal) - тут только компактная заглушка-приглашение,
  // без которой инлайновый граф был бы тесным (см. .tech-graph max-height: 360px).
  const wrap = el("div", { class: "tech-tab-placeholder" });
  wrap.appendChild(el("div", {
    class: "tech-tab-summary",
    text: `Изучено технологий: ${VIEW.techs_researched}/${VIEW.techs_total}`,
  }));
  // Текущее исследование (VIEW.active_research) - видно прямо тут, рядом с
  // кнопкой открытия дерева, чтобы не нужно было открывать модалку только
  // ради того, чтобы проверить прогресс/остаток ходов (то же самое, что
  // researchProgressRow показывает в панели "Исследование" сбоку, но здесь -
  // на самой вкладке категории действий).
  if (VIEW.active_research) {
    const box = el("div", { class: "tech-tab-research" });
    box.appendChild(researchProgressRow(VIEW.active_research, VIEW.active_research.name));
    wrap.appendChild(box);
  }
  const btn = el("button", { class: "tech-tab-open-btn", text: "Открыть дерево технологий" });
  btn.addEventListener("click", openTechTreeModal);
  wrap.appendChild(btn);
  return wrap;
}

function openTechTreeModal() {
  closeTechTreeModal();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeTechTreeModal(); });

  const modal = el("div", { class: "modal tech-modal graph-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Дерево технологий" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: closeTechTreeModal }));
  modal.appendChild(head);
  // Позиция/зум графа (см. techGraphZoom) переживают пересборку сами - объект-
  // состояние живёт СНАРУЖИ renderTechTree(), поэтому здесь больше не нужно
  // руками сохранять/восстанавливать scrollLeft/scrollTop (та же логика раньше
  // была нужна, пока панорамирование было нативным скроллом, см. CLAUDE.md про
  // enableGraphPanning).
  modal.appendChild(renderTechTree());

  overlay.appendChild(modal);
  overlay.id = "techTreeOverlay";
  document.body.appendChild(overlay);
}

function closeTechTreeModal() {
  const overlay = document.getElementById("techTreeOverlay");
  if (overlay) overlay.remove();
}

// Цикличная палитра фоновых зон графа технологий - одна на тир (см.
// content.json:techs.*.tier). Циклится по модулю, если тиров больше цветов,
// как TOOL_PALETTES у иконок кирки.
const TIER_BAND_COLORS = [
  { bg: "rgba(240,160,48,0.10)", border: "rgba(240,160,48,0.35)", text: "#f0a030" },
  { bg: "rgba(74,201,160,0.10)", border: "rgba(74,201,160,0.35)", text: "#4ac9a0" },
  { bg: "rgba(91,141,239,0.10)", border: "rgba(91,141,239,0.35)", text: "#7fa4ef" },
  { bg: "rgba(197,101,224,0.10)", border: "rgba(197,101,224,0.35)", text: "#d295e6" },
  { bg: "rgba(224,90,138,0.10)", border: "rgba(224,90,138,0.35)", text: "#e58bab" },
  { bg: "rgba(99,199,107,0.10)", border: "rgba(99,199,107,0.35)", text: "#8ed695" },
];
function tierBandColor(tier) {
  return TIER_BAND_COLORS[(tier - 1) % TIER_BAND_COLORS.length];
}

function hexToRgba(hex, alpha) {
  const m = /^#([0-9a-fA-F]{2})([0-9a-fA-F]{2})([0-9a-fA-F]{2})$/.exec(hex || "");
  if (!m) return hex;
  const r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// Оформление эры квестбука (content.json: eras[era]) - имя и главный цвет,
// заданные в редакторе контента. У эры без записи в eras (старый контент,
// только что заведённый в редакторе номер) - тот же дефолт, что был ДО
// появления этого раздела: подпись "Эра N" и цикличная палитра TIER_BAND_COLORS.
function eraTheme(era) {
  const info = VIEW.eras && VIEW.eras[String(era)];
  if (info && info.color) {
    return { bg: hexToRgba(info.color, 0.10), border: hexToRgba(info.color, 0.35), text: info.color, name: info.name || `Эра ${era}` };
  }
  const palette = tierBandColor(era);
  return { bg: palette.bg, border: palette.border, text: palette.text, name: `Эра ${era}` };
}

// Столбец графа - это НЕ тир целиком (было так, но зависимости ВНУТРИ тира,
// толпящиеся в одном столбце, было тяжело отследить визуально): тир теперь может
// занимать НЕСКОЛЬКО столбцов подряд - по одному на каждый уровень глубины СРЕДИ
// ЗАВИСИМОСТЕЙ ВНУТРИ ЭТОГО ЖЕ ТИРА (requires на технологию из ДРУГОГО тира не
// увеличивает эту локальную глубину - такая зависимость рисуется обычной, пусть
// и более длинной, кривой к более ранней колонке). Инвариант, который просил
// сохранить пользователь, всё равно держится: столбец принадлежит РОВНО одному
// тиру - тиры просто получают по несколько столбцов подряд вместо одного, и
// между ними по-прежнему можно провести вертикальную разделительную линию (это и
// есть цветная граница между .tech-col-band).
function computeTechColumns(tree) {
  const byId = {};
  tree.forEach(t => { byId[t.id] = t; });
  const tiers = [...new Set(tree.map(t => t.tier))].sort((a, b) => a - b);

  const localLevel = {};
  function localLevelOf(id, stack) {
    if (localLevel[id] !== undefined) return localLevel[id];
    if (stack.has(id)) return 0; // цикл - не должно происходить в валидном контенте
    stack.add(id);
    const t = byId[id];
    const sameTierReqs = (t.requires || []).filter(r => byId[r] && byId[r].tier === t.tier);
    localLevel[id] = sameTierReqs.length ? 1 + Math.max(...sameTierReqs.map(r => localLevelOf(r, stack))) : 0;
    return localLevel[id];
  }
  tree.forEach(t => localLevelOf(t.id, new Set()));

  const columnOf = {};
  const tierRange = {};
  let offset = 0;
  tiers.forEach(tier => {
    const idsInTier = tree.filter(t => t.tier === tier).map(t => t.id);
    const width = 1 + Math.max(0, ...idsInTier.map(id => localLevel[id]));
    idsInTier.forEach(id => { columnOf[id] = offset + localLevel[id]; });
    tierRange[tier] = { startCol: offset, endCol: offset + width - 1 };
    offset += width;
  });
  return { columnOf, tierRange, tiers };
}

function renderTechTree() {
  const wrap = el("div", { class: "tech-tree-wrap" });
  const tree = VIEW.tech_tree;
  techTreeState = null;
  if (!tree.length) {
    wrap.appendChild(el("div", { class: "empty-note", text: "В этой игре нет технологий." }));
    return wrap;
  }
  if (!tree.some(t => t.id === selectedTechId)) {
    selectedTechId = (tree.find(t => t.status === "available") || tree[0]).id;
  }

  const { columnOf, tierRange, tiers } = computeTechColumns(tree);
  const graph = el("div", { class: "tech-graph" });
  const svg = svgEl("svg", { class: "tech-edges" });
  const cols = el("div", { class: "tech-cols" });
  const nodeEls = {};
  tiers.forEach(tier => {
    const palette = tierBandColor(tier);
    const band = el("div", { class: "tech-col-band" });
    band.style.background = palette.bg;
    band.style.border = `1px solid ${palette.border}`;
    band.appendChild(el("div", { class: "tech-col-title", text: `Тир ${tier}`, style: `color:${palette.text}` }));
    const row = el("div", { class: "tech-col-row" });
    const { startCol, endCol } = tierRange[tier];
    for (let col = startCol; col <= endCol; col++) {
      const colEl = el("div", { class: "tech-col" });
      tree.filter(t => columnOf[t.id] === col).forEach(t => {
        // Идёт исследование ИМЕННО этой технологии (VIEW.active_research, см.
        // game/engine.py:research) - доп. класс поверх обычного status (узел
        // остаётся "available" по факту, ещё не в state.techs) и прогресс ходов
        // прямо в подписи узла, чтобы был виден без клика по узлу.
        const researching = VIEW.active_research && VIEW.active_research.tech_id === t.id;
        const classes = `tech-node ${t.status}${researching ? " researching" : ""}${t.id === selectedTechId ? " selected" : ""}`;
        const node = el("div", { class: classes });
        const label = researching ? `${t.name} (${VIEW.active_research.turns_done}/${VIEW.active_research.turns_total})` : t.name;
        node.appendChild(el("div", { text: label }));
        node.addEventListener("click", () => selectTechNode(t.id));
        colEl.appendChild(node);
        nodeEls[t.id] = node;
      });
      row.appendChild(colEl);
    }
    band.appendChild(row);
    cols.appendChild(band);
  });
  graph.appendChild(svg);
  graph.appendChild(cols);
  const redrawTechEdges = () => drawTechEdges(graph, svg, tree, nodeEls);
  enableGraphPanning(graph, cols, techGraphZoom, redrawTechEdges);
  enableGraphZoom(graph, cols, techGraphZoom, redrawTechEdges);
  wrap.appendChild(graph);
  const detailBox = el("div");
  detailBox.appendChild(renderTechDetail(tree.find(t => t.id === selectedTechId)));
  wrap.appendChild(detailBox);
  techTreeState = { nodeEls, detailBox };

  // Связи рисуются после того, как узлы реально попали в DOM и получили размеры -
  // без requestAnimationFrame getBoundingClientRect ещё отдал бы нули.
  requestAnimationFrame(redrawTechEdges);
  return wrap;
}

// Перетаскивание мышью для панорамирования .tech-graph. graphPanState - ОДНА
// глобальная переменная (не поле на графе), потому что mousemove/mouseup должны
// продолжать работать, даже когда курсор уходит ЗА пределы .tech-graph во время
// быстрого перетаскивания - а слушать эти события нужно на window, а не на самом
// графе.
let graphPanState = null; // { graph, cols, zoomState, redraw, startX, startY, panX0, panY0 } | null
// Текущий зум+панорама графа техов/квестов - см. enableGraphZoom/enableGraphPanning.
// Раздельные переменные (а не одна общая), потому что обе модалки могут быть
// открыты для разных целей в разное время и не должны делить один и тот же
// уровень приближения/сдвиг вида.
let techGraphZoom = { zoom: 1, panX: 0, panY: 0 };
let questGraphZoom = { zoom: 1, panX: 0, panY: 0 };

// mousedown вешается ЗАНОВО на каждый свежий .tech-graph (renderTechTree()
// пересоздаёт граф с нуля при каждой перерисовке) - это не течёт, старый
// элемент вместе со своим слушателем просто уходит в сборщик мусора. А вот
// mousemove/mouseup - глобальные и регистрируются РОВНО ОДИН РАЗ ниже, у
// bootstrap-кода в конце файла: если бы их тоже вешали здесь на window при
// каждом рендере, они бы копились там вечно (window переживает любую
// перерисовку), а не исчезали вместе с графом.
function enableGraphPanning(graph, cols, zoomState, redraw) {
  graph.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return; // только левая кнопка мыши
    if (e.target.closest(".tech-node, .quest-node")) return; // клик по узлу - это выбор технологии/квеста, не панорамирование
    graphPanState = {
      graph, cols, zoomState, redraw,
      startX: e.clientX, startY: e.clientY,
      panX0: zoomState.panX, panY0: zoomState.panY,
    };
    graph.classList.add("panning");
    e.preventDefault(); // не выделять текст на графе во время перетаскивания
  });
}

// Зум колесом мыши + панорамирование перетаскиванием для .tech-graph (и
// .tech-graph.quest-graph) - оба через ОДИН и тот же CSS transform на .tech-cols
// (translate ПОСЛЕ scale, см. applyGraphTransform), а не через нативный скролл:
// у overflow:auto-скролла есть жёсткая рамка [0, scrollWidth-clientWidth], и когда
// граф целиком помещается в модалку (частый случай для небольших квестовых эр),
// эта рамка нулевая - раньше это тихо схлопывало scrollLeft обратно в 0, и зум
// визуально цеплялся за transform-origin (левый верхний угол) вместо курсора,
// где бы тот ни стоял. .tech-edges (SVG рёбер) намеренно остаётся ВНЕ этого
// transform - drawTechEdges/drawQuestEdges честно перечитывают geometry узлов
// через getBoundingClientRect ПОСЛЕ transform (redraw(), см. ниже), поэтому рёбра
// просто сами оказываются в новых координатах без единой строчки, знающей про
// zoom/pan, а сами линии не "толстеют" при масштабировании вместе с узлами.
// GRAPH_ZOOM_MIN/MAX подобраны на глаз: ниже 0.5 узлы превращаются в нечитаемую
// кашу, выше 2 увеличивать уже незачем - обычный текст на узле и так короткий.
const GRAPH_ZOOM_MIN = 0.5;
const GRAPH_ZOOM_MAX = 2;
const GRAPH_ZOOM_STEP = 1.12;

// translate ПОСЛЕ scale (порядок в списке transform читается справа налево) -
// значит panX/panY заданы в экранных пикселях независимо от текущего зума:
// перетаскивание на 100px экрана всегда двигает вид на 100px экрана, а не на
// 100/zoom px контента. Итоговая экранная позиция точки L контента (при
// transform-origin: 0 0) = panX + zoom*L - см. вывод в enableGraphZoom.
function applyGraphTransform(cols, zoomState) {
  cols.style.transform = `translate(${zoomState.panX}px, ${zoomState.panY}px) scale(${zoomState.zoom})`;
}

// zoomState - {zoom, panX, panY}, а не голые переменные: содержимое модалки
// (renderTechTree/renderQuestGraph) пересобирается с нуля при КАЖДОМ действии
// игрока, пока модалка открыта (см. openTechTreeModal/openQuestsModal, вызываются
// заново из renderAll()) - объект-обёртка живёт СНАРУЖИ рендер-функции (как
// selectedTechId/questsActiveEra) и переживает эту пересборку, поэтому зум и
// сдвиг вида не сбрасываются при каждом клике "Исследовать"/"Забрать награду".
function enableGraphZoom(graph, cols, zoomState, redraw) {
  applyGraphTransform(cols, zoomState);
  graph.addEventListener("wheel", (e) => {
    e.preventDefault(); // колесо теперь целиком отдано зуму, не скроллу графа
    const rect = graph.getBoundingClientRect();
    const offsetX = e.clientX - rect.left;
    const offsetY = e.clientY - rect.top;
    const oldZoom = zoomState.zoom;
    // Точка контента (в координатах ДО scale, transform-origin: 0 0) под курсором -
    // экранная позиция точки L это panX + zoom*L (см. applyGraphTransform), обращаем.
    const contentX = (offsetX - zoomState.panX) / oldZoom;
    const contentY = (offsetY - zoomState.panY) / oldZoom;
    const factor = e.deltaY < 0 ? GRAPH_ZOOM_STEP : 1 / GRAPH_ZOOM_STEP;
    const newZoom = Math.min(GRAPH_ZOOM_MAX, Math.max(GRAPH_ZOOM_MIN, oldZoom * factor));
    if (newZoom === oldZoom) return;
    // Подбираем panX/panY так, чтобы contentX/contentY остались РОВНО под курсором,
    // где бы он ни стоял - чистый translate, без чужого клэмпинга (см. комментарий
    // к GRAPH_ZOOM_MIN выше).
    zoomState.zoom = newZoom;
    zoomState.panX = offsetX - newZoom * contentX;
    zoomState.panY = offsetY - newZoom * contentY;
    applyGraphTransform(cols, zoomState);
    redraw();
  }, { passive: false });
}

function drawTechEdges(graph, svg, tree, nodeEls) {
  const graphRect = graph.getBoundingClientRect();
  svg.setAttribute("width", graph.scrollWidth);
  svg.setAttribute("height", graph.scrollHeight);
  svg.innerHTML = "";
  let edgeIndex = 0;
  tree.forEach(t => {
    const toEl = nodeEls[t.id];
    if (!toEl) return;
    const toRect = toEl.getBoundingClientRect();
    (t.requires || []).forEach(reqId => {
      const fromEl = nodeEls[reqId];
      if (!fromEl) return;
      const fromRect = fromEl.getBoundingClientRect();
      // Без + graph.scrollLeft/scrollTop - .tech-graph больше не скроллится
      // (overflow: hidden, панорама теперь transform, см. enableGraphPanning),
      // getBoundingClientRect уже честно даёт итоговый экранный прямоугольник.
      const x1 = fromRect.right - graphRect.left;
      const y1 = fromRect.top - graphRect.top + fromRect.height / 2;
      const x2 = toRect.left - graphRect.left;
      const y2 = toRect.top - graphRect.top + toRect.height / 2;
      const midX = (x1 + x2) / 2;
      const done = t.status !== "locked";
      // pathLength=1 нормализует stroke-dasharray/-dashoffset к 0..1 независимо
      // от реальной длины кривой - позволяет одной и той же CSS-анимации
      // "дочерчивания" (см. .tech-edge) работать для рёбер любой длины/формы.
      svg.appendChild(svgEl("path", {
        d: `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`,
        class: `tech-edge${done ? " edge-done" : ""}`,
        pathLength: "1",
        style: `animation-delay:${(edgeIndex++ * 0.03).toFixed(2)}s`,
      }));
    });
  });
}

function renderTechDetail(tech) {
  const box = el("div", { class: "tech-detail" });
  if (!tech) return box;

  const u = tech.unlocks;
  const unlockNames = [
    ...u.buildings.map(x => x.name),
    ...u.locations.map(x => `локация «${x.name}»`),
    ...u.manual_actions.map(x => x.name),
    ...u.mining.map(x => `добыча «${x.name}»`),
    ...u.tools,
    ...u.energy_recipes.map(x => `рецепт за энергию «${x.name}»`),
  ];
  // Полное описание/что открывает/предупреждение про лабораторию - НЕ постоянным
  // текстом (это разрослось бы обратно в большую карточку), а подсказкой при
  // наведении на имя технологии - см. CLAUDE.md, "компактная плашка деталей".
  const titleParts = [tech.description];
  titleParts.push(unlockNames.length ? `Открывает: ${unlockNames.join(", ")}` : "Прямо ничего не открывает - усиливает уже имеющееся.");
  if (tech.status === "available" && !tech.lab_built) {
    titleParts.push(`Нужна лаборатория тира ${tech.tier} - она ещё не построена.`);
  }

  const info = el("div", { class: "tech-detail-info" });
  const statusText = { researched: " — изучено", available: "", locked: " — заблокировано" };
  info.appendChild(el("div", { class: "tech-detail-name", title: titleParts.join(" "), text: `${tech.name}${statusText[tech.status] || ""}` }));

  // research_turns > 1 - показываем эффективное время (уже с учётом купленных
  // research_speed апгрейдов лаборатории, см. game/engine.py:tech_research_turns) -
  // рядом с ценой. Ровно 1 ход не показываем вовсе, чтобы не засорять
  // мгновенные технологии бесполезным "· 1 ход".
  const turnsText = tech.research_turns > 1 ? ` · ${tech.research_turns} х.` : "";
  const costText = tech.cost.length
    ? tech.cost.map(c => `${c.amount} ${c.name}`).join(" · ")
    : "бесплатно";
  const costLine = el("div", { class: "tech-detail-cost" + (tech.status === "available" && !tech.lab_built ? " warn" : "") });
  if (tech.status === "researched") {
    costLine.textContent = `Тир ${tech.tier}`;
  } else if (tech.status === "available" && !tech.lab_built) {
    costLine.textContent = `Нужна лаборатория тира ${tech.tier}`;
  } else if (tech.status === "locked") {
    costLine.textContent = `Тир ${tech.tier} · нужны другие технологии`;
  } else {
    costLine.append(`Тир ${tech.tier}: `, el("b", { text: costText + turnsText }));
  }
  info.appendChild(costLine);
  box.appendChild(info);

  // Слот исследования ГЛОБАЛЬНЫЙ (VIEW.active_research, см. game/engine.py:research) -
  // на этой самой технологии показываем прогресс с отменой. На любой ДРУГОЙ
  // "available" - можно переключиться ОДНИМ кликом в любой момент (research()
  // сам отменяет текущую и возвращает её cost) - кнопка просто подписана иначе
  // и предупреждает, что заменит текущее исследование, чтобы клик не был
  // неожиданностью.
  const switchingAway = VIEW.active_research && VIEW.active_research.tech_id !== tech.id;
  if (VIEW.active_research && VIEW.active_research.tech_id === tech.id) {
    box.appendChild(researchProgressRow(VIEW.active_research));
  } else if (tech.status === "available") {
    const btn = el("button", { text: switchingAway ? "Переключиться →" : "Исследовать →" });
    const key = `tech:${tech.id}`;
    const delay = VIEW.default_action_delay_ms;
    const remaining = cooldownRemainingMs(key);
    if (remaining > 0) applyCooldownVisual(btn, remaining, delay);
    btn.addEventListener("click", () => tryRunAction(key, delay, btn, () => doAction("tech", tech.id)));
    box.appendChild(btn);
    if (switchingAway) {
      box.appendChild(el("div", { class: "hint", text: `Отменит текущее исследование «${VIEW.active_research.name}» (затраты вернутся)` }));
    }
  }
  return box;
}

// Всплывающее уведомление о провалившемся действии (например, "Исследовать" в
// дереве технологий) - без него провал виден ТОЛЬКО в журнале событий на
// дашборде, который не виден, пока открыта модалка (дерево технологий,
// инструменты, инвентарь и т.п.) - см. doAction. Тот же контейнер #toastBanner,
// что и у выполненных квестов, но своя красная тема (.toast-error) вместо золотой.
// Не больше ОДНОГО тоста ошибки одновременно - убираем предыдущий (если он ещё
// не успел исчезнуть сам) перед показом нового, иначе частые повторные клики по
// недоступному действию завалили бы весь верхний правый угол стопкой одинаковых
// сообщений и перекрыли бы геймплей. Тосты выполненных квестов эта логика не
// трогает - им копиться друг на друге можно, они редкие и это не мешает.
// ---------- звук ----------
// Стандартные звуки синтезируются на лету через Web Audio API (без аудио-файлов -
// см. CLAUDE.md, раздел "звуки"), кастомный звук ручного действия и три глобальных
// слота (фон/открытие лутбокса/клик по кнопке - VIEW.ui_sounds, см. content.json:
// ui.sounds) - обычный <audio> на файл из tools/sounds/ (отдаётся
// tools/web_ui.py:_serve_sound). Громкость - два НЕЗАВИСИМЫХ канала (музыка/звуки,
// 0..1), а не единый булев "выключено" - 0 по каналу и есть его мут, полноценная
// панель со слайдерами открывается кликом по soundToggleBtn (см. блок инициализации
// в конце скрипта). Одноразовых звуковых эффектов (не музыки) без жеста игрока не
// бывает - они все играют в ответ на клик, поэтому браузерная политика автоплея им
// не мешает; для фоновой музыки это НЕ так, см. setupBackgroundMusic.
function _loadVolume(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw !== null && raw !== "") return Math.min(1, Math.max(0, Number(raw)));
  } catch (e) { /* ignore */ }
  return fallback;
}
let _sfxVolume = 0.8;
let _musicVolume = 0.5;
// Миграция со старой булевой настройки "soundMuted" (только вкл/выкл на двоих) -
// если игрок когда-то выключал звук ею и ещё не трогал новые слайдеры, оба канала
// стартуют приглушёнными вместо неожиданного "опять громко".
try {
  if (localStorage.getItem("sfxVolume") === null && localStorage.getItem("musicVolume") === null
    && localStorage.getItem("soundMuted") === "1") {
    _sfxVolume = 0; _musicVolume = 0;
  } else {
    _sfxVolume = _loadVolume("sfxVolume", 0.8);
    _musicVolume = _loadVolume("musicVolume", 0.5);
  }
} catch (e) { /* ignore */ }

let _audioCtx = null;
function _getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}

function _soundIcon() {
  if (_sfxVolume <= 0 && _musicVolume <= 0) return "🔇";
  if (Math.max(_sfxVolume, _musicVolume) < 0.4) return "🔉";
  return "🔊";
}

function _applyVolumes() {
  try { localStorage.setItem("sfxVolume", String(_sfxVolume)); } catch (e) { /* ignore */ }
  try { localStorage.setItem("musicVolume", String(_musicVolume)); } catch (e) { /* ignore */ }
  const btn = document.getElementById("soundToggleBtn");
  if (btn) btn.textContent = _soundIcon();
  const bg = document.getElementById("bgMusicAudio");
  if (bg) bg.volume = _musicVolume;
  const musicLabel = document.getElementById("musicVolumeLabel");
  if (musicLabel) musicLabel.textContent = `${Math.round(_musicVolume * 100)}%`;
  const sfxLabel = document.getElementById("sfxVolumeLabel");
  if (sfxLabel) sfxLabel.textContent = `${Math.round(_sfxVolume * 100)}%`;
}

function setMusicVolume(v) { _musicVolume = Math.min(1, Math.max(0, v)); _applyVolumes(); }
function setSfxVolume(v) { _sfxVolume = Math.min(1, Math.max(0, v)); _applyVolumes(); }

// Огибающая "щипок" - быстрая атака, экспоненциальный спад громкости, один
// осциллятор на ноту. tones - список [частота Гц, задержка старта сек, длительность сек].
function _playTones(tones, type = "sine", gainPeak = 0.18) {
  if (_sfxVolume <= 0) return;
  let ctx;
  try { ctx = _getAudioCtx(); } catch (e) { return; }
  const now = ctx.currentTime;
  tones.forEach(([freq, startAt = 0, dur = 0.12]) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t0 = now + startAt;
    const peak = gainPeak * _sfxVolume;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(peak, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  });
}

const SOUND_PRESETS = {
  success: () => _playTones([[660, 0, 0.08]], "sine", 0.15),
  error: () => _playTones([[180, 0, 0.16]], "square", 0.12),
  reward: () => _playTones([[523, 0, 0.1], [659, 0.09, 0.1], [784, 0.18, 0.22]], "triangle", 0.16),
  breed: () => _playTones([[440, 0, 0.09], [554, 0.08, 0.14]], "sine", 0.15),
  breed_mutated: () => _playTones([[440, 0, 0.08], [554, 0.07, 0.08], [659, 0.14, 0.08], [880, 0.21, 0.22]], "triangle", 0.16),
  breakdown: () => _playTones([[200, 0, 0.1], [120, 0.08, 0.22]], "sawtooth", 0.14),
  // Дефолты для глобальных слотов (VIEW.ui_sounds) без загруженного файла - см.
  // playGlobalSound. Ключи совпадают с ключами ui_sounds не случайно: playGlobalSound
  // falls back на preset с ТЕМ ЖЕ именем.
  button_click: () => _playTones([[820, 0, 0.03]], "square", 0.05),
  lootbox_open: () => _playTones([[300, 0, 0.05], [420, 0.05, 0.08], [520, 0.11, 0.14]], "square", 0.14),
  // Короткий "тик" за каждую ячейку, пролетающую мимо указателя во время прокрутки
  // барабана (см. _runLootboxTicker) - имитация классического звука лутбокса
  // (как в CS:GO): один и тот же щелчок, частота его повторов сама по себе
  // отражает замедление ленты (cubic-bezier в openLootBoxModal), без искусственной
  // логики "ближе к концу - реже".
  lootbox_tick: () => _playTones([[1100, 0, 0.025]], "square", 0.07),
};

function playSound(name) {
  const preset = SOUND_PRESETS[name];
  if (preset) preset();
}

function playCustomSound(url) {
  if (_sfxVolume <= 0 || !url) return;
  const audio = new Audio(url);
  audio.volume = 0.6 * _sfxVolume;
  audio.play().catch(() => {});
}

// Глобальный звук (VIEW.ui_sounds.<key>, загружается в редакторе контента, вкладка
// "Настройки") - если для слота не загружен файл, играет встроенный синтезированный
// preset того же имени (см. SOUND_PRESETS.button_click/lootbox_open выше).
function playGlobalSound(key) {
  const url = VIEW && VIEW.ui_sounds && VIEW.ui_sounds[key];
  if (url) playCustomSound(url);
  else playSound(key);
}

// Фоновая музыка - обычный зацикленный <audio> (#bgMusicAudio), не Web Audio -
// проще для длинного трека, чем ручная сборка через AudioBufferSourceNode.
// Источник берётся из VIEW ОДИН РАЗ при загрузке состояния (content.json грузится
// в module-level константы ровно один раз при старте процесса - см. CLAUDE.md,
// ui.sounds.background_music не меняется в рамках сессии игрока). Автоплей СО
// ЗВУКОМ браузеры блокируют без жеста пользователя - если он ещё не случился,
// ждём первый клик где угодно в документе.
function setupBackgroundMusic() {
  const audio = document.getElementById("bgMusicAudio");
  const url = VIEW.ui_sounds && VIEW.ui_sounds.background_music;
  if (!audio || !url) return;
  if (audio.getAttribute("src") !== url) audio.src = url;
  audio.volume = _musicVolume;
  const tryPlay = () => { if (_musicVolume > 0) audio.play().catch(() => {}); };
  tryPlay();
  document.addEventListener("click", tryPlay, { once: true });
}

function showErrorToast(message) {
  playSound("error");
  const banner = document.getElementById("toastBanner");
  banner.querySelectorAll(".toast-error").forEach(t => t.remove());
  const toast = el("div", { class: "toast-error", text: message });
  banner.appendChild(toast);
  setTimeout(() => toast.remove(), 5000);
}

// Явное уведомление о результате скрещивания (мутация/её отсутствие) - той же
// причиной, что и showErrorToast: клик по "Скрестить" происходит ИЗНУТРИ
// модалки "Фермы", а журнал событий на дашборде за ней не виден, так что без
// тоста результат (какой вид родился, была ли мутация) прошёл бы мимо игрока
// незамеченным. См. doAction.
function showBreedToast(message, mutated) {
  playSound(mutated ? "breed_mutated" : "breed");
  const banner = document.getElementById("toastBanner");
  banner.querySelectorAll(".toast-breed").forEach(t => t.remove());
  const toast = el("div", { class: "toast-breed" });
  toast.appendChild(el("div", { class: "title", text: mutated ? "Мутация!" : "Скрещивание" }));
  toast.appendChild(el("div", { class: "desc", text: message }));
  banner.appendChild(toast);
  setTimeout(() => toast.remove(), 6000);
}

// Уведомление о ВЫПОЛНЕНИИ квеста (условия выполнены, награда ещё не забрана -
// см. openLootBoxModal для самого получения награды).
function showQuestToast(quest) {
  playSound("reward");
  const toast = el("div", { class: "toast-quest" });
  const text = el("div");
  text.appendChild(el("div", { class: "title", text: `Квест выполнен: ${quest.name}` }));
  text.appendChild(el("div", { class: "desc", text: quest.description }));
  toast.appendChild(text);
  document.getElementById("toastBanner").appendChild(toast);
  setTimeout(() => toast.remove(), 5000);
}

function pushLog(log) {
  const list = document.getElementById("logList");
  // "Умный" автоскролл: свежие записи теперь появляются СВЕРХУ, так что читающий
  // самое новое просто держит scrollTop у нуля - никакого дёргания вниз не нужно.
  // А вот если пользователь прокрутил вниз, чтобы почитать историю, новая запись
  // сверху сдвинет всё остальное ниже - без компенсации это выглядело бы как
  // случайный прыжок содержимого под курсором, поэтому подрастим scrollTop ровно
  // на высоту новой записи, чтобы то, что он читал, осталось на месте.
  const wasAtTop = list.scrollTop < 20;
  const entry = el("div", { class: "log-entry" });
  // VIEW уже отражает состояние ПОСЛЕ advance_turn (турн увеличен на сервере) - запись
  // же описывает только что завершившийся ход, поэтому -1 (та же поправка, что и в
  // game/engine.py: record_history_entry использует state.turn - 1 по той же причине).
  entry.appendChild(el("span", { class: "turn-tag mono", text: `[ход ${VIEW.turn - 1}]` }));
  if (log.message) entry.appendChild(el("div", { class: "msg", text: log.message }));

  const deltas = [...(log.action_deltas || []), ...(log.production_deltas || [])];
  if (deltas.length) {
    const line = deltas.map(d => `${d.amount > 0 ? "+" : ""}${d.amount} ${d.name}`).join(", ");
    entry.appendChild(el("div", { class: "deltas", text: line }));
  }
  if (log.idle && log.idle.length) {
    entry.appendChild(el("div", { class: "warn-line", text: `Простаивают: ${log.idle.join(", ")}` }));
  }
  if (log.broken && log.broken.length) {
    entry.appendChild(el("div", { class: "danger-line", text: `Сломалось: ${log.broken.map(b => `${b.name} x${b.count}`).join(", ")}` }));
  }
  if (log.boss_fled) {
    entry.appendChild(el("div", { class: "danger-line", text: `${log.boss_fled} сбежал - время вышло.` }));
  }
  if (log.autocraft_completed && log.autocraft_completed.length) {
    entry.appendChild(el("div", { class: "msg", text: `Автокрафт докрафтил: ${log.autocraft_completed.join(", ")}` }));
  }
  if (log.pending_finished && log.pending_finished.length) {
    entry.appendChild(el("div", { class: "msg", text: `Дождалось автокрафта и завершилось: ${log.pending_finished.join(", ")}` }));
  }
  if (log.energy_crafted && log.energy_crafted.length) {
    entry.appendChild(el("div", { class: "msg", text: `Крафт из энергии завершён: ${log.energy_crafted.join(", ")}` }));
  }
  if (log.manual_completed && log.manual_completed.length) {
    entry.appendChild(el("div", { class: "msg", text: `Завершено: ${log.manual_completed.join(", ")}` }));
  }
  if (log.automation_fired && log.automation_fired.length) {
    const line = log.automation_fired.map(a => `${a.building_name}: ${a.message}`).join("; ");
    entry.appendChild(el("div", { class: "msg", text: `Автоматизация: ${line}` }));
  }
  if (log.quests_completed && log.quests_completed.length) {
    entry.appendChild(el("div", { class: "msg", text: `Квесты выполнены: ${log.quests_completed.map(q => q.name).join(", ")}` }));
    log.quests_completed.forEach(showQuestToast);
  }

  list.insertBefore(entry, list.firstChild);
  // Ограничение теперь 10 последних записей (было 50) - самые старые теперь в
  // конце списка (свежие сверху), поэтому лишнее срезаем с хвоста, а не с начала.
  while (list.children.length > 10) list.removeChild(list.lastChild);
  if (!wasAtTop) list.scrollTop += entry.offsetHeight;
}

// ---------- инвентарь ----------

// Текст поиска по складу - переживает rebuild сетки (openStorage() дёргается
// заново на каждый пин/апгрейд), как categorySearchQuery/locationSearchQuery.
let storageSearchQuery = "";

const STORAGE_SORT_OPTIONS = [
  ["default", "Как в игре"],
  ["amount_desc", "Количество ↓"],
  ["amount_asc", "Количество ↑"],
  ["alpha", "По алфавиту"],
];

// Режим сортировки склада - тем же приёмом переживает rebuild сетки, а через
// localStorage (тот же приём, что sfxVolume/musicVolume) ещё и перезапуск игры
// целиком - это чисто клиентская настройка интерфейса (не save-critical state,
// не пишется в save.json), но по прямому пожеланию игрока должна пережить
// закрытие/открытие окна. "default" - порядок появления в игре (как
// VIEW.storage пришёл с сервера).
let storageSortMode = "default";
try {
  const savedSort = localStorage.getItem("storageSortMode");
  if (STORAGE_SORT_OPTIONS.some(([value]) => value === savedSort)) storageSortMode = savedSort;
} catch (e) { /* ignore */ }
// То же самое, но для сетки выбора ресурса во вкладке "Автокрафт" модалки
// "Приоритеты" (см. renderAutocraftPriorityTab) - отдельная переменная, у этих
// двух сеток разный набор плиток и они открываются независимо друг от друга.
let priorityResourceSearchQuery = "";

// Подсвечивает плитки ресурса, чьё имя содержит запрос (без учёта регистра).
// Сетки иконок (hide=false: склад, выбор ресурса в "Приоритетах", сетка
// перетаскивания особей в "Скрещивании") только притемняют непопавшие плитки
// (search-dim) - сетка не должна "прыгать" и терять привычное игроку
// расположение, поиск тут подсказка "где смотреть", а не фильтр. Обычные
// списки (hide=true - постройки, банк особей, книга пчёл) прячут непопавшие
// строки целиком через display:none, тот же приём, что makeCategorySearchBar/
// makeLocationSearchBar - порядок строк неважен, скрытие ничего не ломает.
function applyResourceHighlight(grid, query, hide) {
  const q = query.trim().toLowerCase();
  grid.querySelectorAll("[data-resource-name]").forEach(tile => {
    tile.classList.remove("search-match", "search-dim");
    if (hide) {
      tile.style.display = (!q || tile.dataset.resourceName.includes(q)) ? "" : "none";
      return;
    }
    if (!q) return;
    tile.classList.add(tile.dataset.resourceName.includes(q) ? "search-match" : "search-dim");
  });
}

// Сортировка плиток склада - копия VIEW.storage (сам массив не трогаем, им
// пользуется ещё и подсчёт "закреплено N/10" в заголовке). "default" - как
// пришло с сервера (порядок появления ресурса в игре, resource_order).
function sortedStorageItems() {
  const items = [...VIEW.storage];
  const nameOf = (rid) => (VIEW.resource_names[rid] || "").toLowerCase();
  const amountOf = (rid) => VIEW.resources[rid] || 0;
  if (storageSortMode === "amount_asc") {
    items.sort((a, b) => amountOf(a.id) - amountOf(b.id));
  } else if (storageSortMode === "amount_desc") {
    items.sort((a, b) => amountOf(b.id) - amountOf(a.id));
  } else if (storageSortMode === "alpha") {
    items.sort((a, b) => nameOf(a.id).localeCompare(nameOf(b.id), "ru"));
  }
  return items;
}

// Переключатель сортировки склада - select, а не отдельные кнопки-вкладки:
// вариантов всего 4 и они не нуждаются в развесистом UI вкладок с подчёркиванием
// (см. positionTabUnderline) - тут это было бы избыточно ради самого частого
// экрана игры. Выбор дёргает openStorage() целиком (та же схема, что и пин),
// т.к. меняется порядок плиток, не просто фильтр видимости.
function makeStorageSortBar() {
  const bar = el("div", { class: "storage-sort-bar" });
  bar.appendChild(el("span", { class: "storage-sort-label", text: "Сортировка:" }));
  const select = el("select");
  STORAGE_SORT_OPTIONS.forEach(([value, text]) => {
    const opt = el("option", { value, text });
    if (value === storageSortMode) opt.selected = true;
    select.appendChild(opt);
  });
  select.addEventListener("change", () => {
    storageSortMode = select.value;
    try { localStorage.setItem("storageSortMode", storageSortMode); } catch (e) { /* ignore */ }
    openStorage();
  });
  bar.appendChild(select);
  return bar;
}

// Строка поиска над сеткой/списком ресурсов - queryState.get/set читает и
// пишет значение в переменную-держатель конкретной сетки (storageSearchQuery,
// priorityResourceSearchQuery и т.д.), чтобы текст не сбрасывался при
// пересборке. hide - см. applyResourceHighlight.
function makeResourceSearchBar(grid, queryState, hide) {
  const bar = el("div", { class: "loc-search-bar" });
  const input = el("input", { type: "text", placeholder: "Поиск по названию…" });
  input.value = queryState.get();
  input.addEventListener("input", () => {
    queryState.set(input.value);
    applyResourceHighlight(grid, input.value, hide);
  });
  bar.appendChild(input);
  applyResourceHighlight(grid, queryState.get(), hide);
  return bar;
}

// Общая "база" плитки ресурса (иконка + притемнение при нулевом остатке +
// зацепка для поиска) - используется и складом (там ещё добавляются количество/
// имя/пин/апгрейд), и сеткой выбора ресурса в приоритетах (там вместо этого -
// клик-выбор), чтобы обе выглядели буквально одинаково, как просил игрок.
function resourceTileBase(rid) {
  const amount = VIEW.resources[rid] || 0;
  const tile = el("div", { class: "storage-tile" + (amount === 0 ? " zero" : "") });
  tile.dataset.resourceName = VIEW.resource_names[rid].toLowerCase();
  // Слот иконки - ФИКСИРОВАННОГО размера ВСЕГДА (см. .storage-tile-icon), даже
  // если у ресурса нет картинки (iconDef === null) - иначе такие плитки были
  // ниже остальных в сетке и портили ровный ряд рамок (см. CLAUDE.md).
  const iconBox = el("div", { class: "storage-tile-icon" });
  const iconDef = resourceIcon(rid);
  if (iconDef) iconBox.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 24));
  tile.appendChild(iconBox);
  return tile;
}

// Модалка "Навыки" - generic-меню ВСЕХ линеек прокачки (VIEW.skills, см.
// game/engine.py:skills_view) - чисто информационная (никаких покупок), поэтому
// проще storage/tools-модалок: список без кнопок, effects показаны как есть
// (свободный словарь - конкретный смысл каждого ключа знает не эта модалка, а
// механика, которая его читает, например бой читает "damage").
function openSkillsModal() {
  const prevModal = document.querySelector("#skillsOverlay .modal");
  const savedScroll = prevModal ? prevModal.scrollTop : null;
  closeSkillsModal();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeSkillsModal(); });

  const modal = el("div", { class: "modal upgrades-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Навыки" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: closeSkillsModal }));
  modal.appendChild(head);

  const list = el("div", { class: "upgrades-list scroll-area" });
  VIEW.skills.forEach(s => {
    const row = el("div", { class: "upgrade-row" });
    row.appendChild(el("div", { class: "upgrade-title", text: `${s.name} — уровень ${s.level}${s.max_level ? `/${s.max_level}` : ""}` }));
    if (s.description) row.appendChild(el("div", { class: "upgrade-desc", text: s.description }));
    const effRow = el("div", { class: "costs" });
    Object.entries(s.effects || {}).forEach(([k, v]) => effRow.appendChild(el("span", { class: "note-chip", text: `${k}: ${v}` })));
    if (effRow.children.length) row.appendChild(effRow);
    if (s.next_xp_required != null) {
      row.appendChild(el("div", { class: "hint", text: `Опыт: ${s.xp} / ${s.next_xp_required} до следующего уровня` }));
    } else {
      row.appendChild(el("div", { class: "upgrade-status done", text: `✓ Максимальный уровень (опыт: ${s.xp})` }));
    }
    list.appendChild(row);
  });
  if (!VIEW.skills.length) list.appendChild(el("div", { class: "empty-note", text: "Навыков пока нет." }));
  modal.appendChild(list);

  overlay.appendChild(modal);
  overlay.id = "skillsOverlay";
  document.body.appendChild(overlay);
  if (savedScroll !== null) modal.scrollTop = savedScroll;
}

function closeSkillsModal() {
  const overlay = document.getElementById("skillsOverlay");
  if (overlay) overlay.remove();
}

// Модалка "Квесты" - вкладка на каждую эру (VIEW.quests[].era), внутри вкладки
// свой отдельный граф зависимостей (см. renderQuestGraph). requires на квест из
// ДРУГОЙ эры по-прежнему реально гейтит доступность (см. game/engine.py:
// is_quest_available/check_quests) - просто не рисуется ребром, раз квест-условие
// физически не на этой вкладке (см. renderQuestDetail: список текстом вместо
// линии). Прежде эры были просто цветными колонками ОДНОГО общего графа - теперь
// это разные графы, что и даёт квестам ВНУТРИ одной эры собственные прямые связи
// без наложения на длинные межэровые рёбра.
let questsActiveEra = null; // переживает переоткрытие модалки, как prioritiesActiveTab

function defaultQuestEra(eras, quests) {
  const inProgress = quests.find(q => q.status === "available");
  if (inProgress) return inProgress.era;
  const notClaimed = quests.find(q => q.status !== "claimed");
  if (notClaimed) return notClaimed.era;
  return eras[0];
}

function openQuestsModal() {
  // Позиция/зум графа переживают пересборку сами через questGraphZoom - см.
  // комментарий в openTechTreeModal.
  closeQuestsModal();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeQuestsModal(); });

  const modal = el("div", { class: "modal tech-modal quest-modal graph-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Квесты" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: closeQuestsModal }));
  modal.appendChild(head);

  const quests = VIEW.quests;
  const eras = [...new Set(quests.map(q => q.era))].sort((a, b) => a - b);
  const body = el("div", { class: "quest-era-body" });
  if (!eras.length) {
    body.appendChild(el("div", { class: "empty-note", text: "В этой игре нет квестов." }));
  } else {
    if (questsActiveEra === null || !eras.includes(questsActiveEra)) {
      questsActiveEra = defaultQuestEra(eras, quests);
    }
    const tabs = el("div", { class: "tabs quest-era-tabs" });
    let activeEraBtn = null;
    eras.forEach(era => {
      const theme = eraTheme(era);
      const btn = el("button", { text: theme.name, class: era === questsActiveEra ? "active" : "" });
      btn.style.setProperty("--era-accent", theme.text);
      btn.addEventListener("click", () => {
        questsActiveEra = era;
        tabs.querySelectorAll("button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        body.innerHTML = "";
        body.appendChild(renderQuestGraph(era));
        positionTabUnderline(tabs, btn);
      });
      tabs.appendChild(btn);
      if (era === questsActiveEra) activeEraBtn = btn;
    });
    modal.appendChild(tabs);
    body.appendChild(renderQuestGraph(questsActiveEra));
    // rAF - на первом открытии tabs ещё не в document (appendChild ниже по коду).
    requestAnimationFrame(() => positionTabUnderline(tabs, activeEraBtn));
  }
  modal.appendChild(body);

  overlay.appendChild(modal);
  overlay.id = "questsOverlay";
  document.body.appendChild(overlay);
}

function closeQuestsModal() {
  const overlay = document.getElementById("questsOverlay");
  if (overlay) overlay.remove();
}

// Суммарный вес всех призов кейса - знаменатель для отображаемых шансов
// (content.json loot_cases.*.prizes[].weight, см. game/engine.py:_roll_loot_case_prize).
function totalPrizeWeight(prizes) {
  return prizes.reduce((sum, p) => sum + (p.weight || 1), 0);
}

// Пороги редкости для фона ячейки лутбокса - тот же цветовой код, что в
// CS:GO/CS2 (синий -> частый, голубой -> редкий, фиолетовый -> супер редкий,
// красный -> супер-супер редкий, жёлтый -> практически невозможный). Порог -
// шанс ИМЕННО этого приза среди всех призов кейса (weight/totalWeight*100),
// не глобальная редкость ресурса. Проверяются по убыванию, первый подошедший
// побеждает.
const LOOTBOX_RARITY_THRESHOLDS = [
  { min: 20, cls: "rarity-common" },
  { min: 5, cls: "rarity-rare" },
  { min: 1, cls: "rarity-epic" },
  { min: 0.1, cls: "rarity-legendary" },
  { min: 0, cls: "rarity-mythic" },
];
function lootboxRarityClass(oddsPercent) {
  return LOOTBOX_RARITY_THRESHOLDS.find(t => oddsPercent >= t.min).cls;
}

// Столбец графа ОДНОЙ эры - локальная глубина зависимостей среди квестов ЭТОЙ
// эры (requires на квест из другой эры сюда не попадает - его тут физически нет,
// см. openQuestsModal). Та же идея, что computeTechColumns, но без внешнего
// уровня "по тирам" - вкладка уже одна эра, offset всегда с нуля.
function computeQuestEraLevels(quests) {
  const byId = {};
  quests.forEach(q => { byId[q.id] = q; });
  const localLevel = {};
  function localLevelOf(id, stack) {
    if (localLevel[id] !== undefined) return localLevel[id];
    if (stack.has(id)) return 0; // цикл - не должно происходить в валидном контенте
    stack.add(id);
    const q = byId[id];
    const sameEraReqs = (q.requires || []).filter(r => byId[r]);
    localLevel[id] = sameEraReqs.length ? 1 + Math.max(...sameEraReqs.map(r => localLevelOf(r, stack))) : 0;
    return localLevel[id];
  }
  quests.forEach(q => localLevelOf(q.id, new Set()));
  return localLevel;
}

const QUEST_STATUS_ICON = { locked: "🔒", available: "⏳", completed: "🎁", claimed: "✓" };
// Дефолтный цвет текста подсказки, когда у квеста нет своего tooltip_color -
// держать в паре с QUEST_DEFAULT_TOOLTIP_COLOR в content_editor.html и с
// дефолтом .quest-node-tip { color: ... } в CSS выше.
const QUEST_DEFAULT_TOOLTIP_COLOR = "#dbe7ec";

// q.icon (content.json: quests.*.icon) - необязательный per-квестовый оверрайд
// центральной пиксель-иконки узла ({grid,palette}, рисуется тем же редактором
// иконок, что у ресурсов/построек/мобов - см. questIcon), действует для ЛЮБОГО
// статуса, включая locked (приглушается CSS-фильтром .quest-node.locked
// .quest-node-icon), в отличие от QUEST_STATUS_ICON (жетон в углу - это
// всегда значок СТАТУСА, а не квеста). q.bg/q.border - оверрайд цвета узла
// целиком (иначе узел красится по статусу, см. CSS .quest-node.<status>) -
// инлайн-стиль перебивает правило из таблицы стилей. q.tooltip_color - та же
// идея для цвета текста подсказки (ПЕР-КВЕСТОВО, не общая настройка - разным
// квестам может требоваться разный контраст на разном фоне узла). Имя квеста
// здесь НЕ печатается - только во всплывающей подсказке (.quest-node-tip)
// при наведении, см. CSS-комментарий выше.
function buildQuestNode(q) {
  const node = el("div", { class: `quest-node ${q.status}${q.id === selectedQuestId ? " selected" : ""}` });
  const iconDef = questIcon(q);
  const iconWrap = el("div", { class: "quest-node-icon" });
  iconWrap.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 34));
  node.appendChild(iconWrap);
  node.appendChild(el("div", { class: "quest-node-badge", text: QUEST_STATUS_ICON[q.status] || "" }));
  const tip = el("div", { class: "quest-node-tip", text: q.name });
  tip.style.color = q.tooltip_color || QUEST_DEFAULT_TOOLTIP_COLOR;
  node.appendChild(tip);
  if (q.bg) node.style.background = q.bg;
  if (q.border) node.style.borderColor = q.border;
  return node;
}

// Как techTreeState/selectTechNode - живёт, пока граф не перестроен целиком,
// клик по узлу подменяет только панель деталей напрямую, не трогая .tech-graph
// (иначе прокрутка/панорамирование графа сбрасывались бы при каждом выборе).
let questGraphState = null;

function selectQuestNode(id) {
  selectedQuestId = id;
  if (!questGraphState) { openQuestsModal(); return; }
  Object.entries(questGraphState.nodeEls).forEach(([qid, node]) => {
    node.classList.toggle("selected", qid === id);
  });
  const quest = VIEW.quests.find(q => q.id === id);
  questGraphState.detailBox.innerHTML = "";
  questGraphState.detailBox.appendChild(renderQuestDetail(quest));
}

// Граф квестов ОДНОЙ эры (era) - вызывается заново при переключении вкладки
// (см. openQuestsModal). Квесты других эр тут не участвуют вообще, поэтому
// requires на них не может нарисовать ребро - лок остаётся виден только по
// статусу узла и текстом в панели деталей (renderQuestDetail).
function renderQuestGraph(era) {
  const wrap = el("div", { class: "tech-tree-wrap" });
  const quests = VIEW.quests.filter(q => q.era === era);
  questGraphState = null;
  if (!quests.length) {
    wrap.appendChild(el("div", { class: "empty-note", text: "В этой эре пока нет квестов." }));
    return wrap;
  }
  if (!quests.some(q => q.id === selectedQuestId)) {
    // Locked-квест сюда попасть не должен (см. click-листенер ниже - на locked
    // он не вешается вовсе), поэтому и фолбэк выбора его игнорирует - если в
    // эре вообще нет ни одного разблокированного квеста (вырожденный случай),
    // панель деталей просто остаётся пустой (renderQuestDetail(undefined)).
    const fallback = quests.find(q => q.status === "completed") || quests.find(q => q.status === "claimed")
      || quests.find(q => q.status === "available") || quests.find(q => q.status !== "locked");
    selectedQuestId = fallback ? fallback.id : null;
  }

  const localLevel = computeQuestEraLevels(quests);
  const maxCol = Math.max(0, ...quests.map(q => localLevel[q.id]));

  const graph = el("div", { class: "tech-graph quest-graph" });
  const svg = svgEl("svg", { class: "tech-edges" });
  const cols = el("div", { class: "tech-cols" });
  // Раньше тут была одна большая цветная "плашка" эры (.tech-col-band,
  // background/border = theme.bg/border) под ВСЕМИ колонками сразу - с тех
  // пор, как узлы стали компактными квадратами 64x64 (см. CSS-комментарий у
  // .quest-node), а .tech-col по умолчанию 160px шириной (общий класс с
  // деревом технологий, там под текстовые карточки), плашка растягивалась
  // далеко за пределы самих квадратов и выглядела как случайное цветное
  // пятно - убрана совсем (принадлежность к эре и так видна по вкладке
  // сверху и по цвету рамки/фона узла из его статуса).
  const row = el("div", { class: "tech-col-row" });
  const nodeEls = {};
  for (let col = 0; col <= maxCol; col++) {
    const colEl = el("div", { class: "tech-col" });
    quests.filter(q => localLevel[q.id] === col).forEach(q => {
      const node = buildQuestNode(q);
      // Locked-квест рисуется на графе, но некликабелен (см. CSS-комментарий у
      // .quest-node) - открыть детали можно только для уже доступного квеста.
      if (q.status !== "locked") node.addEventListener("click", () => selectQuestNode(q.id));
      colEl.appendChild(node);
      nodeEls[q.id] = node;
    });
    row.appendChild(colEl);
  }
  cols.appendChild(row);
  graph.appendChild(svg);
  graph.appendChild(cols);
  const redrawQuestEdges = () => drawQuestEdges(graph, svg, quests, nodeEls);
  enableGraphPanning(graph, cols, questGraphZoom, redrawQuestEdges);
  enableGraphZoom(graph, cols, questGraphZoom, redrawQuestEdges);
  wrap.appendChild(graph);
  const detailBox = el("div");
  detailBox.appendChild(renderQuestDetail(quests.find(q => q.id === selectedQuestId)));
  wrap.appendChild(detailBox);
  questGraphState = { nodeEls, detailBox };

  requestAnimationFrame(redrawQuestEdges);
  return wrap;
}

// Буквальная копия drawTechEdges - "done" (сплошное ребро) тут означает "квест
// уже ДОСТУПЕН" (status !== locked), а не только "выполнен" - иначе ребро от
// выполненного prerequisite к следующему квесту не подсвечивалось бы, пока сам
// следующий квест ещё не пройден. reqId, указывающий на квест другой эры, тут
// просто не найдётся в nodeEls (эта эра его не рендерила) - ребро не рисуется,
// это и есть "зависимость от другой эры не видна явной линией".
function drawQuestEdges(graph, svg, quests, nodeEls) {
  const graphRect = graph.getBoundingClientRect();
  svg.setAttribute("width", graph.scrollWidth);
  svg.setAttribute("height", graph.scrollHeight);
  svg.innerHTML = "";
  let edgeIndex = 0;
  quests.forEach(q => {
    const toEl = nodeEls[q.id];
    if (!toEl) return;
    const toRect = toEl.getBoundingClientRect();
    (q.requires || []).forEach(reqId => {
      const fromEl = nodeEls[reqId];
      if (!fromEl) return;
      const fromRect = fromEl.getBoundingClientRect();
      // Без + graph.scrollLeft/scrollTop - см. тот же комментарий в drawTechEdges.
      const x1 = fromRect.right - graphRect.left;
      const y1 = fromRect.top - graphRect.top + fromRect.height / 2;
      const x2 = toRect.left - graphRect.left;
      const y2 = toRect.top - graphRect.top + toRect.height / 2;
      const midX = (x1 + x2) / 2;
      const done = q.status !== "locked";
      svg.appendChild(svgEl("path", {
        d: `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`,
        class: `tech-edge${done ? " edge-done" : ""}`,
        pathLength: "1",
        style: `animation-delay:${(edgeIndex++ * 0.03).toFixed(2)}s`,
      }));
    });
  });
}

function renderQuestDetail(quest) {
  const box = el("div", { class: "tech-detail" });
  if (!quest) return box;

  // "Нужно"/"Награда" - визуально ЯРЧЕ соседних строк (.quest-detail-goal/
  // .quest-detail-reward, см. CSS) - прямая жалоба игрока "текст снизу
  // незаметен, непонятно что делать и какая награда". Разбивка призов по
  // шансам теперь тоже постоянный текст в строке награды (барабан всё равно
  // крутится ДО настоящего результата в openLootBoxModal, см.
  // claimQuestReward - показ шансов заранее не портит анимацию) - в подсказке
  // на имени остаётся только пояснение про требования из другой эры.
  const totalWeight = totalPrizeWeight(quest.reward_case.prizes);
  const prizeLines = quest.reward_case.prizes.map(p => {
    const odds = totalWeight ? Math.round((p.weight || 1) / totalWeight * 100) : 0;
    return `${VIEW.resource_names[p.resource]} ×${p.amount} (${odds}%)`;
  });
  let title = "";
  if (quest.status === "locked" && quest.requires.length) {
    // Требование из ДРУГОЙ эры не нарисовано линией на этом графе (см.
    // renderQuestGraph) - поэтому явно подписываем эру рядом с именем, иначе
    // игрок не поймёт, почему у явно "готового" на вид узла нет входящего ребра.
    const reqNames = quest.requires.map(rid => {
      const rq = VIEW.quests.find(q => q.id === rid);
      if (!rq) return rid;
      return rq.era === quest.era ? rq.name : `${rq.name} (${eraTheme(rq.era).name})`;
    });
    title = `Нужно сначала выполнить: ${reqNames.join(", ")}`;
  }

  const info = el("div", { class: "tech-detail-info" });
  const statusSuffix = {
    claimed: " — награда получена", completed: " — готов к выполнению",
    available: " — в процессе", locked: " — заблокирован",
  };
  info.appendChild(el("div", { class: "tech-detail-name", title, text: `${quest.name}${statusSuffix[quest.status] || ""}` }));
  if (quest.description) info.appendChild(el("div", { class: "tech-detail-cost", text: quest.description }));
  info.appendChild(el("div", { class: "tech-detail-cost", text: eraTheme(quest.era).name }));
  if (quest.conditions.length && quest.status !== "claimed") {
    info.appendChild(el("div", { class: "quest-detail-goal", text: `Нужно: ${quest.conditions.join(" · ")}` }));
  }
  info.appendChild(el("div", { class: "quest-detail-reward", text: `Награда: «${quest.reward_case.name}» — ${prizeLines.join(", ")}` }));
  box.appendChild(info);

  if (quest.status === "completed") {
    const claimBtn = el("button", { text: "Открыть лутбокс" });
    claimBtn.addEventListener("click", () => claimQuestReward(quest, claimBtn));
    box.appendChild(claimBtn);
  }
  return box;
}

// Как cancelJob/insert_soul - управление имуществом, НЕ тратит ход, поэтому не
// идёт через doAction() (тот предполагает трату хода/автокрафт-предпросмотр).
// Сервер уже решил, какой приз выпал (RNG на сервере, не на клиенте) и начислил
// его к моменту ответа - openLootBoxModal только АНИМИРУЕТ прокрутку барабана до
// этого уже свершившегося результата.
async function claimQuestReward(quest, btn) {
  if (busy) return;
  busy = true;
  if (btn) btn.disabled = true;
  try {
    const res = await fetch("/api/claim_quest", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ quest_id: quest.id }),
    });
    const payload = await res.json();
    VIEW = payload.state;
    // renderAll() ПЕРЕД открытием лутбокса - если модалка "Квесты" сейчас открыта,
    // она пересоберётся тут же (см. renderAll: openQuestsModal), и лутбокс должен
    // лечь НА неё сверху, а не оказаться погребён под свежепересобранной модалкой
    // (обе - .modal-overlay с одним z-index, порядок в DOM решает, что рисуется поверх).
    renderAll();
    if (payload.ok && payload.prize) {
      openLootBoxModal(quest.reward_case, payload.prize);
    } else {
      pushLog({ message: payload.message, ok: payload.ok, action_deltas: [], production_deltas: [], idle: [], broken: [] });
    }
  } finally {
    busy = false;
  }
}

// ---------- лутбокс: анимация прокрутки барабана ----------

const LOOTBOX_CELL_WIDTH = 96;
const LOOTBOX_REEL_LENGTH = 30;
const LOOTBOX_WINNING_INDEX = 24; // достаточно далеко, чтобы лента успела разогнаться и затормозить

let _lootboxTickRaf = null;

// Достаёт текущий translateX ленты прямо из вычисленного CSS-transform (а не из
// track.style.transform, который во время CSS-transition остаётся строкой
// ЦЕЛЕВОГО значения) - только так можно узнать, где лента находится ПРЯМО
// СЕЙЧАС, посреди анимации.
function _trackTranslateX(track) {
  const transform = getComputedStyle(track).transform;
  if (!transform || transform === "none") return 0;
  const match = /matrix\(([^)]+)\)/.exec(transform);
  if (!match) return 0;
  const parts = match[1].split(",").map(Number);
  return parts[4] || 0;
}

// Каждый кадр сверяет, какая ячейка сейчас под указателем, и на КАЖДУЮ смену
// ячейки играет один и тот же "тик" (SOUND_PRESETS.lootbox_tick) - не таймер с
// фиксированным интервалом: интервал между тиками сам вытекает из реальной
// скорости ленты (быстро в начале, реже и с "провисанием" перед остановкой, как
// задаёт cubic-bezier в openLootBoxModal), без искусственного ускорения/замедления.
function _runLootboxTicker(viewport, track, durationMs) {
  const start = performance.now();
  const viewportWidth = viewport.clientWidth;
  let lastIndex = Math.floor((viewportWidth / 2 - _trackTranslateX(track)) / LOOTBOX_CELL_WIDTH);
  const step = () => {
    if (!document.body.contains(track)) { _lootboxTickRaf = null; return; }
    const offset = -_trackTranslateX(track);
    const index = Math.floor((offset + viewportWidth / 2) / LOOTBOX_CELL_WIDTH);
    if (index !== lastIndex) {
      playSound("lootbox_tick");
      lastIndex = index;
    }
    if (performance.now() - start < durationMs) {
      _lootboxTickRaf = requestAnimationFrame(step);
    } else {
      _lootboxTickRaf = null;
    }
  };
  _lootboxTickRaf = requestAnimationFrame(step);
}

function closeLootBoxModal() {
  if (_lootboxTickRaf) { cancelAnimationFrame(_lootboxTickRaf); _lootboxTickRaf = null; }
  const overlay = document.getElementById("lootBoxOverlay");
  if (overlay) overlay.remove();
}

// caseData - {name, description, prizes} (VIEW.quests[].reward_case, тот же пул,
// что уже показан игроку в карточке квеста ДО открытия - без сюрприза насчёт
// содержимого, только насчёт того, что именно выпадет). wonPrize - {resource,
// amount}, реальный результат, уже начисленный на сервере (см. claimQuestReward).
function openLootBoxModal(caseData, wonPrize) {
  closeLootBoxModal();
  playGlobalSound("lootbox_open");
  const overlay = el("div", { class: "modal-overlay" });
  const modal = el("div", { class: "modal lootbox-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: `Открытие: ${caseData.name}` }));
  head.appendChild(el("button", { text: "Закрыть", onclick: closeLootBoxModal }));
  modal.appendChild(head);
  overlay.appendChild(modal);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeLootBoxModal(); });

  const viewport = el("div", { class: "lootbox-viewport" });
  const track = el("div", { class: "lootbox-track" });
  viewport.appendChild(track);
  viewport.appendChild(el("div", { class: "lootbox-pointer" }));
  modal.appendChild(viewport);

  const resultBox = el("div", { class: "lootbox-result" });
  modal.appendChild(resultBox);

  overlay.id = "lootBoxOverlay";
  document.body.appendChild(overlay);

  const prizePool = caseData.prizes.length ? caseData.prizes : [wonPrize];
  const prizePoolWeight = totalPrizeWeight(prizePool);
  for (let i = 0; i < LOOTBOX_REEL_LENGTH; i++) {
    const prize = i === LOOTBOX_WINNING_INDEX ? wonPrize : prizePool[Math.floor(Math.random() * prizePool.length)];
    // wonPrize приходит с сервера как {resource, amount} без weight (см.
    // ActionResult.prize) - для реального результата ищем вес по совпадению
    // с определением приза в самом кейсе, а не читаем prize.weight напрямую.
    const prizeDef = prize.weight !== undefined ? prize
      : (prizePool.find(p => p.resource === prize.resource && p.amount === prize.amount)
        || prizePool.find(p => p.resource === prize.resource));
    const oddsPercent = prizePoolWeight ? (prizeDef ? (prizeDef.weight || 1) : 1) / prizePoolWeight * 100 : 0;
    const cell = el("div", { class: `lootbox-cell ${lootboxRarityClass(oddsPercent)}` });
    const iconDef = resourceIcon(prize.resource);
    if (iconDef) cell.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 36));
    cell.appendChild(el("div", { class: "lootbox-cell-name", text: VIEW.resource_names[prize.resource] }));
    cell.appendChild(el("div", { class: "lootbox-cell-amount", text: `×${prize.amount}` }));
    track.appendChild(cell);
  }

  // Небольшой случайный сдвиг внутри ячейки-победителя - иначе указатель всегда
  // останавливался бы ровно по центру ячейки, что визуально выдавало бы, что
  // остановка "подстроена" под заранее известный индекс.
  const jitter = (Math.random() - 0.5) * LOOTBOX_CELL_WIDTH * 0.5;
  requestAnimationFrame(() => {
    const viewportWidth = viewport.clientWidth;
    const targetOffset = LOOTBOX_WINNING_INDEX * LOOTBOX_CELL_WIDTH + LOOTBOX_CELL_WIDTH / 2 - viewportWidth / 2 + jitter;
    track.style.transition = "transform 4.2s cubic-bezier(0.1, 0.7, 0.15, 1)";
    track.style.transform = `translateX(-${targetOffset}px)`;
    _runLootboxTicker(viewport, track, 4200);
  });

  setTimeout(() => {
    playSound("reward");
    const winningCell = track.children[LOOTBOX_WINNING_INDEX];
    if (winningCell) winningCell.classList.add("won");
    resultBox.innerHTML = "";
    const iconDef = resourceIcon(wonPrize.resource);
    if (iconDef) resultBox.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 44));
    resultBox.appendChild(el("div", {
      class: "title", text: `Выпало: ${VIEW.resource_names[wonPrize.resource]} ×${wonPrize.amount}`,
    }));
  }, 4300);
}

function openStorage() {
  // Пин/анпин ресурса или покупка расширения вместимости дёргает openStorage()
  // заново (сетка перестраивается, т.к. список закреплённых/вместимость могли
  // поменяться) - без этого модалка со скроллом вниз при каждом клике прыгала бы
  // обратно наверх. Запоминаем прокрутку СТАРОЙ модалки (если она уже была
  // открыта) до того, как closeStorage() её снесёт.
  const prevModal = document.querySelector("#storageOverlay .modal");
  const savedScroll = prevModal ? prevModal.scrollTop : null;

  closeStorage();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeStorage(); });

  const modal = el("div", { class: "modal storage-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: `Склад (закреплено ${VIEW.pinned.length}/10)` }));
  head.appendChild(el("button", { text: "Закрыть", onclick: closeStorage }));
  modal.appendChild(head);

  const grid = el("div", { class: "storage-grid scroll-area" });
  // Идём по VIEW.storage (не по resource_order напрямую) - виды (SPECIES)
  // переиспользуют id ресурса только ради иконки/имени и НЕ должны попадать
  // на склад как отдельные плитки (см. tools/web_ui.py: storage_view) - особи
  // живут в state.creatures и показываются в панели "Фермы", не здесь.
  sortedStorageItems().forEach(item => {
    const rid = item.id;
    const amount = VIEW.resources[rid] || 0;
    const pinned = VIEW.pinned.includes(rid);
    // Ресурс, которого у игрока сейчас нет, на складе не показываем вовсе (по
    // прямому пожеланию игрока) - иначе при сортировке "по возрастанию" экран
    // забивался бы кучей нулей. ИСКЛЮЧЕНИЕ - закреплённые (★): плитка склада
    // единственное место с кнопкой "Открепить" (см. pinBtn ниже), спрятав её,
    // игрок не смог бы снять пин с ресурса, который потратил в ноль.
    if (amount === 0 && !pinned) return;
    const tile = resourceTileBase(rid);
    // capacity === null - у ресурса вообще не настроена вместимость склада, он
    // хранится без ограничений (как было для ВСЕХ ресурсов до этой механики) -
    // тогда показываем просто количество, без дроби "x / y".
    const amountEl = el("div", { class: "amount mono" });
    if (item && item.capacity !== null) {
      amountEl.append(String(amount) + " ", el("span", { class: "cap", text: `/ ${item.capacity}` }));
    } else {
      amountEl.textContent = String(amount);
    }
    const nameEl = el("div", { class: "name", text: VIEW.resource_names[rid] });
    // Плитка сама по себе не кликабельна целиком (там уже сидят кнопки "★"/апгрейда,
    // клик по ресурсу не должен их задевать) - кликабельны только количество и
    // название, как ингредиент в costChip (см. engine.RECIPE_BOARD_BUILDING_ID).
    if (item.jump_to) {
      [amountEl, nameEl].forEach(el2 => {
        el2.classList.add("jumpable");
        el2.title = "Перейти к рецепту этого ресурса";
        el2.addEventListener("click", (e) => { e.stopPropagation(); jumpToAction(item.jump_to); });
      });
    }
    tile.appendChild(amountEl);
    tile.appendChild(nameEl);

    const pinBtn = el("button", {
      class: "pin-toggle" + (pinned ? " pinned" : ""),
      text: pinned ? "★" : "☆",
      title: pinned ? "Открепить" : "Закрепить",
    });
    pinBtn.addEventListener("click", async () => {
      const res = await fetch("/api/pin", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ resource_id: rid }),
      });
      const payload = await res.json();
      VIEW = payload.state;
      renderAll();
      openStorage();
    });
    tile.appendChild(pinBtn);

    // Следующий тир расширения склада - показывается, ПОКА ОН ЕСТЬ, даже если
    // технология для него ещё не изучена (кнопка тогда просто задизейблена, с
    // подсказкой в title) - тот же принцип, что у "Дальше: ..." в панели
    // "Инструменты". Ресурс без storage вообще (item.next_capacity_add === null)
