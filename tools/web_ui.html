  document.getElementById("energyFree").textContent = (free >= 0 ? "+" : "") + free;
  const freeStat = document.getElementById("energyFreeStat");
  freeStat.classList.toggle("ok", free >= 0);
  freeStat.classList.toggle("bad", free < 0);

  const deficit = e.consumption > e.generation;
  const freeRatio = deficit ? 0 : (e.generation > 0 ? (e.generation - e.consumption) / e.generation : 1);
  const fill = document.getElementById("energyBarFill");
  fill.style.width = (deficit ? 100 : freeRatio * 100) + "%";
  fill.classList.toggle("danger", deficit);
}

// Предыдущее показанное значение каждого ресурса (rid -> amount) - нужно,
// чтобы renderResources() понимал, что именно изменилось с прошлого рендера,
// и проиграл докрутку/пульсацию только по-настоящему изменившимся плиткам.
let prevResourceAmounts = {};

// Плавно докручивает текст узла от `from` к `to` за `duration` мс (ease-out),
// вместо мгновенной подмены - тот же принцип разовой анимации по событию, что
// у вспышки постройки/перехода по локациям, только на самой цифре.
function animateResourceValue(node, from, to, duration = 350) {
  const start = performance.now();
  function step(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    node.textContent = String(Math.round(from + (to - from) * eased));
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderResources() {
  const container = document.getElementById("resGrid");
  container.innerHTML = "";
  if (!VIEW.pinned.length) {
    container.appendChild(el("div", { class: "empty-note", text: "Нет закреплённых ресурсов - открой Склад." }));
    return;
  }
  VIEW.pinned.forEach(rid => {
    const amount = VIEW.resources[rid] || 0;
    const rate = VIEW.rates[rid] || 0;
    const prevAmount = prevResourceAmounts[rid];
    const tileClasses = ["res-tile"];
    if (amount === 0) tileClasses.push("zero");
    if (prevAmount !== undefined && prevAmount !== amount) tileClasses.push("changed", amount > prevAmount ? "up" : "down");
    const tile = el("div", { class: tileClasses.join(" ") });
    const iconDef = resourceIcon(rid);
    if (iconDef) tile.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 32));
    const info = el("div", { class: "info" });
    const amountEl = el("div", { class: "amount mono", text: String(prevAmount !== undefined ? prevAmount : amount) });
    info.appendChild(amountEl);
    if (prevAmount !== undefined && prevAmount !== amount) animateResourceValue(amountEl, prevAmount, amount);
    prevResourceAmounts[rid] = amount;
    if (rate !== 0) info.appendChild(el("div", { class: `rate ${rate > 0 ? "pos" : "neg"}`, text: `${rate > 0 ? "+" : ""}${rate}/ход` }));
    // jump_to (см. engine.RECIPE_BOARD_BUILDING_ID/VIEW.resource_jump) - тот же
    // клик "перейти к рецепту", что и у чипов цены/плиток склада, только здесь
    // на закреплённой панели наверху, самом заметном месте с суммой ресурса.
    const jumpTo = VIEW.resource_jump[rid];
    const nameEl = el("div", { class: "name" + (jumpTo ? " jumpable" : ""), text: VIEW.resource_names[rid] });
    if (jumpTo) {
      nameEl.title = "Перейти к рецепту этого ресурса";
      nameEl.addEventListener("click", () => jumpToAction(jumpTo));
    }
    info.appendChild(nameEl);
    tile.appendChild(info);
    container.appendChild(tile);
  });
}

// Строка поиска панели "Производственные мощности" - переживает rebuild списка
// (renderBuildings() дёргается заново после каждого действия), как
// creatureBankSearchQuery/storageSearchQuery.
let buildingsSearchQuery = "";
// Последний ход, для которого уже проставили вспышку "произвело" - null значит
// "ещё ни разу не рендерили", чтобы не вспыхивало ВСЁ разом при самой первой
// отрисовке страницы (см. renderBuildings).
let lastBuildingsFlashTurn = null;
// Фильтр "Состояние" панели "Производственные мощности" - переживает rebuild
// списка, как buildingsSearchQuery. "all"/"ok"/"broken" - порядок цикла клика
// по иконке, см. BLD_STATUS_FILTER_CYCLE.
let buildingsBrokenFilter = "all";
// Фильтр по тегам (b.tags, назначаются в редакторе контента - buildings.*.tags,
// см. CLAUDE.md) - Set выбранных тегов, ЛЮБОЙ из которых должен быть у постройки
// (OR, не И - постройка с несколькими тегами попадает под фильтр, если совпал
// хотя бы один). Пусто = без фильтра по тегам.
let buildingsTagFilter = new Set();
// Открыта ли выпадающая панель фильтра по тегам - переживает rebuild списка
// (renderBuildings() дёргается заново при каждом клике по чекбоксу тега, чтобы
// применить фильтр), как buildingsSearchQuery.
let buildingsTagDropdownOpen = false;

const BLD_STATUS_FILTER_CYCLE = ["all", "ok", "broken"];
const BLD_STATUS_FILTER_META = {
  all: { label: "Все" },
  ok: { label: "Только исправные" },
  broken: { label: "Только сломанные" },
};

// Панель фильтров над списком построек - иконка-переключатель состояния (клик
// листает по кругу "Все" -> "Только исправные" -> "Только сломанные", тот же
// цветовой язык, что .bld-led у самой постройки, вместо select ради компактности
// - вариантов всего 3 и они меняются кликом чаще, чем выбором из списка) +
// красиво оформленный выпадающий список тегов (тот же визуальный приём, что
// .sound-panel у громкости в шапке - плавающая панель, закрывается кликом
// снаружи, см. document click listener сразу под функцией), собранный
// динамически из ВСЕХ уже построенных построек (VIEW.buildings) - не
// фиксированный список, ЛЮБОЙ тег, назначенный хоть одной постройке в редакторе
// контента, сам появляется тут как фильтр, без правки этого файла.
function renderBuildingsFilterBar(allTags) {
  const bar = el("div", { class: "bld-filters" });

  const statusBtn = el("button", { type: "button", class: `bld-status-filter-btn ${buildingsBrokenFilter}` });
  statusBtn.title = `Состояние: ${BLD_STATUS_FILTER_META[buildingsBrokenFilter].label} (клик - сменить)`;
  statusBtn.appendChild(el("span", { class: "bld-status-dot" }));
  statusBtn.appendChild(document.createTextNode(BLD_STATUS_FILTER_META[buildingsBrokenFilter].label));
  statusBtn.addEventListener("click", () => {
    const idx = BLD_STATUS_FILTER_CYCLE.indexOf(buildingsBrokenFilter);
    buildingsBrokenFilter = BLD_STATUS_FILTER_CYCLE[(idx + 1) % BLD_STATUS_FILTER_CYCLE.length];
    renderBuildings();
  });
  bar.appendChild(statusBtn);

  if (allTags.length) {
    const tagWrap = el("div", { class: "bld-tag-dropdown" });
    const tagBtn = el("button", {
      type: "button", class: "bld-tag-dropdown-btn",
      text: buildingsTagFilter.size ? `Тип: ${[...buildingsTagFilter].join(", ")}` : "Тип: любой",
    });
    tagBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      buildingsTagDropdownOpen = !buildingsTagDropdownOpen;
      renderBuildings();
    });
    tagWrap.appendChild(tagBtn);

    if (buildingsTagDropdownOpen) {
      const panel = el("div", { class: "bld-tag-dropdown-panel" });
      allTags.forEach(tag => {
        const label = el("label", { class: "bld-tag-option" });
        const cb = el("input", { type: "checkbox" });
        cb.checked = buildingsTagFilter.has(tag);
        cb.addEventListener("change", () => {
          if (cb.checked) buildingsTagFilter.add(tag); else buildingsTagFilter.delete(tag);
          renderBuildings();
        });
        label.appendChild(cb);
        label.appendChild(document.createTextNode(tag));
        panel.appendChild(label);
      });
      if (buildingsTagFilter.size) {
        const clearBtn = el("button", { type: "button", class: "bld-tag-clear", text: "Сбросить" });
        clearBtn.addEventListener("click", () => { buildingsTagFilter.clear(); renderBuildings(); });
        panel.appendChild(clearBtn);
      }
      tagWrap.appendChild(panel);
    }
    bar.appendChild(tagWrap);
  }

  return bar;
}
// Закрытие выпадающей панели тегов кликом снаружи - слушатель вешается РОВНО
// ОДИН РАЗ на весь документ (не при каждом renderBuildings(), чтобы не копить
// висящие обработчики при каждой перерисовке панели), тот же приём, что
// soundControl/soundPanel в конце файла.
document.addEventListener("click", (e) => {
  if (buildingsTagDropdownOpen && !e.target.closest(".bld-tag-dropdown")) {
    buildingsTagDropdownOpen = false;
    renderBuildings();
  }
});

// Список построек (не сетка тайлов) - та же строка, что "Банк особей" в
// "Особях": иконка со статусом, счётчик/бейдж лимита, описание, содержание
// за ход (upkeepRow/specialAbilitiesRow - те же хелперы, что у карточки
// каталога "Построить") и, если у типа постройки вообще есть upgrades,
// кнопка "⚙ Улучшения" прямо в строке - единственное место, откуда она теперь
// открывается (см. tools/web_ui.py: build_view, каталог "Построить" больше не
// обязан держать штучную постройку на виду после max_count ради этой кнопки).
// Три спец-механики (is_farm/is_breeding_station/is_genetics_lab, тоже из
// build_view) дают ещё по одной кнопке ТУТ ЖЕ, на карточке ИМЕННО ТОЙ
// постройки, что отвечает за механику - по прямому пожеланию, 2026-09-10:
// расселение/апгрейды пасек и скрещивание раньше жили в общем меню "Пасеки" в
// шапке, оторванном от самих построек.
function renderBuildings() {
  const container = document.getElementById("buildingsGrid");
  const prevList = container.querySelector(".bld-list");
  const savedScroll = prevList ? prevList.scrollTop : null;
  container.innerHTML = "";
  document.getElementById("buildingsCount").textContent = VIEW.buildings.length;
  if (!VIEW.buildings.length) {
    container.appendChild(el("div", { class: "empty-note", text: "Построек пока нет." }));
    return;
  }

  // Ход реально продвинулся с прошлого рендера (не просто действие вроде
  // insert_soul/toggle_autocraft, которые хода не тратят, см. CLAUDE.md) -
  // именно в этот момент постройки со status="ok"/"partial" и активными копиями
  // произвели ресурс за только что прошедший ход.
  const turnAdvanced = lastBuildingsFlashTurn !== null && VIEW.turn !== lastBuildingsFlashTurn;
  lastBuildingsFlashTurn = VIEW.turn;

  // Теги считаются заново из ТЕКУЩИХ VIEW.buildings при каждой перерисовке (не
  // кэшируются) - постройка может сломаться/восстановиться, но набор тегов как
  // таковой меняется только правкой content.json, так что дороговизны тут нет.
  // Снимаем из фильтра теги, которых не осталось ни у одной постройки (например,
  // после смены сохранения на другое) - иначе кнопка осталась бы "нажатой", но
  // невидимой, и фильтр выглядел бы сломанным без явной подсказки почему.
  const allTags = [...new Set(VIEW.buildings.flatMap(b => b.tags || []))].sort((a, b) => a.localeCompare(b, "ru"));
  [...buildingsTagFilter].forEach(t => { if (!allTags.includes(t)) buildingsTagFilter.delete(t); });

  const filteredBuildings = VIEW.buildings.filter(b => {
    if (buildingsBrokenFilter === "broken" && !(b.broken > 0)) return false;
    if (buildingsBrokenFilter === "ok" && b.broken > 0) return false;
    if (buildingsTagFilter.size && !(b.tags || []).some(t => buildingsTagFilter.has(t))) return false;
    return true;
  });

  const list = el("div", { class: "bld-list thin-scroll" });
  filteredBuildings.forEach(b => {
    const producedThisTurn = turnAdvanced && b.active_count > 0 && b.produces.length > 0;
    const row = el("div", { class: producedThisTurn ? "bld-row produced" : "bld-row" });
    row.dataset.resourceName = b.name.toLowerCase();

    const head = el("div", { class: "bld-row-head" });

    const iconWrap = el("div", { class: "bld-row-icon" });
    const customIcon = buildingIcon(b.id);
    if (customIcon) {
      iconWrap.appendChild(pixelIcon(customIcon.grid, customIcon.palette, 30));
    } else {
      iconWrap.appendChild(pixelIcon(ICONS.machine.grid, BUILDING_PALETTE[b.status] || BUILDING_PALETTE.ok, 30));
      iconWrap.appendChild(el("div", { class: "bld-icon-label", text: b.icon_label }));
    }
    iconWrap.appendChild(el("div", { class: `bld-led ${b.status}` }));
    head.appendChild(iconWrap);

    const main = el("div", { class: "bld-row-main" });
    const title = el("div", { class: "bld-row-title" });
    title.appendChild(document.createTextNode(b.name));
    // Штучные постройки (max_count) показывают "сколько построено из скольки
    // можно" вместо голого счётчика - именно эти постройки пропадают из
    // каталога "Построить" по достижению лимита, счётчик здесь - единственное
    // место, где это видно.
    if (b.max_count != null) {
      title.appendChild(el("span", { class: "bld-badge limit", text: `лимит ${b.count}/${b.max_count}` }));
    } else {
      title.appendChild(el("span", { class: "amt mono", text: `×${b.count}` }));
    }
    if (b.broken > 0) {
      title.appendChild(el("span", { class: "bld-badge broken", text: `сломано: ${b.broken}` }));
    }
    main.appendChild(title);

    if (b.description) main.appendChild(el("div", { class: "bld-row-desc", text: b.description }));

    // Те же хелперы, что у карточки постройки в каталоге "Построить" - раньше
    // содержание за ход и особые способности (вычислительная мощность,
    // разблокировка автокрафта, ёмкость преобразователя) были видны только в
    // hover-подсказке (buildingTooltip), теперь - прямо в строке.
    const upkeep = upkeepRow(b);
    if (upkeep) main.appendChild(upkeep);
    const special = specialAbilitiesRow(b);
    if (special) main.appendChild(special);
    const mechanismToggle = renderMechanismToggle(b);
    if (mechanismToggle) main.appendChild(mechanismToggle);

    if (b.broken > 0) main.appendChild(renderBuildingRepairRow(b));
    head.appendChild(main);

    if (b.upgrades || b.is_farm || b.is_breeding_station || b.is_genetics_lab || b.is_soul_collector || b.is_enchanting_table || b.automation) {
      const actions = el("div", { class: "bld-row-actions" });
      if (b.upgrades) {
        const btn = el("button", { class: "upgrade-open-btn", text: "⚙ Улучшения" });
        btn.addEventListener("click", () => openBuildingUpgradesModal(b));
        actions.appendChild(btn);
      }
      if (b.automation) {
        const btn = el("button", { class: "upgrade-open-btn", text: "🤖 Автоматизация" });
        btn.title = "Правила «если ресурс — тогда действие», выполняются автоматически каждый ход";
        btn.addEventListener("click", () => openAutomationModal(b));
        actions.appendChild(btn);
      }
      if (b.is_farm) {
        const btn = el("button", { class: "upgrade-open-btn", text: "🐝 Особи" });
        btn.title = "Расселение и улучшения каждого построенного экземпляра этой фермы";
        btn.addEventListener("click", () => openFarmTypeModal(b.id));
        actions.appendChild(btn);
      }
      if (b.is_breeding_station) {
        const btn = el("button", { class: "upgrade-open-btn", text: "🧬 Скрестить" });
        btn.title = "Скрестить любых двух особей игрока";
        btn.addEventListener("click", openBreedingModal);
        actions.appendChild(btn);
      }
      if (b.is_genetics_lab) {
        const btn = el("button", { class: "upgrade-open-btn", text: "🧬 Синтез" });
        btn.title = "Синтезировать особь по уже изученным аллелям";
        btn.addEventListener("click", openGeneticsLabModal);
        actions.appendChild(btn);
      }
      if (b.is_soul_collector) {
        const btn = el("button", { class: "upgrade-open-btn", text: "👻 Души" });
        btn.title = "Вставить/вынуть души в слоты этого синтезатора";
        btn.addEventListener("click", () => openSoulSynthesizerModal(b.id));
        actions.appendChild(btn);
      }
      if (b.is_enchanting_table) {
        const btn = el("button", { class: "upgrade-open-btn", text: "🔮 Зачаровать" });
        btn.title = "Зачаровать кирку, оружие или броню";
        btn.addEventListener("click", openEnchantingModal);
        actions.appendChild(btn);
      }
      head.appendChild(actions);
    }

    row.appendChild(head);
    list.appendChild(row);
  });

  container.appendChild(renderBuildingsFilterBar(allTags));
  container.appendChild(makeResourceSearchBar(list, {
    get: () => buildingsSearchQuery,
    set: (v) => { buildingsSearchQuery = v; },
  }, true));
  if (!filteredBuildings.length) {
    list.appendChild(el("div", { class: "empty-note", text: "Ничего не подходит под фильтр." }));
  }
  container.appendChild(list);
  if (savedScroll !== null) list.scrollTop = savedScroll;
}

// Ремонт теперь прямо на карточке постройки (не отдельная вкладка "Ремонт" -
// см. CLAUDE.md) - кнопка чинит СРАЗУ все копии, для которых сейчас хватает
// инструмента (b.repairable), цена (b.repair_cost) отражает именно эту часть.
// Если какой-то вид поломки ждёт инструмент (b.repair_blocked) - показываем
// подсказку под кнопкой, что конкретно нужно, даже если repairable === 0
// (кнопка тогда просто задизейблена, но сама постройка и её сломанность видны).
function renderBuildingRepairRow(b) {
  const wrap = el("div", { class: "bld-repair-row" });
  const btn = el("button", { class: "small", text: `Ремонт (${b.repairable}/${b.broken})` });
  btn.disabled = b.repairable <= 0;
  if (b.repair_cost.length) {
    const costBox = el("span", { class: "bld-repair-cost" });
    b.repair_cost.forEach(c => costBox.appendChild(costChip(c.id, c.amount, false, c.jump_to)));
    wrap.appendChild(costBox);
  }
  const { key, delay } = actionCooldownInfo("repair", b);
  btn.addEventListener("click", () => tryRunAction(key, delay, btn, () => doAction("repair", b.id)));
  wrap.appendChild(btn);
  if (b.repair_blocked.length) {
    const hint = b.repair_blocked
      .map(t => `${t.type_name} ×${t.count} (нужен: ${t.missing_tools.join(", ")})`)
      .join("; ");
    wrap.appendChild(el("span", { class: "bld-repair-blocked", text: hint }));
  }
  return wrap;
}

// Список инструментов живёт в отдельной модалке (кнопка "Инструменты" в шапке,
// рядом со Статистикой/Инвентарём/Сохранениями), а не инлайн-панелью на
// дашборде, как было раньше - список растёт с каждым новым content.json["tools"]
// (было раньше жёстко про одну кирку), и держать его вечно на виду перестало
// иметь смысл. Один блок на КАЖДЫЙ инструмент. Кнопка апгрейда - НЕ через
// actionCard/categories (у этой панели всегда была своя, отдельная от "Пульта
// действий" вёрстка), но ту же защиту от автокликера (tryRunAction/
// applyCooldownVisual) получает точно так же, как и все остальные кнопки.
// Модалка - строго про инструменты (статус + цена открытия/улучшения каждого),
// без добычи - добыча (поиск/копка жил) целиком живёт в Шахте
// (VIEW.categories.mining), по прямому пожеланию не дублировать её здесь.
function openToolsModal() {
  // Тот же приём, что openStorage(): апгрейд тира дёргает openToolsModal()
  // заново (список перестраивается целиком) - без сохранения прокрутки модалка
  // с несколькими экранами инструментов прыгала бы наверх при каждом клике.
  const prevModal = document.querySelector("#toolsOverlay .modal");
  const savedScroll = prevModal ? prevModal.scrollTop : null;

  closeToolsModal();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeToolsModal(); });

  const modal = el("div", { class: "modal tools-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Инструменты" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: closeToolsModal }));
  modal.appendChild(head);

  // Компактная строка 1:1 из канваса (B_Tools.dc.html: .line/.pips/.req) -
  // полоска пипсов вместо крупной пиксель-иконки, короткая акцентная кнопка
  // вместо кнопки-простыни с перечислением всех ресурсов внутри неё самой (по
  // прямому пожеланию, 2026-09-13 - см. CLAUDE.md). Маленькая иконка тира
  // слева - ЕДИНСТВЕННОЕ намеренное отличие от канваса (там иконок нет вовсе):
  // у тиров инструментов есть настоящая кастомная пиксель-иконка, рисуемая в
  // content_editor.html (iconEditButton у tools[].tiers[]) - прятать реально
  // нарисованный контент было бы не "привести к канвасу", а потерять фичу.
  const list = el("div", { class: "tools-list scroll-area" });
  VIEW.tools.forEach(tool => {
    const row = el("div", { class: "line" });
    const iconDef = toolIcon(tool.id, tool.tier);
    row.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 28));
    const body = el("div", { class: "line-body" });
    row.appendChild(body);
    body.appendChild(el("div", { class: "line-name", text: `${tool.name}: ${tool.tier_name}` }));

    const pips = el("div", { class: "pips" });
    for (let i = 1; i <= tool.max_tier; i++) {
      pips.appendChild(el("div", { class: `pip ${i < tool.tier ? "done" : i === tool.tier ? "current" : "locked"}` }));
    }
    body.appendChild(pips);

    // Прочность (max_durability на ТЕКУЩЕМ тире) - см. "Виды поломок и ремонт
    // инструментов" в CLAUDE.md. Инструменты без max_durability (топор/кирка/
    // меч и т.п.) вообще не показывают эту строку.
    if (tool.max_durability != null) {
      body.appendChild(el("div", {
        class: "line-sub" + (tool.is_broken ? " danger" : ""),
        text: `Прочность: ${tool.durability_remaining}/${tool.max_durability}`,
      }));
    }

    const req = el("div", { class: "req" });
    const reqText = el("div", { class: "req-text" });
    if (tool.is_broken) {
      const repairCostText = tool.repair_cost.map(c => `${c.amount} ${c.name}`).join(", ") || "бесплатно";
      reqText.append("Ремонт: ", el("b", { text: repairCostText }));
      req.appendChild(reqText);
      const repairBtn = el("div", { class: "btn-sm", text: "Почин." });
      const rKey = `repair_tool:${tool.id}`;
      const rDelay = VIEW.default_action_delay_ms;
      const rRemaining = cooldownRemainingMs(rKey);
      if (rRemaining > 0) applyCooldownVisual(repairBtn, rRemaining, rDelay);
      repairBtn.addEventListener("click", () => tryRunAction(rKey, rDelay, repairBtn, () => doAction("repair_tool", tool.id)));
      req.appendChild(repairBtn);
    } else if (tool.next_tier_name) {
      const costText = tool.next_cost.map(c => `${c.amount} ${c.name}`).join(", ") || "бесплатно";
      if (tool.can_upgrade) {
        reqText.append(`Тир ${tool.tier} → ${tool.tier + 1}: `, el("b", { text: costText }));
        req.appendChild(reqText);
        const btn = el("div", { class: "btn-sm", text: "Улучшить" });
        const key = `upgrade_tool:${tool.id}`;
        const delay = VIEW.default_action_delay_ms;
        const remaining = cooldownRemainingMs(key);
        if (remaining > 0) applyCooldownVisual(btn, remaining, delay);
        btn.addEventListener("click", () => tryRunAction(key, delay, btn, () => doAction("upgrade_tool", tool.id)));
        req.appendChild(btn);
      } else {
        // Следующий тир существует, но пока не открыт технологией - показываем,
        // что дальше есть куда расти и чего это будет стоить, а не просто прячем
        // (иначе выглядело бы так, будто инструмент уже упёрся в потолок).
        reqText.classList.add("locked");
        reqText.textContent = `требует тех «${tool.next_tech_name}»`;
        req.appendChild(reqText);
        req.appendChild(el("div", { class: "btn-sm disabled", text: "—" }));
      }
    } else {
      reqText.classList.add("locked");
      reqText.textContent = "максимальный тир";
      req.appendChild(reqText);
    }
    body.appendChild(req);
    list.appendChild(row);
  });
  modal.appendChild(list);

  overlay.appendChild(modal);
  overlay.id = "toolsOverlay";
  document.body.appendChild(overlay);
  if (savedScroll !== null) modal.scrollTop = savedScroll;
}

function closeToolsModal() {
  const overlay = document.getElementById("toolsOverlay");
  if (overlay) overlay.remove();
}

const UPGRADE_TYPE_LABELS = {
  scale: "Масштаб рецепта",
  energy_efficiency: "Энергоэффективность",
  generation_efficiency: "Эффективность генерации",
  energy_converter_capacity: "Пропускная способность",
  soul_collector_slots: "Слоты синтезатора душ",
  soul_generation_efficiency: "Эффективность синтезатора душ",
  breakdown_immunity: "Неломкость",
  action_duration_reduction: "Ускорение действия",
};

// Один блок "Было -> Стало" для ЛИБО постройки (output=produces, input=consumes),
// ЛИБО зависимого ручного действия (output=gain, input=cost) - naming общий,
// потому что математика одна и та же (см. game/engine.py:_apply_building_upgrades).
// null, если и было, и станет - пусто (постройке или действию нечего показать).
function upgradeBeforeAfterBlock(label, beforeOutput, beforeInput, afterOutput, afterInput) {
  if (!beforeOutput.length && !beforeInput.length && !afterOutput.length && !afterInput.length) return null;
  const block = el("div", { class: "upgrade-preview-block" });
  block.appendChild(el("div", { class: "upgrade-preview-label", text: label }));
  const beforeRow = el("div", { class: "costs" });
  beforeRow.appendChild(el("span", { class: "note-chip", text: "Было:" }));
  beforeOutput.forEach(c => beforeRow.appendChild(costChip(c.id, c.amount, true)));
  beforeInput.forEach(c => beforeRow.appendChild(costChip(c.id, c.amount, false)));
  if (!beforeOutput.length && !beforeInput.length) beforeRow.appendChild(el("span", { class: "note-chip", text: "ничего" }));
  block.appendChild(beforeRow);
  const afterRow = el("div", { class: "costs" });
  afterRow.appendChild(el("span", { class: "note-chip accent", text: "→ Станет:" }));
  afterOutput.forEach(c => afterRow.appendChild(costChip(c.id, c.amount, true)));
  afterInput.forEach(c => afterRow.appendChild(costChip(c.id, c.amount, false)));
  if (!afterOutput.length && !afterInput.length) afterRow.appendChild(el("span", { class: "note-chip", text: "ничего" }));
  block.appendChild(afterRow);
  return block;
}

// Небольшое отдельное окно улучшений ОДНОГО типа постройки (три жёстко зашитых
// типа - см. game/engine.py:effective_building_stats) - открывается кнопкой
// "Улучшения" на уже построенной карточке в каталоге "Построить" (upgradesRow).
// item - запись из VIEW.categories.build (передаётся свежая при каждом открытии/
// пересборке, см. renderAll()).
function openBuildingUpgradesModal(item) {
  // Тот же приём, что openStorage()/openToolsModal(): покупка улучшения дёргает
  // openBuildingUpgradesModal() заново (см. renderAll()) - запоминаем прокрутку
  // СТАРОЙ модалки до того, как closeBuildingUpgradesModal() её снесёт, иначе
  // список улучшений (растёт со временем) прыгал бы наверх при каждой покупке.
  const prevModal = document.querySelector("#buildingUpgradesOverlay .modal");
  const savedScroll = prevModal ? prevModal.scrollTop : null;

  closeBuildingUpgradesModal();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeBuildingUpgradesModal(); });

  const modal = el("div", { class: "modal upgrades-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: `Улучшения: ${item.name}` }));
  head.appendChild(el("button", { text: "Закрыть", onclick: closeBuildingUpgradesModal }));
  modal.appendChild(head);

  const { current, dependent_action_names, upgrades } = item.upgrades;
  if (dependent_action_names.length) {
    modal.appendChild(el("p", { class: "hint", text:
      "Эта постройка сама ничего не производит - её улучшения влияют на ручные действия, "
      + "которые от неё зависят (см. requires_building):" }));
    const depList = el("div", { class: "upgrade-preview-block" });
    dependent_action_names.forEach(name => depList.appendChild(el("div", { class: "note-chip", text: name })));
    modal.appendChild(depList);
  }

  // Строка апгрейда - 1:1 из канваса (B_Buildings.dc.html: .row/.idx/.info/.btn-sm) -
  // порядковый номер + имя/описание/цена в один горизонтальный ряд с компактной
  // акцентной кнопкой справа, а не карточка со всем стопкой друг под другом,
  // как было раньше - по прямому пожеланию, 2026-09-13, см. CLAUDE.md.
  const list = el("div", { class: "upgrades-list scroll-area" });
  upgrades.forEach((u, idx) => {
    const row = el("div", { class: "upg-row" });
    row.appendChild(el("div", { class: "upg-idx", text: String(idx + 1).padStart(2, "0") }));
    const body = el("div", { class: "upg-body" });
    row.appendChild(body);
    body.appendChild(el("div", { class: "upgrade-title", text: `${u.name} - ${UPGRADE_TYPE_LABELS[u.type] || u.type}` }));
    body.appendChild(el("div", { class: "upgrade-desc", text: u.description }));

    if (u.preview) {
      const buildingBlock = upgradeBeforeAfterBlock("Постройка", current.produces, current.consumes, u.preview.produces, u.preview.consumes);
      if (buildingBlock) body.appendChild(buildingBlock);
      // Только ОДИН показательный рецепт (example_action), а не все зависимые
      // действия разом - их может быть несколько десятков (см. CLAUDE.md) -
      // полный список имён уже дан выше, в dependent_action_names.
      const before = current.example_action;
      const after = u.preview.example_action;
      if (before && after) {
        const actionBlock = upgradeBeforeAfterBlock(before.name, before.gain, before.cost, after.gain, after.cost);
        if (actionBlock) body.appendChild(actionBlock);
      }
    }

    const costRow = el("div", { class: "costs" });
    u.cost.forEach(c => costRow.appendChild(costChip(c.id, c.amount, false, c.jump_to)));
    if (!u.cost.length) costRow.appendChild(el("span", { class: "note-chip", text: "бесплатно" }));
    if (u.repeatable) costRow.appendChild(el("span", { class: "note-chip", text: `куплено раз: ${u.times_purchased}${u.max_purchases != null ? `/${u.max_purchases}` : ""}` }));
    body.appendChild(costRow);

    // Следующий уровень прогрессии, который ещё не куплен (sequence_locked),
    // сервер вообще не включает в upgrades (см. web_ui.py:building_upgrades_view) -
    // сюда он просто не попадает, пока не куплен предыдущий. Остаётся только
    // tech_locked - уровень уже "на очереди", но не хватает технологии.
    const lockReasons = [];
    if (u.tech_locked) lockReasons.push(`Нужна технология «${u.requires_tech_name}»`);

    // repeatable - кнопка "Купить" остаётся доступной ПОСЛЕ первой покупки
    // (каждая следующая покупка стакает ещё +value, цена растёт - см.
    // game/engine.py:repeatable_upgrade_cost) до max_purchases (at_max), если он
    // задан; обычный апгрейд - как раньше, ровно одна покупка.
    if (u.repeatable && u.at_max) {
      row.appendChild(el("div", { class: "upgrade-status done", text: `✓ Максимум (${u.times_purchased}/${u.max_purchases})` }));
    } else if (u.purchased && !u.repeatable) {
      row.appendChild(el("div", { class: "upgrade-status done", text: "✓ Куплено" }));
    } else if (lockReasons.length) {
      row.appendChild(el("div", { class: "upgrade-status locked", text: lockReasons.join(" · ") }));
    } else {
      const buyBtn = el("div", { class: "btn-sm", text: u.repeatable && u.purchased ? "Ещё" : "Купить" });
      const key = `building_upgrade:${item.id}:${u.id}:${u.times_purchased}`;
      const delay = VIEW.default_action_delay_ms;
      const remaining = cooldownRemainingMs(key);
      if (remaining > 0) applyCooldownVisual(buyBtn, remaining, delay);
      buyBtn.addEventListener("click", () => tryRunAction(key, delay, buyBtn, () => doAction("building_upgrade", `${item.id}:${u.id}`)));
      row.appendChild(buyBtn);
    }
    list.appendChild(row);
  });
  modal.appendChild(list);

  overlay.appendChild(modal);
  overlay.id = "buildingUpgradesOverlay";
  overlay.dataset.buildingId = item.id;
  document.body.appendChild(overlay);
  if (savedScroll !== null) modal.scrollTop = savedScroll;
}

function closeBuildingUpgradesModal() {
  const overlay = document.getElementById("buildingUpgradesOverlay");
  if (overlay) overlay.remove();
}

const AUTOMATION_OP_LABELS = { ">=": "не меньше", "<=": "не больше" };

// Окно "Автоматизация" (item.automation, см. tools/web_ui.py:automation_view) -
// список уже настроенных правил вида "если ресурс X >= / <= K (и, может быть,
// ещё условия) - выполнить действие Y" + кнопка добавления нового, пока есть
// свободные слоты (item.automation.capacity). Тот же приём, что у
// openBuildingUpgradesModal: запоминаем прокрутку старой модалки перед
// пересборкой, id/dataset.buildingId для обновления из renderAll().
function openAutomationModal(item) {
  const prevModal = document.querySelector("#automationOverlay .modal");
  const savedScroll = prevModal ? prevModal.scrollTop : null;

  closeAutomationModal();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeAutomationModal(); });

  const modal = el("div", { class: "modal upgrades-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: `Автоматизация: ${item.name}` }));
  head.appendChild(el("button", { text: "Закрыть", onclick: closeAutomationModal }));
  modal.appendChild(head);

  const automation = item.automation;
  modal.appendChild(el("p", { class: "hint", text:
    `Слоты: ${automation.rules.length}/${automation.capacity}. Каждый ход каждое правило проверяет свои `
    + "условия и, если ВСЕ они истинны (без условий - значит всегда), само выполняет выбранное действие - "
    + "без клика игрока." }));

  const list = el("div", { class: "upgrades-list scroll-area" });
  automation.rules.forEach(rule => list.appendChild(renderAutomationRuleRow(item.id, rule)));
  modal.appendChild(list);

  if (automation.rules.length < automation.capacity) {
    const addBtn = el("button", { class: "small", text: "+ добавить правило" });
    addBtn.addEventListener("click", () => openAutomationRuleEditorModal(item.id, null));
    const addRow = el("div", { class: "upgrade-row" });
    addRow.appendChild(addBtn);
    modal.appendChild(addRow);
  } else if (!automation.rules.length) {
    modal.appendChild(el("p", { class: "hint", text: "Нет свободных слотов - купите апгрейд автоматизатора." }));
  }

  overlay.appendChild(modal);
  overlay.id = "automationOverlay";
  overlay.dataset.buildingId = item.id;
  document.body.appendChild(overlay);
  if (savedScroll !== null) modal.scrollTop = savedScroll;
}

function closeAutomationModal() {
  const overlay = document.getElementById("automationOverlay");
  if (overlay) overlay.remove();
}

// Модалка "Шахта" (VIEW.mine_field, см. tools/web_ui.py:mine_field_view) -
// туман войны: клетка видна только в радиусе 1 от уже пройденной, ломается
// только если ортогонально граничит со сломанной (диагональ видна, но не
// рубится) ИЛИ если весь N x N блок удара касается пройденного хотя бы одной
// гранью (тогда бьёт целиком, включая ещё не открытые клетки внутри блока).
// Глобальная модалка (одна на игру, как Квесты/Навыки) - хук в renderAll() уже
// добавлен рядом с остальными такими модалками.
let mineFieldHoverIndex = null;
// Всплывашка "+N" по клетке, которую только что ударили - выставляется
// mineFieldHitCell ДО renderAll() и считывается openMineFieldModal ПОСЛЕ того,
// как renderMineFieldGrid пересоберёт сетку заново (сама модалка при каждом
// действии уничтожается и создаётся с нуля, см. renderAll/openMineFieldModal -
// поэтому попап не может просто "остаться висеть", его нужно заспавнить заново
// поверх новой клетки на той же позиции).
let mineFieldPendingPopup = null;

// Клики по полю НЕ идут через doAction()/`/api/action` (тот всегда тратит ход,
// см. tools/web_ui.py:run_turn) - у поля шахты свои выделенные эндпоинты, как у
// insert_soul/house_creature, чтобы исследование тумана не двигало игровые часы.
async function mineFieldPost(path, body, onResult) {
  const prevResources = VIEW.resources;
  const res = await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const payload = await res.json();
  VIEW = payload.state;
  if (onResult) onResult(prevResources);
  pushLog({ message: payload.message, ok: payload.ok, action_deltas: [], production_deltas: [], idle: [], broken: [] });
  renderAll();
}

function mineFieldNewField() { return mineFieldPost("/api/mining_new_field", {}); }

function mineFieldHitCell(r, c) {
  return mineFieldPost("/api/mining_hit_cell", { r, c }, (prevResources) => {
    // Всплывашка - только по РУДЕ, не по обычной породе (rock_resource) - по
    // прямому пожеланию, 2026-09-16: камень копаешь постоянно, "+N" на каждый
    // клик замусоривал бы экран, руда - редкое приятное событие, вот её и
    // стоит подсвечивать.
    const rockId = VIEW.mine_field.rock_resource;
    const gains = [];
    for (const rid in VIEW.resources) {
      if (rid === rockId) continue;
      const delta = (VIEW.resources[rid] || 0) - (prevResources[rid] || 0);
      if (delta > 0) gains.push({ id: rid, amount: delta });
    }
    if (gains.length) mineFieldPendingPopup = { r, c, gains };
  });
}

// Спавнит "+N <иконка>" над клеткой (r, c) в уже отрисованной сетке - вызывается
// сразу после renderMineFieldGrid, координаты берутся геометрически (getBoundingClientRect),
// а не по проценту от размера ячейки, чтобы не зависеть от текущего масштаба поля.
function spawnMineFieldGainPopup(gridWrap, mf, popup) {
  const gridEl = document.getElementById("mineFieldGrid");
  if (!gridEl) return;
  const cellEl = gridEl.children[mineFieldIdx(mf.size, popup.r, popup.c)];
  if (!cellEl) return;
  const wrapRect = gridWrap.getBoundingClientRect();
  const cellRect = cellEl.getBoundingClientRect();
  const left = cellRect.left - wrapRect.left + cellRect.width / 2;
  const top = cellRect.top - wrapRect.top;
  popup.gains.forEach((gain, i) => {
    const span = el("div", { class: "mine-gain-popup" });
    span.style.left = `${left}px`;
    span.style.top = `${top}px`;
    span.style.animationDelay = `${i * 90}ms`;
    span.appendChild(document.createTextNode(`+${gain.amount}`));
    const iconDef = resourceIcon(gain.id);
    if (iconDef) {
      const iconBox = el("span", { class: "mine-gain-icon" });
      iconBox.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 16));
      span.appendChild(iconBox);
    }
    gridWrap.appendChild(span);
    span.addEventListener("animationend", () => span.remove());
  });
}

function mineFieldIdx(size, r, c) { return r * size + c; }

function mineFieldCellBroken(cells, size, r, c) {
  if (r < 0 || r >= size || c < 0 || c >= size) return false;
  const cell = cells[mineFieldIdx(size, r, c)];
  return !!(cell && cell.broken);
}

function mineFieldHasOrthogonalBrokenNeighbor(cells, size, r, c) {
  return [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dr, dc]) => mineFieldCellBroken(cells, size, r + dr, c + dc));
}

function mineFieldAreaCoords(size, area, r, c) {
  const offset = Math.floor((area - 1) / 2);
  const coords = [];
  for (let rr = r - offset; rr < r - offset + area; rr++) {
    for (let cc = c - offset; cc < c - offset + area; cc++) {
      if (rr >= 0 && rr < size && cc >= 0 && cc < size) coords.push([rr, cc]);
    }
  }
  return coords;
}

function mineFieldBlockReachable(cells, size, area, r, c) {
  return mineFieldAreaCoords(size, area, r, c).some(([rr, cc]) =>
    mineFieldCellBroken(cells, size, rr, cc) || mineFieldHasOrthogonalBrokenNeighbor(cells, size, rr, cc)
  );
}

function mineFieldCellEl(mf, r, c) {
  const size = mf.size;
  const cell = mf.cells[mineFieldIdx(size, r, c)];
  const el_ = el("div", { class: "mine-cell" });
  el_.dataset.r = r;
  el_.dataset.c = c;
  if (!cell.revealed) {
    el_.classList.add("fog");
    // sensed_resource приходит только на верхнем тире щупа (mine_field.
    // scanner_reveal_all_tier) - клетка остаётся В ТУМАНЕ (revealed всё ещё
    // false, ломать нельзя, пока не дойдёшь обычным путём), просто сквозь
    // туман проглядывает призрачная иконка руды - см. engine.py: mine_field_view.
    if (cell.sensed_resource) {
      const iconDef = veinIcon(cell.sensed_resource);
      if (iconDef) {
        const iconBox = el("div", { class: "mine-icon mine-sensed-icon" });
        iconBox.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 28));
        el_.appendChild(iconBox);
      }
    }
    return el_;
  }
  if (cell.broken) { el_.classList.add("cleared"); return el_; }

  let iconDef = null;
  if (cell.resource) iconDef = veinIcon(cell.resource);
  // Порода без руды - случайный вариант спрайта (icon_variant проставлен один раз
  // при генерации клетки на сервере, см. _generate_mine_field), чисто визуальная
  // пестрота поля, без единого клонированного тайла на 400 клеток подряд.
  else iconDef = (mf.rock_icons && mf.rock_icons[cell.icon_variant]) || mf.rock_icon;
  if (iconDef) {
    const iconBox = el("div", { class: "mine-icon" });
    iconBox.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 28));
    el_.appendChild(iconBox);
  }
  if (cell.locked) el_.appendChild(el("span", { class: "mine-lock", text: "🔒" }));
  if (cell.damage_fraction) {
    const cracks = el("div", { class: "mine-cracks" });
    cracks.style.opacity = Math.min(0.85, cell.damage_fraction * 0.9 + 0.15);
    el_.appendChild(cracks);
  }
  return el_;
}

// Поле чуть шире, чем выше (не строгий квадрат) - по прямому пожеланию,
// 2026-09-16, "попробовать чуть растянутые прямоугольники". 1.15 - скромная
// растяжка, легко подкрутить это единственное число, если захочется заметнее.
const MINE_GRID_ASPECT = 1.15;

function renderMineFieldGrid(mf) {
  const grid = document.getElementById("mineFieldGrid");
  // Явный пиксельный размер вместо чистого CSS (width:100% + aspect-ratio) -
  // тот подход считал высоту ТОЛЬКО от ширины обёртки, не оглядываясь на
  // реально доступную высоту, и на широкой/невысокой модалке поле вылезало за
  // .mine-grid-wrap и обрезалось overflow:hidden самой модалки (жалоба
  // 2026-09-16: не видно низа поля и кнопки "Обновить шахту", если модалка не
  // помещается по высоте). Берём наибольший прямоугольник с соотношением
  // сторон MINE_GRID_ASPECT, который целиком помещается в обёртку - строки и
  // столбцы сетки (grid-template-rows/-columns, оба ниже) делят эту явную
  // ширину/высоту поровну, поэтому сама фигура клетки получается той же
  // пропорции, без округления/наползания на последнюю строку.
  const wrap = grid.parentElement;
  const maxW = wrap.clientWidth, maxH = wrap.clientHeight;
  let w = maxH * MINE_GRID_ASPECT, h = maxH;
  if (w > maxW) { w = maxW; h = maxW / MINE_GRID_ASPECT; }
  w = Math.floor(w); h = Math.floor(h);
  if (w > 0 && h > 0) { grid.style.width = `${w}px`; grid.style.height = `${h}px`; }
  grid.style.gridTemplateColumns = `repeat(${mf.size}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${mf.size}, 1fr)`;
  grid.innerHTML = "";
  for (let r = 0; r < mf.size; r++) {
    for (let c = 0; c < mf.size; c++) {
      grid.appendChild(mineFieldCellEl(mf, r, c));
    }
  }
  applyMineFieldHoverPreview(mf);
}

function applyMineFieldHoverPreview(mf) {
  const grid = document.getElementById("mineFieldGrid");
  if (!grid) return;
  Array.prototype.forEach.call(grid.children, cellEl => cellEl.style.boxShadow = "");
  if (mineFieldHoverIndex === null) return;
  const r = Math.floor(mineFieldHoverIndex / mf.size), c = mineFieldHoverIndex % mf.size;
  if (!mineFieldBlockReachable(mf.cells, mf.size, mf.pickaxe.area, r, c)) return;
  mineFieldAreaCoords(mf.size, mf.pickaxe.area, r, c).forEach(([rr, cc]) => {
    const cellEl = grid.children[mineFieldIdx(mf.size, rr, cc)];
    if (cellEl) cellEl.style.boxShadow = "inset 0 0 0 2px var(--blueprint)";
  });
}

// Небольшая подсказка над полем (не в "Справочнике руд" - тот статичный
// энциклопедический список, эта строка про ТЕКУЩЕЕ поле) - по прямому
// пожеланию, 2026-09-16. Собирается ЦЕЛИКОМ из ore_catalog: present_on_field/
// field_count в ответе сервера появляются, только если тир щупа игрока
// достаточен (см. engine.py: mine_field_view/scanner_types_tier/
// scanner_counts_tier) - клиенту не нужно знать сами пороги, достаточно
// проверить, пришли ли эти поля вообще.
function mineFieldScannerHintText(mf) {
  const catalog = mf.ore_catalog.filter(o => o.researched);
  if (!catalog.length || catalog[0].present_on_field === undefined) return null;
  const found = catalog.filter(o => o.present_on_field);
  if (!found.length) return { text: "Щуп: на этом поле руды не найдено.", tone: "var(--muted)" };
  const hasCounts = found.every(o => o.field_count !== undefined);
  const parts = found.map(o => hasCounts ? `${o.name} (${o.field_count} кл.)` : o.name);
  return { text: `Щуп нашёл: ${parts.join(", ")}.`, tone: "#7ee6a8" };
}

function openMineFieldModal() {
  closeMineFieldModal();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeMineFieldModal(); });

  const modal = el("div", { class: "modal mine-field-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Шахта" }));
  const catalogBtn = el("button", { class: "small", text: "Справочник руд" });
  catalogBtn.addEventListener("click", () => openMineOreCatalogModal());
  head.appendChild(catalogBtn);
  // mine-exit-btn - подсветка чуть другим акцентом, чем "Обновить шахту"
  // (та - тёплый primary, эта - холодный blueprint-контур): обе кнопки
  // заметны, но не спорят друг с другом за внимание как две одинаковые CTA.
  // По прямому пожеланию, 2026-09-16.
  head.appendChild(el("button", { class: "mine-exit-btn", text: "Выход", onclick: closeMineFieldModal }));
  modal.appendChild(head);

  const mf = VIEW.mine_field;
  const topline = el("div", { class: "mine-field-topline" });
  topline.appendChild(el("span", {}, [
    document.createTextNode("Кирка "),
    el("b", { text: `Т${mf.pickaxe.tier}` }),
    document.createTextNode(` · зона ${mf.pickaxe.area}×${mf.pickaxe.area} · урон ${mf.pickaxe.power}`),
    document.createTextNode(" · Щуп "),
    el("b", { text: `Т${mf.scanner_tier}` }),
  ]));
  // primary - тот же акцентный стиль, что у главных CTA-кнопок в игре (см.
  // button.primary в CSS), по прямому пожеланию, 2026-09-16 - "Обновить шахту"
  // должна бросаться в глаза рядом с приглушённой строкой статуса кирки/щупа.
  const newFieldBtn = el("button", { class: "small primary", text: "Обновить шахту" });
  newFieldBtn.addEventListener("click", () => mineFieldNewField());
  topline.appendChild(newFieldBtn);
  modal.appendChild(topline);

  const hint = mineFieldScannerHintText(mf);
  if (hint) {
    const attrs = { class: "mine-field-hint", text: hint.text };
    if (hint.tone) attrs.style = `color:${hint.tone}`;
    modal.appendChild(el("div", attrs));
  }

  const gridWrap = el("div", { class: "mine-grid-wrap" });
  const grid = el("div", { class: "mine-grid", id: "mineFieldGrid" });
  gridWrap.appendChild(grid);
  modal.appendChild(gridWrap);

  grid.addEventListener("click", (e) => {
    const cellEl = e.target.closest(".mine-cell");
    if (!cellEl) return;
    mineFieldHitCell(Number(cellEl.dataset.r), Number(cellEl.dataset.c));
  });
  grid.addEventListener("mousemove", (e) => {
    const cellEl = e.target.closest(".mine-cell");
    if (!cellEl) return;
    const idx = mineFieldIdx(mf.size, Number(cellEl.dataset.r), Number(cellEl.dataset.c));
    if (mineFieldHoverIndex !== idx) { mineFieldHoverIndex = idx; applyMineFieldHoverPreview(mf); }
  });
  grid.addEventListener("mouseleave", () => { mineFieldHoverIndex = null; applyMineFieldHoverPreview(mf); });

  overlay.appendChild(modal);
  overlay.id = "mineFieldOverlay";
  document.body.appendChild(overlay);
  renderMineFieldGrid(mf);
  if (mineFieldPendingPopup) {
    spawnMineFieldGainPopup(gridWrap, mf, mineFieldPendingPopup);
    mineFieldPendingPopup = null;
  }
}

function closeMineFieldModal() {
  const overlay = document.getElementById("mineFieldOverlay");
  if (overlay) overlay.remove();
}

const AUTOMATION_KIND_LABELS = { manual_action: "Действие", energy_recipe: "Крафт за энергию" };

function renderAutomationRuleRow(buildingId, rule) {

// Форма добавления/редактирования ОДНОГО правила - отдельный overlay поверх
// openAutomationModal (обе модалки могут быть открыты одновременно, как
// стек), закрывается сама по кнопке "Сохранить"/"Отмена" - в отличие от
// openAutomationModal, renderAll() её не пересобирает (нет смысла держать
// открытой форму редактирования поперёк хода).
function openAutomationRuleEditorModal(buildingId, rule) {
  const building = VIEW.buildings.find(b => b.id === buildingId);
  if (!building || !building.automation) return;
  const automation = building.automation;

  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  const modal = el("div", { class: "modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: rule ? "Изменить правило" : "Новое правило" }));
  head.appendChild(el("button", { text: "Отмена", onclick: () => overlay.remove() }));
  modal.appendChild(head);

  const body = el("div", { class: "upgrades-list" });

  // Два уровня выбора: сначала тип цели (ручное действие / крафт за энергию),
  // потом сама цель - список targetSelect'а зависит от kindSelect'а и
  // пересобирается при его смене (targetsByKind, сгруппировано один раз).
  const targetsByKind = { manual_action: [], energy_recipe: [] };
  automation.eligible_targets.forEach(t => targetsByKind[t.kind].push(t));

  const kindRow = el("div", { class: "upgrade-row" });
  kindRow.appendChild(el("div", { class: "upgrade-title", text: "Тип цели" }));
  const kindSelect = el("select");
  Object.entries(AUTOMATION_KIND_LABELS).forEach(([value, label]) => {
    const opt = el("option", { value, text: label });
    if ((rule ? rule.kind : "manual_action") === value) opt.selected = true;
    kindSelect.appendChild(opt);
  });
  kindRow.appendChild(kindSelect);
  body.appendChild(kindRow);

  const targetRow = el("div", { class: "upgrade-row" });
  targetRow.appendChild(el("div", { class: "upgrade-title", text: "Цель" }));
  const targetSelect = el("select");
  const renderTargetOptions = () => {
    targetSelect.innerHTML = "";
    targetsByKind[kindSelect.value].forEach(t => {
      const opt = el("option", { value: t.id, text: t.name });
      if (rule && rule.kind === kindSelect.value && rule.target_id === t.id) opt.selected = true;
      targetSelect.appendChild(opt);
    });
  };
  renderTargetOptions();
  kindSelect.addEventListener("change", renderTargetOptions);
  targetRow.appendChild(targetSelect);
  body.appendChild(targetRow);

  const condRow = el("div", { class: "upgrade-row" });
  condRow.appendChild(el("div", {
    class: "upgrade-title",
    text: "Условия (все должны быть истинны; без единого условия - выполняется всегда)",
  }));
  const condList = el("div");
  const conditions = rule ? rule.conditions.map(c => ({ resource: c.resource, op: c.op, amount: c.amount })) : [];

  const renderConditionRows = () => {
    condList.innerHTML = "";
    conditions.forEach((c, i) => {
      const line = el("div", { class: "costs" });
      const resSelect = el("select");
      automation.condition_resources.forEach(r => {
        const opt = el("option", { value: r.id, text: r.name });
        if (c.resource === r.id) opt.selected = true;
        resSelect.appendChild(opt);
      });
      resSelect.addEventListener("change", () => { c.resource = resSelect.value; });
      const opSelect = el("select");
      Object.entries(AUTOMATION_OP_LABELS).forEach(([value, label]) => {
        const opt = el("option", { value, text: label });
        if (c.op === value) opt.selected = true;
        opSelect.appendChild(opt);
      });
      opSelect.addEventListener("change", () => { c.op = opSelect.value; });
      const amountInput = el("input", { type: "number", min: "0", value: String(c.amount) });
      amountInput.addEventListener("change", () => { c.amount = Number(amountInput.value) || 0; });
      const rmBtn = el("button", { class: "small danger", text: "✕" });
      rmBtn.addEventListener("click", () => { conditions.splice(i, 1); renderConditionRows(); });
      line.append(resSelect, opSelect, amountInput, rmBtn);
      condList.appendChild(line);
    });
  };
  renderConditionRows();
  condRow.appendChild(condList);
  const addCondBtn = el("button", { class: "small", text: "+ добавить условие" });
  addCondBtn.addEventListener("click", () => {
    conditions.push({ resource: automation.condition_resources[0].id, op: ">=", amount: 0 });
    renderConditionRows();
  });
  condRow.appendChild(addCondBtn);
  body.appendChild(condRow);
  modal.appendChild(body);

  const footerRow = el("div", { class: "upgrade-row" });
  const saveBtn = el("button", { text: rule ? "Сохранить" : "Добавить" });
  saveBtn.addEventListener("click", async () => {
    if (!targetSelect.value) return;  // выбранный kind вообще без доступных целей
    saveBtn.disabled = true;
    if (rule) await updateAutomationRule(buildingId, rule.index, kindSelect.value, targetSelect.value, conditions);
    else await addAutomationRule(buildingId, kindSelect.value, targetSelect.value, conditions);
    overlay.remove();
  });
  footerRow.appendChild(saveBtn);
  modal.appendChild(footerRow);

  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

// Какая вкладка сейчас открыта в модалке "Приоритеты" - не save-critical state,
// живёт только в памяти вкладки браузера (как activeLocationTab и т.п.).
let prioritiesActiveTab = "autocraft";

// Одна строка списка приоритета (используется и вкладкой "Автокрафт", и вкладкой
// "Энергосистема") - имя + произвольные доп. строки (subtitleLines) + поле ручного
// ввода числа приоритета + кнопка сброса, если приоритет переопределён игроком
// под это сохранение.
function priorityRow(item, setFn, subtitleLines) {
  const row = el("div", { class: "priority-row" });
  const info = el("div", { class: "info" });
  info.appendChild(el("b", { text: item.name }));
  subtitleLines.forEach(line => info.appendChild(el("span", { text: line })));
  row.appendChild(info);

  const order = el("div", { class: "priority-order-controls" });
  const valueInput = el("input", {
    type: "number", class: "priority-value-input",
    title: "Задать значение приоритета",
    value: String(item.priority),
  });
  const commitValue = () => {
    const v = parseInt(valueInput.value, 10);
    if (Number.isNaN(v)) { valueInput.value = String(item.priority); return; }
    if (v === item.priority) return;
    setFn(item.id, v);
  };
  valueInput.addEventListener("change", commitValue);
  valueInput.addEventListener("keydown", (e) => { if (e.key === "Enter") valueInput.blur(); });
  order.appendChild(valueInput);
  row.appendChild(order);

  if (item.overridden) {
    const resetBtn = el("button", { class: "panel-head-btn", text: `Сброс (умолч. ${item.default_priority})` });
    resetBtn.addEventListener("click", () => setFn(item.id, null));
    row.appendChild(resetBtn);
  }
  return row;
}

// Какой ресурс сейчас выбран в фильтре вкладки "Автокрафт" модалки "Приоритеты" -
// "" значит "показать все рецепты сразу" (старое поведение). Как prioritiesActiveTab,
// живёт только в памяти вкладки браузера, не сохраняется.
let priorityResourceFilter = "";

// Множество ресурсов, которые хоть какое-то действие из VIEW.action_priorities
// производит - плитки остальных ресурсов в сетке выбора помечаются "no-recipe"
// (кликабельны, но выбор ничего не отфильтрует - см. renderAutocraftPriorityTab).
function recipeResourceIds() {
  const set = new Set();
  VIEW.action_priorities.forEach(a => a.gain.forEach(g => set.add(g.id)));
  return set;
}

// Сетка выбора ресурса - визуальная копия склада (openStorage): те же плитки
// (resourceTileBase), то же расположение (VIEW.storage), чтобы игрок
// узнавал ресурс по привычной позиции иконки, а не читал текст в выпадающем
// списке. Дополнительная первая плитка "Все рецепты" сбрасывает фильтр.
function renderPriorityResourcePicker(container) {
  const recipeIds = recipeResourceIds();
  const grid = el("div", { class: "storage-grid" });

  const allTile = el("div", { class: "storage-tile all-recipes-tile clickable"
    + (priorityResourceFilter === "" ? " selected" : "") });
  allTile.dataset.resourceName = "все рецепты";
  allTile.appendChild(el("div", { class: "all-recipes-icon", text: "✱" }));
  allTile.appendChild(el("div", { class: "name", text: "Все рецепты" }));
  allTile.addEventListener("click", () => { priorityResourceFilter = ""; openPrioritiesModal(); });
  grid.appendChild(allTile);

  // Как и openStorage() - идём по VIEW.storage, а не по resource_order
  // напрямую, чтобы виды (SPECIES, переиспользующие id ресурса ради иконки)
  // не попадали в сетку выбора: у особей всё равно нет автокрафт-рецепта.
  VIEW.storage.forEach(item => {
    const rid = item.id;
    const tile = resourceTileBase(rid);
    tile.classList.add("clickable");
    if (!recipeIds.has(rid)) tile.classList.add("no-recipe");
    if (rid === priorityResourceFilter) tile.classList.add("selected");
    tile.appendChild(el("div", { class: "amount mono", text: String(VIEW.resources[rid] || 0) }));
    tile.appendChild(el("div", { class: "name", text: VIEW.resource_names[rid] }));
    tile.title = recipeIds.has(rid) ? "" : "У этого ресурса пока нет рецепта для автокрафта";
    tile.addEventListener("click", () => { priorityResourceFilter = rid; openPrioritiesModal(); });
    grid.appendChild(tile);
  });

  container.appendChild(makeResourceSearchBar(grid, {
    get: () => priorityResourceSearchQuery,
    set: (v) => { priorityResourceSearchQuery = v; },
  }));
  const scroll = el("div", { class: "priority-resource-scroll" });
  scroll.appendChild(grid);
  container.appendChild(scroll);
}

function renderAutocraftPriorityTab(container) {
  container.appendChild(el("p", { class: "hint", text:
    "Если несколько действий производят один и тот же ресурс, автокрафт выбирает то, у "
    + "которого приоритет БОЛЬШЕ (при равенстве - любое из них). Выбери ресурс, чтобы увидеть "
    + "только рецепты, которые его производят, и вписать в поле нужное число приоритета." }));

  renderPriorityResourcePicker(container);

  const list = el("div", { class: "priority-list" });
  const items = priorityResourceFilter
    ? VIEW.action_priorities.filter(a => a.gain.some(g => g.id === priorityResourceFilter))
    : VIEW.action_priorities;
  const sorted = [...items].sort((a, b) => b.priority - a.priority);
  sorted.forEach((a) => {
    const sub = [`даёт: ${a.gain.map(g => g.name).join(", ")}`];
    if (a.is_active_recipe) sub.push("сейчас используется автокрафтом");
    list.appendChild(priorityRow(a, setActionPriority, [sub.join(" - ")]));
  });
  if (!sorted.length) {
    list.appendChild(el("div", { class: "empty-note", text: priorityResourceFilter
      ? "У этого ресурса нет ни одного детерминированного рецепта с ценой."
      : "Нет действий, у которых есть цена (голый сбор сырья не считается рецептом)." }));
  }
  container.appendChild(list);
}

function renderEnergyPriorityTab(container) {
  container.appendChild(el("p", { class: "hint", text:
    "Когда общего запаса энергии не хватает на все активные крафты сразу, тип машины с "
    + "БОЛЬШИМ приоритетом тянет из него первым. Пропускная способность (квота) у каждого "
    + "типа своя - растёт от улучшений, купленных для этой же постройки в её карточке, "
    + "приоритет решает только споры за то, что осталось в общем запасе." }));
  const list = el("div", { class: "priority-list" });
  const sorted = [...VIEW.energy_priorities].sort((a, b) => b.priority - a.priority);
  sorted.forEach((e) => {
    const sub = [
      e.built_count > 0 ? `построено: ${e.built_count}` : "ещё не построено",
      e.quota == null ? "пропускная способность: без ограничения" : `пропускная способность: ${e.quota}/ход`,
    ];
    const row = priorityRow(e, setEnergyPriority, [sub.join(" - ")]);
    if (e.shortfall_last_turn > 0) {
      row.querySelector(".info").appendChild(el("span", {
        class: "priority-shortfall-note",
        text: `в прошлый ход не хватило пропускной способности: -${e.shortfall_last_turn}`,
      }));
    }
    list.appendChild(row);
  });
  if (!sorted.length) {
    list.appendChild(el("div", { class: "empty-note", text: "В игре пока нет ни одного типа построек с крафтом за энергию." }));
  }
  container.appendChild(list);
}

// Единая панель "Приоритеты" (кнопка в шапке) - объединяет приоритет автокрафт-
// рецептов и приоритет распределения энергии между типами машин (см. CLAUDE.md,
// "Энергосистема: несколько типов..."), раньше это была отдельная модалка
// "Приоритеты рецептов" внутри панели "Автокрафт". tab - какую вкладку открыть
// ("autocraft"/"energy"); без аргумента - последнюю активную (prioritiesActiveTab).
function openPrioritiesModal(tab) {
  if (tab) prioritiesActiveTab = tab;
  const prevModal = document.querySelector("#prioritiesOverlay .modal");
  const savedScroll = prevModal ? prevModal.scrollTop : null;

  closePrioritiesModal();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closePrioritiesModal(); });

  const modal = el("div", { class: "modal priorities-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Приоритеты" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: closePrioritiesModal }));
  modal.appendChild(head);

  const tabs = el("div", { class: "tabs" });
  const autocraftTabBtn = el("button", { text: "Автокрафт" });
  const energyTabBtn = el("button", { text: "Энергосистема" });
  tabs.append(autocraftTabBtn, energyTabBtn);
  modal.appendChild(tabs);

  const body = el("div", { class: "scroll-area" });
  modal.appendChild(body);

  // Вкладка "Энергосистема" появляется, только когда построена хотя бы одна
  // копия ЛЮБОГО типа энергетической машины (built_count > 0 у любого элемента
  // VIEW.energy_priorities) - до этого настраивать приоритет между типами не на
  // чём: в игре ещё нет ни одного реального конфликта за пул энергии. Ряды
  // ВНУТРИ вкладки (уже показанной) по-прежнему перечисляют ВСЕ типы из
  // content.json, включая ещё не построенные - см. web_ui.py:energy_priority_view.
  const energyTabAvailable = VIEW.energy_priorities.some(e => e.built_count > 0);
  energyTabBtn.hidden = !energyTabAvailable;
  if (!energyTabAvailable && prioritiesActiveTab === "energy") prioritiesActiveTab = "autocraft";

  const renderTab = () => {
    autocraftTabBtn.classList.toggle("active", prioritiesActiveTab === "autocraft");
    energyTabBtn.classList.toggle("active", prioritiesActiveTab === "energy");
    body.innerHTML = "";
    if (prioritiesActiveTab === "autocraft") renderAutocraftPriorityTab(body);
    else renderEnergyPriorityTab(body);
    // rAF - на первом вызове overlay ещё не в document (appendChild ниже по
    // коду), offsetLeft/offsetWidth активной кнопки были бы нулями без layout.
    requestAnimationFrame(() => positionTabUnderline(tabs, prioritiesActiveTab === "autocraft" ? autocraftTabBtn : energyTabBtn));
  };
  autocraftTabBtn.addEventListener("click", () => { prioritiesActiveTab = "autocraft"; renderTab(); });
  energyTabBtn.addEventListener("click", () => { prioritiesActiveTab = "energy"; renderTab(); });
  renderTab();

  overlay.appendChild(modal);
  overlay.id = "prioritiesOverlay";
  document.body.appendChild(overlay);
  if (savedScroll !== null) modal.scrollTop = savedScroll;
}

function closePrioritiesModal() {
  const overlay = document.getElementById("prioritiesOverlay");
  if (overlay) overlay.remove();
}

const ACTION_TABS = [
  ["locations", "Локации"],
  ["build", "Построить"],
  ["tech", "Исследовать"],
];

// locId=null - корень дерева локаций (действия и локации без своей "родительской"
// ссылки лежат именно там - см. VIEW.locations[].parent_location/
// VIEW.categories.manual[].location).
function locationChildren(locId) {
  return VIEW.locations.filter(l => l.parent_location === locId);
}

function locationItemCount(locId) {
  const loc = VIEW.locations.find(l => l.id === locId) || null;
  let count = manualActionsAt(locId).length + locationChildren(locId).length;
  if (loc && loc.is_mine) {
    count += 1; // одна кнопка "Войти в шахту", открывающая модалку с полем
  }
  if (loc && loc.is_converter) count += VIEW.categories.converter.length;
  if (loc && loc.is_hunting) {
    count += 1; // кнопка "искать" - показывается всегда, как поиск жилы в шахте
    count += VIEW.hunting.mobs.filter(m => m.location === locId && m.is_boss).length;
  }
  return count;
}

// "пункт" - НЕ "действие": внутри локации может быть смесь и вложенных локаций,
// и собственных действий сразу, счётчик на карточке локации считает оба вида.
function pluralItems(n) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return "пункт";
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return "пункта";
  return "пунктов";
}

function renderActions() {
  const visibleTabs = ACTION_TABS;
  if (!visibleTabs.some(([k]) => k === activeActionTab)) activeActionTab = "locations";

  const tabsBox = document.getElementById("actionTabs");
  // Сохраняем существующее подчёркивание (.tab-underline) при очистке - иначе
  // тут же ниже создалось бы с нуля через positionTabUnderline() и анимация
  // всегда ехала бы от дефолтной CSS-позиции (левый край, "Локации"), а не от
  // реально текущей вкладки.
  const existingUnderline = tabsBox.querySelector(".tab-underline");
  tabsBox.innerHTML = "";
  if (existingUnderline) tabsBox.appendChild(existingUnderline);
  let activeTabBtn = null;
  visibleTabs.forEach(([key, label]) => {
    const count = key === "locations"
      ? locationItemCount(null)
      : (VIEW.categories[key] || []).length;
    const btn = el("button", { text: `${label} (${count})`, class: activeActionTab === key ? "active" : "" });
    btn.addEventListener("click", () => { activeActionTab = key; renderActions(); });
    tabsBox.appendChild(btn);
    if (activeActionTab === key) activeTabBtn = btn;
  });
  requestAnimationFrame(() => positionTabUnderline(tabsBox, activeTabBtn));

  const body = document.getElementById("actionBody");
  // Списки действий (.action-list) и дерево технологий (.tech-graph) скроллятся
  // сами по себе - если просто снести и отстроить body.innerHTML заново (а это
  // происходит после КАЖДОГО действия, не только при смене вкладки), скролл
  // всегда обнулится. Запоминаем прокрутку СТАРОГО контейнера до сноса и
  // возвращаем на НОВЫЙ после - но только если это тот же самый "вид" (та же
  // вкладка и, для локаций, та же локация), а не переключение на другую вкладку -
  // туда скролл переносить не нужно, она с другим содержимым. Тот же приём, что
  // renderTechsKeepScroll в редакторе контента.
  const currentView = activeActionTab === "locations" ? `locations:${locationPath.join(">")}` : activeActionTab;
  const sameViewAsBefore = lastRenderedActionView === currentView;
  const prevScroller = sameViewAsBefore ? body.querySelector(".action-list, .tech-graph") : null;
  const savedScroll = prevScroller ? { left: prevScroller.scrollLeft, top: prevScroller.scrollTop } : null;
  lastRenderedActionView = currentView;

  body.innerHTML = "";
  if (activeActionTab === "locations") body.appendChild(renderLocationsPanel());
  else if (activeActionTab === "tech") body.appendChild(renderTechTab());
  else body.appendChild(renderActionCategory(activeActionTab));

  if (savedScroll) {
    const newScroller = body.querySelector(".action-list, .tech-graph");
    if (newScroller) { newScroller.scrollLeft = savedScroll.left; newScroller.scrollTop = savedScroll.top; }
  }
}

const EMPTY_NOTES = {
  build: "Нечего строить.",
};

function manualActionsAt(locationId) {
  return VIEW.categories.manual.filter(m => m.location === locationId);
}

// Полноценное вложенное меню локаций: в КАЖДОЙ (включая корень, currentId=null)
// одновременно могут быть и дочерние локации (грид карточек, клик - зайти внутрь),
// и собственные действия (включая спецпункты шахты/механизмов) - список ниже.
// locationPath - путь от корня до текущей; "← Назад"/"⌂ В начало" всегда доступны,
// пока мы не в корне (кнопки, а не привязка к номеру хода - переход НЕ тратит ход).
function renderLocationsPanel() {
  // Считываем и сразу сбрасываем направление перехода (см. locationNavDirection) -
  // ровно один рендер получает анимацию, следующие обычные перерисовки этой же
  // локации (после клика на действие) её не подхватят.
  const navDir = locationNavDirection;
  locationNavDirection = null;

  const wrap = el("div", { class: navDir ? `loc-panel-enter ${navDir}` : "" });
  if (!VIEW.locations.length) {
    wrap.appendChild(el("div", { class: "empty-note", text: "Локации пока недоступны." }));
    return wrap;
  }

  const currentId = locationPath.length ? locationPath[locationPath.length - 1] : null;
  const loc = VIEW.locations.find(l => l.id === currentId) || null;

  if (locationPath.length) {
    const navRow = el("div", { class: "back-row" });
    const backBtn = el("button", { text: "← Назад" });
    backBtn.addEventListener("click", () => { locationNavDirection = "back"; locationPath.pop(); renderActions(); });
    navRow.appendChild(backBtn);
    const rootBtn = el("button", { text: "⌂ В начало" });
    rootBtn.addEventListener("click", () => { locationNavDirection = "back"; locationPath = []; renderActions(); });
    navRow.appendChild(rootBtn);
    wrap.appendChild(navRow);

    const crumbs = el("div", { class: "loc-breadcrumb" });
    locationPath.forEach((lid, i) => {
      if (i > 0) crumbs.appendChild(document.createTextNode(" › "));
      const l = VIEW.locations.find(x => x.id === lid);
      const isLast = i === locationPath.length - 1;
      const seg = el("span", { class: "loc-breadcrumb-item" + (isLast ? " current" : ""), text: l ? l.name : lid });
      if (!isLast) seg.addEventListener("click", () => { locationNavDirection = "back"; locationPath = locationPath.slice(0, i + 1); renderActions(); });
      crumbs.appendChild(seg);
    });
    wrap.appendChild(crumbs);
  }

  const container = el("div");
  const children = locationChildren(currentId);
  if (children.length) {
    const grid = el("div", { class: "loc-grid" });
    children.forEach(l => {
      const card = el("div", { class: "loc-card" });
      card.dataset.search = l.name.toLowerCase();
      const iconDef = l.is_mine ? ICONS.pickaxe : (l.is_converter ? ICONS.energy : ICONS.machine);
      card.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 36));
      card.appendChild(el("div", { class: "loc-name", text: l.name }));
      const n = locationItemCount(l.id);
      card.appendChild(el("div", { class: "loc-count", text: `${n} ${pluralItems(n)}` }));
      card.addEventListener("click", () => { locationNavDirection = "forward"; locationPath.push(l.id); renderActions(); });
      grid.appendChild(card);
    });
    container.appendChild(grid);
  }

  const list = el("div", { class: "action-list thin-scroll" });
  const addCard = (kind, item) => {
    const card = actionCard(kind, item);
    card.dataset.search = actionLabel(kind, item).toLowerCase();
    list.appendChild(card);
  };
  if (loc && loc.is_hunting) {
    const encounterBanner = renderEncounterBanner(loc.id);
    if (encounterBanner) container.appendChild(encounterBanner);
  }

  manualActionsAt(currentId).forEach(item => addCard("manual", item));
  if (loc && loc.is_mine) {
    const card = el("button", { class: "action-card" });
    card.dataset.search = "войти в шахту";
    card.appendChild(pixelIcon(ICONS.pickaxe.grid, ICONS.pickaxe.palette, 30));
    const main = el("div", { class: "main" });
    main.appendChild(el("div", { class: "name", text: "Войти в шахту" }));
    card.appendChild(main);
    card.addEventListener("click", openMineFieldModal);
    list.appendChild(card);
  }
  if (loc && loc.is_converter) {
    VIEW.categories.converter.forEach(item => addCard("converter", item));
  }
  if (loc && loc.is_hunting) {
    const huntingMobs = VIEW.hunting.mobs.filter(m => m.location === loc.id);
    addCard("hunting", { kind: "search", location: loc.id });
    huntingMobs.filter(m => m.is_boss).forEach(m => addCard("hunting", { ...m, kind: "summon" }));
  }
  if (list.children.length) container.appendChild(list);

  // Строка поиска - всегда на виду (как кнопка поиска жилы в Шахте), фильтрует
  // СРАЗУ оба вида карточек в этом уровне (data-search есть и у .loc-card, и у
  // .action-card) - один общий контейнер вместо раздельных списков.
  wrap.appendChild(makeLocationSearchBar(currentId ?? "root", container));

  if (!children.length && !list.children.length) {
    container.appendChild(el("div", { class: "empty-note", text: "Здесь пока нечего делать." }));
  }
  wrap.appendChild(container);
  return wrap;
}

let locationSearchQuery = {}; // location_id -> текст поиска, чтобы не сбрасывался при переключении локаций

// Тот же приём, что makeLocationSearchBar, но для вкладок категорий действий
// (сейчас используется только для "build" - каталог построек растёт быстрее
// остальных категорий, см. renderActionCategory). categorySearchQuery[kind] -
// текст поиска, чтобы не сбрасывался при переключении вкладок/после действий.
let categorySearchQuery = {};

function makeCategorySearchBar(kind, listContainer) {
  const bar = el("div", { class: "loc-search-bar" });
  const input = el("input", { type: "text", placeholder: "Поиск по названию…" });
  input.value = categorySearchQuery[kind] || "";
  const apply = () => {
    const q = input.value.trim().toLowerCase();
    categorySearchQuery[kind] = input.value;
    listContainer.querySelectorAll("[data-search]").forEach(node => {
      node.style.display = (!q || node.dataset.search.includes(q)) ? "" : "none";
    });
  };
  input.addEventListener("input", apply);
  bar.appendChild(input);
  apply();
  return bar;
}

function makeLocationSearchBar(locationId, listContainer) {
  const bar = el("div", { class: "loc-search-bar" });
  const input = el("input", { type: "text", placeholder: "Поиск по названию…" });
  input.value = locationSearchQuery[locationId] || "";
  const apply = () => {
    const q = input.value.trim().toLowerCase();
    locationSearchQuery[locationId] = input.value;
    listContainer.querySelectorAll("[data-search]").forEach(node => {
      node.style.display = (!q || node.dataset.search.includes(q)) ? "" : "none";
    });
  };
  input.addEventListener("input", apply);
  bar.appendChild(input);
  apply();
  return bar;
}

function renderActionCategory(kind) {
  const list = VIEW.categories[kind] || [];
  const container = el("div", { class: "action-list thin-scroll" });
  if (!list.length) {
    container.appendChild(el("div", { class: "empty-note", text: EMPTY_NOTES[kind] || "Пусто." }));
    return container;
  }
  list.forEach(item => {
    const card = actionCard(kind, item);
    card.dataset.search = actionLabel(kind, item).toLowerCase();
    container.appendChild(card);
  });
  if (kind === "build") {
    const wrap = el("div");
    wrap.appendChild(makeCategorySearchBar(kind, container));
    wrap.appendChild(container);
    return wrap;
  }
  return container;
}

// Случайное produce ({"min","max"} вместо плоского числа - см. game/engine.py:
// _is_range_amount/_roll_range_amounts) - НЕЗАВИСИМО от chance ниже: chance решает,
// случится ли начисление вообще, диапазон - сколько именно, если да. Конкретное
// число каждый раз выбирает сервер (равномерно, при начислении), здесь только
// показываем границы; ползунок масштаба домножает ОБЕ границы (scaleAmount), не
// бросает кости на клиенте.
function isRangeAmount(amount) {
  return amount != null && typeof amount === "object";
}
function scaleAmount(amount, scale) {
  if (isRangeAmount(amount)) return { min: amount.min * scale, max: amount.max * scale };
  return amount * scale;
}
function formatAmount(amount) {
  return isRangeAmount(amount) ? `${amount.min}-${amount.max}` : `${amount}`;
}

// chance (0..1, необязательный) - "Шанс потребления/получения" (см. CLAUDE.md):
// вероятность, что ИМЕННО ЭТОТ ресурс реально потратится/выдастся за одну попытку
// (100% - как всегда было раньше, ничего не рисуем). tools/web_ui.py присылает
// поле "chance" только когда оно < 1, так что undefined здесь - обычный, гарантированный ресурс.
function costChip(resId, amount, isGain, jumpTo, chance) {
  const chip = el("span", { class: `cost-chip${isGain ? " gain" : ""}${jumpTo ? " jumpable" : ""}` });
  const iconDef = resourceIcon(resId);
  if (iconDef) chip.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 14));
  chip.appendChild(document.createTextNode(`${isGain ? "+" : ""}${formatAmount(amount)}`));
  if (chance != null && chance < 1) {
    const percent = Math.round(chance * 100);
    chip.appendChild(el("span", { class: "chance-note", text: ` (${percent}%)` }));
    chip.title = `Шанс ${isGain ? "получить" : "потратить"} этот ресурс за попытку: ${percent}%`;
  }
  if (jumpTo) {
    chip.title = (chip.title ? chip.title + ". " : "") + "Перейти к рецепту этого ресурса";
    // Чип сидит внутри <button class="action-card"> - без stopPropagation клик по
    // ингредиенту заодно выполнил бы и само действие карточки, что не нужно.
    chip.addEventListener("click", (e) => {
      e.stopPropagation();
      e.preventDefault();
      jumpToAction(jumpTo);
    });
  }
  return chip;
}

// Модалки, которые могут содержать кликабельный ресурс (см. costChip/resourceTileBase) -
// закрываем их перед переходом к рецепту, иначе подсвеченная карточка окажется под
// overlay'ем, и игрок её просто не увидит.
const JUMP_CLOSABLE_OVERLAYS = [
  "techTreeOverlay", "toolsOverlay", "storageOverlay", "farmTypeOverlay", "breedingOverlay",
  "buildingUpgradesOverlay", "prioritiesOverlay",
];

function closeOverlaysForJump() {
  JUMP_CLOSABLE_OVERLAYS.forEach(id => {
    const overlay = document.getElementById(id);
    if (overlay) overlay.remove();
  });
}

// Путь от корня до локации данного ручного действия (см. VIEW.locations[].parent_location,
// как в renderLocationsPanel) - locationId=null (действие в корне дерева локаций) даёт
// пустой путь.
function locationPathTo(locationId) {
  const path = [];
  let current = locationId;
  while (current != null) {
    path.unshift(current);
    const loc = VIEW.locations.find(l => l.id === current);
    current = loc ? loc.parent_location : null;
  }
  return path;
}

// Переходит к карточке ручного действия с этим id - используется кликом по
// кликабельному ресурсу (см. costChip/resourceTileBase). В отличие от исходной
// версии (искала карточку ТОЛЬКО в уже открытой локации), теперь сама
// переключает вкладку "Локации" и путь до нужной локации, если действие сейчас
// не на виду - RECIPE_BOARD_BUILDING_ID должен уметь довести игрока до рецепта
// из ЛЮБОГО места, а не только подсветить то, что и так уже открыто. Если
// карточка скрыта поиском по локации, поиск сбрасывается, чтобы она стала видна.
function jumpToAction(actionId) {
  closeOverlaysForJump();
  const action = VIEW.categories.manual.find(m => m.id === actionId);
  if (!action) return; // действие сейчас недоступно/не существует - переходить некуда
  const targetPath = locationPathTo(action.location);
  if (activeActionTab !== "locations" || locationPath.join(">") !== targetPath.join(">")) {
    locationPath = targetPath;
    activeActionTab = "locations";
    renderActions();
  }
  const node = document.querySelector(`[data-action-id="${actionId}"]`);
  if (!node) return;
  if (node.style.display === "none") {
    const bar = document.querySelector(".loc-search-bar input");
    if (bar) { bar.value = ""; bar.dispatchEvent(new Event("input")); }
  }
  node.scrollIntoView({ behavior: "smooth", block: "center" });
  node.classList.remove("flash");
  void node.offsetWidth; // перезапустить анимацию, если карточка уже мигала
  node.classList.add("flash");
  setTimeout(() => node.classList.remove("flash"), 1600);
}

function perTurnChip(resId, amount, isProduce) {
