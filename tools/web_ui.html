// 5 жёстко зашитых признаков генотипа особи - должно совпадать с
// game/engine.py:GENOTYPE_TRAIT_IDS.
const GENOTYPE_TRAIT_IDS = ["species", "lifespan", "output_multiplier", "active_period", "environment"];
const ACTIVE_PERIOD_LABELS = { day: "днём", night: "ночью", always: "всегда" };

// entry.produces - сырой produces вида (БЕЗ множителей и БЕЗ чисел - в тексте
// показываем только НАЗВАНИЯ ресурсов, точное количество нигде в UI слота
// больше не печатается, см. CLAUDE.md).
function creatureProducesText(entry) {
  return entry.produces.map(c => c.name).join(", ") || "ничего не производит";
}

function creatureSummaryLine(entry) {
  if (!entry.identified) return "геном не опознан - виден только вид";
  const activity = ACTIVE_PERIOD_LABELS[entry.active_period] || entry.active_period;
  return `${creatureProducesText(entry)} за рабочий ход · активность: ${activity} · продукция ×${entry.output_multiplier} · срок жизни ${entry.lifespan} ход(ов)`;
}

// Особи одного вида называются одинаково (entry.name - это ИМЯ ВИДА, не
// уникальное имя) - короткий номер из id ("creature_37" -> "37") единственный
// способ на глаз отличить одну особь от другой в списке/при скрещивании.
function creatureShortId(entry) {
  return entry.id.replace(/^creature_/, "");
}

// Текст для поиска/фильтра по особи (см. makeResourceSearchBar/
// applyResourceHighlight - тот же приём, что у поиска по складу, просто
// прикладываем dataset.resourceName к строке/карточке особи): номер, имя
// вида, весь фенотип и, если геном опознан, названия ВСЕХ аллелей (включая
// рецессивные) - чтобы можно было найти "особь с геном такой-то аллели",
// а не только по видимому фенотипу.
function creatureSearchText(entry) {
  let text = `${entry.name} №${creatureShortId(entry)} ${creatureSummaryLine(entry)}`;
  if (entry.identified && entry.genotype) {
    GENOTYPE_TRAIT_IDS.forEach(traitId => {
      (entry.genotype[traitId] || []).forEach(allele => { text += " " + allele.name; });
    });
  }
  return text.toLowerCase();
}

// Пиксель-иконка вида по умолчанию (пока ни у одного вида пчёл нет своей
// нарисованной в редакторе контента иконки, см. resourceIcon) - чтобы карточки
// в новом визуальном скрещивании не были пустыми плашками без картинки.
const FALLBACK_SPECIES_ICON = {
  grid: [
    ".CC...CC.",
    "CCCC.CCCC",
    ".AAAAAAA.",
    "ABBBABBBA",
    "AAAAAAAAA",
    "ABBBABBBA",
    ".AAAAAAA.",
    "....A....",
  ],
  palette: { A: "#241a08", B: "#f4c430", C: "#dfe6ec" },
};

function creatureCardIcon(entry, size) {
  const iconDef = resourceIcon(entry.species_id) || FALLBACK_SPECIES_ICON;
  return pixelIcon(iconDef.grid, iconDef.palette, size);
}

// Пока геном не опознан (entry.identified === false) - виден только ВИД особи
// (он и так есть в заголовке карточки), всё остальное (фенотип: что особь
// производит, когда активна, срок жизни; и генотип: обе аллели на каждый из
// 4 признаков, с пометкой доминантной) скрыто целиком - раскрывается только
// анализом в генетической лаборатории (engine.analyze_creature). Никакого
// автоматического опознания по времени в ферме нет - можно поселить особь и
// получать продукцию "вслепую", не зная, что именно она даёт.
function creatureGenotypeBlock(entry) {
  if (!entry.identified) {
    return el("div", { class: "hint", text: "Геном не опознан - виден только вид. Нужен анализ в генетической лаборатории, чтобы узнать остальные признаки." });
  }
  const wrap = el("div");
  wrap.appendChild(el("div", {
    class: "creature-caption",
    text: "Генотип - обе аллели каждого признака; та, что помечена «дом.» (доминантная), сейчас и определяет фенотип, вторая передаётся по наследству при скрещивании",
  }));
  const table = el("table", { class: "genotype-table" });
  const headRow = el("tr");
  headRow.appendChild(el("th", { text: "Признак" }));
  headRow.appendChild(el("th", { text: "Аллель 1" }));
  headRow.appendChild(el("th", { text: "Аллель 2" }));
  table.appendChild(headRow);
  GENOTYPE_TRAIT_IDS.forEach(traitId => {
    const pair = entry.genotype[traitId];
    const row = el("tr");
    row.appendChild(el("td", { text: VIEW.genetic_trait_names[traitId] || traitId }));
    pair.forEach(allele => {
      row.appendChild(el("td", { text: allele.name + (allele.dominant ? " (дом.)" : "") }));
    });
    table.appendChild(row);
  });
  wrap.appendChild(table);
  return wrap;
}

// Свёрнутые по умолчанию карточки особей - id тех, что игрок сам развернул
// (полоска возраста + фенотип/генотип прячутся за кнопкой-шевроном, чтобы
// список ферм/банк не превращался в стену таблиц) - переживает rebuild
// списка (модалка "Особи" пересобирается заново после любого действия), как
// creatureBankSearchQuery/breedParentAId. Заголовок строки (имя, номер,
// кнопки действий) виден всегда независимо от этого. refresh - какую именно
// модалку пересобрать (openFarmTypeModal(buildingId) - единственный вызывающий
// сейчас, разные экземпляры фермы живут в разных модалках по типу постройки).
const expandedCreatureIds = new Set();

function creatureToggleButton(creatureId, bodyEl, refresh) {
  const expanded = expandedCreatureIds.has(creatureId);
  bodyEl.hidden = !expanded;
  const btn = el("button", {
    class: "panel-head-btn creature-toggle-btn",
    text: expanded ? "▴" : "▾",
    title: expanded ? "Свернуть" : "Развернуть",
  });
  btn.addEventListener("click", () => {
    if (expanded) expandedCreatureIds.delete(creatureId); else expandedCreatureIds.add(creatureId);
    refresh();
  });
  return btn;
}

function renderFarmUpgrades(farm) {
  if (!farm.upgrades) return null;
  const box = el("div", { class: "upgrades-list scroll-area" });
  farm.upgrades.upgrades.forEach(u => {
    const row = el("div", { class: "upgrade-row" });
    row.appendChild(el("div", { class: "upgrade-title", text: u.name }));
    row.appendChild(el("div", { class: "upgrade-desc", text: u.description }));
    if (u.replaces_current_environment) {
      row.appendChild(el("div", { class: "hint", text: "При покупке заменит текущую активную эмуляцию среды этой пасеки, если она есть." }));
    }
    if (u.cost && u.cost.length) {
      const costRow = el("div", { class: "costs" });
      u.cost.forEach(c => costRow.appendChild(costChip(c.id, c.amount, false, c.jump_to)));
      if (u.repeatable) costRow.appendChild(el("span", { class: "note-chip", text: `куплено раз: ${u.times_purchased}${u.max_purchases != null ? `/${u.max_purchases}` : ""}` }));
      row.appendChild(costRow);
    }
    if (u.repeatable && u.at_max) {
      row.appendChild(el("div", { class: "upgrade-status done", text: `✓ Куплено максимум (${u.times_purchased}/${u.max_purchases})` }));
    } else if (u.purchased && !u.repeatable) {
      row.appendChild(el("div", { class: "upgrade-status done", text: "✓ Куплено" }));
    } else if (u.tech_locked) {
      row.appendChild(el("div", { class: "upgrade-status locked", text: `Нужна технология «${u.requires_tech_name}»` }));
    } else {
      // Покупка апгрейда экземпляра - управление имуществом, а не игровое
      // действие (не тратит ход, см. purchaseFarmUpgrade) - без tryRunAction/
      // кулдауна, тем же принципом, что у houseCreature/releaseCreature.
      const buyBtn = el("button", { text: u.repeatable && u.purchased ? "Купить ещё" : "Купить" });
      buyBtn.addEventListener("click", () => purchaseFarmUpgrade(farm.id, u.id));
      row.appendChild(buyBtn);
    }
    box.appendChild(row);
  });
  return box;
}

function renderFarmSection(farm, refresh) {
  const section = el("div", { class: "farm-section" });
  const statusText = farm.working ? "" : " (не работает)";
  const head = el("div", { class: "farm-section-head" });
  head.appendChild(el("h3", { text: `${farm.name} — слоты ${farm.slots_used}/${farm.slot_capacity}${statusText}` }));
  if (farm.upgrades && farm.upgrades.upgrades.length) {
    const upgradesBtn = el("button", { class: "upgrade-open-btn", text: "⚙ Улучшения" });
    upgradesBtn.addEventListener("click", () => openFarmUpgradesModal(farm));
    head.appendChild(upgradesBtn);
  }
  section.appendChild(head);

  if (!farm.creatures.length) {
    section.appendChild(el("div", { class: "empty-note", text: "В этой ферме пока никого нет." }));
  }
  farm.creatures.forEach(entry => {
    const row = el("div", { class: "creature-row" });
    const head = el("div", { class: "job-head" });
    const title = el("span");
    title.append(
      `${entry.name} `,
      el("span", { class: "creature-id-badge", text: `№${creatureShortId(entry)}` }),
    );
    if (entry.identified) {
      title.append(`: ${entry.turns_alive}/${entry.lifespan} ход(ов)`);
    }
    head.appendChild(title);
    const right = el("span", { class: "job-right" });
    if (!entry.identified && VIEW.genetics_lab_available) {
      const analyzeBtn = el("button", { class: "small", text: "Анализировать" });
      analyzeBtn.addEventListener("click", () => analyzeCreature(entry.id));
      right.appendChild(analyzeBtn);
    }
    right.appendChild(jobCancelButton(() => releaseCreature(entry.id)));
    const body = el("div", { class: "creature-body" });
    if (entry.identified) {
      const ratio = Math.min(1, entry.turns_alive / entry.lifespan);
      const bar = el("div", { class: "job-bar" });
      bar.appendChild(el("div", { class: "job-bar-fill", style: `width:${Math.round(ratio * 100)}%` }));
      body.appendChild(bar);
    }
    body.appendChild(creatureGenotypeBlock(entry));
    right.appendChild(creatureToggleButton(entry.id, body, refresh));
    head.appendChild(right);
    row.appendChild(head);
    // Видно сразу в слоте, без разворачивания карточки (creatureToggleButton
    // прячет только body с генотипом) - ЧТО именно эта особь производит, без
    // чисел (см. CLAUDE.md): иконка+название на каждый ресурс, плюс отдельный
    // чип с % для бонусной продукции промышленной пасеки (entry.bonus_produce),
    // если сейчас действует.
    if (entry.identified && (entry.produces.length || entry.bonus_produce)) {
      const producesRow = el("div", { class: "costs" });
      entry.produces.forEach(c => producesRow.appendChild(produceLabelChip(c.id, c.name)));
      if (entry.bonus_produce) {
        producesRow.appendChild(produceChanceChip(entry.bonus_produce.resource_id, entry.bonus_produce.name, entry.bonus_produce.chance));
      }
      row.appendChild(producesRow);
    }
    row.appendChild(body);
    section.appendChild(row);
  });
  return section;
}

// Строка поиска для банка особей - переживает rebuild списка (модалка "Особи"
// пересобирается заново после любого действия), как storageSearchQuery.
let creatureBankSearchQuery = "";

// houseTargets - экземпляры ферм, в которые можно поселить особь отсюда
// (модалка "Особи" открыта на КОНКРЕТНОМ типе постройки - openFarmTypeModal -
// поэтому выпадающий список "Поселить" ограничен экземплярами ЭТОГО типа, а не
// вообще всеми фермами игрока). refresh пробрасывается в creatureToggleButton,
// как в renderFarmSection.
//
// Банк особей тут дополнительно отфильтрован по houseTargets[0].accepts_family
// (buildings.*.breeding_accepts_family, одинаков у всех экземпляров одного
// типа построек - см. game/engine.py:breeding_accepts_family, сравнивается с
// entry.family - species.*.family каждой особи) - иначе в модалке "Пасека"
// был бы виден и весь банк манацветов вперемешку с пчёлами, хотя поселить их
// туда всё равно нельзя (движок отклонит house_creature). null/отсутствие
// поля - старое поведение без ограничений, показываем банк целиком.
function renderCreatureBankSection(houseTargets, refresh) {
  const acceptsFamily = houseTargets.length ? houseTargets[0].accepts_family : null;
  const bankEntries = acceptsFamily ? VIEW.creature_bank.filter(e => e.family === acceptsFamily) : VIEW.creature_bank;
  const section = el("div", { class: "farm-section" });
  section.appendChild(el("h3", { text: `Банк особей (${bankEntries.length})` }));
  if (!bankEntries.length) {
    const text = VIEW.creature_bank.length
      ? "В запасе нет особей подходящего для этой фермы вида."
      : "В запасе никого нет - поймай или выведи особь.";
    section.appendChild(el("div", { class: "empty-note", text }));
    return section;
  }
  const list = el("div", { class: "creature-list" });
  bankEntries.forEach(entry => {
    const row = el("div", { class: "creature-row" });
    row.dataset.resourceName = creatureSearchText(entry);
    const head = el("div", { class: "job-head" });
    const title = el("span");
    title.append(`${entry.name} `, el("span", { class: "creature-id-badge", text: `№${creatureShortId(entry)}` }));
    head.appendChild(title);
    const right = el("span", { class: "job-right" });
    if (houseTargets.length) {
      const select = el("select");
      houseTargets.forEach(farm => {
        const free = farm.slot_capacity - farm.slots_used;
        const opt = el("option", { value: farm.id, text: `${farm.name} (${free} своб.)` });
        if (free <= 0) opt.disabled = true;
        select.appendChild(opt);
      });
      const houseBtn = el("button", { class: "habitat-house-btn", text: "Поселить" });
      houseBtn.addEventListener("click", () => houseCreature(entry.id, select.value));
      right.append(select, houseBtn);
    }
    if (!entry.identified && VIEW.genetics_lab_available) {
      const analyzeBtn = el("button", { class: "small", text: "Анализировать" });
      analyzeBtn.addEventListener("click", () => analyzeCreature(entry.id));
      right.appendChild(analyzeBtn);
    }
    const body = el("div", { class: "creature-body" });
    body.appendChild(creatureGenotypeBlock(entry));
    right.appendChild(creatureToggleButton(entry.id, body, refresh));
    head.appendChild(right);
    row.appendChild(head);
    row.appendChild(body);
    list.appendChild(row);
  });
  section.appendChild(makeResourceSearchBar(list, {
    get: () => creatureBankSearchQuery,
    set: (v) => { creatureBankSearchQuery = v; },
  }, true));
  section.appendChild(list);
  return section;
}

// Скрещивать можно ЛЮБЫХ двух особей игрока - из банка или уже поселённых
// (не обязательно в одной и той же ферме) - фермы тут вообще ни при чём,
// скрещивание требует отдельный работающий механизм (VIEW.breeding_station_available,
// см. game/engine.py:breed_creatures/breeding_station_available).
function allOwnedCreatures() {
  return [...VIEW.creature_bank, ...VIEW.farms.flatMap(f => f.creatures)];
}

// Выбранные родители для скрещивания - id особей (не сами объекты: особь
// могла умереть/уйти между перерисовками, сверяемся заново при каждом
// рендере). Переживает rebuild модалки (openBreedingModal() дёргается заново
// после любого действия), как storageSearchQuery/priorityResourceFilter -
// иначе выбор родителей сбрасывался бы, например, при завершении хода откуда
// угодно, пока модалка "Скрещивание" открыта.
let breedParentAId = null;
let breedParentBId = null;
let breedPickerSearchQuery = "";
// "" - показать особей всех семейств. Семейство (entry.family, см.
// game/engine.py:species_family) - свободный тег вида (например "bee"/
// "flower"), а не отдельная сущность - фильтр строится из тех тегов, что
// реально встретились среди особей игрока, поэтому новый вид/семейство
// подхватывается сам, без правки этого файла.
let breedPickerFamilyFilter = "";

// Один слот "Родитель А/Б" - пустой (плейсхолдер под drag&drop) или карточка
// уже выбранной особи с кнопкой "убрать". onDropId(creatureId) вызывается и
// при drag&drop, и как общий колбэк из клика по карточке в сетке ниже.
function renderBreedSlot(label, entry, onDropId, onClear) {
  const slot = el("div", { class: "breed-slot" + (entry ? " filled" : "") });
  slot.appendChild(el("div", { class: "breed-slot-label", text: label }));
  if (entry) {
    const card = el("div", { class: "breed-slot-card" });
    card.appendChild(creatureCardIcon(entry, 32));
    const info = el("div", { class: "breed-slot-info" });
    info.appendChild(el("div", { class: "name", text: `${entry.name} №${creatureShortId(entry)}` }));
    info.appendChild(el("div", { class: "hint", text: creatureSummaryLine(entry) }));
    card.appendChild(info);
    slot.appendChild(card);
    const clearBtn = el("button", { class: "breed-slot-clear", text: "×", title: "Убрать из слота" });
    clearBtn.addEventListener("click", onClear);
    slot.appendChild(clearBtn);
  } else {
    slot.appendChild(el("div", { class: "breed-slot-placeholder", text: "Перетащи сюда особь снизу или кликни по её карточке" }));
  }
  slot.addEventListener("dragover", (e) => { e.preventDefault(); slot.classList.add("drag-over"); });
  slot.addEventListener("dragleave", () => slot.classList.remove("drag-over"));
  slot.addEventListener("drop", (e) => {
    e.preventDefault();
    slot.classList.remove("drag-over");
    const droppedId = e.dataTransfer.getData("text/plain");
    if (droppedId) onDropId(droppedId);
  });
  return slot;
}

// Скрещивание - визуальный выбор вместо двух <select> с одинаковыми
// подписями (особи одного вида называются одинаково, в выпадающем списке
// невозможно было понять, какую именно особь выбираешь): два слота
// "Родитель А/Б" + сетка карточек всех особей игрока (банк + поселённые) с
// поиском/фильтром (см. creatureSearchText) - особь ставится в слот
// перетаскиванием иконки-карточки или кликом (первый свободный слот).
function renderBreedSection() {
  const section = el("div", { class: "farm-section breed-root" });
  const headRow = el("div", { class: "breed-section-head" });
  headRow.appendChild(el("h3", { text: "Скрестить" }));
  // Кнопка книги знаний видна, только когда построен работающий механизм
  // скрещивания (VIEW.breeding_station_available) - именно он открывает саму
  // возможность мутации вида при скрещивании (см. game/engine.py:
  // breeding_station_available). Не завязана на наличие 2 особей у игрока -
  // это справочник "как получить", им можно пользоваться и заранее.
  if (VIEW.breeding_station_available) {
    const bookBtn = el("button", {
      class: "small", text: "Книга видов",
      title: "Каталог видов: какие пары родителей дают какой вид и с каким шансом",
    });
    bookBtn.addEventListener("click", openSpeciesBookModal);
    headRow.appendChild(bookBtn);
  }
  section.appendChild(headRow);
  const creatures = allOwnedCreatures();
  if (!VIEW.breeding_station_available || creatures.length < 2) {
    section.appendChild(el("div", { class: "empty-note", text: "Нужна работающая станция скрещивания и две особи." }));
    return section;
  }

  const byId = {};
  creatures.forEach(c => { byId[c.id] = c; });
  if (breedParentAId && !byId[breedParentAId]) breedParentAId = null;
  if (breedParentBId && !byId[breedParentBId]) breedParentBId = null;
  if (breedParentAId && breedParentAId === breedParentBId) breedParentBId = null;

  const assign = (creatureId, preferredSlot) => {
    if (creatureId === breedParentAId || creatureId === breedParentBId) return;
    if (preferredSlot === "a") breedParentAId = creatureId;
    else if (preferredSlot === "b") breedParentBId = creatureId;
    else if (!breedParentAId) breedParentAId = creatureId;
    else if (!breedParentBId) breedParentBId = creatureId;
    else { breedParentAId = creatureId; breedParentBId = null; } // оба слота заняты - начинаем выбор заново с А
    openBreedingModal();
  };

  // Кнопка "Скрестить" - МЕЖДУ слотами родителей (1:1 из канваса, B_Breeding.dc.html:
  // .cross-row - слот/кнопка/слот в один ряд), не отдельной строкой под сеткой
  // банка особей, как было раньше - по прямому пожеланию, 2026-09-13, см. CLAUDE.md.
  const slots = el("div", { class: "breed-slots" });
  slots.appendChild(renderBreedSlot("Родитель А", byId[breedParentAId] || null,
    (id) => assign(id, "a"), () => { breedParentAId = null; openBreedingModal(); }));
  const breedBtn = el("button", { class: "primary breed-cross-btn", text: "Скрестить" });
  breedBtn.disabled = !breedParentAId || !breedParentBId;
  const breedKey = "breed_action";
  const breedDelay = VIEW.default_action_delay_ms;
  const breedRemaining = cooldownRemainingMs(breedKey);
  if (breedRemaining > 0) applyCooldownVisual(breedBtn, breedRemaining, breedDelay);
  breedBtn.addEventListener("click", () => {
    if (!breedParentAId || !breedParentBId) return;
    tryRunAction(breedKey, breedDelay, breedBtn, () => doAction("breed", `${breedParentAId}:${breedParentBId}`));
  });
  slots.appendChild(breedBtn);
  slots.appendChild(renderBreedSlot("Родитель Б", byId[breedParentBId] || null,
    (id) => assign(id, "b"), () => { breedParentBId = null; openBreedingModal(); }));
  section.appendChild(slots);

  // Фильтр по семейству ("только пчёлы"/"только цветы") - отдельный от
  // текстового поиска ниже: чипы реально ПРЯЧУТ карточки чужого семейства
  // (это выбор категории, не подсказка "где искать"), поэтому оба фильтра
  // применяются последовательно (сначала семейство, потом текст поиска).
  const families = [...new Set(creatures.map(c => c.family).filter(Boolean))];
  if (breedPickerFamilyFilter && !families.includes(breedPickerFamilyFilter)) breedPickerFamilyFilter = "";
  if (families.length > 1) {
    const filterBar = el("div", { class: "breed-family-filter" });
    const allBtn = el("button", { type: "button", text: "Все", class: breedPickerFamilyFilter === "" ? "active" : "" });
    allBtn.addEventListener("click", () => { breedPickerFamilyFilter = ""; openBreedingModal(); });
    filterBar.appendChild(allBtn);
    families.forEach(family => {
      const btn = el("button", {
        type: "button", text: family.charAt(0).toUpperCase() + family.slice(1),
        class: breedPickerFamilyFilter === family ? "active" : "",
      });
      btn.addEventListener("click", () => { breedPickerFamilyFilter = family; openBreedingModal(); });
      filterBar.appendChild(btn);
    });
    section.appendChild(filterBar);
  }
  const visibleCreatures = breedPickerFamilyFilter
    ? creatures.filter(c => c.family === breedPickerFamilyFilter)
    : creatures;

  const pickerGrid = el("div", { class: "breed-picker-grid scroll-area" });
  visibleCreatures.forEach(entry => {
    const selectedSlot = entry.id === breedParentAId ? "a" : entry.id === breedParentBId ? "b" : null;
    const card = el("div", { class: "breed-card" + (selectedSlot ? ` selected-${selectedSlot}` : "") });
    card.draggable = true;
    card.dataset.resourceName = creatureSearchText(entry);
    card.title = creatureSummaryLine(entry) + (entry.identified ? " (геном опознан)" : "");
    card.appendChild(creatureCardIcon(entry, 26));
    card.appendChild(el("div", { class: "breed-card-id", text: `№${creatureShortId(entry)}` }));
    card.appendChild(el("div", { class: "breed-card-name", text: entry.name }));
    card.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", entry.id));
    card.addEventListener("click", () => {
      if (selectedSlot === "a") { breedParentAId = null; openBreedingModal(); return; }
      if (selectedSlot === "b") { breedParentBId = null; openBreedingModal(); return; }
      assign(entry.id, null);
    });
    pickerGrid.appendChild(card);
  });
  section.appendChild(makeResourceSearchBar(pickerGrid, {
    get: () => breedPickerSearchQuery,
    set: (v) => { breedPickerSearchQuery = v; },
  }));
  section.appendChild(pickerGrid);
  return section;
}

// ---------- Книга видов (справочник рецептов скрещивания, VIEW.species_catalog) ----------

// Выбранный в книге вид/поисковый запрос - переживают пересборку модалки
// (openSpeciesBookModal() дёргается заново после любого действия/renderAll,
// как и остальное состояние UI модалки "Скрещивание" выше), чтобы клик по
// родителю в детали рецепта ("перейти к его рецепту") не сбрасывал открытую
// книгу целиком.
let speciesBookSelectedId = null;
let speciesBookSearchQuery = "";

function speciesIcon(speciesId, size) {
  const iconDef = resourceIcon(speciesId) || FALLBACK_SPECIES_ICON;
  return pixelIcon(iconDef.grid, iconDef.palette, size);
}

function speciesCatalogEntry(speciesId) {
  return VIEW.species_catalog.find(s => s.id === speciesId) || null;
}

// Имя родителя в строке рецепта - кликабельно ВСЕГДА (у каждого вида есть
// своя страница в этой же книге, см. renderSpeciesBookDetail), даже если сам
// родитель - "базовый" вид: переход на него просто покажет там пояснение, что
// рецептов для него нет и получается он не скрещиванием (например, ловится в
// дикой природе), а не спрячет кнопку вовсе.
function bookParentButton(parentId, parentName) {
  const btn = el("button", {
    class: "book-parent-btn clickable", type: "button",
    title: `Перейти к странице вида «${parentName}»`,
  });
  btn.appendChild(speciesIcon(parentId, 14));
  btn.appendChild(document.createTextNode(parentName));
  btn.addEventListener("click", () => { speciesBookSelectedId = parentId; openSpeciesBookModal(); });
  return btn;
}

function renderSpeciesBookRecipe(recipe) {
  const row = el("div", { class: "book-recipe-row" + (recipe.locked ? " locked" : "") });
  row.appendChild(bookParentButton(recipe.parent_a, recipe.parent_a_name));
  row.appendChild(el("span", { text: "×" }));
  row.appendChild(bookParentButton(recipe.parent_b, recipe.parent_b_name));
  row.appendChild(el("span", { class: "book-recipe-chance", text: `${Math.round(recipe.chance * 100)}%` }));
  if (recipe.locked) {
    const reasons = [];
    if (recipe.requires_tech_name) reasons.push(`технология «${recipe.requires_tech_name}»`);
    if (recipe.requires_building_name) reasons.push(`постройка «${recipe.requires_building_name}»`);
    row.appendChild(el("div", { class: "book-recipe-lock", text: `Пока недоступно: нужна(ы) ${reasons.join(", ")}.` }));
  }
  return row;
}

function renderSpeciesBookDetail(speciesId) {
  const pane = el("div", { class: "book-detail-pane" });
  const species = speciesCatalogEntry(speciesId);
  if (!species) {
    pane.appendChild(el("div", { class: "empty-note", text: "Выбери вид слева." }));
    return pane;
  }
  const head = el("div", { class: "book-detail-head" });
  head.appendChild(speciesIcon(species.id, 32));
  head.appendChild(el("strong", { text: species.name }));
  pane.appendChild(head);
  if (species.description) pane.appendChild(el("div", { class: "book-species-desc", text: species.description }));
  if (!species.breedable) {
    pane.appendChild(el("div", {
      class: "empty-note",
      text: "Базовый вид - получается не скрещиванием (например, ловится в дикой природе), рецептов для него нет.",
    }));
    return pane;
  }
  if (!species.recipes.length) {
    pane.appendChild(el("div", { class: "empty-note", text: "Для этого вида пока нет ни одного рецепта скрещивания в игре." }));
    return pane;
  }
  species.recipes.forEach(r => pane.appendChild(renderSpeciesBookRecipe(r)));
  return pane;
}

function renderSpeciesBookList() {
  const pane = el("div", { class: "book-list-pane" });
  const list = el("div", { class: "book-species-list thin-scroll" });
  VIEW.species_catalog.forEach(species => {
    const item = el("button", {
      class: "book-species-item" + (species.id === speciesBookSelectedId ? " selected" : ""),
      type: "button",
    });
    item.dataset.resourceName = species.name.toLowerCase();
    item.appendChild(speciesIcon(species.id, 20));
    item.appendChild(el("span", { text: species.name }));
    item.addEventListener("click", () => { speciesBookSelectedId = species.id; openSpeciesBookModal(); });
    list.appendChild(item);
  });
  pane.appendChild(makeResourceSearchBar(list, {
    get: () => speciesBookSearchQuery,
    set: (v) => { speciesBookSearchQuery = v; },
  }, true));
  pane.appendChild(list);
  return pane;
}

// Список видов + поиск слева, детали выбранного вида (описание и все пары
// родителей, дающие его при скрещивании, с шансом) справа - открывается
// кнопкой "Книга видов" из блока "Скрестить" модалки "Скрещивание" (см.
// renderBreedSection), но живёт в СВОЁМ overlay поверх неё - тот же приём,
// что у остальных модалок (пересобирается заново в renderAll(), если открыта).
function openSpeciesBookModal() {
  closeSpeciesBookModal();
  if (speciesBookSelectedId && !speciesCatalogEntry(speciesBookSelectedId)) speciesBookSelectedId = null;
  if (!speciesBookSelectedId && VIEW.species_catalog.length) speciesBookSelectedId = VIEW.species_catalog[0].id;

  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeSpeciesBookModal(); });

  const modal = el("div", { class: "modal tech-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Книга видов" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: closeSpeciesBookModal }));
  modal.appendChild(head);

  const body = el("div", { class: "book-layout" });
  body.appendChild(renderSpeciesBookList());
  body.appendChild(renderSpeciesBookDetail(speciesBookSelectedId));
  modal.appendChild(body);

  overlay.appendChild(modal);
  overlay.id = "speciesBookOverlay";
  document.body.appendChild(overlay);
}

function closeSpeciesBookModal() {
  const overlay = document.getElementById("speciesBookOverlay");
  if (overlay) overlay.remove();
}

// Генетический шаблон (Gendustry) - штампует особь с ВЫБРАННЫМ геномом из уже
// ИЗУЧЕННЫХ аллелей (VIEW.known_alleles, см. game/engine.py:synthesize_creature) -
// доступно только с генетической лабораторией. Живёт в своей модалке
// (openGeneticsLabModal), открывается кнопкой "Синтез" на карточке
// генетической лаборатории в панели "Производственные мощности".
function renderSynthesizeSection() {
  const section = el("div", { class: "farm-section" });
  section.appendChild(el("h3", { text: "Синтез (генетический шаблон)" }));
  const missing = GENOTYPE_TRAIT_IDS.filter(t => !(VIEW.known_alleles[t] || []).length);
  if (missing.length) {
    section.appendChild(el("div", { class: "empty-note", text: "Опознай хотя бы одну особь - синтез доступен, только когда изучена хотя бы одна аллель каждого признака." }));
    return section;
  }
  const fields = el("div", { class: "synth-fields" });
  const selects = {};
  GENOTYPE_TRAIT_IDS.forEach(traitId => {
    const row = el("div", { class: "field-row" });
    row.appendChild(el("span", { text: VIEW.genetic_trait_names[traitId] || traitId }));
    const select = el("select");
    (VIEW.known_alleles[traitId] || []).forEach(a => select.appendChild(el("option", { value: a.id, text: a.name })));
    row.appendChild(select);
    fields.appendChild(row);
    selects[traitId] = select;
  });
  section.appendChild(fields);
  const footer = el("div", { class: "synth-footer" });
  const synthBtn = el("button", { class: "primary", text: "Синтезировать" });
  const key = "synthesize_action";
  const delay = VIEW.default_action_delay_ms;
  const remaining = cooldownRemainingMs(key);
  if (remaining > 0) applyCooldownVisual(synthBtn, remaining, delay);
  synthBtn.addEventListener("click", () => {
    const chosen = GENOTYPE_TRAIT_IDS.map(t => `${t}=${selects[t].value}`).join(":");
    tryRunAction(key, delay, synthBtn, () => doAction("synthesize", chosen));
  });
  const costText = VIEW.genetics_cost.synthesize.map(c => `${c.amount} ${c.name}`).join(", ") || "бесплатно";
  footer.append(synthBtn, el("div", { class: "hint", text: `Цена: ${costText}` }));
  section.appendChild(footer);
  return section;
}

// Модалка "Особи" - открывается кнопкой на карточке КОНКРЕТНОЙ built-постройки-
// фермы (Пасека/Оранжерея/Электрическая пасека/Промышленная пасека - is_farm,
// см. tools/web_ui.py: build_view) в панели "Производственные мощности" (прямое
// пожелание, 2026-09-10: расселение и апгрейды экземпляров живут рядом с самой
// постройкой, а не в отдельном общем меню в шапке). Показывает ВСЕ физические
// экземпляры ИМЕННО ЭТОГО типа построек (VIEW.farms отфильтрован по
// building_id) со слотами/апгрейдами/поселёнными особями, и банк непоселённых
// особей ниже - выпадающий список "Поселить" в банке ограничен экземплярами
// этого же типа (см. renderCreatureBankSection). Тот же приём, что
// openStorage/openToolsModal - пересобирается заново в renderAll(), если уже
// открыта на тот же buildingId (см. проверку "farmTypeOverlay" там).
function openFarmTypeModal(buildingId) {
  const prevModal = document.querySelector("#farmTypeOverlay .modal");
  const savedScroll = prevModal ? prevModal.scrollTop : null;

  closeFarmTypeModal();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeFarmTypeModal(); });

  const buildingItem = VIEW.buildings.find(b => b.id === buildingId);
  const modal = el("div", { class: "modal tech-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: buildingItem ? buildingItem.name : "Особи" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: closeFarmTypeModal }));
  modal.appendChild(head);

  const refresh = () => openFarmTypeModal(buildingId);
  const farms = VIEW.farms.filter(f => f.building_id === buildingId);
  const body = el("div", { class: "farms-modal-body scroll-area" });
  farms.forEach(farm => body.appendChild(renderFarmSection(farm, refresh)));
  body.appendChild(renderCreatureBankSection(farms, refresh));
  modal.appendChild(body);

  overlay.appendChild(modal);
  overlay.id = "farmTypeOverlay";
  overlay.dataset.buildingId = buildingId;
  document.body.appendChild(overlay);
  if (savedScroll !== null) modal.scrollTop = savedScroll;
}

function closeFarmTypeModal() {
  const overlay = document.getElementById("farmTypeOverlay");
  if (overlay) overlay.remove();
}

    VIEW = payload.state;
    pushLog({ message: payload.message, ok: payload.ok, action_deltas: [], production_deltas: [], idle: [], broken: [] });

  } finally {
    busy = false;

}

// Модалка "Души" - открывается кнопкой на карточке КОНКРЕТНОЙ built-постройки-
// синтезатора (soul_collector, is_soul_collector - см. tools/web_ui.py:
// build_view) в панели "Производственные мощности" - по прямому пожеланию,
// 2026-09-13: вставка/выемка душ живёт в своей модалке, а не прямо в панели
// построек - тот же приём, что "Особи" у ферм (openFarmTypeModal). Банк душ
// внизу (VIEW.soul_bank) отфильтрован по entry.accepts_kind (resources.*.
// soul_kind, см. game/engine.py:soul_kind/soul_collector_accepts_kind) - в
// "обычном" синтезаторе показываются и вставляются только души мобов, в
// "алтаре" - только боссовые, полная аналогия с creature_bank +
// breeding_accepts_family у ферм.
// Слоты синтезатора - визуальный ряд ячеек (пустые пунктиром приглашают
// перетащить душу, заполненные светятся сплошной цианевой рамкой), та же
// drag&drop-механика, что слоты родителей в "Скрещивании" (renderBreedSlot) -
// по прямому пожеланию, 2026-09-13, см. CLAUDE.md. Кроме перетаскивания,
// карточка банка ниже кликабельна (вставляет в первый свободный слот) -
// drag&drop необязателен, просто удобнее для нескольких слотов сразу.
function renderSoulCollectorSection(entry) {
  const section = el("div", { class: "farm-section" });
  const head = el("div", { class: "farm-section-head" });
  head.appendChild(el("h3", { text: `Слоты ${entry.installed.length}/${entry.capacity}` }));
  section.appendChild(head);

  const slots = el("div", { class: "soul-slots" });
  entry.installed.forEach(s => {
    const slot = el("div", { class: "soul-slot filled" });
    const iconWrap = el("div", { class: "soul-slot-icon" });
    const iconDef = resourceIcon(s.id);
    if (iconDef) iconWrap.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 28));
    slot.appendChild(iconWrap);
    slot.appendChild(el("div", { class: "soul-slot-name", text: s.name }));
    const clearBtn = el("button", { class: "breed-slot-clear", text: "×", title: "Вынуть душу" });
    clearBtn.addEventListener("click", () => removeSoul(entry.building_id, s.index));
    slot.appendChild(clearBtn);
    slot.addEventListener("dragover", (e) => e.preventDefault());
    slot.addEventListener("drop", (e) => e.preventDefault()); // слот занят - перетаскивание сюда ничего не делает
    slots.appendChild(slot);
  });
  for (let i = entry.installed.length; i < entry.capacity; i++) {
    const slot = el("div", { class: "soul-slot" });
    slot.appendChild(el("div", { class: "soul-slot-placeholder", text: "Перетащи душу сюда" }));
    slot.addEventListener("dragover", (e) => { e.preventDefault(); slot.classList.add("drag-over"); });
    slot.addEventListener("dragleave", () => slot.classList.remove("drag-over"));
    slot.addEventListener("drop", (e) => {
      e.preventDefault();
      slot.classList.remove("drag-over");
      const soulId = e.dataTransfer.getData("text/plain");
      if (soulId) insertSoul(entry.building_id, soulId);
    });
    slots.appendChild(slot);
  }
  section.appendChild(slots);
  return section;
}

function renderSoulBankSection(entry) {
  const bankEntries = VIEW.soul_bank.filter(s => s.kind === entry.accepts_kind);
  const section = el("div", { class: "farm-section" });
  section.appendChild(el("h3", { text: `Банк душ (${bankEntries.length})` }));
  if (!bankEntries.length) {
    section.appendChild(el("div", { class: "empty-note", text: "В запасе нет подходящих для этого синтезатора душ." }));
    return section;
  }
  const grid = el("div", { class: "soul-bank-grid" });
  bankEntries.forEach(s => {
    const full = s.amount <= 0 || entry.installed.length >= entry.capacity;
    const card = el("div", { class: "breed-card soul-bank-card" + (full ? " disabled" : "") });
    card.draggable = !full;
    card.title = full ? "Слоты синтезатора заполнены" : "Перетащи в свободный слот сверху или кликни";
    const iconBox = el("div", { class: "soul-bank-icon" });
    const iconDef = resourceIcon(s.id);
    if (iconDef) iconBox.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 26));
    card.appendChild(iconBox);
    card.appendChild(el("div", { class: "breed-card-name", text: s.name }));
    card.appendChild(el("div", { class: "soul-bank-count", text: `× ${s.amount}` }));
    card.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", s.id));
    card.addEventListener("click", () => { if (!full) insertSoul(entry.building_id, s.id); });
    grid.appendChild(card);
  });
  section.appendChild(grid);
  return section;
}

// ---------- Стол зачарований (enchanting_table, VIEW.enchanting) ----------
// Модалка глобальная (не привязана к конкретной built-постройке, в отличие от
// soul_collector) - любая работающая копия любого стола зачарований годится
// (см. game/engine.py:_enchanting_table_config), поэтому кнопка на карточке
// постройки просто открывает её без buildingId. enchantingActiveTool -
// выбор инструмента переживает переоткрытие (тот же приём, что
// questsActiveEra/prioritiesActiveTab).
let enchantingActiveTool = null;
let enchantingSpinning = false;
let enchantingFx = [];
let _enchFxLoopRunning = false;
let _enchFxLastT = null;

function lvlColorVar(level) { return level === 1 ? "var(--lvl1)" : level === 2 ? "var(--lvl2)" : "var(--lvl3)"; }
function lvlColorRgb(level) { return level === 1 ? "95,208,232" : level === 2 ? "95,208,232" : "240,160,48"; }
function lvlRoman(level) { return level === 1 ? "I" : level === 2 ? "II" : "III"; }

function openEnchantingModal() {
  const data = VIEW.enchanting;
  closeEnchantingModal();
  if (!data.tools.length) return; // в этом контенте ни один инструмент не зачаровываем (enchant_kind нигде не задан)
  if (!enchantingActiveTool || !data.tools.some(t => t.id === enchantingActiveTool)) {
    enchantingActiveTool = data.tools[0].id;
  }

  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay && !enchantingSpinning) closeEnchantingModal(); });
  const modal = el("div", { class: "modal enchanting-modal" });
  modal.append(
    el("div", { class: "bracket tl" }), el("div", { class: "bracket tr" }),
    el("div", { class: "bracket bl" }), el("div", { class: "bracket br" }),
  );
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Стол зачарований" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: () => { if (!enchantingSpinning) closeEnchantingModal(); } }));
  modal.appendChild(head);

  const layout = el("div", { class: "ench-layout" });
  layout.append(
    el("div", { class: "ench-col ench-col-left", id: "enchLeftCol" }),
    el("div", { class: "ench-col ench-col-center", id: "enchCenterCol" }),
    el("div", { class: "ench-col ench-col-right", id: "enchRightCol" }),
  );
  modal.appendChild(layout);

  overlay.appendChild(modal);
  overlay.id = "enchantingOverlay";
  document.body.appendChild(overlay);

  renderEnchantingAll();
  _startEnchFxLoop();
}

function closeEnchantingModal() {
  const overlay = document.getElementById("enchantingOverlay");
  if (overlay) overlay.remove();
  enchantingFx = [];
}

function renderEnchantingAll() {
  const data = VIEW.enchanting;
  const tool = data.tools.find(t => t.id === enchantingActiveTool) || data.tools[0];
  renderEnchantingLeft(data, tool);
  renderEnchantingCenter(tool, data);
  renderEnchantingRight(tool);
}

function renderEnchantingAppliedInto(container, tool) {
  container.innerHTML = "";
  if (!tool.applied.length) {
    container.appendChild(el("div", { class: "ench-applied-empty" }));
    return;
  }
  tool.applied.forEach(a => {
    const c = lvlColorVar(a.level);
    const chip = el("div", { class: "ench-chip" });
    chip.style.cssText = `border-color:${c};color:${c};background:color-mix(in srgb,${c} 12%, transparent)`;
    chip.dataset.enchantId = a.enchant_id;
    const iconDef = enchantIcon(a.enchant_id);
    chip.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 16));
    chip.appendChild(el("span", { text: a.name }));
    chip.appendChild(el("b", { text: lvlRoman(a.level) }));
    container.appendChild(chip);
  });
}

function renderEnchantingLeft(data, tool) {
  const col = document.getElementById("enchLeftCol");
  col.innerHTML = "";
  col.appendChild(el("div", { class: "ench-col-label", text: "Инструмент" }));

  const select = el("select");
  data.tools.forEach(t => {
    const opt = el("option", { value: t.id, text: t.name });
    if (t.id === tool.id) opt.setAttribute("selected", "selected");
    select.appendChild(opt);
  });
  select.addEventListener("change", (e) => {
    if (enchantingSpinning) { select.value = enchantingActiveTool; return; }
    enchantingActiveTool = e.target.value;
    renderEnchantingAll();
  });
  col.appendChild(select);

  const card = el("div", { class: "ench-tool-card" });
  const iconBox = el("div", { class: "ench-tool-card-icon" });
  const toolIconDef = toolIcon(tool.id, tool.tier);
  iconBox.appendChild(pixelIcon(toolIconDef.grid, toolIconDef.palette, 26));
  card.appendChild(iconBox);
  const info = el("div");
  info.appendChild(el("div", { class: "ench-tool-card-name", text: tool.name }));
  info.appendChild(el("div", { class: "ench-tool-card-tier", text: `${tool.tier_name} · тир ${tool.tier}/${tool.max_tier}` }));
  card.appendChild(info);
  col.appendChild(card);

  if (tool.max_durability != null) {
    const durWrap = el("div");
    const label = el("div", { class: "ench-durability-label" });
    label.appendChild(el("span", { text: "Прочность" }));
    label.appendChild(el("b", { text: `${tool.durability_remaining} / ${tool.max_durability}` }));
    durWrap.appendChild(label);
    const bar = el("div", { class: "ench-durability-bar" });
    const pct = Math.max(0, Math.min(100, (tool.durability_remaining / tool.max_durability) * 100));
    const fillCls = pct <= 20 ? " crit" : pct <= 50 ? " low" : "";
    bar.appendChild(el("div", { class: `ench-durability-fill${fillCls}`, style: `width:${pct}%` }));
    durWrap.appendChild(bar);
    col.appendChild(durWrap);
  }

  col.appendChild(el("div", { class: "ench-col-label", text: "Активные" }));
  const appliedCol = el("div", { class: "ench-applied-col", id: "enchAppliedCol" });
  renderEnchantingAppliedInto(appliedCol, tool);
  col.appendChild(appliedCol);
}

function renderEnchantingRight(tool) {
  const col = document.getElementById("enchRightCol");

  col.appendChild(el("div", { class: "ench-col-label", text: "Доступно" }));

  } else {
    tool.pool.forEach(group => {
      const row = el("div", { class: "ench-pool-row" });
      const ic = el("div", { class: "ench-pool-ic" });
      const iconDef = enchantIcon(group.enchant_id);
      ic.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 15));
      row.appendChild(ic);
      row.appendChild(el("div", { class: "ench-pool-name", text: group.name }));
      const levels = el("div", { class: "ench-pool-levels" });
      group.levels.forEach(lv => {

        const pip = el("div", { class: `ench-pool-lvl${lv.reached ? " reached" : ""}`, text: lvlRoman(lv.level) });
        pip.style.setProperty("--lvl-c", c);
        pip.title = `${group.name} ${lvlRoman(lv.level)}: ${group.description}`;

function renderEnchantingCenter(tool, data) {
  const col = document.getElementById("enchCenterCol");
  col.innerHTML = "";
  enchantingFx = [];

  col.appendChild(el("div", { class: "ench-altar-glow", id: "enchAltarGlow" }));

  const circlesRow = el("div", { class: "ench-circles-row" });
  for (let i = 0; i < 3; i++) {
    const slot = el("div", { class: "ench-circle-slot", id: `enchSlot${i}` });

    canvas.width = 138; canvas.height = 138;

    slot.appendChild(el("div", { class: "ench-rune-ticks" }));
    const circle = el("div", { class: "ench-circle", id: `enchCircle${i}` });
    circle.append(
      el("div", { class: "ring" }), el("div", { class: "ring2" }),

// Орбитальные искры вокруг каждого круга (canvas, ЧИСТО декоративно - реальный
// исход уже решён сервером, см. rollEnchant) - ускоряются во время прокрутки,
// разлетаются вспышкой при фиксации символа, краснеют и осыпаются при провале.
function makeEnchantFx(canvas) {
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height, cx = W / 2, cy = H / 2;
  let particles = [];
  let ambientTimer = 0;
  let ambientRate = 220;
  let rgb = "95,208,232";

  function spawnAmbient() {
    const ang = Math.random() * Math.PI * 2;
    const r = 46 + Math.random() * 8;
    particles.push({
      x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r,
      ang, r, spin: (Math.random() < 0.5 ? 1 : -1) * (0.004 + Math.random() * 0.006),
      life: 900 + Math.random() * 500, maxLife: 1400, size: 1 + Math.random() * 1.2,
      rgb, orbit: true, alpha: 0.5 + Math.random() * 0.3,
    });
  }
  function burst(color, count, speed) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = speed * (0.5 + Math.random() * 0.7);
      particles.push({
        x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        life: 500 + Math.random() * 260, maxLife: 760, size: 1.4 + Math.random() * 1.8,
        rgb: color, orbit: false, alpha: 1, grav: 0,
      });
    }
  }
  function fallShards(color, count) {
    for (let i = 0; i < count; i++) {
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
      particles.push({
        x: cx + (Math.random() - 0.5) * 50, y: cy + (Math.random() - 0.5) * 30,
        vx: Math.cos(ang) * 0.4, vy: -1.2 - Math.random(),
        life: 700 + Math.random() * 300, maxLife: 1000, size: 1.6 + Math.random() * 1.6,
        rgb: color, orbit: false, alpha: 1, grav: 0.09,
      });
    }
  }
  function setAmbientColor(c, rate) { rgb = c; ambientRate = rate || 220; }

  function step(dt) {
    ambientTimer += dt;
    if (ambientTimer > ambientRate) { ambientTimer = 0; spawnAmbient(); }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      if (p.orbit) {
        p.ang += p.spin * dt;
        p.x = cx + Math.cos(p.ang) * p.r;
        p.y = cy + Math.sin(p.ang) * p.r;
      } else {
        p.vy += (p.grav || 0) * (dt / 16);
        p.x += p.vx * (dt / 16);
        p.y += p.vy * (dt / 16);
      }
    }
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      const a = Math.max(0, p.life / p.maxLife) * (p.alpha != null ? p.alpha : 1);
      ctx.fillStyle = `rgba(${p.rgb},${a.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
  }
  return { step, draw, burst, fallShards, setAmbientColor };
}

function _enchFxLoop(t) {
  if (!document.getElementById("enchantingOverlay")) { _enchFxLoopRunning = false; _enchFxLastT = null; return; }
  if (_enchFxLastT == null) _enchFxLastT = t;
  const dt = Math.min(48, t - _enchFxLastT);
  _enchFxLastT = t;
  enchantingFx.forEach(f => { f.step(dt); f.draw(); });
  requestAnimationFrame(_enchFxLoop);
}
function _startEnchFxLoop() {
  if (_enchFxLoopRunning) return;
  _enchFxLoopRunning = true;
  _enchFxLastT = null;
  requestAnimationFrame(_enchFxLoop);
}

function setEnchCircleCore(circleEl, enchantId, color) {
  const core = circleEl.querySelector(".core");
  core.innerHTML = "";
  const iconDef = enchantIcon(enchantId);
  core.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 30));
  circleEl.style.setProperty("--lvl-c", color);
}

function playEnchShock(idx, color) {
  const shockEl = document.getElementById(`enchShock${idx}`);
  if (!shockEl) return;
  shockEl.style.setProperty("--lvl-c", color);
  shockEl.classList.remove("play");
  void shockEl.offsetWidth;
  shockEl.classList.add("play");
}

function spinEnchCircle(idx, pool, forced, duration) {
  return new Promise(resolve => {
    const circleEl = document.getElementById(`enchCircle${idx}`);
    if (!circleEl) { resolve(); return; }
    circleEl.classList.add("spinning");
    circleEl.classList.remove("locked", "success", "fail");
    if (enchantingFx[idx]) enchantingFx[idx].setAmbientColor("95,208,232", 90);
    let steps = 0;
    const tick = () => {
      const pick = pool[Math.floor(Math.random() * pool.length)];
      setEnchCircleCore(circleEl, pick.enchant_id, lvlColorVar(pick.level));
      steps++;
      const delay = 50 + steps * 8;
      if (steps * delay < duration) {
        setTimeout(tick, delay);
        return;
      }
      circleEl.classList.remove("spinning");
      circleEl.classList.add("locked");
      const color = lvlColorVar(forced.level);
      setEnchCircleCore(circleEl, forced.enchant_id, color);
      const badge = circleEl.querySelector(".lvl-badge");
      if (badge) badge.textContent = lvlRoman(forced.level);
      const rgb = lvlColorRgb(forced.level);
      if (enchantingFx[idx]) { enchantingFx[idx].setAmbientColor(rgb, 500); enchantingFx[idx].burst(rgb, 16, 2.6); }
      playEnchShock(idx, color);
      const glow = document.getElementById("enchAltarGlow");
      if (glow) {
        const locked = document.querySelectorAll(".ench-circle.locked").length;
        glow.style.setProperty("--ench-glow-rgb", rgb);
        glow.style.setProperty("--ench-glow-a", (0.05 + locked * 0.09).toFixed(2));
      }
      resolve();
    };
    tick();
  });
}

// Барабан для анимации набирается из ТЕКУЩЕГО пула инструмента (VIEW.enchanting,
// уже свежий на момент вызова - см. rollEnchant) - круги при прокрутке мелькают
// РЕАЛЬНЫМИ доступными символами, но останавливаются РОВНО там, где решил сервер
// (enchantResult.circles), а не где попадёт клиентский random.
async function playEnchantRoll(enchantResult) {
  const tool = VIEW.enchanting.tools.find(t => t.id === enchantResult.tool_id);
  const pool = tool ? tool.pool.flatMap(g => g.levels.map(lv => ({ enchant_id: g.enchant_id, level: lv.level }))) : [];
  if (!pool.length) return;
  const glow = document.getElementById("enchAltarGlow");
  if (glow) { glow.style.setProperty("--ench-glow-rgb", "95,208,232"); glow.style.setProperty("--ench-glow-a", ".04"); }

  const circles = enchantResult.circles;
  await spinEnchCircle(0, pool, circles[0], 900);
  await sleep(220);
  await spinEnchCircle(1, pool, circles[1], 900);
  await sleep(220);
  await spinEnchCircle(2, pool, circles[2], 1050);

  if (enchantResult.success) {
    for (let i = 0; i < 3; i++) {
      const c = document.getElementById(`enchCircle${i}`);
      if (c) c.classList.add("success");
      if (enchantingFx[i]) { enchantingFx[i].burst("240,160,48", 26, 3.2); enchantingFx[i].setAmbientColor("240,160,48", 300); }
    }
    if (glow) { glow.style.setProperty("--ench-glow-rgb", "240,160,48"); glow.style.setProperty("--ench-glow-a", ".22"); }
    const badge = document.getElementById("enchSuccessBadge");
    if (badge) {
      badge.innerHTML = "";
      const iconDef = enchantIcon(enchantResult.applied.enchant_id);
      badge.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 30));
      badge.appendChild(el("span", { class: "roman", text: lvlRoman(enchantResult.applied.level) }));
      badge.classList.remove("show");
      void badge.offsetWidth;
      badge.classList.add("show");
    }
    playSound("reward");
    const appliedCol = document.getElementById("enchAppliedCol");
    const chip = appliedCol && appliedCol.querySelector(`[data-enchant-id="${enchantResult.applied.enchant_id}"]`);
    if (chip) chip.classList.add("new-flash");
    await sleep(1500);
  } else {
    for (let i = 0; i < 3; i++) {
      const c = document.getElementById(`enchCircle${i}`);
      if (c) c.classList.add("fail");
      if (enchantingFx[i]) { enchantingFx[i].burst("224,82,74", 10, 1.4); enchantingFx[i].fallShards("224,82,74", 14); enchantingFx[i].setAmbientColor("224,82,74", 260); }
    }
    if (glow) { glow.style.setProperty("--ench-glow-rgb", "224,82,74"); glow.style.setProperty("--ench-glow-a", ".2"); }
    await sleep(700);
  }

  for (let i = 0; i < 3; i++) {
    const c = document.getElementById(`enchCircle${i}`);
    if (c) c.classList.remove("locked", "success", "fail");
    if (enchantingFx[i]) enchantingFx[i].setAmbientColor("95,208,232", 260);
  }
  if (glow) glow.style.setProperty("--ench-glow-a", ".04");
}

async function rollEnchant(toolId) {
  if (busy || enchantingSpinning) return;
  busy = true;
  enchantingSpinning = true;
  const btn = document.getElementById("enchRollBtn");
  if (btn) btn.disabled = true;
  try {
    const res = await fetch("/api/enchant_tool", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tool_id: toolId }),
    });
    const payload = await res.json();
    VIEW = payload.state;
    if (!payload.enchant) {
      // Не удалось даже начать (нет стола/не хватает книг) - обычное сообщение
      // об ошибке, крутить нечего.
      enchantingSpinning = false;
      renderAll();
      pushLog({ message: payload.message, ok: payload.ok, action_deltas: [], production_deltas: [], idle: [], broken: [] });
      return;
    }
    renderAll(); // модалка перестраивается заново (круги в состоянии покоя) - тот же приём, что claimQuestReward/openLootBoxModal
    await playEnchantRoll(payload.enchant);
    pushLog({ message: payload.message, ok: payload.ok, action_deltas: [], production_deltas: [], idle: [], broken: [] });
  } finally {
    enchantingSpinning = false;
    busy = false;
    const freshBtn = document.getElementById("enchRollBtn");
    if (freshBtn) freshBtn.disabled = !VIEW.enchanting.available;
  }
}

// Ползунок меню "Механизмы" (b.disableable, см. tools/web_ui.py:build_view/
// engine.is_disableable_building) - только у построек, которые пассивно И
// производят, И потребляют. min=0 (можно выключить все копии целиком),
// max=working_count (сколько вообще есть работающих, не сломанных копий) -
// сломанные тут не считаются, их и так нечем "включать". Живое число под
// пальцем обновляется на КАЖДОЕ движение (input), запрос на сервер уходит
// только по отпусканию (change) - тот же принцип "не долбить сервер на
// каждый пиксель", что и у скролла/поиска в других панелях.
function renderMechanismToggle(b) {
  if (!b.disableable || b.working_count <= 0) return null;
  const wrap = el("div", { class: "bld-mechanism-toggle" });
  wrap.appendChild(el("span", { class: "bld-mechanism-toggle-label", text: "Включено:" }));
  const slider = el("input", {
    type: "range", min: "0", max: String(b.working_count), step: "1", value: String(b.active_count),
  });
  const valueLabel = el("span", { class: "bld-mechanism-toggle-value mono", text: `${b.active_count} из ${b.working_count}` });
  slider.addEventListener("input", () => {
    valueLabel.textContent = `${slider.value} из ${b.working_count}`;
  });
  slider.addEventListener("change", () => setBuildingActiveCount(b.id, Number(slider.value)));
  wrap.append(slider, valueLabel);
  return wrap;
}

async function setBuildingActiveCount(buildingId, activeCount) {
  if (busy) return;
  busy = true;
  try {
    const res = await fetch("/api/set_building_active_count", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ building_id: buildingId, active_count: activeCount }),
    });
    const payload = await res.json();
    VIEW = payload.state;
    renderAll();
  } finally {
    busy = false;
  }
}

async function abandonEncounter() {
  if (busy) return;
  busy = true;
  clearActiveQte(); // не оставлять зависший авто-таймаут QTE на кнопке, которой больше не будет
  try {
    const res = await fetch("/api/hunt_abandon", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    const payload = await res.json();
    VIEW = payload.state;
    pushLog({ message: payload.message, ok: payload.ok, action_deltas: [], production_deltas: [], idle: [], broken: [] });
    renderAll();
  } finally {
    busy = false;
  }
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// Сколько ждать после playCombatHitEffect() перед тем, как doAction() применит
// новый VIEW/renderAll() - панель схватки строится ЗАНОВО на каждый renderAll(),
// поэтому без этой паузы анимация на СТАРОМ DOM обрывалась бы, не успев доиграть
// (при убийстве панель вовсе исчезает - см. doAction).
const HIT_EFFECT_DELAY_MS = 450;

// Каким РЕЖИМОМ приёма (move.mode, см. combat_moves_view) был нанесён удар, который
// сейчас летит на сервер - выставляется в makeAttackButton ПЕРЕД вызовом doAction()
// (сам combat-пакет из ответа сервера режима не несёт, только числа) и читается ровно
// один раз в playCombatHitEffect, чтобы покрасить цифру урона под конкретный режим
// (см. .dmg-float-true в CSS). Сброс на дефолт сразу после прочтения - на случай,
// если между кликами по приёму придёт какой-то другой combat-эффект без явного move.
let pendingAttackMoveMode = "multiplier";
// Попал ли игрок в зелёную зону QTE ПЕРЕД этим конкретным ударом (см. ниже) -
// тот же приём передачи "как был нанесён удар" в playCombatHitEffect, что и
// pendingAttackMoveMode, только для косметического бонуса, а не для цвета по режиму.
let pendingQteHit = false;

// ---------- QTE тайминга удара (см. .qte-track в CSS) ----------
// ЧИСТО клиентский слой поверх кнопки атаки - сервер как источник правды по-прежнему
// не знает о QTE вообще (game/engine.py:attack_encounter урон считает как всегда),
// попадание в зону даёт только косметический бонус самому эффекту удара, а не
// реальные дополнительные очки урона - тот же принцип "не обманывать цифры", что
// у остальных чисто клиентских эффектов в игре (click_delay_ms и т.п., см. CLAUDE.md).
// Маркер раньше гонялся CSS-анимацией (alternate), а qteMarkerPos() отдельно
// пересчитывал ту же позицию по performance.now() для сверки с зоной - ДВА
// независимых таймера (браузерный композитор для CSS-анимации и JS-часы для
// клика) технически могут разойтись на десятки мс (первый кадр CSS-анимации
// стартует не в момент присвоения style, а на следующей отрисовке, и это время
// не константа) - именно это давало ощущение "клик засчитывается с задержкой"
// при живой игре. Теперь маркер двигает САМ JS (rAF-цикл tick() внутри startQte)
// через ТУ ЖЕ qteMarkerPos(), что и проверка попадания - визуальная позиция и позиция,
// по которой судится клик, гарантированно одно и то же число, расхождению
// неоткуда взяться.
const QTE_SWEEP_MS = 650;    // время ОДНОГО прохода маркера от края до края
// 0.22 (~143мс окно на реакцию при 650мс прохода) оказалось слишком туго даже
// после починки визуальной рассинхронизации - среднее время реакции человека
// само по себе около 200-250мс, так что окно ýже этого физически не пройти
// стабильно. Расширено по прямому пожеланию, 2026-09-14.
const QTE_ZONE_WIDTH = 0.3;  // доля ширины шкалы, случайно сдвигается на старте
const QTE_TIMEOUT_MS = 2600; // не подвисать навсегда, если игрок отвлёкся - бьём "мимо" сами
const QTE_MARKER_WIDTH_PX = 6; // держать в паре с шириной .qte-marker в CSS (см. tick() ниже)
let activeQte = null; // { key, startedAt, zoneStart, timeoutId, rafId, track, btn, marker } | null

function qteMarkerPos(startedAt) {
  const cycle = QTE_SWEEP_MS * 2;
  const t = (performance.now() - startedAt) % cycle;
  return t <= QTE_SWEEP_MS ? t / QTE_SWEEP_MS : 2 - t / QTE_SWEEP_MS;
}

function isQteHit(qte) {
  const pos = qteMarkerPos(qte.startedAt);
  return pos >= qte.zoneStart && pos <= qte.zoneStart + QTE_ZONE_WIDTH;
}

// Полная расчистка (таймеры + DOM) - используется, когда шкалу нужно убрать
// БЕЗ визуального подтверждения исхода (отступление из боя, старт следующей
// шкалы). Разрешение клика идёт через resolveQte() ниже, не сюда.
function clearActiveQte() {
  if (!activeQte) return;
  clearTimeout(activeQte.timeoutId);
  cancelAnimationFrame(activeQte.rafId);
  activeQte.track.remove();
  activeQte.btn.classList.remove("qte-active");
  activeQte = null;
}

// Мгновенная (без ожидания ответа сервера) обратная связь по исходу QTE -
// красит шкалу в hit/miss ПРЯМО в момент клика/авто-таймаута и убирает её чуть
// погодя, а не тут же: раньше шкала пропадала сразу, и до самого прилёта ответа
// с сервера (autocraft-preview + /api/action + HIT_EFFECT_DELAY_MS, вместе
// иногда больше секунды) игрок не видел вообще никакого подтверждения, что
// клик засчитан - это и читалось как "залипание". Сама реальная атака (см.
// launchAttack) по-прежнему уходит на сервер независимо от этой анимации.
const QTE_RESULT_FLASH_MS = 220;
function resolveQte(qte, hit) {
  clearTimeout(qte.timeoutId);
  cancelAnimationFrame(qte.rafId);
  qte.track.classList.add(hit ? "qte-result-hit" : "qte-result-miss");
  setTimeout(() => {
    qte.track.remove();
    qte.btn.classList.remove("qte-active");
  }, QTE_RESULT_FLASH_MS);
}

// Запускает шкалу НА кнопке btn - зона случайной ширины QTE_ZONE_WIDTH в случайном
// месте на каждый запуск. finish(hit) вызывается ЛИБО по авто-таймауту (hit=false),
// ЛИБО вторым кликом по той же кнопке (см. makeAttackButton).
function startQte(key, btn, finish) {
  const zoneStart = Math.random() * (1 - QTE_ZONE_WIDTH);
  const track = el("div", { class: "qte-track" });
  track.appendChild(el("div", {
    class: "qte-zone",
    style: `left:${(zoneStart * 100).toFixed(1)}%; width:${(QTE_ZONE_WIDTH * 100).toFixed(1)}%`,
  }));
  const marker = el("div", { class: "qte-marker" });
  track.appendChild(marker);
  btn.appendChild(track);
  btn.classList.add("qte-active");
  const startedAt = performance.now();
  const timeoutId = setTimeout(() => finish(false), QTE_TIMEOUT_MS);
  let rafId;
  const tick = () => {
    const pos = qteMarkerPos(startedAt);
    // "- pos*ширина" - маркер не должен вылезать за правый край шкалы на pos=1,
    // та же поправка, что раньше была в конечном кадре CSS-keyframe
    // (calc(100% - Npx)), но теперь применена по всей длине.
    marker.style.left = `calc(${(pos * 100).toFixed(2)}% - ${(pos * QTE_MARKER_WIDTH_PX).toFixed(2)}px)`;
    rafId = requestAnimationFrame(tick);
  };
  tick(); // сразу выставить стартовую позицию, не ждать первого кадра rAF
  return { key, startedAt, zoneStart, timeoutId, rafId, track, btn, marker };
}

// Двигает и заливку (быстро), и "теневой след" (медленнее, см. .encounter-hp-ghost
// в CSS) полоски HP на одну и ту же итоговую ширину - оба elements получают ОДНО
// и то же значение синхронно, а разница в скорости появления - целиком заслуга
// CSS transition/transition-delay, JS-у сверх этого дёргать ничего не нужно.
function updateHpBar(fillId, ghostId, ratio) {
  const pct = `${Math.round(Math.max(0, Math.min(1, ratio)) * 100)}%`;
  const fill = document.getElementById(fillId);
  if (fill) fill.style.width = pct;
  const ghost = document.getElementById(ghostId);
  if (ghost) ghost.style.width = pct;
}

function playKillFlash() {
  const overlay = el("div", { class: "kill-flash-overlay" });
  document.body.appendChild(overlay);
  setTimeout(() => overlay.remove(), 500);
}

// Поражение игрока (0 HP - см. combat.defeated/attack_encounter) - тот же
// приём, что playKillFlash, красным вместо жёлтого.
function playDefeatFlash() {
  const overlay = el("div", { class: "defeat-flash-overlay" });
  document.body.appendChild(overlay);
  setTimeout(() => overlay.remove(), 700);
}

// Летящий урон/тряска портрета/вспышка на ваншот - играется на DOM ЕЩЁ ДО того,
// как doAction подменит VIEW (см. HIT_EFFECT_DELAY_MS выше). HP-полоска двигается
// напрямую (inline width), а не через полную перерисовку - иначе CSS-transition
// не от чего было бы интерполировать (свежий элемент сразу в конечной позиции).
// combat.player_damage_taken/player_hp/player_max_hp/defeated - см.
// game/engine.py:attack_encounter (ответка моба, есть на КАЖДОМ ответе, не
// только при поражении - 0, если удар был убивающим и ответки не было).
function playCombatHitEffect(combat) {
  const moveMode = pendingAttackMoveMode;
  pendingAttackMoveMode = "multiplier";
  const qteHit = pendingQteHit;
  pendingQteHit = false;
  if (combat.max_hp > 0) {
    updateHpBar("encounterHpFill", "encounterHpGhost", combat.remaining_hp / combat.max_hp);
  }
  const portrait = document.getElementById("encounterPortrait");
  if (portrait) {
    portrait.classList.remove("hit-shake");
    void portrait.offsetWidth; // reflow - иначе повторное .add() того же класса не перезапустит анимацию (и замах, и тряска/вспышка сидят на одном классе)
    portrait.classList.add("hit-shake");
    let dmgClass = "dmg-float";
    if (combat.instant_kill) dmgClass += " dmg-float-kill";
    else if (moveMode === "percent_max_hp" || moveMode === "percent_remaining_hp") dmgClass += " dmg-float-true";
    if (qteHit) dmgClass += " dmg-float-qte";
    const dmg = el("div", { class: dmgClass, text: `-${combat.damage}` });
    portrait.appendChild(dmg);
    setTimeout(() => dmg.remove(), 900);
  }
  if (combat.instant_kill) playKillFlash();

  if (combat.player_max_hp > 0) {
    updateHpBar("encounterPlayerHpFill", "encounterPlayerHpGhost", combat.player_hp / combat.player_max_hp);
  }
  const playerWrap = document.getElementById("encounterPlayerHpWrap");
  if (playerWrap && combat.player_damage_taken > 0) {
    playerWrap.classList.remove("hit-shake");
    void playerWrap.offsetWidth;
    playerWrap.classList.add("hit-shake");
    const dmg = el("div", { class: "dmg-float", text: `-${combat.player_damage_taken}` });
    playerWrap.appendChild(dmg);
    setTimeout(() => dmg.remove(), 900);
  }
  if (combat.defeated) playDefeatFlash();
}

// Кнопка одного варианта атаки - moveId=null - обычная атака (всегда доступна),
// иначе move - запись из VIEW.hunting.combat_moves (см. engine.combat_moves_view).
// Приёмы, у которых move.unlocked === false, сюда вообще не попадают - см.
// renderEncounterModalBody (по прямому пожеланию: "заблокированные" приёмы не
// должны быть видны вовсе, в отличие от "на кулдауне" - те видны, просто
// временно недоступны, с круговым таймером до готовности, см. ниже).
// Человекочитаемая формула урона приёма - см. game/engine.py:_move_damage (4
// независимых режима). Только для подсказки (title) - сам расчёт всегда на сервере.
function moveFormulaText(move) {
  if (move.mode === "percent_max_hp") return `${Math.round(move.percent * 100)}% от максимального HP цели`;
  if (move.mode === "percent_remaining_hp") return `${Math.round(move.percent * 100)}% от ТЕКУЩЕГО HP цели`;
  if (move.mode === "execute") {
    const fallback = move.damage_multiplier ? `×${move.damage_multiplier} обычного урона` : "как обычная атака";
    return `добивает цель, если её HP ≤ ${Math.round(move.execute_threshold_percent * 100)}% от максимума, иначе - ${fallback}`;
  }
  return `×${move.damage_multiplier ?? 1} к обычному урону`;
}

function makeAttackButton(label, moveId, move) {
  const { key, delay } = actionCooldownInfo("hunting", { kind: "attack", moveId });
  const btn = el("button", { class: "move-btn" + (moveId ? "" : " primary") });
  btn.appendChild(document.createTextNode(label));
  const onCooldown = move && move.cooldown_remaining > 0;
  if (move) {
    const base = `${move.description} Урон: ${moveFormulaText(move)}.`;
    btn.title = onCooldown ? `${base} (готов через ${move.cooldown_remaining} х.)` : base;
  }
  if (onCooldown) {
    btn.disabled = true;
    // Круговой "циферблат" вместо плоского числа в углу (см. .move-cd-pie в CSS) -
    // конус-градиент дозаполняется тут же, под конкретную долю оставшегося кулдауна
    // (cooldown_turns всегда > 0, раз есть move.cooldown_remaining > 0 вообще).
    const frac = Math.max(0, Math.min(1, move.cooldown_remaining / move.cooldown_turns));
    const deg = Math.round(frac * 360);
    const pie = el("div", {
      class: "move-cd-pie",
      style: `background: conic-gradient(var(--danger) ${deg}deg, rgba(255,255,255,.15) ${deg}deg)`,
      text: String(move.cooldown_remaining),
    });
    btn.appendChild(pie);
  } else {
    const remaining = cooldownRemainingMs(key);
    if (remaining > 0) applyCooldownVisual(btn, remaining, delay);
    // Отправляет реальный удар на сервер как раньше - hit решает только косметику
    // (см. .dmg-float-qte/pendingQteHit), сам урон не меняется вообще.
    const launchAttack = (hit) => {
      pendingAttackMoveMode = move ? move.mode : "multiplier";
      pendingQteHit = hit;
      tryRunAction(key, delay, btn, () => doAction("hunt_attack", moveId));
    };
    // Первый клик по кнопке ЗАПУСКАЕТ QTE (см. startQte), второй клик по НЕЙ ЖЕ -
    // считывает текущее положение маркера и наносит удар. Пока на этой кнопке QTE
    // идёт, клик по ЛЮБОЙ другой кнопке атаки игнорируется (activeQte один на всю
    // панель) - не даёт открыть вторую шкалу параллельно первой. Исход красится
    // (см. resolveQte) СРАЗУ на клике, ДО фактического ответа сервера - реальный
    // удар (launchAttack) всё равно уходит на сервер как обычно, это только визуал.
    btn.addEventListener("click", () => {
      if (activeQte && activeQte.key === key) {
        const qte = activeQte;
        const hit = isQteHit(qte);
        activeQte = null;
        resolveQte(qte, hit);
        launchAttack(hit);
        return;
      }
      if (activeQte || cooldownRemainingMs(key) > 0) return;
      activeQte = startQte(key, btn, (hit) => {
        const qte = activeQte;
        activeQte = null;
        resolveQte(qte, hit);
        launchAttack(hit);
      });
    });
  }
  return btn;
}

// "N приём"/"N приёма"/"N приёмов" - для подсказки про ещё не открытые приёмы
// (см. renderEncounterModalBody), бесповоротно завязана на конкретное слово,
// как и pluralItems ("пункт") - отдельная функция на каждое такое слово, не
// общий генератор, тот же приём, что уже есть в файле.
function pluralPriem(n) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return "приём";
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return "приёма";
  return "приёмов";
}

// Панель текущей схватки (ОДНА на всю игру, см. VIEW.hunting.active_encounter) -
// показывается только в локации, к которой относится сама цель (encounter.location),
// а не в любой локации с охотой сразу. Портрет (mobIcon) и HP-полоска несут
// фиксированные id (#encounterPortrait/#encounterHpFill) - на них целится
// playCombatHitEffect ДО перерисовки. "✕" (jobCancelButton) - abandonEncounter
// (без хода, как house/release особей). Кнопки атаки: обычная (всегда) + по одной
// на каждый УЖЕ ОТКРЫТЫЙ приём боя (VIEW.hunting.combat_moves отфильтрован по
// move.unlocked - см. makeAttackButton) - неоткрытые не рисуются вовсе, вместо
// них внизу тихая строка-подсказка с одним числом, сколько их ещё будет.
// Содержимое модалки "Охота" (см. openHuntingModal) - портрет/HP моба, таймер
// босса, HP-полоска ИГРОКА + бейдж "Ранен" (VIEW.hunting.player_hp/
// player_max_hp/wounded/wounded_turns_left, см. tools/web_ui.py:hunting_view),
// кнопки приёмов и "Отступить". Схватка ГЛОБАЛЬНА (не привязана к локации, см.
// CLAUDE.md) - в отличие от старого renderActiveEncounterBlock (жил ВНУТРИ
// панели конкретной локации), у этой версии нет параметра locationId вовсе.
function renderEncounterModalBody() {
  const encounter = VIEW.hunting.active_encounter;
  if (!encounter) return null;
  const box = el("div", { class: "creature-row encounter-box" });

  const portrait = el("div", { id: "encounterPortrait", class: "encounter-portrait" + (encounter.is_boss ? " is-boss" : "") });
  const iconDef = mobIcon(encounter.mob_id);
  if (iconDef) portrait.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 56));
  box.appendChild(portrait);

  const body = el("div", { class: "encounter-body" });
  const title = el("div", { class: "encounter-title" });
  title.appendChild(el("span", {
    text: `${encounter.is_boss ? "Босс" : "Цель"}: ${encounter.name} — ${encounter.remaining_hp}/${encounter.max_hp} HP`,
  }));
  if (encounter.turns_left !== null && encounter.turns_left !== undefined) {
    title.appendChild(el("span", {
      class: "encounter-timer" + (encounter.turns_left <= 3 ? " urgent" : ""),
      text: `⏱ ${encounter.turns_left} х.`,
      title: "Сбежит, если не убить за столько ходов",
    }));
  }
  body.appendChild(title);

  const ratio = Math.max(0, Math.min(1, encounter.remaining_hp / encounter.max_hp));
  const ratioPct = `${Math.round(ratio * 100)}%`;
  const bar = el("div", { class: "encounter-hp-bar" });
  // ghost и fill стартуют на ОДНОЙ и той же ширине - "теневой след" виден только
  // между самим ударом и следующей перерисовкой (см. .encounter-hp-ghost в CSS),
  // на свежепостроенной модалке предыдущего кадра ещё нет, показывать нечего.
  bar.appendChild(el("div", { id: "encounterHpGhost", class: "encounter-hp-ghost", style: `width:${ratioPct}` }));
  bar.appendChild(el("div", { id: "encounterHpFill", class: "encounter-hp-fill", style: `width:${ratioPct}` }));
  body.appendChild(bar);

  // HP игрока - отдельная полоска/id от моба выше (см. playCombatHitEffect),
  // зелёная (.player-hp-fill), чтобы "чьё" здоровье не путалось на глаз.
  const playerTitle = el("div", { class: "encounter-title" });
  playerTitle.appendChild(el("span", { text: `Твоё здоровье: ${VIEW.hunting.player_hp}/${VIEW.hunting.player_max_hp}` }));
  if (VIEW.hunting.wounded) {
    const dmgPercent = Math.round(VIEW.hunting.wounded_damage_multiplier * 100);
    playerTitle.appendChild(el("span", {
      class: "wounded-badge",
      text: `Ранен: ещё ${VIEW.hunting.wounded_turns_left} х.`,
      title: `Получено при поражении в предыдущем бою. Пока действует, весь урон, который наносите ВЫ, снижен до ${dmgPercent}% от обычного. Само пройдёт через ${VIEW.hunting.wounded_turns_left} х.; лечится реген HP (см. полоску выше) — но только вне боя, в бою HP не восстанавливается.`,
    }));
  }
  body.appendChild(playerTitle);
  const playerRatio = VIEW.hunting.player_max_hp > 0
    ? Math.max(0, Math.min(1, VIEW.hunting.player_hp / VIEW.hunting.player_max_hp)) : 0;
  const playerRatioPct = `${Math.round(playerRatio * 100)}%`;
  const playerWrap = el("div", { id: "encounterPlayerHpWrap", class: "player-hp-bar player-hp-wrap" });
  playerWrap.appendChild(el("div", { id: "encounterPlayerHpGhost", class: "player-hp-ghost", style: `width:${playerRatioPct}` }));
  playerWrap.appendChild(el("div", { id: "encounterPlayerHpFill", class: "player-hp-fill", style: `width:${playerRatioPct}` }));
  body.appendChild(playerWrap);

  const allMoves = VIEW.hunting.combat_moves || [];
  const unlockedMoves = allMoves.filter(m => m.unlocked);
  const lockedCount = allMoves.length - unlockedMoves.length;
  const moves = el("div", { class: "encounter-moves" });
  moves.appendChild(makeAttackButton("Атаковать", null));
  unlockedMoves.forEach(move => moves.appendChild(makeAttackButton(move.name, move.id, move)));
  body.appendChild(moves);
  if (lockedCount > 0) {
    body.appendChild(el("div", {
      class: "encounter-locked-hint",
      text: `Ещё ${lockedCount} ${pluralPriem(lockedCount)} откроется с более сильным оружием.`,
    }));
  }
  body.appendChild(el("button", { class: "danger", text: "Отступить", onclick: abandonEncounter }));

  box.appendChild(body);
  return box;
}

// Компактный баннер вместо старой инлайн-панели схватки внутри панели
// локации (renderActions) - схватка глобальна и переживает переход между
// локациями, баннер просто напоминает вернуться в бой (открывает модалку),
// если её закрыли, не отступив. Показывается ТОЛЬКО в самой локации-"Охоте",
// где идёт бой (encounter.location), как и раньше.
function renderEncounterBanner(locationId) {
  const encounter = VIEW.hunting.active_encounter;
  if (!encounter || encounter.location !== locationId) return null;
  const banner = el("div", { class: "encounter-banner", onclick: openHuntingModal });
  banner.appendChild(el("span", {
    text: `⚔ В бою: ${encounter.name} — ${encounter.remaining_hp}/${encounter.max_hp} HP`,
  }));
  banner.appendChild(el("span", { text: "Открыть →" }));
  return banner;
}

// Модалка "Охота" - см. renderEncounterModalBody. Ничего не строит и просто
// закрывается, если активной схватки уже нет (добита/отступили/сбежал босс) -
// тот же приём, что у остальных renderAll()-переоткрываемых модалок.
function openHuntingModal() {
  if (!VIEW.hunting.active_encounter) {
    closeHuntingModal();
    return;
  }
  closeHuntingModal();
  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeHuntingModal(); });

  const modal = el("div", { class: "modal hunting-modal" });
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("strong", { text: "Охота" }));
  head.appendChild(el("button", { text: "Закрыть", onclick: closeHuntingModal }));
  modal.appendChild(head);
  modal.appendChild(renderEncounterModalBody());

  overlay.appendChild(modal);
  overlay.id = "huntingOverlay";
  document.body.appendChild(overlay);
}

function closeHuntingModal() {
  const overlay = document.getElementById("huntingOverlay");
  if (overlay) overlay.remove();
}

async function cancelJob(kind, extra) {
  if (busy) return;
  busy = true;
  try {
    const res = await fetch("/api/cancel_job", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind, ...extra }),
    });
    const payload = await res.json();
    VIEW = payload.state;
    pushLog({ message: payload.message, ok: payload.ok, action_deltas: [], production_deltas: [], idle: [], broken: [] });
    renderAll();
  } finally {
    busy = false;
  }
}

function renderEnergy() {
  const e = VIEW.energy;
  const free = e.generation - e.consumption;
  document.getElementById("hudEnergy").textContent = e.capacity > 0 ? `${e.stock}/${e.capacity}` : e.stock;
  document.getElementById("energyStock").textContent = e.capacity > 0 ? `${e.stock}/${e.capacity}` : e.stock;
  const stockLbl = document.getElementById("energyStockLbl");
  stockLbl.textContent = e.capacity > 0 ? "Запас" : "Запас (без хранилищ)";
  stockLbl.title = e.capacity > 0 ? "" : "Без построек-хранилищ энергия не переносится на следующий ход";
  document.getElementById("energyGen").textContent = "+" + e.generation;
  document.getElementById("energyCons").textContent = "-" + e.consumption;
