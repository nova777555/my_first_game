  .ench-pool-row { display: flex; align-items: center; gap: 9px; padding: 7px 8px; background: rgba(255,255,255,.02); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .ench-pool-ic { width: 26px; height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
  .ench-pool-ic svg { width: 15px; height: 15px; }
  .ench-pool-name { font-size: 11.5px; font-weight: 600; flex: 1; min-width: 0; }
  .ench-pool-levels { display: flex; gap: 3px; flex-shrink: 0; }
  .ench-pool-lvl { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-family: Consolas, monospace; font-size: 9px; border: 1px solid var(--border); color: var(--muted); }
  .ench-pool-lvl.reached { border-color: var(--lvl-c); color: var(--lvl-c); background: color-mix(in srgb, var(--lvl-c) 14%, transparent); }
  .ench-pool-empty { font-size: 11.5px; color: var(--muted); }

  .toast-breed { background: linear-gradient(135deg, #1f3a24, #20242a); border: 1px solid var(--ok); }
  .toast-breed .title { color: var(--ok); font-weight: 700; font-size: 12px; }
  .toast-breed .desc { font-size: 11px; color: var(--text); }

  .stats-modal { max-width: 560px; }
  .stats-range-row { display: flex; gap: 8px; align-items: center; padding: 14px 16px 4px; flex-wrap: wrap; }
  .stats-range-row label { font-size: 12px; color: var(--muted); }
  .stats-range-row input[type=number] { width: 80px; }
  .stats-presets { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 12px; }
  .stats-presets button { font-size: 11px; padding: 4px 8px; }
  .stats-body { padding: 0 16px 16px; }
  .stats-section { margin-bottom: 14px; }
  .stats-section h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
  .stats-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 3px 0; }
  .stats-row .amount { margin-left: auto; }
  .stats-row .amount.pos { color: var(--ok); }
  .stats-row .amount.neg { color: var(--danger); }
  .stats-empty { color: var(--muted); font-size: 12px; padding: 8px 0; }

  .saves-modal { max-width: 520px; }
  .saves-new-row { display: flex; gap: 8px; padding: 16px 22px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .saves-new-row input[type=text] { flex: 1; }
  .saves-list { padding: 4px 22px 22px; }
  .save-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .save-item:last-child { border-bottom: none; }
  .save-item .info { flex: 1; min-width: 0; }
  .save-item .name { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
  .save-item .meta { font-size: 11px; color: var(--muted); }
  .saves-reset-row { padding: 14px 22px; border-top: 1px solid rgba(255,255,255,.08); }
  .saves-reset-row button { width: 100%; padding: 8px; }

  .tech-tab-placeholder { padding: 24px 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .tech-tab-summary { color: var(--muted); font-size: 13px; }
  .tech-tab-open-btn { padding: 10px 18px; font-size: 13px; }
  .tech-tab-research { width: 100%; text-align: left; }

  /* .tech-tree-wrap заполняет ВСЮ высоту модалки, оставшуюся под шапкой (модалка
     теперь фиксированного размера 700x820 - см. .modal.tech-modal выше, и
     никогда не "прыгает" от количества технологий/квестов внутри): граф -
     flex:1, растягивается на всё оставшееся место и сам скроллится/панорамится
     (см. .tech-graph), а компактная плашка деталей внизу (.tech-detail) -
     фиксированной высоты, как в канвасе. */
  .tech-tree-wrap { display: flex; flex-direction: column; gap: 16px; padding: 20px; flex: 1; min-height: 0; }
  /* Обёртка вкладок эры в модалке "Квесты" - тоже flex:1 (заполняет всё, что
     осталось под вкладками эр в фиксированной модалке 700x820), сама модалка
     никогда не меняет размер при переключении эры - см. CLAUDE.md. */
  .quest-era-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .tech-graph {
    /* overflow: hidden, не auto - панорамирование и зум теперь чистый CSS-transform
       (translate+scale) на .tech-cols, см. enableGraphPanning/enableGraphZoom, а не
       нативный скролл: у скролла есть жёсткая рамка [0, scrollWidth-clientWidth], и
       когда граф целиком помещается в модалку (частый случай для небольших квестовых
       эр), эта рамка нулевая - любая попытка алгоритма зума к курсору выставить
       scrollLeft тихо схлопывалась обратно в 0, и зум визуально цеплялся за
       transform-origin (левый верхний угол) вместо курсора. translate такого
       ограничения не имеет. */
    position: relative; flex: 1; min-height: 0; overflow: hidden;
    border: 1px solid rgba(255,255,255,.1); border-radius: 0; background: #0d1116; cursor: grab;
  }
  .tech-graph.panning { cursor: grabbing; }
  .tech-cols { display: flex; gap: 6px; padding: 18px; position: relative; z-index: 1; width: max-content; transform-origin: 0 0; }
  .tech-col-band { display: flex; flex-direction: column; border-radius: 10px; padding: 10px 8px; }
  .tech-col-title { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; text-align: center; margin-bottom: 10px; font-weight: 600; }
  .tech-col-row { display: flex; gap: 28px; flex: 1; }
  .tech-col { display: flex; flex-direction: column; gap: 14px; width: 160px; justify-content: center; }
  /* Узел-"чип" 1:1 из канваса (B_TechTree.dc.html): полноцветная плоская рамка +
     тонированный фон по статусу, вместо старой карточки с цветной полоской
     слева - тот же язык, что у .n-done/.n-avail/.n-locked в канвасе. */
  .tech-node {
    background: #14191f; border: 1px solid #2b333b; border-radius: 0; padding: 8px 10px;
    font-family: Consolas, "Courier New", monospace; font-size: 11px; color: #4d5762; cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .tech-node:hover { border-color: var(--blueprint); }
  .tech-node.selected { box-shadow: 0 0 0 1px var(--accent); border-color: var(--accent); }
  .tech-node.researched { background: rgba(95,208,232,.08); border-color: var(--blueprint); color: #a9e8f5; }
  .tech-node.available { background: rgba(240,160,48,.08); border-color: var(--accent); color: var(--accent); animation: node-flicker 6s infinite; }
  .tech-node.locked { opacity: 1; }
  /* Идёт исследование ИМЕННО этого узла (VIEW.active_research) - зелёный акцент
     поверх обычного .available, чтобы отличался от просто "доступна" на глаз. */
  .tech-node.researching { background: rgba(74,201,160,.12); border-color: #4ac9a0; color: #8ed6c2; animation: node-researching-pulse 1.6s infinite; }
  @keyframes node-researching-pulse {
    0%, 100% { box-shadow: 0 0 0 rgba(74,201,160,0); }
    50% { box-shadow: 0 0 8px rgba(74,201,160,.6); }
  }
  @keyframes node-flicker {
    0%, 92% { box-shadow: none; }
    93% { opacity: .5; box-shadow: none; }
    94% { opacity: 1; box-shadow: 0 0 10px rgba(240,160,48,.55); }
    95% { opacity: .65; box-shadow: none; }
    96%, 100% { opacity: 1; box-shadow: 0 0 10px rgba(240,160,48,.4); }
  }
  .lab-warn-line { color: var(--warn); font-size: 12px; margin: 4px 0 8px; }
  .tech-edges { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 0; }
  /* pathLength="1" (см. drawTechEdges/drawQuestEdges) нормализует длину кривой к
     0..1 - stroke-dasharray:1 значит "один сплошной штрих на всю длину", а
     анимация просто едет dashoffset 1 -> 0, т.е. "дочерчивает" ребро при
     каждой перерисовке графа (открытие модалки, исследование технологии). */
  .tech-edge {
    fill: none; stroke: var(--border); stroke-width: 1.5;
    stroke-dasharray: 1; stroke-dashoffset: 1; animation: tech-edge-draw .6s ease-out forwards;
  }
  .tech-edge.edge-done { stroke: var(--blueprint); }
  @keyframes tech-edge-draw { to { stroke-dashoffset: 0; } }

  /* Узел квестового графа (openQuestsModal/renderQuestGraph) - НАМЕРЕННО не
     .tech-node: отдельный класс, чтобы декоративная обводка не задела дерево
     технологий. Квадрат с большой пиксель-иконкой квеста (q.icon, своя
     картинка на каждый квест - рисуется/загружается в редакторе контента
     точно так же, как у ресурсов/построек/мобов, дефолт - questIcon()) в
     центре + значок-жетон статуса в углу (QUEST_STATUS_ICON) - имя квеста НЕ
     печатается прямо на узле,
     только во всплывающей подсказке при наведении (.quest-node-tip) и в
     постоянной панели деталей снизу (renderQuestDetail). Locked-квест
     рисуется на графе ВСЕГДА (не скрывается), просто приглушённым цветом и
     БЕЗ клика (см. renderQuestGraph - click-листенер вешается только на
     status !== "locked") - подсказка с именем при наведении при этом всё
     равно работает (осознанный "тизер" следующего квеста без подробностей).
     Статусная палитра НЕ повторяет --ok/--danger: claimed/completed
     тонируются голубым (--blueprint - "уже часть схемы"), available -
     янтарным (--accent - "требует действия"), а не зелёным. */
  .quest-node {
    position: relative;
    width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center;
    background: #14191f; border: 1px solid #2b333b; border-radius: 6px;
    font-family: Consolas, "Courier New", monospace; font-size: 11px; color: #4d5762;
    cursor: pointer;
    transition: border-color .12s ease, background .12s ease;
  }
  .quest-node.locked { cursor: default; }
  .quest-node:not(.locked):hover { border-color: var(--blueprint); }
  .quest-node.selected { box-shadow: 0 0 0 1px var(--accent); border-color: var(--accent); }
  .quest-node.locked { background: #14191f; border-color: #2b333b; color: #4d5762; }
  .quest-node.available { background: rgba(240,160,48,.08); border-color: var(--accent); color: var(--accent); animation: node-flicker 6s infinite; }
  .quest-node.completed { background: rgba(95,208,232,.05); border-color: rgba(95,208,232,.5); color: #7f97a1; }
  .quest-node.claimed { background: rgba(95,208,232,.1); border-color: var(--blueprint); color: #a9e8f5; }
  .quest-node-icon { display: flex; }
  .quest-node.locked .quest-node-icon { filter: grayscale(1) opacity(.5); }
  /* Подсказка с именем квеста при наведении - CUSTOM (не нативный title),
     ИМЕННО потому что цвет текста в ней настраивается ПЕР-КВЕСТОВО из
     редактора контента (quests.*.tooltip_color, см. content_editor.html:
     вкладка "Квесты" - тот же принцип, что q.icon/q.bg/q.border) - у
     нативного title цвет текста браузер не отдаёт на откуп странице. Цвет
     выставляется инлайн-стилем НА КОНКРЕТНОМ узле в buildQuestNode (нет
     override - остаётся дефолт из этого правила, QUEST_DEFAULT_TOOLTIP_COLOR).
     Шрифт НАМЕРЕННО не моноширинный (в отличие от самого узла/остального
     графа, см. CLAUDE.md "стиль чертежа") - подсказка читается на глаз бегло
     и мельком, засечки/моноширинность тут только мешают. */
  .quest-node-tip {
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: #10151bf0; border: 1px solid #2b333b; border-radius: 4px; padding: 5px 9px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px; font-weight: 600; line-height: 1.3; letter-spacing: .01em;
    white-space: nowrap; pointer-events: none; z-index: 20;
    display: none;
    color: #dbe7ec;
  }
  .quest-node:hover .quest-node-tip { display: block; }
  /* Колонки/ряд графа квестов ПЕРЕОПРЕДЕЛЯЮТ общую ширину .tech-col (160px в
     дереве технологий, рассчитана на текстовые карточки) под компактный
     квадрат 64x64 - без этого каждая колонка держала кучу пустого места
     справа от узла (см. комментарий у renderQuestGraph про убранную band). */
  .quest-graph .tech-col { width: 64px; }
  .quest-graph .tech-col-row { gap: 20px; }
  /* .tech-graph скроллится (overflow:auto) - подсказка (.quest-node-tip)
     всплывает НАД узлом абсолютным позиционированием и обрезается краем
     контейнера, если узел в самом верхнем ряду и обычного padding (18px, см.
     .tech-cols) не хватает под её высоту. Увеличенный верхний паддинг ТОЛЬКО
     для графа квестов даёт место под подсказку у любого узла, не трогая
     дерево технологий (там подсказок такого рода нет). */
  .quest-graph .tech-cols { padding-top: 44px; }
  .quest-node-badge {
    position: absolute; top: -7px; right: -7px; width: 19px; height: 19px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 10px; line-height: 1;
    background: #161d24; border: 1px solid #2b333b; color: inherit;
  }
  .quest-node.locked .quest-node-badge { border-color: #2b333b; color: #4d5762; }
  .quest-node.available .quest-node-badge { border-color: var(--accent); color: var(--accent); }
  .quest-node.completed .quest-node-badge { border-color: #7f97a1; color: #7f97a1; }
  .quest-node.claimed .quest-node-badge { border-color: var(--blueprint); color: var(--blueprint); }
  .quest-node.claimed .quest-node-badge::after {
    content: ""; position: absolute; inset: -1px; border-radius: 50%; border: 1px solid var(--blueprint);
    animation: claim-ping 3s ease-out infinite;
  }
  @keyframes claim-ping {
    0% { transform: scale(1); opacity: .8; }
    70%, 100% { transform: scale(2.4); opacity: 0; }
  }

  .quest-era-tabs button.active { color: var(--era-accent, var(--accent)); border-color: var(--era-accent, var(--accent-dim)); }
  /* Компактная плашка деталей - 1:1 из канваса (B_TechTree.dc.html/B_Quests.dc.html:
     .detail/.detail-name/.detail-cost/.btn): невысокий флекс-ряд (инфо-блок
     слева, кнопка справа), а НЕ карточка с заголовком/описанием/списком
     "открывает"/бейджем тира друг под другом, как было раньше - см. CLAUDE.md.
     У технологии полное описание/"открывает"/предупреждение про лабораторию -
     по-прежнему только title-подсказка на имени (иначе плашка растянулась бы
     на пол-экрана). У квеста описание, условие выполнения И награда
     (renderQuestDetail: quest.description/quest.conditions/reward_case) -
     ПОСТОЯННЫЙ текст в info-блоке (не только подсказка) - без этого при клике
     на квест было физически не понять, что делать и какая награда. "Нужно: .."
     и "Награда: .." дополнительно выделены цветом/жирным (.quest-detail-goal/
     .quest-detail-reward) поверх обычного тусклого .tech-detail-cost -
     прямая жалоба "текст снизу незаметен"; в подсказке у квеста остаётся
     только пояснение про требования из другой эры. */
  .tech-detail {
    flex-shrink: 0; background: transparent; border: 1px solid rgba(255,255,255,.1); border-radius: 0;
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .tech-detail-info { min-width: 0; }
  .tech-detail-name { font-family: Consolas, monospace; font-size: 13px; font-weight: 700; color: #dbe7ec; cursor: help; }
  .tech-detail-cost { font-size: 11px; color: #7f97a1; font-family: Consolas, monospace; margin-top: 4px; }
  .tech-detail-cost b { color: #dbe7ec; font-weight: 700; }
  .tech-detail-cost.warn { color: var(--warn); }
  /* "Что сделать"/"какая награда" у квеста (renderQuestDetail) - осознанно
     ярче и крупнее соседних tech-detail-cost строк (флейвор-описание/эра),
     это ответ на прямую жалобу "текст снизу незаметен, непонятно что делать".
     Амбер (--accent) для цели - тот же цвет, что у .quest-node.available
     ("требует действия"); циан (--blueprint) для награды - тот же цвет, что
     у .quest-node.claimed ("уже часть добычи"). */
  .quest-detail-goal {
    font-size: 12px; font-weight: 700; color: var(--accent); font-family: Consolas, monospace;
    margin-top: 6px;
  }
  .quest-detail-reward {
    font-size: 12px; font-weight: 700; color: var(--blueprint); font-family: Consolas, monospace;
    margin-top: 4px;
  }
  .tech-detail button {
    flex-shrink: 0; background: var(--accent); color: #10151b; border: 1px solid var(--accent);
    border-radius: 0; padding: 10px 16px; font-weight: 700; font-size: 12px;
    font-family: Consolas, monospace; letter-spacing: .5px;
    clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
    position: relative; overflow: hidden; transition: transform .08s ease, filter .08s ease;
  }
  .tech-detail button:active:not(:disabled) { transform: scale(0.97); filter: brightness(0.92); }
  .tech-detail button.on-cooldown { opacity: .6; cursor: not-allowed; pointer-events: none; }

  /* ---------- панель схватки (модалка "Охота" - renderEncounterModalBody) ---------- */
  .encounter-box { display: flex; gap: 12px; align-items: flex-start; }
  .encounter-portrait {
    position: relative; flex-shrink: 0; width: 72px; height: 72px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; overflow: visible;
  }
  .encounter-portrait.is-boss { border-color: var(--accent); box-shadow: 0 0 10px rgba(240,160,48,.25); }
  .encounter-portrait svg { width: 56px; height: 56px; image-rendering: pixelated; }
  .encounter-body { flex: 1; min-width: 0; }
  .encounter-title { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
  .encounter-timer { font-size: 11px; font-weight: 700; color: var(--muted); }
  .encounter-timer.urgent { color: var(--danger); animation: pulse 1s infinite; }
  .encounter-hp-bar {
    position: relative; height: 10px; border-radius: 5px; background: var(--panel2);
    border: 1px solid var(--border); overflow: hidden; margin: 6px 0 8px;
  }
  /* "Теневой след" полоски HP - лежит ПОД .encounter-hp-fill и той же ширины,
     но перезжает на новое значение медленнее (transition-delay + более долгая
     длительность) - на время, пока .encounter-hp-fill уже прыгнул на новую
     (меньшую) ширину, ghost ещё чуть-чуть виден правее её края и даёт
     привычное по другим играм "полоска только что просела" ощущение. Ставится
     на равную ширину при каждой перерисовке модалки (holo-эффекта без
     предыдущего кадра не бывает), поэтому виден только в окне
     HIT_EFFECT_DELAY_MS между самим ударом и перерисовкой (см. playCombatHitEffect). */
  .encounter-hp-ghost, .player-hp-ghost {
    position: absolute; top: 0; left: 0; height: 100%; background: rgba(255,255,255,.55);
    transition: width .35s ease-out .05s;
  }
  .encounter-hp-fill {
    position: absolute; top: 0; left: 0; height: 100%;
    background: linear-gradient(90deg, var(--accent-dim, var(--accent)), var(--accent));
    transition: width .15s ease-out;
  }
  .encounter-moves { display: flex; gap: 6px; flex-wrap: wrap; }
  /* Подсказка про ещё не открытые приёмы (см. makeAttackButton/renderEncounterModalBody) -
     сами кнопки таких приёмов теперь вообще не рисуются (по прямому пожеланию:
     "заблокированные, а не перезаряжающиеся" не должны быть видны), но полностью
     скрывать сам факт существования прокачки оружия не хочется - одна тихая строка
     вместо ряда серых нерабочих кнопок. */
  .encounter-locked-hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
  /* HP-полоска ИГРОКА внутри модалки "Охота" (см. openHuntingModal) - отдельные
     классы от .encounter-hp-bar/.encounter-hp-fill (те красятся акцентным
     цветом моба), чтобы "чьё" здоровье не путалось на глаз: игрок - зелёный
     (--ok), моб - оранжевый акцент, как и раньше. */
  .player-hp-bar {
    position: relative; height: 10px; border-radius: 5px; background: var(--panel2);
    border: 1px solid var(--border); overflow: hidden; margin: 6px 0 8px;
  }
  .player-hp-fill {
    position: absolute; top: 0; left: 0; height: 100%; background: var(--ok);
    transition: width .15s ease-out;
  }
  .wounded-badge {
    font-size: 11px; font-weight: 700; color: var(--danger); cursor: help;
    border: 1px solid var(--danger); border-radius: 6px; padding: 2px 8px;
  }
  /* Портрет игрока трясётся/подсвечивается той же анимацией, что портрет моба
     (.encounter-portrait.hit-shake), см. playCombatHitEffect. */
  .player-hp-wrap.hit-shake { animation: hit-shake .35s ease-in-out; }
  /* Компактный баннер "В бою: <моб>" в панели локации (заменяет старую инлайн-
     панель схватки - см. renderActions) - открывает модалку "Охота" по клику,
     сама схватка глобальна на всю игру (не привязана к текущей локации), так
     что баннер просто напоминает вернуться в бой, если модалку закрыли не
     отступив. */
  .encounter-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; margin-bottom: 12px; border-radius: 8px;
    background: rgba(224,82,74,.1); border: 1px solid rgba(224,82,74,.35);
    cursor: pointer; font-size: 13px;
  }
  .encounter-banner:hover { background: rgba(224,82,74,.16); }
  .move-btn {
    position: relative; overflow: hidden; font-size: 13px; padding: 12px 16px;
    min-width: 96px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel2);
    color: var(--text); cursor: pointer; transition: transform .08s ease, filter .08s ease;
  }
  .move-btn:active:not(:disabled) { transform: scale(0.96); }
  .move-btn.primary { background: var(--accent); color: #241a08; border-color: var(--accent); font-weight: 600; }
  .move-btn:disabled { opacity: .5; cursor: not-allowed; }
  /* Мини-"циферблат" кулдауна приёма (см. makeAttackButton) - конус-градиент
     дозаполняется JS-ом инлайновым style под конкретную дробь остатка, тут
     только форма/позиция кружка. Сидит В УГЛУ кнопки, а не поверх всей неё -
     чтобы название приёма под ним оставалось читаемым, не как плоский серый
     disabled-фон раньше. */
  .move-btn .move-cd-pie {
    position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.7);
    box-shadow: 0 0 0 1px rgba(0,0,0,.45) inset;
  }
  /* QTE тайминга удара (см. startQte/makeAttackButton в JS) - ЧИСТО клиентская
     шкала поверх самой кнопки атаки, сервер про неё ничего не знает и урон
     считает как всегда (см. game/engine.py:attack_encounter). Первый клик по
     кнопке запускает бегущий маркер, второй - считывает его позицию: попадание
     в зелёную зону не меняет реальный урон, только косметику самого удара
     (см. .dmg-float-qte ниже) - честная механика без обмана в цифрах.
     Занимает своё место снизу кнопки (.qte-active добавляет отступ), а не
     перекрывает текст названия приёма. Отступ/высота шкалы увеличены по
     прямому пожеланию, 2026-09-14: сама кнопка + курсор мыши почти полностью
     закрывали крошечную 5px-полоску, из-за чего казалось, что клик "не туда"
     попадает - у более рослой кнопки полоска остаётся видна НИЖЕ курсора,
     который обычно стоит на тексте приёма ближе к верху кнопки. */
  .move-btn.qte-active { padding-bottom: 28px; }
  .qte-track {
    position: absolute; left: 6px; right: 6px; bottom: 8px; height: 10px;
    background: rgba(0,0,0,.4); border-radius: 5px; overflow: visible;
  }
  .qte-zone { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: rgba(120,224,120,.65); }
  .qte-marker {
    position: absolute; top: -3px; bottom: -3px; width: 6px; border-radius: 3px;
    background: #fff; box-shadow: 0 0 6px rgba(255,255,255,.9); left: 0%;
  }
  /* Мгновенная (без ожидания сервера) покраска исхода - см. resolveQte() в JS. */
  .qte-track.qte-result-hit .qte-marker { background: #7be07b; box-shadow: 0 0 8px rgba(123,224,123,.9); }
  .qte-track.qte-result-hit .qte-zone { background: rgba(123,224,123,.9); }
  .qte-track.qte-result-miss .qte-marker { background: #e0524a; box-shadow: 0 0 8px rgba(224,82,74,.9); }
  /* Косметический бонус попадания в QTE-зону - звёздочка перед числом урона и
     мягкое свечение, накладывается ПОВЕРХ обычной/kill/true-раскраски (см.
     dmgClass в playCombatHitEffect), а не заменяет её. */
  .dmg-float-qte { text-shadow: 0 0 7px rgba(255,255,255,.85), 0 1px 2px rgba(0,0,0,.6); }
  .dmg-float-qte::before { content: "✦ "; }

  @keyframes hit-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-3px) rotate(-2deg); }
    40% { transform: translateX(3px) rotate(2deg); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }
  .encounter-portrait.hit-shake { animation: hit-shake .35s ease-in-out; }
  .encounter-portrait.hit-shake::after {
    content: ""; position: absolute; inset: 0; border-radius: 8px;
    background: rgba(224,82,74,.35); animation: flash-highlight .35s ease-out;
  }
  /* "Замах" - диагональная светлая полоса, пролетающая через портрет моба в
     момент удара (::before, независим от ::after выше - оба живут на одном
     .hit-shake, просто разные псевдоэлементы). Чисто декоративный слой поверх
     существующей тряски/вспышки, без новых иконок оружия. */
  @keyframes weapon-slash {
    0% { transform: translateX(-70%) rotate(-18deg); opacity: 0; }
    35% { opacity: 1; }
    100% { transform: translateX(70%) rotate(-18deg); opacity: 0; }
  }
  .encounter-portrait.hit-shake::before {
    content: ""; position: absolute; inset: -6px; border-radius: 8px; pointer-events: none;
    background: linear-gradient(100deg, transparent 42%, rgba(255,255,255,.9) 49%, rgba(255,255,255,.9) 53%, transparent 60%);
    animation: weapon-slash .3s ease-out;
  }

  @keyframes dmg-float {
    0% { transform: translate(-50%, 0); opacity: 1; }
    100% { transform: translate(-50%, -32px); opacity: 0; }
  }
  .dmg-float {
    position: absolute; left: 50%; top: -4px; transform: translate(-50%, 0);
    font-weight: 700; font-size: 15px; color: var(--danger);
    text-shadow: 0 1px 2px rgba(0,0,0,.6); animation: dmg-float .8s ease-out forwards;
    pointer-events: none; white-space: nowrap;
  }
  /* Цвет цифры урона зависит от того, ЧЕМ был нанесён удар (см. pendingAttackMoveMode/
     playCombatHitEffect) - золото на добивающем/ваншотном ударе (совпадает с
     playKillFlash), фиолетовый на "истинном" уроне (percent_max_hp/percent_remaining_hp,
     он не зависит от навыка/оружия) - обычный урон остаётся как раньше, красным. */
  .dmg-float-kill { color: #ffd76a; font-size: 19px; }
  .dmg-float-true { color: #c58cff; }

  @keyframes kill-flash-fade {
    0% { opacity: .85; }
    100% { opacity: 0; }
  }
  .kill-flash-overlay {
    position: fixed; inset: 0; z-index: 9999; pointer-events: none;
    background: radial-gradient(circle, rgba(255,225,140,.9), rgba(255,225,140,0) 70%);
    animation: kill-flash-fade .5s ease-out forwards;
  }
  /* Поражение игрока (0 HP - см. playDefeatFlash/combat.defeated) - тот же
     приём, что kill-flash-overlay, но красным и чуть дольше, чтобы читалось
     как "плохое", а не как ещё одна победная вспышка. */
  .defeat-flash-overlay {
    position: fixed; inset: 0; z-index: 9999; pointer-events: none;
    background: radial-gradient(circle, rgba(224,82,74,.8), rgba(224,82,74,0) 70%);
    animation: kill-flash-fade .7s ease-out forwards;
  }
</style>
</head>

<script>
// ---------- базовые хелперы ----------

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined) continue;
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) node.appendChild(c);
  return node;
}

const SVG_NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs = {}) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}

// Скользящее голубое подчёркивание активной вкладки под .tabs (см. .tab-underline
// в CSS) - общий хелпер для openPrioritiesModal/openQuestsModal, чтобы не дублировать
// позиционирование в каждом месте, где есть вкладки. Создаёт/переиспользует один
// .tab-underline внутри tabsEl и подгоняет left/width под offsetLeft/offsetWidth
// activeBtn - тот же приём, что macOS/браузерные табы, только на чистом JS/CSS
// (без анимационного фреймворка). Вызывать после того, как activeBtn уже в DOM.
function positionTabUnderline(tabsEl, activeBtn) {
  let underline = tabsEl.querySelector(".tab-underline");
  if (!underline) {
    underline = el("div", { class: "tab-underline" });
    tabsEl.appendChild(underline);
  }
  if (!activeBtn) { underline.classList.remove("visible"); return; }
  underline.style.left = `${activeBtn.offsetLeft}px`;
  underline.style.width = `${activeBtn.offsetWidth}px`;
  underline.classList.add("visible");
}

// Угловые скобки "Чертёж" (см. .bracket в CSS) - 4 настоящих div'а, вставляются
// автоматически в ЛЮБУЮ .modal через MutationObserver на document.body, а не
// руками в каждой из ~19 функций open*Modal(). Настоящие div'ы (не CSS-трюк на
// фоновых градиентах) нужны, чтобы скобки были пиксель-в-пиксель как в канвасе
// (design-канвас, вариант B) - см. CLAUDE.md.
function ensureModalBrackets(modal) {
  if (modal.querySelector(":scope > .bracket")) return;
  ["tl", "tr", "bl", "br"].forEach(pos => {
    modal.insertBefore(el("div", { class: `bracket ${pos}` }), modal.firstChild);
  });
}
new MutationObserver(mutations => {
  for (const m of mutations) {
    for (const node of m.addedNodes) {
      if (!(node instanceof HTMLElement)) continue;
      const modal = node.classList.contains("modal-overlay") ? node.querySelector(".modal") : null;
      if (modal) ensureModalBrackets(modal);
    }
  }
}).observe(document.body, { childList: true });

function pixelIcon(grid, palette, size = 32) {
  const rows = grid.length, cols = grid[0].length;
  const svg = svgEl("svg", { viewBox: `0 0 ${cols} ${rows}`, width: size, height: size });
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const ch = grid[y][x];
      if (ch === ".") continue;
      svg.appendChild(svgEl("rect", { x, y, width: 1, height: 1, fill: palette[ch] }));
    }
  }
  return svg;
}

  // Generic-заглушка для enchantments.*.icon без своей кастомной иконки - тот

  enchant: { grid: [
    "....A....", "....A....", "...AAA...", "..AAAAA..",
    "AAAAAAAAA", "..AAAAA..", "...AAA...", "....A....", "....A....",
  ], palette: { A: "#f0a030" } },
};

// Раскраска по тиру для ЛЮБОГО инструмента без своей кастомной иконки - раньше была
// только про кирку (отсюда прогрессия "дерево -> камень -> металл -> сталь -> золото"),
// теперь общий, зациклённый (% TOOL_PALETTES.length) фоллбэк на любое число тиров.
const TOOL_PALETTES = [
  { A: "#6b4423", B: "#8a5a34" },
  { A: "#6b4423", B: "#8b8f94" },
  { A: "#6b4423", B: "#c7ccd1" },
  { A: "#3a3f52", B: "#5b7fb5" },
  { A: "#4a3f1a", B: "#f0a030" },
];

const BUILDING_PALETTE = {
  ok: { A: "#3f7a52", B: "#1c2b21" },
  partial: { A: "#b98a2e", B: "#2b2416" },
  broken: { A: "#8a3530", B: "#2b1816" },
};

// Пользовательская иконка (если нарисована в редакторе контента) всегда в приоритете
// над встроенной. resourceIcon/buildingIcon возвращают null, если кастомной нет -
// вызывающий код сам решает про откат (для построек это ещё и буква поверх иконки).
function resourceIcon(rid) {
  return (VIEW.icons.resources && VIEW.icons.resources[rid]) || ICONS[rid] || null;
}
// Иконка ЖИЛЫ на поле шахты (mining_info.*.icon) - независима от иконки самого
// добытого ресурса, по прямому пожеланию, 2026-09-16. Без своей иконки жила
// откатывается на resourceIcon(rid) - см. content_editor.html: renderMining().
function veinIcon(rid) {
  return (VIEW.icons.mining_veins && VIEW.icons.mining_veins[rid]) || resourceIcon(rid);
}
function buildingIcon(bid) {
  return (VIEW.icons.buildings && VIEW.icons.buildings[bid]) || null;
}
function mobIcon(mid) {
  return (VIEW.icons.mobs && VIEW.icons.mobs[mid]) || ICONS.monster;
}
function enchantIcon(eid) {
  return (VIEW.icons.enchantments && VIEW.icons.enchantments[eid]) || ICONS.enchant;
}
// Квест несёт свою иконку ПРЯМО в объекте (q.icon, см. quests_view в
// web_ui.py), не через отдельный lookup-словарь VIEW.icons.* - каждый квест
// и так приходит своим полным объектом (в отличие от мобов, которых игра
// встречает по id независимо от контента).
function questIcon(q) {
  return q.icon || ICONS.quest;
}
// toolId="pickaxe" рисуется формой кирки (встроенная иконка ICONS.pickaxe) -
// остальные инструменты без своей нарисованной иконки берут нейтральную форму
// ICONS.machine, чтобы не выглядеть как кирка, которой они не являются.
function toolIcon(toolId, tier) {
  const custom = VIEW.icons.tools && VIEW.icons.tools[toolId] && VIEW.icons.tools[toolId][tier];
  if (custom) return custom;
  const baseGrid = (toolId === "pickaxe" ? ICONS.pickaxe : ICONS.machine).grid;
  const palette = TOOL_PALETTES[(tier - 1) % TOOL_PALETTES.length] || TOOL_PALETTES[0];
  return { grid: baseGrid, palette };
}

// ---------- подтверждение автокрафта ----------
// Перед запуском ЛЮБОГО действия (см. doAction) спрашиваем сервер, придётся ли
// ради него докрафтить что-то по цепочке рецептов - если да, показываем
// игроку, сколько и чего реально спишется (включая промежуточные ресурсы, не
// только верхнюю цену), и ждём подтверждения, прежде чем выполнять действие
// на самом деле. См. CLAUDE.md, "Подтверждение автокрафта".

// Зелёный (--ok) -> жёлтый (--warn) -> красный (--danger) по доле запаса,
// которую съедает операция (0 - остаётся много, 1 - тратится всё). Три же
// цвета, что в CSS-переменных темы - не вводим новых, чисто интерполяция.
function autocraftPercentColor(percent) {
  const stops = [[0, [0x4a, 0xc9, 0xa0]], [0.5, [0xf0, 0xc0, 0x30]], [1, [0xe0, 0x52, 0x4a]]];
  const p = Math.max(0, Math.min(1, percent));
  let seg = stops[0];
  let next = stops[1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (p >= stops[i][0] && p <= stops[i + 1][0]) { seg = stops[i]; next = stops[i + 1]; break; }
  }
  const t = next[0] === seg[0] ? 0 : (p - seg[0]) / (next[0] - seg[0]);
  const mix = (a, b) => Math.round(a + (b - a) * t);
  const [r, g, b] = [mix(seg[1][0], next[1][0]), mix(seg[1][1], next[1][1]), mix(seg[1][2], next[1][2])];
  return `rgb(${r}, ${g}, ${b})`;
}

function autocraftAmountText(row) {
  // Сводка (row.stock) и узел дерева (row.stock_before) называют запас
  // по-разному - здесь неважно, откуда конкретно пришло значение.
  const stock = row.stock !== undefined ? row.stock : row.stock_before;
  const docraft = row.needed - row.taken;
  if (docraft <= 0) return `спишется ${row.taken} из ${stock}`;
  if (row.taken <= 0) return `докрафтится ${docraft}`;
  return `спишется ${row.taken} из ${stock}, докрафтится ещё ${docraft}`;
}

function autocraftSummaryRow(row) {
  const line = el("div", { class: "autocraft-confirm-row" });
  const iconDef = resourceIcon(row.resource_id);
  if (iconDef) line.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 22));
  const info = el("div", { class: "info" });
  info.appendChild(el("div", { class: "name", text: row.name }));
  info.appendChild(el("div", { class: "detail", text: autocraftAmountText(row) }));
  // row.turns - оценка engine.autocraft_eta_turns: не влезает в один ход при
  // текущей скорости автокрафта - явно предупреждаем игрока ДО подтверждения,
  // а не только постфактум по прогресс-бару в панели "Автокрафт".
  if (row.turns) {
    info.appendChild(el("div", { class: "detail turns-note", text: `предполагаемое время крафта - ~${row.turns} ход(ов)` }));
  }
  line.appendChild(info);
  const badge = el("div", { class: "autocraft-confirm-badge" });
  if (row.percent === null) {
    badge.classList.add("neutral");
    badge.textContent = "нет запаса";
  } else {
    badge.style.background = autocraftPercentColor(row.percent);
    badge.textContent = `${Math.round(row.percent * 100)}%`;
    badge.title = "Какую долю текущего запаса этого ресурса съедает вся операция";
  }
  line.appendChild(badge);
  return line;
}

// Один узел дерева рецепта - рекурсивно рисует children внутри направляющей
// линии (.autocraft-tree-children, border-left в CSS). "fires" (сколько раз
// прокрутится рецепт) - самое важное число здесь: по нему видно, какой шаг
// цепочки стоит ускорить улучшением механизма, чтобы сократить число операций.
function autocraftTreeNode(node) {
  const wrap = el("div", { class: "autocraft-tree-node" });
  const head = el("div", { class: "autocraft-tree-head" + (node.fires > 0 ? " drafted" : "") });
  const iconDef = resourceIcon(node.resource_id);
  if (iconDef) head.appendChild(pixelIcon(iconDef.grid, iconDef.palette, 16));
  head.appendChild(el("span", { class: "name", text: node.name }));
  head.appendChild(el("span", { class: "detail", text: `нужно ${node.needed} (${autocraftAmountText(node)})` }));
  if (node.action_id) {
    head.appendChild(el("span", { class: "fires-badge", text: `${node.action_name} ×${node.fires}` }));
  }
  if (node.turns) {
    head.appendChild(el("span", { class: "turns-badge", text: `~${node.turns} ход(ов)` }));
  }
  wrap.appendChild(head);
  if (node.children.length) {
    const childrenBox = el("div", { class: "autocraft-tree-children" });
    node.children.forEach(c => childrenBox.appendChild(autocraftTreeNode(c)));
    wrap.appendChild(childrenBox);
  }
  return wrap;
}

function closeAutocraftConfirmModal() {
  const overlay = document.getElementById("autocraftConfirmOverlay");
  if (overlay) overlay.remove();
}

// Возвращает Promise<boolean> - true, если игрок подтвердил запуск, false при
// отмене (крестик/клик по фону/кнопка "Отмена"). doAction ждёт этот ответ,
// прежде чем реально отправлять /api/action.
function openAutocraftConfirmModal(preview) {
  return new Promise((resolve) => {
    closeAutocraftConfirmModal();
    let showingTree = false;

    const overlay = el("div", { class: "modal-overlay" });
    const modal = el("div", { class: "modal autocraft-confirm-modal" });
    const head = el("div", { class: "modal-head" });
    const title = preview.label ? `Подтверждение автокрафта: ${preview.label}` : "Подтверждение автокрафта";
    head.appendChild(el("strong", { text: title }));
    modal.appendChild(head);

    const body = el("div");
    modal.appendChild(body);

    const treeToggleBtn = el("button", { class: "small" });
    const cancelBtn = el("button", { text: "Отмена" });
    const confirmBtn = el("button", { class: "primary", text: "Запустить" });
    const footer = el("div", { class: "autocraft-confirm-footer" }, [
      treeToggleBtn, el("div", { class: "spacer" }), cancelBtn, confirmBtn,
    ]);
    modal.appendChild(footer);

    function renderBody() {
      body.innerHTML = "";
      if (!showingTree) {
        const list = el("div", { class: "autocraft-confirm-list" });
        preview.summary.forEach(row => list.appendChild(autocraftSummaryRow(row)));
        body.appendChild(list);
      } else {
        const box = el("div", { class: "autocraft-tree-box" });
        preview.tree.forEach(node => box.appendChild(autocraftTreeNode(node)));
        body.appendChild(box);
      }
      treeToggleBtn.textContent = showingTree ? "← Назад к сводке" : "Показать дерево рецепта";
    }
    treeToggleBtn.addEventListener("click", () => { showingTree = !showingTree; renderBody(); });
    renderBody();

    function finish(result) {
      overlay.remove();
      resolve(result);
    }
    cancelBtn.addEventListener("click", () => finish(false));
    confirmBtn.addEventListener("click", () => finish(true));
    overlay.addEventListener("click", (e) => { if (e.target === overlay) finish(false); });

    overlay.appendChild(modal);
    overlay.id = "autocraftConfirmOverlay";
    document.body.appendChild(overlay);
  });
}

// Узнаёт у сервера, придётся ли ради этого действия докрафтить что-то по цепочке
// рецептов (см. game/engine.py:autocraft_preview) - ЧИСТО read-only запрос,
// ничего не меняет в состоянии игры. При любой сетевой ошибке считаем, что
// подтверждение не нужно (не блокируем игрока из-за упавшего вспомогательного
// запроса) - обычный POST /api/action ниже всё равно сработает как должен.
async function fetchAutocraftPreview(type, id, scale) {
  try {
    const body = { type, id };
    if (scale !== undefined) body.scale = scale;
    const res = await fetch("/api/autocraft_preview", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

async function doAction(type, id, scale) {
  if (busy) return;
  busy = true;
  try {
    const preview = await fetchAutocraftPreview(type, id, scale);
    if (preview && preview.needs_confirm) {
      const confirmed = await openAutocraftConfirmModal(preview);
      if (!confirmed) return;
    }
    const body = { type, id };
    // scale - "Ползунок масштаба ручного действия" (см. CLAUDE.md) - только для
    // type === "manual", когда игрок сдвинул ползунок; для всех остальных
    // вызовов doAction() параметр просто не передаётся (undefined), и это поле
    // в теле запроса не появляется вовсе - сервер трактует его отсутствие как
    // "по умолчанию" (do_manual_action(scale=None) = купленный максимум, как раньше).
    if (scale !== undefined) body.scale = scale;
    const res = await fetch("/api/action", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const payload = await res.json();
    if (!res.ok) {
      const message = payload.error || "Ошибка запроса.";
      pushLog({ message, ok: false, action_deltas: [], production_deltas: [], idle: [], broken: [] });
      if (isModalOpen()) showErrorToast(message);
      return;
    }
    // Эффект удара (летящий урон/тряска портрета/вспышка на ваншот) играется на
    // ЕЩЁ СТАРОМ DOM - панель схватки ниже покажет либо новый HP, либо вовсе
    // исчезнет (цель убита), так что без задержки анимация обрывалась бы на
    // середине или не успевала начаться вовсе (см. playCombatHitEffect).
    if (type === "hunt_attack" && payload.log.combat) {
      playCombatHitEffect(payload.log.combat);
      await sleep(HIT_EFFECT_DELAY_MS);
    }
    VIEW = payload.state;
    pushLog(payload.log);
    // Звук провала - только внутри showErrorToast (см. её определение), той же
    // причиной, что и правило показа тоста ниже. Скрещивание озвучивает себя само
    // (showBreedToast, мутация/обычный исход) - здесь его исключаем, чтобы не
    // наложить поверх ещё и обычный "успех". Поломка (log.broken) заметнее и
    // важнее обычного "успеха" за тот же ход - играем её вместо, не вместе.
    if (payload.log.ok && type !== "breed") {
      if (payload.log.broken && payload.log.broken.length) playSound("breakdown");
      else if (payload.log.sound_url) playCustomSound(payload.log.sound_url);
      else playSound("success");
    }
    // Тост нужен ТОЛЬКО когда поверх игры открыта модалка - тогда журнал
    // (левая колонка дашборда) физически не виден, и без тоста провал действия
    // прошёл бы мимо игрока молча. Если модалок нет, журнал и так на виду
    // (см. #logList/#logToggleBtn) - тост поверх геймплея тогда лишний, только
    // закрывает вид собой (по прямому пожеланию, было наоборот - показывался
    // всегда).
    if (!payload.log.ok && isModalOpen()) showErrorToast(payload.log.message);
    // Скрещивание - ВСЕГДА из модалки "Фермы" (нет других мест, откуда его можно
    // запустить), так что без отдельного тоста результат (родился ли новый вид
    // мутацией или чистый вид родителя) прошёл бы мимо так же, как и провал выше -
    // см. game/engine.py:breed_creatures про формулировку message. "Мутация!" в
    // начале строки - тот же текст, что заголовок сообщения от сервера, не
    // отдельный флаг в протоколе (сообщение и так должно быть человекочитаемым).
    if (type === "breed" && payload.log.ok) showBreedToast(payload.log.message, payload.log.message.startsWith("Мутация!"));
    renderAll();
  } finally {
    busy = false;
  }
}

// ---------- защита от автокликера: небольшая задержка после клика ----------
// Кулдаун - ОДНА пара {key, until}, а не карта по всем действиям сразу: клик по
// любому ДРУГОМУ действию просто заменяет её, а не блокируется первым - значит
// не нужно хранить задержки прошлых кликов в памяти, храним только последнюю
// (см. CLAUDE.md). Уже показанная на кнопке анимация при этом не обрывается -
// у неё свой собственный setTimeout, не зависящий от этой переменной, а вот при
// следующей перерисовке (renderActions() перестраивает кнопки с нуля) кнопка,
// чей ключ здесь уже не значится текущим, просто перестаёт считаться остывающей.
// Чисто клиентский эффект (не бережёт от чего-то серьёзнее браузерного автокликера -
// это idle-игра для одного игрока, а не что-то с недоверенным клиентом) - ничего
// не пишется в save.json и не переживает перезагрузку страницы.
const SKIP_TURN_DELAY_MS = 1000;
let actionCooldown = null; // { key, until } | null

function cooldownRemainingMs(key) {
  if (!actionCooldown || actionCooldown.key !== key) return 0;
  return Math.max(0, actionCooldown.until - Date.now());
}

function applyCooldownVisual(btn, remainingMs, totalMs) {
  btn.disabled = true;
  btn.classList.add("on-cooldown");
  const fill = el("div", { class: "cooldown-fill" });
  fill.style.transitionDuration = "0ms";
  fill.style.transform = `scaleX(${Math.max(0, Math.min(1, remainingMs / totalMs))})`;
  btn.appendChild(fill);
  requestAnimationFrame(() => {
    fill.style.transitionDuration = `${remainingMs}ms`;
    fill.style.transform = "scaleX(0)";
  });
  setTimeout(() => {
    btn.disabled = false;
    btn.classList.remove("on-cooldown");
    fill.remove();
  }, remainingMs);
}

// Выполняет действие, только если эта же кнопка (по key) сейчас не остывает -
// повторный клик по НЕЙ ЖЕ игнорируется до истечения delayMs, а клик по любой
// другой кнопке проходит сразу же и переустанавливает актуальный кулдаун на неё.
function tryRunAction(key, delayMs, btn, fn) {
  if (cooldownRemainingMs(key) > 0) return;
  actionCooldown = { key, until: Date.now() + delayMs };
  applyCooldownVisual(btn, delayMs, delayMs);
  fn();
}

// Ключ и задержка для конкретного действия: постройки/крафт/добыча могут задавать
// свой click_delay_ms в content.json (редактор контента, вкладка соответствующей
// сущности), иначе используется общий VIEW.default_action_delay_ms.
function actionCooldownInfo(kind, item) {
  const dflt = VIEW.default_action_delay_ms;
  if (kind === "manual") return { key: `manual:${item.id}`, delay: item.click_delay_ms ?? dflt };
  if (kind === "build") return { key: `build:${item.id}`, delay: item.click_delay_ms ?? dflt };
  if (kind === "repair") return { key: `repair:${item.id}`, delay: item.repair_click_delay_ms ?? dflt };
  if (kind === "hunting") {
    if (item.kind === "search") return { key: `hunt_search:${item.location}`, delay: dflt };
    // move_id=null (обычная атака без приёма) и move_id="heavy_strike" и т.п. -
    // РАЗНЫЕ ключи анти-автокликерного кулдауна (см. tryRunAction), иначе клик по
    // одной кнопке приёма гасил бы визуально и остальные кнопки атаки тоже.
    if (item.kind === "attack") return { key: `hunt_attack:${item.moveId || "basic"}`, delay: dflt };
    if (item.kind === "summon") return { key: `summon_boss:${item.id}`, delay: dflt };
  }
  return { key: `${kind}:${item.id || ""}`, delay: dflt };
}

  document.getElementById("questsBtn").hidden = VIEW.quests.length === 0;

  renderResources();

  renderAutocraft();
  renderEnergyCraft();
  renderManualJobs();
  renderResearchPanel();

  // Если модалка дерева технологий или инструментов сейчас открыта (например,

  if (document.getElementById("toolsOverlay")) openToolsModal();
  if (document.getElementById("storageOverlay")) openStorage();
  // Модалка "Особи" ("Пасека"/"Оранжерея"/...) открыта на конкретный buildingId

    const freshItem = VIEW.buildings.find(b => b.id === upgradesOverlay.dataset.buildingId)

function renderAutocraft() {
  const panel = document.getElementById("autocraftPanel");
  panel.hidden = VIEW.compute_capacity <= 0;
  if (panel.hidden) return;
  const container = document.getElementById("autocraftBody");
  container.innerHTML = "";
  const ac = VIEW.autocraft;

  const summary = el("div", { class: "autocraft-summary" });
  summary.innerHTML = `Скорость: <b>${ac.speed_capacity}</b> операций/ход &nbsp;|&nbsp; Слоты: <b>${ac.slots_used}/${ac.slot_capacity}</b>`;
  container.appendChild(summary);

  const computeLine = el("div", { class: "compute-line" });
  computeLine.innerHTML = `Вычислительная мощность процессоров: <b>${VIEW.compute_capacity}</b> - потолок того, сколько раз за один автокрафт можно прокрутить рецепт`;
  container.appendChild(computeLine);

  if (!ac.jobs.length && !ac.pending_actions.length) {
    container.appendChild(el("div", { class: "empty-note", text: "Сейчас ничего не докрафтывается в фоне." }));
    return;
  }

  ac.jobs.forEach(job => {
    const row = el("div", { class: "autocraft-job" });
    const ratio = job.fires_total > 0 ? job.fires_done / job.fires_total : 0;
    const etaText = job.eta_turns === null ? "нет скорости" : `~${job.eta_turns} ход(ов)`;
    const head = el("div", { class: "job-head" });
    head.appendChild(el("span", { text: `${job.resource_name}: ${job.fires_done}/${job.fires_total}` }));
    const right = el("span", { class: "job-right" });
    right.appendChild(el("span", { class: "job-eta", text: etaText }));
    right.appendChild(jobCancelButton(() => cancelJob("autocraft", { resource_id: job.resource_id })));
    head.appendChild(right);
    row.appendChild(head);
    const bar = el("div", { class: "job-bar" });
    bar.appendChild(el("div", { class: "job-bar-fill", style: `width:${Math.round(ratio * 100)}%` }));
    row.appendChild(bar);
    container.appendChild(row);
  });

  if (ac.pending_actions.length) {
    const list = el("ul", { class: "autocraft-pending" });
    ac.pending_actions.forEach(label => list.appendChild(el("li", { text: `Ждёт автокрафта: ${label}` })));
    container.appendChild(list);
  }
}

// Панель "Крафт из энергии" - появляется, как только построен хотя бы один
// энергетический преобразователь (VIEW.energy_converter_capacity > 0), даже если
// сейчас ни один рецепт не запущен (тогда показывает пустое состояние с подсказкой
// пойти в "Преобразователь"). Рецепт выбирается ВРУЧНУЮ в локации "Преобразователь"
// (вложена в "Механизмы") (или его запускает автокрафт) - эта панель только показывает прогресс уже запущенных
// крафтов (VIEW.energy_jobs, один элемент на каждый занятый преобразователь, БЕЗ
// привязки к конкретной копии постройки), той же полоской, что и у задач автокрафта
// (.autocraft-job/.job-bar) - концептуально это тот же индикатор "копится, доделается
// само". Если преобразователю хватает одного хода на партию, прогресс просто не
// успевает отрисоваться выше 0 - задача исчезает из списка сразу же после завершения.
function renderEnergyCraft() {
  const panel = document.getElementById("energyCraftPanel");
  const container = document.getElementById("energyCraftBody");
  panel.hidden = VIEW.energy_converter_capacity <= 0;
  if (panel.hidden) return;
  container.innerHTML = "";
  if (!VIEW.energy_jobs.length) {
    container.appendChild(el("div", {
      class: "empty-note",
      text: "Ничего не крафтится - выбери рецепт в локации «Преобразователь».",
    }));
    return;
  }
  VIEW.energy_jobs.forEach(job => {
    const ratio = job.threshold > 0 ? Math.min(1, job.progress / job.threshold) : 0;
    const produces = job.produces.map(c => `+${formatAmount(c.amount)} ${c.name}`).join(", ");
    const row = el("div", { class: "autocraft-job" });
    const head = el("div", { class: "job-head" });
    head.appendChild(el("span", { text: `${job.name}: ${job.progress}/${job.threshold}` }));
    const right = el("span", { class: "job-right" });
    right.appendChild(el("span", { class: "job-eta", text: produces }));
    right.appendChild(jobCancelButton(() => cancelJob("energy", { index: job.index })));
    head.appendChild(right);
    row.appendChild(head);
    const bar = el("div", { class: "job-bar" });
    bar.appendChild(el("div", { class: "job-bar-fill", style: `width:${Math.round(ratio * 100)}%` }));
    row.appendChild(bar);
    container.appendChild(row);
  });
}

// Строка "прогресс + отмена" одной многоходовой ручной задачи - общая для панели
// "Долгие действия" (renderManualJobs, ниже) и самой карточки действия (actionCard,
// см. "прогресс видно прямо в карточке" - обе точки показа переиспользуют один и тот
// же DOM/логику, чтобы не могли разойтись). label - опционален: панель "Долгие
// действия" перечисляет РАЗНЫЕ действия и обязана подписать, какое именно, а
// карточка своё название уже показывает сама (см. main.name выше), так что там
// прогресс идёт голым числом. Отмена (cancel_manual_job) возвращает игроку cost,
// списанный при старте, - "✕" тут не расходный клик.
function manualJobProgressRow(actionId, turnsDone, turnsTotal, label) {
  const ratio = turnsTotal > 0 ? turnsDone / turnsTotal : 0;
  const row = el("div", { class: "autocraft-job" });
  const head = el("div", { class: "job-head" });
  const text = label ? `${label}: ${turnsDone}/${turnsTotal} ход(ов)` : `${turnsDone}/${turnsTotal} ход(ов)`;
  head.appendChild(el("span", { text }));
  const right = el("span", { class: "job-right" });
  right.appendChild(jobCancelButton(() => cancelJob("manual", { action_id: actionId })));
  head.appendChild(right);
  row.appendChild(head);
  const bar = el("div", { class: "job-bar" });
  bar.appendChild(el("div", { class: "job-bar-fill", style: `width:${Math.round(ratio * 100)}%` }));
  row.appendChild(bar);
  return row;
}

// Панель "Долгие действия" (manual_actions.*.duration_turns > 1, см.
// game/engine.py:_process_manual_jobs) - видна, только пока идёт хотя бы одна такая
// задача (в отличие от автокрафта/крафта из энергии, тут нет постоянной сводки вроде
// "скорость/слоты", показывать нечего, пока ничего не запущено). Остаётся полезной
// даже теперь, когда та же информация продублирована на самой карточке действия
// (actionCard) - карточка видна, только пока игрок стоит в той же локации, а эта
// панель нет (действие может идти где-то ещё).
function renderManualJobs() {
  const panel = document.getElementById("manualJobsPanel");
  const container = document.getElementById("manualJobsBody");
  panel.hidden = !VIEW.manual_jobs.length;
  if (panel.hidden) return;
  container.innerHTML = "";
  VIEW.manual_jobs.forEach(job => {
    container.appendChild(manualJobProgressRow(job.action_id, job.turns_done, job.turns_total, job.name));
  });

// Прогресс текущего исследования (techs.*.research_turns > 1, см.
// game/engine.py:research/_process_research) - ГЛОБАЛЬНО один слот на всю игру
// (VIEW.active_research, не список, как manual_jobs), поэтому отдельная простая
// функция вместо переиспользования manualJobProgressRow (которой нужен actionId

// старте - тот же принцип, что у долгих ручных действий.
function researchProgressRow(job, label) {

  const row = el("div", { class: "autocraft-job" });

  const text = label ? `${label}: ${job.turns_done}/${job.turns_total} ход(ов)` : `${job.turns_done}/${job.turns_total} ход(ов)`;
  head.appendChild(el("span", { text }));

  right.appendChild(jobCancelButton(() => cancelJob("research", {})));

  bar.appendChild(el("div", { class: "job-bar-fill", style: `width:${Math.round(ratio * 100)}%` }));

// Панель "Исследование" - зеркало renderManualJobs (видна, только пока
// VIEW.active_research не null), нужна отдельно от карточки технологии в дереве
