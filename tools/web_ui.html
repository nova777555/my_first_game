<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Майнкрафт на минималках</title>
<style>
  :root {
    --bg: #14171b;
    --panel: #1b1f24;
    --panel2: #232830;
    --border: #343b44;
    --text: #e8e6df;
    --muted: #8b93a0;
    --accent: #f0a030;
    --accent-dim: #8a5c1c;
    --ok: #4ac9a0;
    --warn: #f0c030;
    --danger: #e0524a;
    /* Акцент "Чертёж" для каркаса модалок (скобки/рёбра графов/подчёркивание
       вкладок) - см. CLAUDE.md, редизайн менюшек. Не заменяет --accent, живёт
       рядом с ним: голубой держит структуру/связи, янтарь - действие/цену. */
    --blueprint: #5fd0e8;
    /* Уровень зачарования (стол зачарований) - I едва разогрета, II полная
       структурная сила (--blueprint), III материализована (--accent) - та же
       грамматика цвета, что у остального интерфейса. */
    --lvl1: rgba(95, 208, 232, .55);
    --lvl2: #5fd0e8;
    --lvl3: #f0a030;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    /* Едва заметная чертёжная сетка фона главного экрана - 1:1 из канваса
       (MainScreen_B.dc.html: .screen), НЕ то же самое, что убранная по
       прямому пожеланию сетка в фоне модалок (см. .modal-overlay ниже) -
       там она перекрывала контент и была слишком заметна, тут - едва видна
       под панелями и не мешает читать интерфейс. */
    background:
      linear-gradient(rgba(95,208,232,.05) 1px, transparent 1px) 0 0/22px 22px,
      linear-gradient(90deg, rgba(95,208,232,.05) 1px, transparent 1px) 0 0/22px 22px,
      var(--bg);
  }
  /* Тот же тонкий скроллбар темы (см. .thin-scroll ниже), но на уровне
     html/body - иначе скролл главного экрана остаётся стандартным браузерным. */
  html { scrollbar-width: thin; scrollbar-color: rgba(95,208,232,.4) transparent; }
  html::-webkit-scrollbar { width: 8px; height: 8px; }
  html::-webkit-scrollbar-track { background: transparent; }
  html::-webkit-scrollbar-thumb { background-color: rgba(95,208,232,.35); border: 2px solid var(--bg); background-clip: padding-box; }
  html::-webkit-scrollbar-thumb:hover { background-color: rgba(95,208,232,.6); background-clip: padding-box; }
  .mono { font-family: Consolas, "Courier New", monospace; }
  /* Общий стиль ЛЮБОЙ кнопки в приложении - раньше кнопка без класса и вне
     специальных контейнеров (.tool-row/.tabs/...) оставалась голым браузерным
     button без единого правила, теперь у всех кнопок одинаковый базовый вид,
     а контекстные классы (.small/.primary/.danger/...) только модифицируют его.
     position:relative+overflow:hidden - нужны ЛЮБОЙ кнопке с кулдауном
     (applyCooldownVisual вставляет .cooldown-fill как абсолютного потомка). */
  /* Плоская "чертёжная" кнопка (см. CLAUDE.md, редизайн менюшек, канвас-вариант
     B) - 1:1 принцип канваса: rgba-бордер без скругления, прозрачный фон,
     голубой (--blueprint) hover ("это структурный элемент, с ним можно
     взаимодействовать"); button.primary остаётся плотным янтарным
     (--accent) - в языке канваса голубой держит структуру, янтарь - цену/
     действие, см. комментарий у --blueprint выше. */
  button {
    font: inherit; cursor: pointer;
    background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,.15);
    border-radius: 0; padding: 7px 12px; font-size: 12px;
    position: relative; overflow: hidden;
    transition: border-color .15s ease, transform .08s ease, filter .08s ease, background .15s ease;
  }
  button:hover { border-color: var(--blueprint); background: rgba(95,208,232,.06); }
  button:active:not(:disabled) { transform: scale(0.97); filter: brightness(0.94); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.small { padding: 4px 10px; font-size: 11px; }
  button.primary {
    background: var(--accent); color: #241a08; border-color: var(--accent); font-weight: 600;
    clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px);
  }
  button.primary:hover { filter: brightness(1.08); background: var(--accent); }
  button.danger:hover { border-color: var(--danger); background: rgba(224,82,74,.08); }

  /* Тот же принцип, что у button выше: текстовые поля и select раньше оставались
     голым браузерным видом (белый фон) поверх тёмной темы - теперь общий базовый
     стиль под остальной интерфейс, вместо точечных .foo input { width: ... }. */
  select, input[type=text], input[type=number], input[type=search] {
    font: inherit;
    background: rgba(255,255,255,.03); color: var(--text); border: 1px solid rgba(255,255,255,.15);
    border-radius: 0; padding: 7px 10px; font-size: 12px;
    transition: border-color .15s ease;
  }
  select:hover, input[type=text]:hover, input[type=number]:hover, input[type=search]:hover {
    border-color: var(--blueprint);
  }
  select:focus, input[type=text]:focus, input[type=number]:focus, input[type=search]:focus {
    outline: none; border-color: var(--blueprint);
  }
  select:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
  input[type=text]::placeholder, input[type=search]::placeholder { color: var(--muted); }
  select option { background: var(--panel2); color: var(--text); }
  /* Нативная стрелка select не красится под тёмную тему в большинстве браузеров -
     appearance:none снимает её целиком, стрелка перерисована сама (--muted, тот же
     цвет, что у остального второстепенного текста) через background-image. */
  select {
    cursor: pointer;
    appearance: none; -webkit-appearance: none;
    padding-right: 26px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238b93a0' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
    background-size: 10px 7px;
  }

  /* HUD-шапка 1:1 из канваса (design-канвас, MainScreen_B.dc.html) - ряд
     бордированных ячеек (заголовок/ход/время/технологии/энергия), а не
     плашки-таблетки на прозрачном фоне, как раньше - см. CLAUDE.md. */
  header.hud {
    display: flex; align-items: stretch; flex-wrap: wrap;
    border-bottom: 1px solid rgba(255,255,255,.1);
    position: sticky; top: 0; z-index: 20; background: var(--panel);
  }
  .hud-title {
    display: flex; align-items: center; padding: 8px 22px; white-space: nowrap;
    font-family: Consolas, monospace; font-weight: 700; color: var(--accent);
    font-size: 13px; letter-spacing: 1px; line-height: 1.35; text-transform: uppercase;
    background: var(--panel); border-right: 1px solid rgba(255,255,255,.1);
  }
  .save-name-label { font-size: 9px; color: var(--muted); letter-spacing: .02em; text-transform: none; font-weight: 400; margin-top: 2px; }
  .hud-cell {
    display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 8px 18px;
    border-right: 1px solid rgba(255,255,255,.1); background: var(--panel);
  }
  .hud-cell b { font-family: Consolas, monospace; font-size: 14px; font-weight: 400; color: var(--blueprint); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .hud-cell span { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .hud-cell .time-icon { display: inline-flex; }
  .hud-nav { display: flex; gap: 6px; margin-left: auto; align-items: center; padding: 8px 16px; background: var(--panel); flex-wrap: wrap; }
  .hud-nav button { background: var(--panel2); }
  /* Панель громкости (два независимых канала - музыка/звуки, не единый вкл/выкл) -
     всплывает под кнопкой-колонкой, закрывается кликом снаружи (см. soundControl
     в конце скрипта). */
  .sound-control { position: relative; }
  .sound-panel {
    position: absolute; top: calc(100% + 6px); right: 0;
    background: #161d24; border: 1px solid rgba(255,255,255,.12); border-radius: 0;
    padding: 12px; width: 190px; box-shadow: 0 10px 28px rgba(0,0,0,.45); z-index: 30;
    display: flex; flex-direction: column; gap: 12px;
  }
  .sound-panel[hidden] { display: none; }
  .sound-panel-row { display: flex; flex-direction: column; gap: 5px; }
  .sound-panel-row .row-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .sound-panel-row .row-head b { color: var(--accent); font-family: Consolas, monospace; font-weight: 400; }
  .sound-panel-row input[type=range] { width: 100%; accent-color: var(--accent); }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.danger:hover { background: var(--danger); color: #1a1207; }

  /* Раньше контент был центрирован в узкой колонке (max-width:1180px) -
     канвас (MainScreen_B.dc.html) занимает экран во всю ширину, гриду отдана
     фиксированная правая колонка 380px вместо резиновой 1fr - см. .dashboard. */
  main { padding: 24px; }

  .dashboard { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 980px) {
    .dashboard { grid-template-columns: 1fr 380px; align-items: start; }
  }
  .col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

  /* "Модуль" 1:1 из канваса (MainScreen_B.dc.html: .module/.module::before) -
     тонкая inset-рамка + голубые угловые скобки через один многослойный
     background-градиент на ::before (тут, в отличие от модалок, канвас сам
     рисует скобки именно так, не 4 реальных div'а - см. CLAUDE.md). */
  .panel { position: relative; background: var(--panel); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
  .panel::before {
    content: ""; position: absolute; inset: -1px; pointer-events: none;
    background:
      linear-gradient(to right, var(--blueprint) 3px, transparent 3px) no-repeat top left / 24px 3px,
      linear-gradient(to bottom, var(--blueprint) 3px, transparent 3px) no-repeat top left / 3px 24px,
      linear-gradient(to left, var(--blueprint) 3px, transparent 3px) no-repeat top right / 24px 3px,
      linear-gradient(to bottom, var(--blueprint) 3px, transparent 3px) no-repeat top right / 3px 24px,
      linear-gradient(to right, var(--blueprint) 3px, transparent 3px) no-repeat bottom left / 24px 3px,
      linear-gradient(to top, var(--blueprint) 3px, transparent 3px) no-repeat bottom left / 3px 24px,
      linear-gradient(to left, var(--blueprint) 3px, transparent 3px) no-repeat bottom right / 24px 3px,
      linear-gradient(to top, var(--blueprint) 3px, transparent 3px) no-repeat bottom right / 3px 24px;
  }
  .panel-head {
    padding: 14px 18px;
    font-family: Consolas, monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    color: var(--text);
  }
  .panel-head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .module-tag { font-size: 9px; color: var(--muted); letter-spacing: 1px; font-weight: 400; text-transform: uppercase; }
  /* Галочка "Автокрафт" - теперь живёт в шапке самой панели "Автокрафт"
     (переехала туда по прямому пожеланию, 2026-09-13, была на "Пульте
     действий" и там терялась) - переключатель в общем стиле остального
     интерфейса (тот же приём "switch", что задуман в канвасе для правил
     автоматизации), не голый браузерный чекбокс. */
  .autocraft-toggle {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; letter-spacing: normal; text-transform: none; color: var(--muted);
    cursor: pointer;
  }
  .autocraft-toggle input[type=checkbox] { position: absolute; opacity: 0; width: 0; height: 0; }
  .autocraft-toggle .switch {
    width: 28px; height: 15px; border: 1px solid rgba(255,255,255,.15); position: relative; flex-shrink: 0;
    background: transparent; transition: background .15s, border-color .15s;
  }
  .autocraft-toggle .switch .knob {
    position: absolute; top: 1px; left: 1px; width: 11px; height: 11px; background: #4d5762;
    transition: left .15s, background .15s;
  }
  .autocraft-toggle input:checked + .switch { background: rgba(240,160,48,.15); border-color: rgba(240,160,48,.4); }
  .autocraft-toggle input:checked + .switch .knob { left: 15px; background: var(--accent); }
  .autocraft-toggle input:focus-visible + .switch { border-color: var(--blueprint); }
  .panel-body { padding: 0 18px 18px; }

  .energy-readout { display: flex; justify-content: space-between; margin-bottom: 12px; }
  .energy-stat { display: flex; flex-direction: column; }
  .energy-stat .num { font-size: 15px; font-weight: 700; font-family: Consolas, monospace; }
  .energy-stat .lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .energy-stat.ok .num { color: var(--ok); }
  .energy-stat.bad .num { color: var(--danger); }
  .energy-bar { height: 9px; border-radius: 0; background: var(--panel2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); overflow: hidden; }
  .energy-bar-fill { height: 100%; background: var(--ok); transition: width .3s; }
  .energy-bar-fill.danger { background: var(--danger); }
  .compute-line { margin-top: 10px; font-size: 11px; color: var(--muted); }
  .compute-line b { color: var(--accent); font-family: Consolas, monospace; }
  .autocraft-summary { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .autocraft-summary b { color: var(--accent); font-family: Consolas, monospace; }
  .autocraft-job { margin-bottom: 8px; }
  .autocraft-job .job-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 3px; }
  .autocraft-job .job-eta { color: var(--muted); }
  .autocraft-job .job-right { display: flex; align-items: center; gap: 6px; }
  .autocraft-job .job-bar { height: 8px; border-radius: 0; background: var(--panel2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); overflow: hidden; }
  .autocraft-job .job-bar-fill {
    height: 100%; transition: width .3s;
    background-image: repeating-linear-gradient(45deg, var(--accent) 0 6px, var(--accent-dim) 6px 12px);
    background-size: 17px 17px; animation: job-bar-stripes 1s linear infinite;
  }
  @keyframes job-bar-stripes { from { background-position: 0 0; } to { background-position: 17px 0; } }
  .job-cancel {
    background: transparent; border: 1px solid rgba(255,255,255,.15); border-radius: 0;
    color: var(--muted); font-size: 11px; line-height: 1; padding: 2px 6px; cursor: pointer;
  }
  .job-cancel:hover { border-color: var(--danger); color: var(--danger); }
  .autocraft-pending { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .autocraft-pending li { margin-bottom: 3px; }

  .habitat-bank-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 6px; gap: 8px; }
  .habitat-house-btn { padding: 3px 8px; font-size: 11px; white-space: nowrap; }
  .habitat-house-btn:disabled { opacity: .4; cursor: not-allowed; }

  .res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .res-tile { background: var(--panel2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); border-radius: 0; padding: 6px 8px; display: flex; align-items: center; gap: 6px; }
  .res-tile.zero { opacity: .45; filter: grayscale(.7); }
  /* Разовая пульсация плитки в момент, когда число реально поменялось с прошлого
     рендера (см. renderResources/prevResourceAmounts) - зелёная для роста,
     красная для убыли, сама цифра при этом отдельно "докручивается"
     (animateResourceValue), а не прыгает мгновенно. */
  .res-tile.changed.up { animation: res-tile-pulse-up .8s ease-out; }
  .res-tile.changed.down { animation: res-tile-pulse-down .8s ease-out; }
  @keyframes res-tile-pulse-up { 0% { background: rgba(74, 201, 160, .09); } 100% { background: var(--panel2); } }
  @keyframes res-tile-pulse-down { 0% { background: rgba(224, 82, 74, .08); } 100% { background: var(--panel2); } }
  .res-tile svg { flex-shrink: 0; }
  .res-tile .info { display: flex; flex-direction: column; overflow: hidden; }
  .res-tile .amount { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .res-tile .rate { font-size: 9px; }
  .res-tile .rate.pos { color: var(--ok); }
  .res-tile .rate.neg { color: var(--danger); }
  .res-tile .name { font-size: 9px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .bld-icon-label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: Consolas, monospace; font-weight: 700; font-size: 8px; color: var(--accent);
    padding-top: 4px;
    pointer-events: none;
  }
  .bld-led { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--panel); }
  .bld-led.ok { background: var(--ok); }
  .bld-led.partial { background: var(--warn); }
  .bld-led.broken { background: var(--danger); box-shadow: 0 0 6px var(--danger); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* Панель "Производственные мощности" - список строк с поиском (makeResourceSearchBar
     с hide=true - непопавшие строки прячутся целиком, как "Банк особей" в
     "Фермах"), а не сетка тайлов - в строке помещается статус, счётчик/лимит,
     описание, содержание за ход и кнопка "⚙ Улучшения". */
  .bld-list { display: flex; flex-direction: column; max-height: 420px; overflow-y: auto; padding-right: 2px; }
  .bld-row {
    background: var(--bg); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); border-radius: 0;
    padding: 10px 12px; margin-bottom: 8px; transition: box-shadow .15s, opacity .15s;
  }
  .bld-row:last-child { margin-bottom: 0; }
  /* Разовая вспышка постройки, которая реально произвела ресурс в ход, только
     что завершившийся (см. renderBuildings/lastBuildingsFlashTurn) - НАМЕРЕННО
     гораздо бледнее flash-highlight (той делится с карточками действий, где
     вспышка - осознанный акцент на клик игрока, а не фоновый тик) - тут просто
     чуть заметный отблеск, чтобы не отвлекать при каждом ходе. */
  .bld-row.produced { animation: bld-row-produced-flash 1.6s ease-out; }
  @keyframes bld-row-produced-flash { 0% { background: rgba(240, 160, 48, .07); } 100% { background: var(--bg); } }
  .bld-row-head { display: flex; align-items: flex-start; gap: 10px; }
  .bld-row-icon { position: relative; width: 30px; height: 30px; flex-shrink: 0; margin-top: 1px; }
  .bld-row-icon svg { width: 100%; height: 100%; }
  .bld-row-icon .bld-icon-label { font-size: 7px; }
  .bld-row-icon .bld-led { width: 7px; height: 7px; border-color: var(--bg); }
  .bld-row-main { flex: 1; min-width: 0; }
  .bld-row-main .costs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .bld-row-title { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 13px; font-weight: 600; }
  .bld-row-title .amt { color: var(--muted); font-weight: 400; }
  .bld-row-desc { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
  .bld-badge { font-size: 9.5px; font-weight: 700; letter-spacing: .02em; padding: 2px 6px; border-radius: 0; text-transform: uppercase; }
  .bld-badge.limit { background: var(--panel2); border: 1px solid rgba(255,255,255,.12); color: var(--muted); }
  .bld-badge.broken { background: rgba(224, 82, 74, .16); border: 1px solid rgba(224, 82, 74, .4); color: #ef8a83; }
  /* Панель фильтров ("Состояние" + теги типа постройки, см. renderBuildingsFilterBar) -
     над строкой поиска, тот же порядок, что storage-controls-row (сортировка над
     поиском). */
  .bld-filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px 0; }
  /* Иконка-переключатель состояния - клик листает по кругу (см.
     BLD_STATUS_FILTER_CYCLE), цвет точки - тот же язык, что .bld-led у самой
     постройки (зелёный/красный), у "Все" - нейтральный серый. */
  .bld-status-filter-btn { display: inline-flex; align-items: center; gap: 6px; }
  .bld-status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--muted); }
  .bld-status-filter-btn.ok .bld-status-dot { background: var(--ok); }
  .bld-status-filter-btn.broken .bld-status-dot { background: var(--danger); }
  /* Выпадающий список тегов - тот же визуальный приём, что .sound-panel у
     громкости в шапке (плавающая тёмная панель с тенью, закрывается кликом
     снаружи). Чекбоксы вместо select[multiple] - обычный select[multiple]
     некрасиво выглядит и требует Ctrl+клик для мульти-выбора, что неочевидно. */
  .bld-tag-dropdown { position: relative; }
  .bld-tag-dropdown-panel {
    position: absolute; top: calc(100% + 6px); left: 0;
    background: #161d24; border: 1px solid rgba(255,255,255,.12); border-radius: 0;
    padding: 10px 12px; min-width: 180px; box-shadow: 0 10px 28px rgba(0,0,0,.45); z-index: 30;
    display: flex; flex-direction: column; gap: 6px;
  }
  .bld-tag-option { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
  .bld-tag-clear { align-self: flex-start; font-size: 11px; margin-top: 4px; color: var(--muted); }
  .bld-repair-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .bld-repair-row .cost-chip { margin: 0; }
  .bld-repair-cost { display: flex; gap: 6px; flex-wrap: wrap; }
  .bld-repair-blocked { font-size: 10.5px; color: #ef8a83; }
  .bld-row-actions { flex-shrink: 0; }
  /* Ползунок "включено/выключено" меню "Механизмы" (см. renderMechanismToggle) -
     та же вёрстка, что .scale-slider-row у ручных действий, но живёт прямо в
     строке постройки, не под отдельной кнопкой. */
  .bld-mechanism-toggle {
    display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 4px 10px;
    background: var(--panel2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); border-radius: 0; font-size: 11px;
  }
  .bld-mechanism-toggle-label { color: var(--muted); white-space: nowrap; }
  .bld-mechanism-toggle input[type=range] { flex: 1; }
  .bld-mechanism-toggle-value { color: var(--accent); font-weight: 600; min-width: 5em; text-align: right; white-space: nowrap; }

  /* Строка инструмента - 1:1 из канваса (B_Tools.dc.html: .line/.pips/.req) -
     полоска пипсов вместо крупной иконки, короткая акцентная кнопка ("Улучшить")
     с ценой ОТДЕЛЬНОЙ строкой слева от неё, а не длинная кнопка-простыня со
     всеми ресурсами внутри самого текста кнопки - по прямому пожеланию,
     2026-09-13 (см. CLAUDE.md). */
  .tools-list { display: flex; flex-direction: column; gap: 18px; padding: 18px 22px; }
  .line { display: flex; gap: 12px; align-items: flex-start; border: 1px solid rgba(255,255,255,.08); padding: 12px 14px; }
  .line-body { flex: 1; min-width: 0; }
  .line-name { font-size: 12.5px; font-weight: 700; color: #dbe7ec; margin-bottom: 10px; }
  .line-sub { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .line-sub.danger { color: var(--danger); }
  .pips { display: flex; gap: 4px; }
  .pip { flex: 1; height: 8px; border: 1px solid rgba(255,255,255,.15); }
  .pip.done { background: rgba(255,255,255,.3); border-color: rgba(255,255,255,.3); }
  .pip.current { background: var(--accent); border-color: var(--accent); }
  .pip.locked { background: transparent; }
  .req { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; font-family: Consolas, monospace; }
  .req-text { font-size: 11px; color: #7f97a1; }
  .req-text b { color: #dbe7ec; font-weight: 700; }
  .req-text.locked { color: #55606a; }
  .btn-sm {
    font-family: Consolas, monospace; font-size: 10.5px; color: #10151b; background: var(--accent);
    border: 1px solid var(--accent); padding: 8px 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px);
    position: relative; overflow: hidden;
  }
  .btn-sm.disabled { background: transparent; color: #4d5762; border-color: #2b333b; cursor: default; }
  .btn-sm.on-cooldown { opacity: .55; cursor: not-allowed; pointer-events: none; }

  .priorities-modal .tabs { padding: 14px 20px 0; }
  .priority-resource-scroll {
    max-height: 230px; overflow-y: auto; overflow-x: hidden; border: 1px solid rgba(255,255,255,.08); margin: 8px 16px 0;
    scrollbar-width: thin; scrollbar-color: rgba(95,208,232,.4) transparent;
  }
  .priority-resource-scroll::-webkit-scrollbar { width: 8px; }
  .priority-resource-scroll::-webkit-scrollbar-track { background: transparent; }
  .priority-resource-scroll::-webkit-scrollbar-thumb { background-color: rgba(95,208,232,.35); border: 2px solid #161d24; background-clip: padding-box; }
  .priority-resource-scroll .storage-grid { padding: 10px; }
  .priority-list { display: flex; flex-direction: column; gap: 10px; padding: 18px 22px; }
  .priority-row {
    display: flex; align-items: center; gap: 14px;
    border: 1px solid rgba(255,255,255,.08); border-radius: 0; padding: 12px 14px;
  }
  .priority-row .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .priority-row .info b { display: block; font-size: 13px; }
  .priority-row .info span { font-size: 11px; color: var(--muted); }
  .priority-row .info span.priority-shortfall-note { color: var(--warn); }
  .priority-order-controls { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .priority-value-input { width: 56px; text-align: center; }

  .loc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 14px 18px; }
  .loc-card {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: var(--panel2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); border-radius: 0;
    padding: 16px 10px; text-align: center; color: var(--text); cursor: pointer; width: 100%;
    transition: box-shadow .12s;
  }
  .loc-card:hover { box-shadow: inset 0 0 0 1px var(--blueprint); }
  .loc-card:active { transform: scale(.96); }
  .loc-card .loc-name { font-size: 13px; font-weight: 600; }
  .loc-card .loc-count { font-size: 11px; color: var(--muted); }
  /* Переход между уровнями дерева локаций (см. locationNavDirection) - лёгкий
     слайд+фейд ВСЕГО контента панели, направление зависит от того, зашли мы
     глубже ("forward") или вернулись назад/наверх ("back"). Одноразовая анимация
     на конкретный рендер (класс добавляется только renderLocationsPanel, когда
     сама навигация и произошла), а не постоянный декор. */
  .loc-panel-enter { animation: loc-panel-slide-forward .2s ease-out; }
  .loc-panel-enter.back { animation-name: loc-panel-slide-back; }
  @keyframes loc-panel-slide-forward { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes loc-panel-slide-back { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
  .back-row { padding: 10px 18px 0; display: flex; gap: 8px; }
  .back-row button { padding: 6px 10px; }
  .panel-head-btn { padding: 4px 10px; }
  .loc-header { font-size: 13px; font-weight: 700; padding: 10px 18px 0; color: var(--accent); }
  .loc-breadcrumb { padding: 8px 18px 0; font-size: 12px; color: var(--muted); }
  .loc-breadcrumb-item { cursor: pointer; }
  .loc-breadcrumb-item:hover { color: var(--accent); text-decoration: underline; }
  .loc-breadcrumb-item.current { color: var(--accent); font-weight: 700; cursor: default; }
  .loc-breadcrumb-item.current:hover { text-decoration: none; }
  .loc-search-bar { flex-shrink: 0; padding: 14px 18px 0; }
  .loc-search-bar input {
    width: 100%; padding-left: 30px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='6.5' cy='6.5' r='4.5' fill='none' stroke='%238b93a0' stroke-width='1.6'/><line x1='9.8' y1='9.8' x2='14' y2='14' stroke='%238b93a0' stroke-width='1.6' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-position: 9px center;
    background-size: 13px 13px;
  }
  /* Строка поиска + сортировки склада - поиск занимает свободное место, сортировка
     прижата справа фиксированной ширины (см. makeStorageSortBar). */
  .storage-controls-row { flex-shrink: 0; display: flex; align-items: center; gap: 18px; padding: 14px 18px 0; }
  .storage-controls-row .loc-search-bar { flex: 1; padding: 0; }
  .storage-sort-bar { flex-shrink: 0; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .storage-sort-label { color: var(--muted); font-size: 13px; }

  .tabs { position: relative; display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 10px 0; }
  .tabs button {
    background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,.1);
    border-bottom: none; border-radius: 0; padding: 6px 10px; font-size: 12px;
  }
  .tabs button.active { background: rgba(95,208,232,.05); color: var(--blueprint); border-color: rgba(95,208,232,.3); }
  /* Скользящее подчёркивание активной вкладки - JS (positionTabUnderline())
     двигает left/width под реальный прямоугольник активной кнопки, CSS только
     анимирует переезд. Один голубой акцент поверх существующей смены фона -
     не заменяет её, просто добавляет "живой" переезд между вкладками. */
  .tab-underline {
    position: absolute; bottom: -2px; height: 3px; background: var(--blueprint);
    box-shadow: 0 0 6px rgba(95,208,232,.7); pointer-events: none;
    transition: left .25s ease, width .25s ease; opacity: 0;
  }
  .tab-underline.visible { opacity: 1; }
  /* Вкладки "Пульта действий" на главном экране - отдельный, более лёгкий вид
     1:1 из канваса (MainScreen_B.dc.html: .tabs/.tab-item), без рамок-боксов
     вокруг каждой вкладки (в отличие от вкладок в модалках выше) - только текст
     + общая нижняя линия ряда + скользящее подчёркивание активной. */
  #actionTabs { gap: 20px; padding: 0 18px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 16px; flex-wrap: nowrap; }
  #actionTabs button {
    background: transparent; border: none; padding: 10px 2px; font-size: 12px; color: var(--muted);
  }
  #actionTabs button.active { background: transparent; color: var(--blueprint); }
  #actionTabs .tab-underline { bottom: -1px; left: 18px; }

  .action-list { padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; max-height: 480px; overflow-y: auto; }
  .action-card {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); border-radius: 0;
    padding: 10px 12px; text-align: left; color: var(--text); width: 100%;
    position: relative; overflow: hidden; flex-shrink: 0;
    transition: transform .08s ease, filter .08s ease, box-shadow .15s ease;
  }
  .action-card:hover { box-shadow: inset 0 0 0 1px var(--blueprint); }
  .action-card:active:not(:disabled) { transform: scale(0.97); filter: brightness(0.94); }
  .action-card:disabled { opacity: .5; cursor: not-allowed; }
  .action-card:disabled:hover { box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
  /* Небольшая задержка после клика (game/content.json: click_delay_ms / ui.default_action_delay_ms) -
     защита от спама кнопкой автокликером, см. tryRunAction(). Чисто UI-эффект, ничего
     не сохраняется в save.json - при перезагрузке страницы кулдауны просто забываются. */
  .action-card.on-cooldown, .skip-row button.on-cooldown { opacity: .55; cursor: not-allowed; pointer-events: none; }
  .cooldown-fill {
    position: absolute; left: 0; bottom: 0; height: 3px; width: 100%;
    background: var(--accent); transform-origin: left; transform: scaleX(1);
    transition: transform linear; pointer-events: none;
  }
  .action-card .main { flex: 1; min-width: 0; }
  .action-card .name { font-size: 13px; font-weight: 600; }
  .action-card .desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .action-card .costs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px; }
  .cost-chip { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
  .cost-chip.gain { color: var(--ok); }
  /* Кликабельный ресурс - переход к его рецепту (см. engine.RECIPE_BOARD_BUILDING_ID) -
     общий класс для ЛЮБОГО места, где показан ресурс (chip цены, плитка склада/
     закреплённой панели), не только .cost-chip. */
  .jumpable { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
  .jumpable:hover { color: var(--accent); }
  /* Шанс потребления/получения (item.chance < 1, см. CLAUDE.md) - приглушённая
     доля от основного цвета чипа (var(--warn), не var(--muted)/var(--ok) чипа) -
     сразу видно, что ресурс негарантированный, независимо от того, cost это или gain. */
  .cost-chip .chance-note { color: var(--warn); font-weight: 600; }
  /* Бонусная продукция промышленной пасеки (см. produceChanceChip) - визуально
     отделена от обычной продукции пунктирной рамкой, не только цветом. */
  .cost-chip.bonus-chip { border: 1px dashed var(--accent); border-radius: 4px; padding: 1px 4px; }
  .note-chip { font-size: 11px; color: var(--muted); }
  @keyframes flash-highlight { 0% { background: var(--accent-dim); } 100% { background: var(--panel2); } }
  .action-card.flash { animation: flash-highlight 1.6s ease-out; }
  /* Обёртка для ручных действий с "Ползунком масштаба" (item.scale_cap > 1, см.
     actionCard) - <input type=range> внутри <button> ненадёжен в браузерах
     (перетаскивание конфликтует с кликом), поэтому ползунок вынесен НАРУЖУ, в
     отдельную строку под кнопкой действия, но оба - прямые дети ЭТОЙ обёртки,
     а не самой .action-card. flex-shrink:0 - та же защита, что у .action-card
     (см. комментарий там же): без неё группа сжималась бы вместо прокрутки
     .action-list, как только суммарная высота карточек превышала max-height. */
  .action-card-group { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
  .action-card-group.flash .action-card { animation: flash-highlight 1.6s ease-out; }
  .scale-slider-row {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px;
    background: var(--panel2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); border-radius: 0; font-size: 11px;
  }
  .scale-slider-label { color: var(--muted); white-space: nowrap; }
  .scale-slider-row input[type=range] { flex: 1; }
  .scale-slider-value { color: var(--accent); font-weight: 600; min-width: 2.5em; text-align: right; }
  .empty-note { color: var(--muted); font-size: 12px; padding: 6px 2px; }

  .skip-row { padding: 0 18px 18px; }
  .skip-row button {
    width: 100%; padding: 11px; background: var(--panel2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
    border: 1px dashed var(--blueprint); border-radius: 0; color: var(--blueprint); position: relative; overflow: hidden;
    transition: transform .08s ease, filter .08s ease, background .15s ease;
  }
  .skip-row button:hover { background: rgba(95,208,232,.08); color: var(--blueprint); }
  .skip-row button:active:not(:disabled) { transform: scale(0.98); filter: brightness(0.94); }

  .log-list { padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; max-height: 280px; overflow-y: auto; font-size: 12px; }
  /* Свёрнутый журнал (по умолчанию) - показывает ТОЛЬКО самую свежую запись
     (она первая в списке - см. pushLog: новые записи вставляются в начало),
     чтобы основную часть левой колонки занимал "Пульт действий", а не история
     событий. Записи по-прежнему копятся в DOM как обычно (см. pushLog) - при
     разворачивании (снятии .compact) они сразу все видны, ничего не дорисовывается. */
  .log-list.compact { max-height: none; overflow: visible; }
  .log-list.compact .log-entry:not(:first-child) { display: none; }
  .log-entry { padding: 5px 0; border-bottom: 1px dashed var(--border); }
  .log-entry .msg { color: var(--text); }
  .log-entry .deltas { color: var(--ok); }
  .log-entry .warn-line { color: var(--warn); }
  .log-entry .danger-line { color: var(--danger); }
  .log-entry .turn-tag { color: var(--muted); margin-right: 6px; }

  .modal-overlay {
    position: fixed; inset: 0; z-index: 100; padding: 20px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(13,17,22,.85);
  }
  /* Каркас "Чертёж" - 1:1 порт из канваса (design-канвас, вариант B), см.
     CLAUDE.md. Скобки - НАСТОЯЩИЕ 4 div'а (не CSS-трюк с фоновыми градиентами),
     чтобы совпадать с канвасом побитово; вставляются автоматически в ЛЮБОЙ
     .modal через ensureModalBrackets()/MutationObserver ниже по файлу - не
     нужно трогать JS каждой из ~19 функций open*Modal(). */
  .modal {
    position: relative; background: #161d24; border: 1px solid rgba(255,255,255,.1);
    border-radius: 0; width: 100%; max-width: 420px; max-height: 80vh;
    overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column;
  }
  .bracket { position: absolute; width: 22px; height: 22px; pointer-events: none; animation: bracket-breathe 4s ease-in-out infinite; }
  .bracket.tl { top: -1px; left: -1px; border-top: 2px solid var(--blueprint); border-left: 2px solid var(--blueprint); }
  .bracket.tr { top: -1px; right: -1px; border-top: 2px solid var(--blueprint); border-right: 2px solid var(--blueprint); }
  .bracket.bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--blueprint); border-left: 2px solid var(--blueprint); }
  .bracket.br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--blueprint); border-right: 2px solid var(--blueprint); }
  @keyframes bracket-breathe {
    0%, 100% { opacity: .7; filter: drop-shadow(0 0 0 rgba(95,208,232,0)); }
    50% { opacity: 1; filter: drop-shadow(0 0 3px rgba(95,208,232,.6)); }
  }
  /* Модалки с ФИКСИРОВАННЫМ размером 1:1 из канваса (не max-width/max-height,
     а именно width/height - см. CLAUDE.md, требование дословного повтора
     макета) - сама модалка никогда не скроллится целиком (overflow:hidden),
     скроллится только её внутренний список/сетка/граф (см. .scroll-area
     ниже), высота модалки не "прыгает" от количества строк внутри. */
  .modal.storage-modal { width: 960px; height: 720px; max-width: none; max-height: none; overflow: hidden; }
  .modal.tools-modal { width: 560px; height: 780px; max-width: none; max-height: none; overflow: hidden; }
  .modal.priorities-modal { width: 560px; height: 780px; max-width: none; max-height: none; overflow: hidden; }
  .modal.upgrades-modal { width: 560px; height: 780px; max-width: none; max-height: none; overflow: hidden; }
  .modal.tech-modal { width: 700px; height: 820px; max-width: none; max-height: none; overflow: hidden; }
  /* Модалка "Охота" (см. openHuntingModal/renderEncounterModalBody) - по прямому
     пожеланию, 2026-09-14: базовые 420px (.modal) ощущались тесными для портрета +
     полосок HP + ряда кнопок приёмов с QTE-шкалой внутри. Просто max-width, не
     фиксированный width/height как у canvas-модалок выше - высота тут и так
     подстраивается под число открытых приёмов. */
  .modal.hunting-modal { max-width: 600px; }
  /* Дерево технологий и квесты - панорамируемые графы узлов, которым тесно в
     обычных 700px .tech-modal (и которые в будущем вырастут ещё сильнее) -
     отдельный класс ПОВЕРХ .tech-modal (не правка самого .tech-modal, который
     делят Разведение/Книга видов/Синтезатор душ и т.п. фиксированной модалкой
     700x820 - их трогать не нужно), по прямому пожеланию, 2026-09-13. */
  .modal.tech-modal.graph-modal { width: 1200px; }
  /* Модалка "Шахта" (openMineFieldModal) - поле должно занимать почти весь
     экран игрока, а не тонуть в паддингах/подписях, поэтому крупный размер,
     как у остальных canvas-модалок. НЕ фиксированный height (в отличие от
     большинства других canvas-модалок) - на 900x940 при небольшом окне низ
     модалки (кнопка "Обновить шахту"/поле целиком) обрезался overflow:hidden
     без возможности проскроллить, по жалобе 2026-09-16. min(…, vh/vw) даёт
     тот же крупный размер на нормальном окне, но ужимается на маленьком -
     .mine-grid-wrap (flex:1, min-height:0) сам подстроит-сожмёт поле под
     оставшуюся высоту, а не даст низу уехать за край. */
  .modal.mine-field-modal { width: min(1080px, 96vw); height: min(1020px, 92vh); max-width: none; max-height: none; overflow: hidden; padding: 14px; gap: 10px; }
  .mine-field-topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .mine-field-topline b { color: var(--blueprint); font-weight: 600; }
  .mine-grid-wrap { position: relative; flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
  /* Размер и форма клеток задаёт JS (renderMineFieldGrid: width/height/
     grid-template-columns/-rows, все 4 - явные inline-стили) - строки И
     столбцы делят явную ширину/высоту поровну (1fr), поэтому клетка НЕ квадрат
     ровно в той пропорции, что и весь прямоугольник поля (MINE_GRID_ASPECT) -
     собственный aspect-ratio у .mine-cell тут не нужен и был бы просто лишним
     (при явных ширине/высоте от grid-трека он всё равно игнорируется, но раньше
     давал ложное впечатление "клетки всегда квадратные"). По прямому
     пожеланию, 2026-09-16 - поле растянуто чуть шире, чем выше. */
  .mine-grid { display: grid; gap: 2px; background: #0c0e11; padding: 5px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.1); }
  .mine-cell { position: relative; background: #2b323c; overflow: hidden; cursor: pointer; }
  .mine-cell.fog { background: #0a0c0e; cursor: default; }
  .mine-sensed-icon { animation: mine-sensed-pulse 2.4s ease-in-out infinite; filter: saturate(.6) brightness(.8); }
  @keyframes mine-sensed-pulse { 0%, 100% { opacity: .3; } 50% { opacity: .65; } }
  .mine-cell.cleared { background: #0c0e11; box-shadow: inset 0 2px 5px rgba(0,0,0,.6); cursor: default; }
  .mine-cell .mine-cracks {
    position: absolute; inset: 0; pointer-events: none;
    background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.75) 0 1.5px, transparent 1.5px 7px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.75) 0 1.5px, transparent 1.5px 7px);
  }
  .mine-cell .mine-icon { position: absolute; inset: 8%; display: flex; }
  .mine-cell .mine-icon svg { width: 100%; height: 100%; }
  .mine-cell .mine-lock { position: absolute; top: 0; right: 0; font-size: 8px; background: rgba(12,14,17,.85); padding: 1px; z-index: 1; }
  .mine-cell.shake { animation: mine-cell-shake .25s; }
  @keyframes mine-cell-shake { 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  /* Всплывающее "+N" после вскапывания клетки (mineFieldPendingPopup) - висит
     поверх .mine-grid-wrap (не внутри .mine-grid, который openMineFieldModal
     пересобирает целиком на каждое действие), сама себя удаляет по animationend. */
  .mine-gain-popup {
    position: absolute; top: 0; left: 0; transform: translate(-50%, 0); pointer-events: none;
    display: flex; align-items: center; gap: 3px; font-size: 14px; font-weight: 700;
    color: #7ee6a8; text-shadow: 0 1px 3px rgba(0,0,0,.85); white-space: nowrap; z-index: 5;
    animation: mine-gain-rise .9s ease-out forwards;
  }
  .mine-gain-popup .mine-gain-icon svg { width: 16px; height: 16px; display: block; }
  @keyframes mine-gain-rise {
    0% { opacity: 0; transform: translate(-50%, 4px) scale(.85); }
    15% { opacity: 1; transform: translate(-50%, -6px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -36px) scale(1); }
  }
  .mine-catalog-search { padding: 10px 14px 0; }
  .mine-catalog-search input { width: 100%; }
  .mine-catalog-row { display: flex; align-items: center; gap: 10px; }
  .mine-catalog-row .mine-catalog-name { font-weight: 600; font-size: 13px; }
  .mine-catalog-row .mine-catalog-meta { font-size: 11.5px; color: var(--muted); }
  .mine-catalog-row.locked-row { opacity: .55; }
  .mine-field-hint { font-size: 12px; padding: 0 2px; }
  .mine-exit-btn { border-color: var(--blueprint); color: var(--blueprint); font-weight: 600; }
  .mine-exit-btn:hover { background: rgba(95,208,232,.12); }
  /* Тонкий скроллбар в цвет темы - вместо стандартного браузерного, ВЕЗДЕ, где
     что-то скроллится внутри интерфейса (список построек на главном экране,
     внутренние списки/сетки/графы модулей фиксированного размера и т.п.) -
     .scroll-area дополнительно добавляет flex:1 (для модулей, где область
     должна растянуться на всё оставшееся место). */
  .thin-scroll, .scroll-area { scrollbar-width: thin; scrollbar-color: rgba(95,208,232,.4) transparent; }
  .thin-scroll::-webkit-scrollbar, .scroll-area::-webkit-scrollbar { width: 8px; height: 8px; }
  .thin-scroll::-webkit-scrollbar-track, .scroll-area::-webkit-scrollbar-track { background: transparent; }
  .thin-scroll::-webkit-scrollbar-thumb, .scroll-area::-webkit-scrollbar-thumb { background-color: rgba(95,208,232,.35); border: 2px solid #161d24; background-clip: padding-box; }
  .thin-scroll::-webkit-scrollbar-thumb:hover, .scroll-area::-webkit-scrollbar-thumb:hover { background-color: rgba(95,208,232,.6); background-clip: padding-box; }
  .scroll-area { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .upgrades-list { display: flex; flex-direction: column; gap: 10px; padding: 18px 22px; }
  .upgrade-row { border: 1px solid rgba(255,255,255,.08); border-radius: 0; padding: 12px 14px; }
  .upgrade-title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .upgrade-desc { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .upgrade-row .costs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .upgrade-status { font-size: 12px; margin-top: 6px; }
  .upgrade-status.done { color: var(--ok); }
  .upgrade-status.locked { color: var(--muted); }
  .upgrade-preview-block { background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.08); border-radius: 0; padding: 8px 10px; margin-top: 8px; }
  /* Строка "Улучшений построек" - 1:1 из канваса (B_Buildings.dc.html: .row/.idx/
     .info/.btn-sm): номер + имя/описание/цена в ОДИН горизонтальный ряд с
     компактной кнопкой справа - НЕ карточка-стопка, как .upgrade-row выше
     (тот делит разметку с Навыками/Автоматизацией/апгрейдами ферм, тут
     сознательно отдельные классы, чтобы не сломать те три места) - по прямому
     пожеланию, 2026-09-13, см. CLAUDE.md. */
  .upg-row { display: flex; align-items: center; gap: 14px; border: 1px solid rgba(255,255,255,.08); padding: 12px 14px; }
  .upg-idx { font-family: Consolas, monospace; font-size: 10px; color: #5b6772; width: 20px; flex-shrink: 0; text-align: right; }
  .upg-body { flex: 1; min-width: 0; }
  .upg-body .upgrade-title { margin-bottom: 3px; }
  .upg-body .upgrade-desc { margin-bottom: 0; }
  .upg-body .costs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .upg-row > .upgrade-status { flex-shrink: 0; white-space: nowrap; margin-top: 0; text-align: right; }
  .upgrade-preview-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }

  .farms-modal-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; }
  /* Секция ("Слоты N/M"/"Банк душ"/"Банк особей"/"Синтез") внутри модалок
     Пасеки/Синтезатора душ/Генетической лаборатории - левая цианевая полоска +
     моноширинный uppercase заголовок (тот же язык, что .panel-head на главном
     экране) вместо голого <h3>, чтобы эти модалки выглядели частью общего
     дизайна, а не отдельным "просто рабочим" интерфейсом - по прямому
     пожеланию, 2026-09-13, см. CLAUDE.md. */
  .farm-section {
    border: 1px solid rgba(255,255,255,.1); border-left: 2px solid rgba(95,208,232,.35);
    border-radius: 0; padding: 14px 16px; margin-bottom: 8px; background: rgba(255,255,255,.015);
  }
  .farm-section h3 {
    font-family: Consolas, monospace; font-size: 11px; font-weight: 700;
    letter-spacing: 1.2px; text-transform: uppercase; color: var(--text); margin: 0;
  }
  .farm-section-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 12px; padding-bottom: 9px; border-bottom: 1px solid rgba(95,208,232,.18);
  }
  /* Голый <h3> без обёртки .farm-section-head (Синтез/Банк душ) - та же
     подчёркивающая черта, но на самом заголовке, раз нет строки-обёртки. */
  .farm-section > h3:first-child { display: block; padding-bottom: 9px; margin-bottom: 12px; border-bottom: 1px solid rgba(95,208,232,.18); }
  .creature-row { background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.08); border-radius: 0; padding: 8px 10px; margin-bottom: 8px; }
  .creature-list { display: flex; flex-direction: column; }
  .creature-id-badge { font-size: 10px; color: var(--muted); font-weight: 400; }
  /* .job-head/.job-right вне .autocraft-job (см. выше) не были флекс-рядом -
     имя и правый блок (select/кнопки) просто шли inline вплотную друг к другу.
     Не мешало, пока имя было одним словом, но с добавлением "№<id>" к имени
     особи текст стал упираться в select без зазора - тот же flex-приём,
     что у .autocraft-job. */
  .creature-row .job-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .creature-row .job-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .creature-caption { font-size: 11px; color: var(--muted); margin: 4px 0 2px; }
  .genotype-table { font-size: 11px; border-collapse: collapse; margin: 6px 0; }
  .genotype-table th {
    padding: 2px 10px 4px 0; color: var(--muted); white-space: nowrap; text-align: left;
    font-size: 10px; text-transform: uppercase; letter-spacing: .03em; font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .genotype-table td { padding: 2px 10px 2px 0; color: var(--muted); white-space: nowrap; }
  .genotype-table td:first-child { color: var(--text); }
  .creature-toggle-btn { flex-shrink: 0; }

  /* Слоты выбора родителей для скрещивания (drag&drop иконки особи) - см.
     renderBreedSlot/renderBreedSection. */
  /* .breed-root - корень модалки "Скрещивание" (см. openBreedingModal): сама
     модалка теперь фиксированного размера 700x820 (.modal.tech-modal), эта
     обёртка заполняет всё под шапкой (flex:1) - без своей рамки/отступа
     .farm-section (тут это не карточка внутри списка, а сама модалка). */
  .breed-root { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; border: none; padding: 0; margin: 0; }
  .breed-root .breed-section-head { flex-shrink: 0; padding: 16px 22px 0; margin-bottom: 0; }
  /* Кросс-ряд - 1:1 из канваса (B_Breeding.dc.html: .cross-row) - слот/кнопка/
     слот в фиксированной раскладке по центру, а не резиновые на всю ширину. */
  .breed-slots { flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 22px; padding: 22px 26px; }
  .breed-cross-btn { flex-shrink: 0; animation: breed-btn-glow 2s ease-in-out infinite; }
  @keyframes breed-btn-glow {
    0%, 100% { box-shadow: 0 0 0 rgba(240,160,48,0); }
    50% { box-shadow: 0 0 20px rgba(240,160,48,.6); }
  }
  .breed-slot {
    flex: 0 0 170px; width: 170px; height: 150px; border: 1px dashed rgba(95,208,232,.4); border-radius: 0;
    padding: 8px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: transparent;
    transition: border-color .12s, background .12s;
  }
  .breed-slot:not(.filled):not(.drag-over) { animation: breed-slot-invite 1.8s ease-in-out infinite; }
  .breed-slot.filled { border-style: solid; border-color: var(--blueprint); background: rgba(95,208,232,.06); animation: breed-slot-glow 2.6s ease-in-out infinite; }
  .breed-slot.drag-over { border-color: var(--accent); background: rgba(240,160,48,.06); }
  @keyframes breed-slot-invite {
    0%, 100% { border-color: rgba(95,208,232,.35); }
    50% { border-color: rgba(95,208,232,.85); }
  }
  @keyframes breed-slot-glow {
    0%, 100% { box-shadow: 0 0 0 rgba(95,208,232,0); }
    50% { box-shadow: 0 0 18px rgba(95,208,232,.45); }
  }
  /* .breed-slot само уже position:relative не имеет по умолчанию - кнопка
     "убрать" теперь абсолютным крестиком в углу (см. .breed-slot-clear), а не
     инлайн рядом с именем, чтобы вертикальный стек (иконка/имя/хинт) остался
     по центру квадрата 170x150, как в канвасе. */
  .breed-slot { position: relative; }
  .breed-slot-label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .breed-slot-placeholder { font-size: 11px; color: var(--muted); padding: 10px 0; text-align: center; }
  .breed-slot-card { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .breed-slot-info { min-width: 0; }
  .breed-slot-info .name { font-size: 12px; font-weight: 600; }
  .breed-slot-info .hint { font-size: 11px; color: var(--muted); margin: 0; }
  .breed-slot-clear {
    position: absolute; top: 6px; right: 6px;
    flex-shrink: 0; width: 22px; height: 22px; padding: 0; border-radius: 50%; line-height: 1;
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
  }
  .breed-slot-clear:hover { color: var(--danger); border-color: var(--danger); }

  /* Слоты синтезатора душ (renderSoulCollectorSection) - тот же визуальный
     язык приглашения/заполненности, что .breed-slot выше (пунктир мигает, пока
     пусто; сплошная цианевая рамка, когда занято), но произвольное ЧИСЛО
     слотов в ряд (entry.capacity, не жёстко зафиксированная пара родителей) и
     поддержка drag&drop души из банка ниже - по прямому пожеланию, 2026-09-13. */
  .soul-slots { display: flex; flex-wrap: wrap; gap: 12px; }
  .soul-slot {
    position: relative; width: 100px; height: 96px; border: 1px dashed rgba(95,208,232,.4); border-radius: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px;
    text-align: center; background: transparent; transition: border-color .12s, background .12s;
  }
  .soul-slot:not(.filled):not(.drag-over) { animation: breed-slot-invite 1.8s ease-in-out infinite; }
  .soul-slot.filled { border-style: solid; border-color: var(--blueprint); background: rgba(95,208,232,.06); animation: breed-slot-glow 2.6s ease-in-out infinite; }
  .soul-slot.drag-over { border-color: var(--accent); background: rgba(240,160,48,.06); }
  .soul-slot-icon { width: 28px; height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .soul-slot-name { font-size: 10px; line-height: 1.2; }
  .soul-slot-placeholder { font-size: 10px; color: var(--muted); padding: 0 2px; }
  /* Карточка банка душ - буквально .breed-card (перетаскиваемая иконка + имя),
     чтобы "Особи" и "Души" выглядели одной и той же системой, не двумя разными -
     .soul-bank-card добавляет только "заполнено/пусто" оттенок. */
  .soul-bank-card { cursor: grab; }
  .soul-bank-card.disabled { cursor: not-allowed; opacity: .4; }
  .soul-bank-card:not(.disabled):hover { border-color: var(--accent); }
  .soul-bank-count { font-size: 10px; color: var(--muted); }
  /* Иконка карточки банка - ФИКСИРОВАННОГО размера ВСЕГДА, даже без картинки
     (та же причина, что у .storage-tile-icon: иначе карточки без иконки были
     бы ниже соседних и портили ровный ряд рамок). */
  .soul-bank-icon { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .soul-bank-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); grid-auto-rows: min-content; align-content: start; gap: 10px; }

  /* Форма "Синтез" в генетической лаборатории (renderSynthesizeSection) -
     .field-row раньше не имел вообще никакого CSS (голый div: подпись +
     нативный select впритык друг к другу) - самое "неоформленное" место из
     трёх модалок, на которые пожаловался игрок, 2026-09-13, см. CLAUDE.md. */
  .synth-fields { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .field-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); }
  .field-row select { min-width: 170px; }
  .synth-footer { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); font-size: 11px; color: var(--muted); }

  /* Сетка карточек всех особей игрока для перетаскивания в слоты выше - те же
     плитки-принципы, что storage-tile/storage-grid (поиск/подсветка общие,
     см. makeResourceSearchBar), но со своим размером под пиксель-иконку. */
  .breed-picker-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: min-content; align-content: start; gap: 12px;
    padding: 12px 26px 26px;
  }
  .breed-card {
    display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: grab;
    background: transparent; border: 1px solid rgba(95,208,232,.25); border-radius: 0; padding: 8px 4px 6px; text-align: center;
    transition: border-color .12s, opacity .12s;
  }
  .breed-card:hover { border-color: var(--blueprint); }
  .breed-card:active { cursor: grabbing; }
  .breed-card.selected-a, .breed-card.selected-b { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); animation: breed-card-selected-glow 2.2s ease-in-out infinite; }
  @keyframes breed-card-selected-glow {
    0%, 100% { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 rgba(240,160,48,0); }
    50% { box-shadow: inset 0 0 0 1px var(--accent), 0 0 12px rgba(240,160,48,.5); }
  }
  .breed-card.search-match { border-color: var(--accent); }
  .breed-card.search-dim { opacity: .3; }
  .breed-card-id { font-size: 9px; color: var(--muted); }
  .breed-card-name { font-size: 10px; line-height: 1.2; }
  /* Чипы фильтра по семейству (см. renderBreedSection) - не путать с
     .tabs (те подразумевают панель под ними), тут просто ряд переключателей. */
  .breed-family-filter { flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; padding: 0 22px; }
  .breed-family-filter button {
    background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
    border-radius: 14px; padding: 4px 12px; font-size: 11px;
  }
  .breed-family-filter button:hover { border-color: var(--accent-dim); }
  .breed-family-filter button.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  .note-chip.accent { color: var(--accent); font-weight: 600; }

  /* Заголовок блока "Скрестить" с кнопкой книги пчёл справа - см. renderBreedSection. */
  .breed-section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .breed-section-head h3 { margin: 0; }

  /* Книга видов (openSpeciesBookModal) - список видов с поиском слева, детали
     выбранного вида (описание + все пары родителей, дающие его) справа. */
  .book-layout { display: flex; flex-wrap: wrap; gap: 16px; padding: 18px 22px; align-items: flex-start; }
  .book-list-pane { flex: 1 1 220px; min-width: 200px; display: flex; flex-direction: column; gap: 8px; }
  .book-species-list { display: flex; flex-direction: column; gap: 4px; max-height: 60vh; overflow-y: auto; }
  .book-species-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 0;
    border: 1px solid rgba(255,255,255,.1); background: transparent; cursor: pointer; text-align: left;
    font-size: 12px; color: var(--text); transition: border-color .12s, background .12s;
  }
  .book-species-item:hover { border-color: var(--blueprint); }
  .book-species-item.selected { border-color: var(--accent); background: rgba(240,160,48,.06); }
  .book-detail-pane { flex: 2 1 340px; min-width: 260px; }
  .book-detail-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .book-species-desc { font-size: 12px; color: var(--muted); margin: 4px 0 14px; }
  .book-recipe-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; margin-bottom: 6px;
    border: 1px solid rgba(255,255,255,.08); border-radius: 0; background: transparent;
  }
  .book-recipe-row.locked { opacity: .55; }
  .book-parent-btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 0;
    background: transparent; border: 1px solid rgba(255,255,255,.15); font-size: 11px; color: var(--text);
  }
  .book-parent-btn.clickable { cursor: pointer; }
  .book-parent-btn.clickable:hover { border-color: var(--accent); color: var(--accent); }
  .book-recipe-chance { font-weight: 600; font-size: 12px; margin-left: auto; }
  .book-recipe-lock { font-size: 10px; color: var(--muted); flex-basis: 100%; }
  .upgrade-open-btn {
    display: inline-flex; align-items: center; flex-shrink: 0; align-self: center;
    cursor: pointer; white-space: nowrap; font-size: 12px; font-weight: 600;
    background: var(--accent-dim); color: #fff3e0; border: 1px solid var(--accent);
    border-radius: 6px; padding: 8px 12px; margin-left: 6px;
    transition: background .1s ease, transform .08s ease;
  }
  .upgrade-open-btn:hover { background: var(--accent); color: #241a08; }
  .upgrade-open-btn:active { transform: scale(0.96); }

  /* Подтверждение автокрафта (см. CLAUDE.md) - маленькая менюшка перед запуском
     действия, если докрафт реально что-то возьмёт из запаса, плюс кнопка,
     разворачивающая полное дерево рецепта. */
  .modal.autocraft-confirm-modal { max-width: 560px; }
  .autocraft-confirm-list { display: flex; flex-direction: column; gap: 8px; padding: 18px 22px; }
  .autocraft-confirm-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: transparent; border: 1px solid rgba(255,255,255,.08); border-radius: 0;
  }
  .autocraft-confirm-row .info { flex: 1; min-width: 0; font-size: 12px; }
  .autocraft-confirm-row .info .name { font-weight: 600; }
  .autocraft-confirm-row .info .detail { color: var(--muted); margin-top: 1px; }
  .autocraft-confirm-row .info .detail.turns-note { color: var(--warn); }
  .autocraft-confirm-badge {
    flex-shrink: 0; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 12px;
    color: #1a1207; min-width: 46px; text-align: center;
  }
  .autocraft-confirm-badge.neutral {
    background: none; color: var(--muted); border: 1px dashed var(--border); font-weight: 500;
  }
  .autocraft-confirm-footer {
    display: flex; align-items: center; gap: 8px; padding: 14px 22px;
    border-top: 1px solid rgba(255,255,255,.08); position: sticky; bottom: 0; background: #161d24;
  }
  .autocraft-confirm-footer .spacer { flex: 1; }

  /* Дерево рецепта - вложенный список с направляющей линией (border-left на
     контейнере детей), без SVG - глубина может быть любой, разметка растёт сама. */
  .autocraft-tree-box { padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; }
  .autocraft-tree-node { display: flex; flex-direction: column; gap: 6px; }
  .autocraft-tree-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 12px;
    background: transparent; border: 1px solid rgba(255,255,255,.08); border-radius: 0;
  }
  .autocraft-tree-head.drafted { border-color: var(--accent-dim); }
  .autocraft-tree-head .name { font-weight: 600; flex-shrink: 0; }
  .autocraft-tree-head .detail { color: var(--muted); flex: 1; min-width: 0; }
  .autocraft-tree-head .fires-badge {
    flex-shrink: 0; font-size: 11px; font-weight: 700; color: #fff3e0;
    background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 10px; padding: 2px 8px;
  }
  .autocraft-tree-head .turns-badge {
    flex-shrink: 0; font-size: 11px; font-weight: 700; color: #241a08;
    background: var(--warn); border: 1px solid var(--warn); border-radius: 10px; padding: 2px 8px;
  }
  .autocraft-tree-children {
    margin-left: 19px; padding-left: 12px; border-left: 2px solid rgba(95,208,232,.3);
    display: flex; flex-direction: column; gap: 6px;
  }
  .modal-head {
    display: flex; align-items: center; padding: 16px 22px 14px; border-bottom: 1px solid rgba(255,255,255,.08);
    position: sticky; top: 0; background: #161d24;
  }
  .modal-head button {
    position: relative; z-index: 0;
    margin-left: auto; padding: 6px 14px 6px 10px; flex-shrink: 0;
    border: none; background: rgba(255,255,255,.15); color: #7f97a1; font-size: 11px;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 8px 100%, 0 calc(100% - 8px));
  }
  .modal-head button::before {
    content: ""; position: absolute; z-index: -1; top: 1px; right: 1px; bottom: 1px; left: 1px;
    background: #161d24;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 7px 100%, 0 calc(100% - 7px));
  }
  .modal-head strong {
    display: inline-block;
    font-family: Consolas, "Courier New", monospace; letter-spacing: 1.5px; text-transform: uppercase;
    font-size: 15px; font-weight: 700; color: #dbe7ec;
  }
  .modal-head strong::after {
    content: ""; display: block; height: 1px; margin-top: 10px;
    background: repeating-linear-gradient(90deg, rgba(95,208,232,.4) 0 6px, transparent 6px 12px);
  }
  /* Промежуточный размер между "огромные полупустые иконки" (было изначально)
     и "слишком мелко, текст не читается" (первая правка, 2026-09-13) - по
     прямому пожеланию во втором заходе того же дня, см. CLAUDE.md. Модалка
     расширена (см. .modal.storage-modal), чтобы влезало много колонок и
     без мелкого шрифта. */
  .storage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); grid-auto-rows: min-content; align-content: start; gap: 8px; padding: 16px 24px 24px; }
  .storage-tile {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: var(--panel2); border: 1px solid rgba(255,255,255,.08); border-radius: 0; padding: 9px 6px 8px; text-align: center;
  }
  /* Не .storage-tile.zero целиком - иначе притемнение как group-фильтр накрыло
     бы и .pin-toggle (абсолютно спозиционированную дочернюю кнопку): звёздочка
     закреплённого ресурса должна оставаться яркой (var(--accent)), даже если
     самого ресурса сейчас 0 и остальная плитка серая - опыт закрепления не
     должен теряться из-за того, что запас на нуле. CSS filter/opacity предка
     нельзя отменить у потомка, поэтому притемняем явно каждого ребёнка, кроме
     звёздочки, вместо самой плитки (см. пожелание игрока, 2026-09-13). */
  .storage-tile.zero > *:not(.pin-toggle) { opacity: .4; filter: grayscale(.75); }
  .storage-tile-icon {
    width: 24px; height: 24px; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.03);
    display: flex; align-items: center; justify-content: center;
  }
  .storage-tile .amount { font-size: 13px; font-weight: 700; }
  .storage-tile .amount .cap { font-weight: 400; color: var(--muted); }
  .storage-tile .name { font-size: 10px; color: var(--muted); line-height: 1.2; }
  .storage-tile.clickable { cursor: pointer; transition: border-color .15s, opacity .15s; }
  .storage-tile.clickable:hover { border-color: var(--accent-dim); }
  .storage-tile.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .storage-tile.no-recipe { opacity: .5; }
  .storage-tile.search-match { border-color: var(--accent); }
  .storage-tile.search-dim { opacity: .3; }
  .all-recipes-tile .all-recipes-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--accent); }
  .pin-toggle {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: #161d24; border: 1px solid rgba(255,255,255,.15); border-radius: 50%;
    font-size: 10px; line-height: 1; color: var(--muted);
  }
  .pin-toggle.pinned { border-color: var(--accent); color: var(--accent); background: rgba(240,160,48,.12); }
  .storage-upgrade-btn {
    position: relative; overflow: hidden;
    margin-top: 2px; font-size: 10px; padding: 2px 7px; border-radius: 0;
    background: var(--accent); border: 1px solid var(--accent); color: #10151b;
  }
  .storage-upgrade-btn:disabled { opacity: .45; cursor: not-allowed; color: var(--muted); background: transparent; border-color: rgba(255,255,255,.15); }
  .storage-upgrade-btn.on-cooldown { opacity: .55; cursor: not-allowed; pointer-events: none; }

  #toastBanner { position: fixed; top: 70px; right: 20px; z-index: 300; display: flex; flex-direction: column; gap: 8px; max-width: 320px; }
  .toast-quest { padding: 10px 14px; border-radius: 8px; animation: toast-in .25s ease-out; }
  @keyframes toast-in { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .toast-quest { background: linear-gradient(135deg, #3a2f10, #20242a); border: 1px solid var(--accent); display: flex; align-items: center; gap: 10px; }
  .toast-quest .title { color: var(--accent); font-weight: 700; font-size: 12px; }
  .toast-quest .desc { font-size: 11px; color: var(--muted); }

  .toast-error { background: linear-gradient(135deg, #3a1f1f, #20242a); border: 1px solid var(--danger); font-size: 12px; color: var(--text); }

  .lootbox-modal { max-width: 480px; text-align: center; }
  .lootbox-viewport { position: relative; height: 96px; margin: 24px 16px 0; overflow: hidden; border-radius: 0; background: #0d1116; border: 1px solid rgba(255,255,255,.12); }
  .lootbox-track { position: absolute; top: 0; left: 0; display: flex; height: 100%; will-change: transform; }
  .lootbox-cell { flex: 0 0 96px; width: 96px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-right: 1px solid rgba(255,255,255,.08); box-sizing: border-box; }
  /* Фон ячейки по редкости приза (доля weight среди суммы весов кейса) - тот же
     цветовой код, что "цвета редкости" CS:GO/CS2: синий/голубой/фиолетовый/
     красный/жёлтый от частого к практически невозможному. Пороги в
     lootboxRarityClass(). Объявлены ДО .won, чтобы пульсация победившей
     ячейки (равная specificity, но позже в исходнике) всё равно перекрывала
     фон редкости в момент остановки барабана. */
  .lootbox-cell.rarity-common { background: rgba(64, 130, 255, 0.16); }
  .lootbox-cell.rarity-rare { background: rgba(41, 200, 240, 0.16); }
  .lootbox-cell.rarity-epic { background: rgba(170, 70, 255, 0.18); }
  .lootbox-cell.rarity-legendary { background: rgba(255, 60, 60, 0.2); }
  .lootbox-cell.rarity-mythic { background: rgba(255, 210, 40, 0.22); }
  .lootbox-cell.won { background: rgba(240, 160, 48, 0.15); animation: lootbox-won-pulse 2.5s ease-in-out infinite; }
  .lootbox-cell .lootbox-cell-name { font-size: 10px; color: var(--muted); text-align: center; padding: 0 4px; }
  .lootbox-cell .lootbox-cell-amount { font-size: 11px; font-weight: 600; color: var(--accent); }
  .lootbox-pointer {
    position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: var(--accent);
    transform: translateX(-1px); box-shadow: 0 0 8px var(--accent); pointer-events: none;
    animation: lootbox-pointer-tick 2.5s ease-in-out infinite;
  }
  @keyframes lootbox-won-pulse {
    0%, 85% { background: rgba(240,160,48,.15); }
    92% { background: rgba(240,160,48,.32); }
    100% { background: rgba(240,160,48,.15); }
  }
  @keyframes lootbox-pointer-tick {
    0%, 85% { box-shadow: 0 0 8px var(--accent); }
    90% { box-shadow: 0 0 18px var(--accent), 0 0 4px #fff5e6; }
    100% { box-shadow: 0 0 8px var(--accent); }
  }
  .lootbox-result { margin: 0 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 70px; justify-content: center; }
  .lootbox-result .title { font-size: 15px; font-weight: 700; color: var(--accent); }

  /* ---------- Стол зачарований (openEnchantingModal) ---------- */
  .modal.enchanting-modal { width: min(940px, 96vw); height: min(660px, 90vh); max-width: none; max-height: none; }
  .ench-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 208px 1fr 236px; }
  .ench-col { min-height: 0; padding: 16px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .ench-col-left { border-right: 1px solid rgba(255,255,255,.08); }
  .ench-col-right { border-left: 1px solid rgba(255,255,255,.08); }
  .ench-col-center { align-items: center; justify-content: center; position: relative; gap: 20px; overflow: hidden; }
  @media (max-width: 720px) {
    .modal.enchanting-modal { width: 100vw; height: 100vh; }
    .ench-layout { grid-template-columns: 1fr; grid-auto-rows: min-content; overflow-y: auto; }
    .ench-col { overflow-y: visible; }
    .ench-col-left, .ench-col-right { border: none; border-top: 1px solid rgba(255,255,255,.08); }
    .ench-col-center { order: -1; }
  }
  .ench-col-label { font-family: Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted); }
  .ench-tool-card { display: flex; align-items: center; gap: 10px; }
  .ench-tool-card-icon { width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .ench-tool-card-name { font-size: 13px; font-weight: 700; }
  .ench-tool-card-tier { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .ench-durability-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-bottom: 4px; }
  .ench-durability-label b { font-family: Consolas, monospace; color: var(--text); font-weight: 400; }
  .ench-durability-bar { height: 7px; background: var(--panel2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); overflow: hidden; }
  .ench-durability-fill { height: 100%; background: var(--ok); transition: width .3s; }
  .ench-durability-fill.low { background: var(--warn); }
  .ench-durability-fill.crit { background: var(--danger); }
  .ench-applied-col { display: flex; flex-direction: column; gap: 6px; }
  .ench-applied-empty { height: 34px; border: 1px dashed rgba(95,208,232,.3); animation: ench-invite-pulse 2s ease-in-out infinite; }
  @keyframes ench-invite-pulse { 0%, 100% { border-color: rgba(95,208,232,.25); } 50% { border-color: rgba(95,208,232,.6); } }
  .ench-chip { display: flex; align-items: center; gap: 7px; font-size: 11.5px; padding: 6px 8px; border: 1px solid; }
  .ench-chip svg { width: 16px; height: 16px; flex-shrink: 0; }
  .ench-chip b { margin-left: auto; font-family: Consolas, monospace; }
  .ench-chip.new-flash { animation: ench-chip-flash 1.1s ease-out; }
  @keyframes ench-chip-flash { 0% { filter: brightness(2.2); } 100% { filter: brightness(1); } }

  .ench-altar-glow { position: absolute; left: 50%; top: 50%; width: 380px; height: 380px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(var(--ench-glow-rgb, 95,208,232), var(--ench-glow-a, .04)) 0%, transparent 68%);
    transition: background .35s; pointer-events: none; z-index: 0; }
  .ench-circles-row { position: relative; z-index: 1; display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .ench-circle-slot { position: relative; width: 138px; height: 138px; display: flex; align-items: center; justify-content: center; }
  .ench-circle-slot canvas { position: absolute; inset: 0; pointer-events: none; }
  .ench-rune-ticks { position: absolute; inset: 7px; border-radius: 50%; pointer-events: none;
    background: repeating-conic-gradient(rgba(95,208,232,.55) 0 2deg, transparent 2deg 30deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    animation: ench-ring-spin-rev 9s linear infinite; opacity: .8; }
  @keyframes ench-ring-spin-rev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
  .ench-circle { position: relative; width: 92px; height: 92px; border-radius: 50%; z-index: 2; }
  .ench-circle .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed rgba(95,208,232,.4); animation: ench-ring-spin 14s linear infinite; }
  .ench-circle .ring2 { position: absolute; inset: 9px; border-radius: 50%; border: 1px solid rgba(95,208,232,.18); }
  @keyframes ench-ring-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .ench-circle .core { position: absolute; inset: 14px; border-radius: 50%; background: var(--bg);
    display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); transition: box-shadow .2s, background .2s; }
  .ench-circle .core svg { width: 30px; height: 30px; }
  .ench-circle.locked .ring { animation-duration: 5s; border-color: var(--lvl-c, var(--blueprint)); }
  .ench-circle.locked .core { box-shadow: inset 0 0 0 2px var(--lvl-c, var(--blueprint)), 0 0 20px color-mix(in srgb, var(--lvl-c, var(--blueprint)) 45%, transparent); background: color-mix(in srgb, var(--lvl-c, var(--blueprint)) 12%, var(--bg)); }
  .ench-circle.spinning .core svg { animation: ench-spin-flicker .09s steps(1) infinite; }
  @keyframes ench-spin-flicker { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  .ench-circle .lvl-badge { position: absolute; bottom: -3px; right: -3px; font-family: Consolas, monospace; font-size: 9px; font-weight: 700;
    background: var(--modal); border: 1px solid var(--lvl-c, var(--border)); color: var(--lvl-c, var(--muted)); width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s; }
  .ench-circle.locked .lvl-badge { opacity: 1; }
  .ench-circle.success .core { animation: ench-circle-win-pulse .9s ease-in-out infinite; }
  @keyframes ench-circle-win-pulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.4); } }
  .ench-circle.fail .core { box-shadow: inset 0 0 0 2px var(--danger), 0 0 18px rgba(224,82,74,.4); }
  .ench-shock-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--lvl-c, var(--blueprint)); opacity: 0; pointer-events: none; z-index: 3; }
  .ench-shock-ring.play { animation: ench-shock-burst .65s ease-out; }
  @keyframes ench-shock-burst { 0% { transform: scale(.35); opacity: .95; } 100% { transform: scale(1.9); opacity: 0; } }

  .ench-success-badge { position: absolute; left: 50%; top: 18%; transform: translate(-50%, -50%) scale(.5); z-index: 5;
    display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--modal); border: 1px solid var(--accent);
    box-shadow: 0 0 26px rgba(240,160,48,.5); opacity: 0; pointer-events: none; }
  .ench-success-badge svg { width: 30px; height: 30px; }
  .ench-success-badge .roman { font-family: Consolas, monospace; font-size: 18px; font-weight: 700; color: var(--accent); }
  .ench-success-badge.show { animation: ench-badge-pop 1.7s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes ench-badge-pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
    14% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    22% { transform: translate(-50%, -50%) scale(1); }
    82% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(.92); }
  }

  .ench-roll-row { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; }
  .ench-roll-btn { padding: 12px 30px; font-size: 12.5px; letter-spacing: .04em; animation: ench-roll-glow 2.2s ease-in-out infinite; }
  @keyframes ench-roll-glow { 0%, 100% { box-shadow: 0 0 0 rgba(240,160,48,0); } 50% { box-shadow: 0 0 20px rgba(240,160,48,.5); } }
  .ench-roll-btn:disabled { animation: none; }
  .ench-book-chip { display: flex; align-items: center; gap: 6px; font-family: Consolas, monospace; font-size: 13px; color: var(--accent); font-weight: 600; }
  .ench-book-chip svg { width: 18px; height: 18px; }

  .ench-pool-list { display: flex; flex-direction: column; gap: 7px; }
